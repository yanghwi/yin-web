<style>
  /* 화면 전체가 게임: 가운데에 게임 화면(240×160의 정수배), 양옆 빈자리에 GBA처럼 생긴 십자 버튼 · A/B · 메뉴 버튼.
     자리와 크기는 main.js fit()이 안전 영역(섬 · 노치 · 둥근 모서리)을 보고 정한다. 테마 전환 없이 색을 모두 직접 지정 */
  :root {
    color-scheme: dark;
    --bg: #0c0a1d; --ink: #f7f3ff; --dim: #9a92d0; --print: #8a82cc; --print-hi: #b9b2e0; --accent: #ffe066;
    --err-bg: #3a1020; --err-ink: #ffd0d0; --run: #ffe066; --run-no: #ff8a7a;
    --pw: 100px; --kw: 56px; /* 십자 버튼 홈 · A/B 홈의 지름 (fit()이 정한다) */
  }
  html { height: 100%; background: var(--bg); overscroll-behavior: none; }
  body {
    height: 100%; margin: 0; overflow: hidden; color: var(--ink); background: var(--bg);
    font-family: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 안전 영역 재기 (fit()이 여백을 읽는다) */
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: crisp-edges; image-rendering: pixelated; background: #0e0a16; }

  /* 조작부: 터치 기기에서만 (PC는 키보드) */
  #controls { display: none; }
  body.touch #controls { display: block; }
  .btn { font: inherit; color: inherit; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; touch-action: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 십자 버튼: 몸체가 파인 둥근 홈에 앉아 있다. 누른 쪽으로 기울고(--rx · --ry) 그 팔이 어두워진다 */
  .dpad { position: fixed; left: 0; top: 0; width: var(--pw); height: var(--pw); touch-action: none; }
  .dpad::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; } /* 누르기 시작하는 자리를 조금 넉넉히 */
  .dpad svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .dpad .cross { position: absolute; inset: 0; pointer-events: none; transition: transform .05s linear;
    transform: perspective(calc(var(--pw) * 1.8)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
  .dpad .arms rect { fill: #000; opacity: 0; transition: opacity .05s linear; }
  .dpad.pu .au, .dpad.pd .ad, .dpad.pl .al, .dpad.pr .ar { opacity: .38; }
  /* 달리기: 누른 채 홈 테두리 밖(점선 고리)까지 밀면 달린다. 누르는 동안 고리가 보이고, 달리면 노랗게 · 못 달리면(지침 · 싸움) 붉게 */
  #runring { position: absolute; inset: -9%; border-radius: 50%; box-sizing: border-box; border: 2px dashed rgba(138, 130, 204, .6); opacity: 0; pointer-events: none; transition: opacity .12s; }
  .dpad.held #runring { opacity: .8; }
  .dpad.run #runring { opacity: 1; border-style: solid; border-color: var(--run); box-shadow: 0 0 8px var(--run); }
  .dpad.norun #runring { opacity: .9; border-color: var(--run-no); }

  /* A · B: 볼록한 짙은 회색 단추가 둥근 홈에 박혀 있고, 이름은 GBA처럼 몸체에 찍혀 있다 (A 옆 글은 지금 하는 일) */
  .key { position: fixed; left: 0; top: 0; width: var(--kw); height: var(--kw); }
  .keybtn { position: relative; display: block; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 58% 62%, #1d1a3a 0, #0b0a17 58%, #05040b 100%);
    box-shadow: inset 3px 4px 6px rgba(0, 0, 0, .95), inset -1px -2px 2px rgba(90, 80, 170, .35), 0 0 0 1px rgba(0, 0, 0, .55), -1px -1px 0 1px rgba(150, 140, 220, .1); }
  .keybtn::before { content: ""; position: absolute; inset: 8%; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #8e8b99 0, #5c5966 17%, #3d3b46 45%, #27262d 78%, #18171d 100%);
    box-shadow: 2px 4px 4px rgba(0, 0, 0, .75), inset 1px 1.5px 1px rgba(255, 255, 255, .22), inset -2px -3px 5px rgba(0, 0, 0, .5);
    transition: transform .04s linear, box-shadow .04s linear, filter .04s linear; }
  .keybtn::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; } /* 손가락 자리를 조금 넉넉히 */
  .keybtn.on::before { transform: translateY(1.5px) scale(.975); filter: brightness(.84);
    box-shadow: 1px 1px 1px rgba(0, 0, 0, .8), inset 1px 1px 1px rgba(255, 255, 255, .14), inset -1px -2px 4px rgba(0, 0, 0, .55); }
  .print { position: absolute; left: 50%; top: 100%; margin-top: 3px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 4px;
    white-space: nowrap; pointer-events: none; color: var(--print); font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 10px; }
  .print b { font-family: "Galmuri11 Bold", "Galmuri11", sans-serif; font-weight: normal; font-size: 13px; color: var(--print-hi); }
  #keyA .print span { color: var(--accent); }

  /* 메뉴 · 제작 · 가방: GBA의 START · SELECT처럼 작은 고무 단추 + 옆에 찍힌 이름 (줄 전체가 누르는 자리) */
  #sys { position: fixed; left: 0; top: 0; display: flex; flex-direction: column; gap: 2px; }
  .sysbtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; color: var(--print); font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 11px; }
  .sysbtn i { position: relative; flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 58% 62%, #1d1a3a 0, #0b0a17 60%, #05040b 100%);
    box-shadow: inset 2px 2px 3px rgba(0, 0, 0, .95), inset -1px -1px 1px rgba(90, 80, 170, .35), -1px -1px 0 1px rgba(150, 140, 220, .08); }
  .sysbtn i::before { content: ""; position: absolute; inset: 3px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #a19eac 0, #6e6b79 30%, #4b4955 70%, #35333c 100%);
    box-shadow: 1px 2px 2px rgba(0, 0, 0, .7), inset -1px -1px 2px rgba(0, 0, 0, .4); transition: transform .04s linear, filter .04s linear; }
  .sysbtn.on i::before { transform: translateY(1px); filter: brightness(.82); box-shadow: 0 .5px 1px rgba(0, 0, 0, .8); }
  .sysbtn.on span { color: var(--print-hi); }

  /* PC 키 안내: 게임 아래에 자리가 남으면 늘, 아니면 타이틀 · 메뉴에서만 게임 아래 끝에 얹는다 */
  #keys { position: fixed; left: 0; right: 0; top: 0; text-align: center; pointer-events: none; white-space: nowrap; font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 10px; color: var(--print); }
  #keys span { padding: 3px 8px; border-radius: 4px; }
  #keys.over span { background: rgba(12, 10, 29, .78); }
  #keys[hidden] { display: none; }

  /* 휴대폰 세로: 가로로 돌려 달라는 안내 (그동안 게임은 멈춘다) */
  #rotate { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; box-sizing: border-box;
    background: #110e22 radial-gradient(circle at 50% 42%, #1d1940 0, #110e22 70%); text-align: center; }
  #rotate[hidden] { display: none; }
  #rotate .phone { position: relative; width: 36px; height: 62px; margin-bottom: 22px; box-sizing: border-box; border: 3px solid var(--print-hi); border-radius: 8px; animation: turn 2.6s ease-in-out infinite; }
  #rotate .phone::before { content: ""; position: absolute; inset: 5px 4px 9px; border-radius: 2px; background: #3d3670; }
  #rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 8px; height: 2px; margin-left: -4px; border-radius: 1px; background: var(--print-hi); }
  #rotate p { margin: 0; font-size: 16px; color: var(--ink); }
  #rotate small { font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 11px; color: var(--dim); }
  @keyframes turn { 0%, 22% { transform: rotate(0deg); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }

  #err { position: fixed; z-index: 6; left: 16px; right: 16px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding: 8px; background: var(--err-bg); color: var(--err-ink); border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    .dpad .cross, .dpad .arms rect, #runring, .keybtn::before, .sysbtn i::before { transition: none; }
    #rotate .phone { animation: none; transform: rotate(-90deg); }
  }
</style>

<script>
/* 듀랑고 GBA — 픽셀 엔진
   이미지 파일 없이 코드로 픽셀을 찍는다: 사각형, 스캔라인으로 채운 원·타원·다각형, 브레젠험 직선.
   안티앨리어싱 없음. 좌표는 항상 정수. */
'use strict';
(function (D) {
  const OUTLINE = '#281a2e';

  /* ---------------- 색 ---------------- */
  const cache32 = new Map();
  function rgb(hex) {
    let h = hex[0] === '#' ? hex.slice(1) : hex;
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function hex(r, g, b) {
    const k = v => Math.max(0, Math.min(255, Math.round(v)));
    return '#' + ((1 << 24) | (k(r) << 16) | (k(g) << 8) | k(b)).toString(16).slice(1);
  }
  // ImageData(RGBA 바이트) ↔ 리틀엔디언 Uint32 = A<<24 | B<<16 | G<<8 | R
  function c32(h) {
    if (!h) return 0;
    if (typeof h === 'number') return h;
    let v = cache32.get(h);
    if (v === undefined) {
      const [r, g, b] = rgb(h);
      v = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
      cache32.set(h, v);
    }
    return v;
  }
  function unpack(c) { return [c & 255, (c >>> 8) & 255, (c >>> 16) & 255]; }
  function toHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return [h, mx ? d / mx : 0, mx];
  }
  function fromHsv(h, s, v) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }

  function hueToward(h, t, a) {
    const d = ((t - h) % 360 + 540) % 360 - 180;
    if (Math.abs(d) <= a) return t;
    return (h + Math.sign(d) * a + 360) % 360;
  }
  // 그림자: 명도 20% 낮추고 색상을 살짝 보라 쪽으로 (탁해지지 않게 채도는 약간 올림)
  function darken(h, k = 0.2) {
    let [H, S, V] = toHsv(...rgb(h));
    if (S < 0.08) { H = 262; S = Math.max(S, 0.05); }

    return hex(...fromHsv(H, S, V));
  }
  // 하이라이트: 25~30% 밝게, 색상은 노랑 쪽으로, 채도는 조금 뺌
  function lighten(h, k = 0.28) {
    let [H, S, V] = toHsv(...rgb(h));
    if (S > 0.08) H = hueToward(H, 52, 8);

  /* ---------------- 난수 ---------------- */
  function hash(x, y, s) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 1442695041)) | 0;

  }

  /* ---------------- 래스터라이저 (span 콜백) ---------------- */
  // 박스 기준 타원: 픽셀 중심 샘플링 → 짝수·홀수 크기 모두 대칭
  function spansEllipse(x, y, w, h, span) {
    const rx = w / 2, ry = h / 2, cx = x + rx, cy = y + ry;
    for (let j = 0; j < h; j++) {
      const dy = (y + j + 0.5 - cy) / ry, t = 1 - dy * dy;
      if (t < 0) continue;
      const hw = rx * Math.sqrt(t);
      const a = Math.max(x, Math.ceil(cx - hw - 0.5)), b = Math.min(x + w - 1, Math.floor(cx + hw - 0.5));
      if (b >= a) span(a, b, y + j);
    }
  }
  // 스캔라인 다각형 채우기 (짝홀 규칙)
  function spansPoly(pts, span) {
    let minY = Infinity, maxY = -Infinity;
    for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
    const y0 = Math.ceil(minY - 0.5), y1 = Math.floor(maxY - 0.5), n = pts.length, xs = [];
    for (let y = y0; y <= y1; y++) {
      const cy = y + 0.5; xs.length = 0;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if ((yi > cy) !== (yj > cy)) xs.push(xi + (cy - yi) * (xj - xi) / (yj - yi));

      xs.sort((a, b) => a - b);

<script>
/* 듀랑고 GBA — 글자
   한글: 갈무리(Galmuri, © Lee Minseo · SIL OFL 1.1). 픽셀 폰트라서 논리 해상도(240×160)에
   설계 크기 그대로 찍으면 글자 픽셀 = 스프라이트 픽셀. 가장자리 번짐은 알파 임계값 112로 끊는다.
     g11  Galmuri11 12px (대화·메뉴)   g11b Galmuri11 Bold 12px (강조·타이틀)   g9 Galmuri9 10px (작은 표시)
   타이틀: Galmuri11 Bold를 정수배로 키운 도트 로고 + 외곽선 두 겹 + 그림자.
   숫자: 직접 만든 5×7 비트맵. */
'use strict';
(function (D) {
  const P = D.PAL;
  const THRESH = 112;
  const FONTS = {
    g11: { fam: '"Galmuri11"', px: 12, lh: 14 },

    g9: { fam: '"Galmuri9"', px: 10, lh: 12 }

  async function load() {

    if (document.fonts) {
      try {
        await Promise.race([
          Promise.all(Object.keys(FONTS).map(f => document.fonts.load(fontStr(f), '가A1'))),
          wait(5000)

  // 갈무리 윤곽선은 설계 크기에서 픽셀 격자와 정확히 맞지만, 운영체제 글꼴 렌더러가 번짐 필터를 걸면
  // 1px 틈이 반쯤 채워져 획이 뭉개진다('빼' 등). 그래서 8배 크기로 그린 뒤 설계 픽셀마다
  // 한가운데 한 점만 읽어 임계값 112로 끊는다 → 어느 플랫폼에서나 같은 비트맵.
  const SS = 8;

                '.CCCCCCNCCCCCk.',
                '.CCCCCCNCCCCCk.',
                '.kCCCCCCCCCCkk.',
                '..kkCCCCCCCkk..',
                '...kkkkkkkkk...'],
        side:  ['.......VVv.....',
                '......VVVVv....',
                '.cCCCCCVCCk....',
                'cCCCCCCCCCCk...',
                'CCCCCCCCCCCCk..',
                'CCCCCCCCCCCCk..',
                'CCCCCCCCCCCCk..',
                'NNNNNNNNNNNNk..',
                'CCCCCCCCCCCCk..',
                'OOOOOCCCCCCCk..',
                'OCCCCCCCCCCCk..',
                'ONCNCCCCCCCk...',
                'OCCCCCCCCCCk...',
                '.kCCCCCCCCk....',
                '..kkCCCCCk.....',
                '...kkkkkk......']
      }
    },
    // 겉옷 가슴의 금 방패 문장 (앞모습, 윗몸 3~5줄) — 구왕국의 사자 문장을 멀리서 본 모양
    crest: {
      front: ['.....XXX.....', '.....XxX.....', '......X......']
    },
    // 배낭: 앞에선 멜빵, 뒤·옆에선 가방
    pack: {
      front: ['...Q.....Q...', '...Q.....Q...'],
      back:  ['...yYYYYYZ...',
              '...yYQQQYZ...',
              '...yYYYYYZ...',
              '...yYYYYYZ...',
              '...ZZZZZZZ...'],
      side:  ['.......yYZ...',
              '......yYYYZ..',
              '......YYYYZ..',
              '......YYYYZ..',
              '......ZZZZ...']
    }
  };

  function palOf(c) {
    const r = (b, o) => col.ramp(b, o);
    const hair = r(c.hair, c.hairR), skin = { hi: P.skinL, base: c.skin || P.skin, sh: c.skinS || P.skinS };
    const top = r(c.top, c.topR), bot = r(c.bottom), shoe = r(c.shoes);
    const pal = {
      H: hair.base, h: hair.hi, d: hair.sh,
      S: skin.base, s: skin.sh, K: skin.hi, n: col.darken(skin.sh, 0.2), E: P.eye, B: P.blush, M: c.mouth || '#7a3a3a',
      A: skin.base, a: skin.sh,
      T: top.base, t: top.hi, u: top.sh,
      P: bot.base, p: bot.sh, F: shoe.base, f: shoe.sh, W: c.sock || '#f4eee6', w: col.darken(c.sock || '#f4eee6', 0.18),
      X: c.acc || top.hi, x: c.acc ? col.darken(c.acc) : top.base,
      G: c.frame || '#6a4a3a', g: c.lens || '#d8ecff', O: P.outline
    };
    if (c.hat) { const hr = r(c.hat); pal.Y = hr.base; pal.y = hr.hi; pal.Z = hr.sh; pal.Q = c.band || col.darken(c.hat, 0.45); }
    if (c.pack) { const pr = r(c.pack); pal.Y = pr.base; pal.y = pr.hi; pal.Z = pr.sh; pal.Q = c.packStrap || col.darken(c.pack, 0.4); }
    if (c.helm) { const hr = r(c.helmC, c.helmR); pal.C = hr.base; pal.c = hr.hi; pal.k = hr.sh; pal.N = c.helmN || hr.sh; }
    if (c.plume) { pal.V = c.plume; pal.v = col.darken(c.plume); } // 투구 깃털
    if (c.mail) { const mr = r(c.mail); pal.I = mr.base; pal.i = mr.sh; } // 쇠사슬 소매 (sleeves: 'mail')
    if (c.more) Object.assign(pal, c.more); // 덧그림(wear) 색 — 2장 사람들 절
    return pal;
  }
  // 줄무늬 셔츠: 특정 행의 옷색을 줄무늬색으로
  function stripePal(pal, c) {
    const s = col.ramp(c.stripe);
    return Object.assign({}, pal, { T: s.base, t: s.hi, u: s.sh });
  }

  // opt.run: 달리기 프레임 f(0~3). 디딤(짝수)은 윗몸이 1px 내려가고 떠오름(홀수)은 발까지 1px 뜨며, 옆모습은 윗몸·머리를 1칸 앞으로
  function frame(c, view, f, opt) {
    opt = opt || {};
    const B = BODIES[c.body], v = view === 'back' ? 'front' : view, sit = opt.sit && B.sit && view === 'front';
    const run = !!opt.run && !sit, R = run && RUN[c.body], fly = run && f % 2 === 1;
    const p = new Pix(FW, FH), pal = palOf(c), bob = run ? (fly ? 0 : 1) : (f === 0 ? 0 : 1);
    const ux = OX - (run && view === 'side' ? 1 : 0); // 윗몸·머리 x (숙이기)
    // 뒷모습은 팔 박자를 반대로: 앞으로 뻗은 팔은 몸에 가리고 뒤로 젖힌 팔이 보인다
    const lo = sit ? B.sit : R ? R.lo[v][f] : B.lo[v][run ? RUN_WALK[f] : f];
    let up = R ? R.up[v][view === 'back' ? (f + 2) % 4 : f] : B.up[v][run ? RUN_WALK[f] : f];
    if (c.sleeves === 'long') up = longSleeve(up);
    else if (c.sleeves === 'mail') up = mailSleeve(up);
    if (view === 'back') up = backUp(up);
    if (sit && opt.phone) up = phoneUp(up);
    const foot = (sit ? B.sitFoot : FOOT) - (fly ? 1 : 0);
    const loY = foot + 1 - lo.length, upY = loY + 1 - up.length + bob;
    const head = opt.nod ? closeEyes(HEADS[c.head][view]) : HEADS[c.head][view], headY = upY - head.length + (opt.nod ? 1 : 0);
    const ov = (o, k) => o && (o[k] || o[view] || (view === 'back' ? o.front : null));
    // 달리면 쌍갈래머리가 한 박자 늦게 따라온다: 떠오를 때 1px 처지고, 옆모습에선 뒤로 1칸 날린다
    const tx = ux - 2 + (run && view === 'side' ? 1 : 0), ty = headY + 2 + (fly ? 1 : 0);
    // 망토 · 묶은 머리 같은 덧그림(c.wear)을 z 층마다 — 2장 사람들 절의 wear()
    const wr = z => c.wear && wear(c, z, p, pal, view, f, { run, fly, sit, ux, upY, loY, headY, foot, body: c.body, up, lo });
    // 머리 뒤 덧그림
    wr('behind');
    if (c.tails) p.tmpl(ov(OVER.tails, view === 'back' ? 'front' : view), pal, tx, ty);
    if (c.pack && view === 'side') p.tmpl(OVER.pack.side, pal, ux, upY);
    // 아랫몸 · 윗몸 (줄무늬 행)
    p.tmpl(lo, pal, OX, loY);
    up.forEach((row, i) => {
      const pp = (c.stripe && c.stripeRows.includes(i)) ? stripePal(pal, c) : pal;
      p.tmpl([row], pp, ux, upY + i);
    });
    if (c.pack && view === 'back') p.tmpl(OVER.pack.back, pal, ux, upY + 1);
    if (c.pack && view === 'front') p.tmpl(OVER.pack.front, pal, ux, upY + 1);
    if (c.scarf && view !== 'back') p.tmpl(OVER.scarf[v], pal, ux, upY);
    if (c.tie && view === 'front') p.tmpl(OVER.tie.front, pal, ux, upY);
    if (c.crest && view === 'front') p.tmpl(OVER.crest.front, pal, ux, upY + 3);
    if (c.pads) p.tmpl(OVER.pads[v], pal, ux, upY + 1);
    wr('body');
    // 머리
    p.tmpl(head, pal, ux, headY);
    if (c.tails) p.tmpl(OVER.ties[v], pal, tx, ty);
    if (c.band) p.tmpl(OVER.band[view], pal, ux, headY + 4);
    wr('head');
    if (c.hat) p.tmpl(OVER.hat[v], pal, ux - 1, headY - 2);
    if (c.helm) p.tmpl(ov(OVER.helm[c.helm], view), pal, ux - 1, headY - 2);
    wr('top');
    p.outline(P.outline);
    return p;
  }

  // 캐릭터 한 명의 모든 프레임: dir → [f0,f1,f2] · 손 위치 · 머리 위 높이
  function build(c) {
    const out = { down: [], up: [], left: [], right: [], def: c, ax: AX, ay: AY, hand: BODIES[c.body].hand };
    for (let f = 0; f < 3; f++) {
      out.down.push(frame(c, 'front', f));
      out.up.push(frame(c, 'back', f));
      out.left.push(frame(c, 'side', f));
    }
    out.right = out.left.map(p => p.flip());
    // 달리기: dir → [4프레임]
    out.run = { down: [], up: [], left: [] };
    for (let f = 0; f < 4; f++) {
      out.run.down.push(frame(c, 'front', f, { run: true }));
      out.run.up.push(frame(c, 'back', f, { run: true }));
      out.run.left.push(frame(c, 'side', f, { run: true }));
    }
    out.run.right = out.run.left.map(p => p.flip());
    // 앉은 앞모습: [보통, 꾸벅 조는 고개, 휴대폰 보기]
    out.sit = [frame(c, 'front', 0, { sit: true }), frame(c, 'front', 0, { sit: true, nod: true }), frame(c, 'front', 0, { sit: true, phone: true })];
    // 머리 꼭대기(가장 위 불투명 줄)까지의 높이 → 말풍선 위치
    const topOf = s => { for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) if (s.get(x, y)) return y; return 0; };
    out.head = AY - topOf(out.down[0]) + 1;
    out.sitHead = AY - topOf(out.sit[0]) + 1;
    return out;
  }

  const WALK = [1, 0, 2, 0];

  // 발밑 그림자 (투명도 0.22로 그릴 것)
  // 발밑 그림자: 크기마다 따로 찍어 둔다 (늘려 그리면 계단이 뭉개짐)
  const _shadows = new Map();
  function shadow(w, h) {
    w = w || 12; h = h || 4;
    const k = w + 'x' + h;
    let s = _shadows.get(k);
    if (!s) { s = new Pix(w, h).ellipse(0, 0, w, h, P.outline); _shadows.set(k, s); }
    return s;
  }


  /* ---------- 무기 (오른쪽을 가리키는 원본을 방향별로 90° 회전) ---------- */
  const WOOD = col.ramp('#9a6a44', { hi: '#c8925e', sh: '#6a4430' }), STONE = col.ramp('#9aa0b8', { hi: '#d6dcee', sh: '#666c86' });
  const FLAME = { hi: '#fff0a0', base: '#f39a3a', sh: '#e0503a' };
  const WEAPON_MAKERS = {
    spear: () => { const S = new D.Shape(24, 7); S.rect(1, 3, 17, 2, WOOD, { sh: 1 }); S.rect(15, 2, 3, 4, col.ramp('#d0a860'), { sh: 1 }); S.poly([[17, 1], [23, 3.5], [17, 6]], STONE, { sh: 1 }); return { p: S.build(), grip: [3, 3] }; },
    hornspear: () => { const S = new D.Shape(26, 7); S.rect(1, 3, 17, 2, WOOD, { sh: 1 }); S.rect(15, 2, 3, 4, col.ramp('#e0445a'), { sh: 1 }); S.poly([[17, 1], [25, 3.5], [17, 6]], col.ramp('#f4ead0', { hi: '#fffaf0', sh: '#cfc0a0' }), { sh: 1 }); return { p: S.build(), grip: [3, 3] }; },
    // 작살: 창대 끝에 섬유로 묶은 바리오닉스 발톱 — 끝이 아래로 휘어 갈고리처럼 걸린다
    harpoon: () => { const S = new D.Shape(26, 8); S.rect(1, 3, 17, 2, WOOD, { sh: 1 }); S.rect(15, 2, 3, 4, col.ramp('#d0a860'), { sh: 1 }); S.poly([[17, 1.5], [21, 1], [24, 2.2], [25, 4.6], [24, 6.4], [23.2, 4.4], [21.6, 3.8], [17, 5.6]], col.ramp('#f4ead0', { hi: '#fffaf0', sh: '#cfc0a0' }), { sh: 1 }); return { p: S.build(), grip: [3, 3] }; },
    // 돌도끼: 늘 보이는 세운 모습(날이 오른쪽)을 먼저 그려 빛이 왼쪽 위에서 오게 하고, 시계 방향으로 돌려 원본을 만든다 (날은 원본의 아래쪽).
    // 쐐기꼴 돌 머리가 자루를 꿰어 뒤로 한 칸 나오고 위아래를 섬유 끈으로 묶었다. 둥글게 벼린 날 끝은 밝게 (초승달 · 낫처럼 보이지 않게)
    // side: 옆모습에서 든 자리 [오른쪽을 볼 때 자루 x, 쥐는 자리를 머리 쪽으로 올린 칸] — 머리가 넓어 몸 앞에 가슴 높이로 들어야 얼굴을 가리지 않는다
    axe: () => {
      const S = new D.Shape(9, 15);
      S.rect(2, 1, 2, 13, WOOD, { sh: 1 });
      S.poly([[1, 4.4], [4, 3.4], [5.6, 2.1], [6.9, 1.7], [7.8, 2.8], [7.8, 7], [6.9, 8.1], [5.6, 7.7], [4, 6.5], [1, 5.6]], STONE, { sh: 1 });
      S.rect(2, 3, 2, 1, col.ramp('#d0a860'), { sh: 0 }); S.rect(2, 6, 2, 1, col.ramp('#d0a860'), { sh: 0 });
      S.detail(p => { const E = col.c32('#e8ecf8'); for (let y = 3; y <= 7; y++) if (p.get(7, y)) p.set(7, y, E); });
      return { p: S.build().rot90(true), grip: [2, 2], side: [13, 3] }; // 손잡이 = 세운 모습의 (2, 12)
    },
    // 돌곡괭이: 도끼처럼 세운 모습을 먼저 그린다. 가운데가 두껍고 두 끝이 아래로 휘어 뾰족한 ⌒ 돌 머리를 섬유 끈으로 묶고, 벼린 두 끝은 밝게.
    // 머리가 자루 양쪽으로 넓어 얼굴 높이에 들면 얼굴을 가린다 → 옆모습은 도끼처럼 몸 앞(side), 앞·뒷모습도 가슴 높이로 내려(low) 든다
    pick: () => {
      const S = new D.Shape(15, 15);
      S.rect(6, 1, 2, 13, WOOD, { sh: 1 });
      S.poly([[0.6, 6.8], [2, 4.6], [4, 3.2], [6, 2.5], [8, 2.5], [10, 3.2], [12, 4.6], [13.4, 6.8], [12.3, 6.4], [10, 5.6], [8, 5.4], [6, 5.4], [4, 5.6], [1.7, 6.4]], STONE, { sh: 1 });
      S.rect(6, 2, 2, 1, col.ramp('#d0a860'), { sh: 0 }); S.rect(6, 6, 2, 1, col.ramp('#d0a860'), { sh: 0 });
      S.detail(p => { const E = col.c32('#e8ecf8'); for (const [x, y] of [[1, 6], [13, 6]]) if (p.get(x, y)) p.set(x, y, E); });
      return { p: S.build().rot90(true), grip: [2, 6], side: [13, 3], low: 3 }; // 손잡이 = 세운 모습의 (6, 12)
    },
    knife: () => { const S = new D.Shape(12, 6); S.rect(1, 2, 4, 2, WOOD, { sh: 0 }); S.poly([[5, 1], [11, 2.5], [5, 5]], STONE, { sh: 1 }); return { p: S.build(), grip: [2, 2] }; },
    club: () => { const S = new D.Shape(16, 9); S.rect(1, 4, 8, 2, WOOD, { sh: 1 }); S.ellipse(7, 1, 8, 7, col.ramp('#b07a52', { hi: '#d8a070', sh: '#7a4e34' }), { sh: 1 }); return { p: S.build(), grip: [2, 4] }; },
    torch: () => { const S = new D.Shape(14, 7); S.rect(1, 3, 8, 2, WOOD, { sh: 1 }); S.poly([[8, 1], [13, 3.5], [8, 6]], FLAME, { sh: 1, hi: 0 }); return { p: S.build(), grip: [2, 3] }; },
    // 렉스 이빨검: 나무 자루 · 렉스 가죽 손잡이 감개 · 휘어진 큰 이빨 날
    toothblade: () => { const S = new D.Shape(22, 9); S.rect(1, 3, 7, 3, WOOD, { sh: 1 }); S.rect(7, 2, 3, 5, col.ramp('#5aac4c', { hi: '#94d676', sh: '#3a7f42' }), { sh: 1 }); S.poly([[10, 1], [17, 1.5], [21, 3.5], [17, 6], [10, 8]], col.ramp('#fbf3dc', { hi: '#fffaf0', sh: '#d8c8a0' }), { sh: 1 }); return { p: S.build(), grip: [3, 4] }; }
  };
  const _weap = {};
  // 반환: {right,left,down,up,upM}: {p, gx, gy} (gx,gy = 손잡이 위치) + side (옆모습 든 자리) · low (앞·뒷모습에서 내려 드는 칸), 있으면
  // up은 원본의 아래쪽(도끼 날)이 오른쪽, upM은 그 좌우를 뒤집어 왼쪽 — 들고 걸을 때 날이 보는 쪽을 따라가게
  function weapon(id) {
    if (_weap[id] || !WEAPON_MAKERS[id]) return _weap[id] || null;
    const { p, grip, side, low } = WEAPON_MAKERS[id](), w = p.w, h = p.h;
    const down = p.rot90(true), up = p.rot90(false);
    return (_weap[id] = {
      right: { p, gx: grip[0], gy: grip[1] },
      left: { p: p.flip(), gx: w - 1 - grip[0], gy: grip[1] },
      down: { p: down, gx: h - 1 - grip[1], gy: grip[0] },
      up: { p: up, gx: grip[1], gy: w - 1 - grip[0] },
      upM: { p: up.flip(), gx: h - 1 - grip[1], gy: w - 1 - grip[0] },
      side, low
    });
  }
  // 공격 자세에서 손 위치 (20×32 칸 기준, 몸 종류마다 build()가 cb.hand로 넘김)
  const HAND = BODIES.kid.hand;

  /* ---------- 베기 호 (방향별, 2프레임) ---------- */
  const _slash = {};
  function slash(dir, f) {
    const key = dir + f;
    if (_slash[key]) return _slash[key];
    const r = 13, S = r * 2 + 3, p = new Pix(S, S), c = r + 1;
    const ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir];
    const span = f === 0 ? 1.25 : 0.9;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const dx = x - c, dy = y - c, d = Math.hypot(dx, dy);
      let a = Math.atan2(dy, dx) - ang; a = Math.atan2(Math.sin(a), Math.cos(a));
      if (Math.abs(a) > span) continue;
      const band = f === 0 ? [r - 3, r] : [r - 1, r];
      if (d >= band[0] && d <= band[1]) p.px(x, y, d > band[1] - 1 ? P.accent : '#fbf8ff');
      else if (f === 0 && d >= r - 5 && d < r - 3 && ((x + y) & 1)) p.px(x, y, '#fbf8ff');
    }
    return (_slash[key] = p);
  }

  /* ---------- 구르기 (하루): 몸을 만 공 2프레임 ---------- */
  const _roll = {};
  function roll(c, f) {
    const key = c.name + f;
    if (_roll[key]) return _roll[key];
    const pal = palOf(c);
    const S = new D.Shape(16, 16), hd = c.helm ? { hi: pal.c, base: pal.C, sh: pal.k } : { hi: pal.h, base: pal.H, sh: pal.d }; // 투구를 쓰면 머리 대신 투구 색
    S.ellipse(1, 2, 13, 12, { hi: pal.t, base: pal.T, sh: pal.u }, { sh: 2 });
    if (f === 0) {
      S.ellipse(1, 1, 9, 8, hd, { sh: 1 });
      S.ellipse(10, 10, 4, 3, { hi: pal.F, base: pal.F, sh: pal.f }, { sh: 1 });
      S.ellipse(4, 11, 4, 3, { hi: pal.P, base: pal.P, sh: pal.p }, { sh: 0 });
    } else {
      S.ellipse(6, 6, 9, 8, hd, { sh: 1 });
      S.ellipse(1, 2, 4, 3, { hi: pal.F, base: pal.F, sh: pal.f }, { sh: 1 });
      S.ellipse(9, 1, 4, 3, { hi: pal.P, base: pal.P, sh: pal.p }, { sh: 0 });
    }
    return (_roll[key] = S.build());
  }
  // 공격 자세 부품: 스프라이트 좌상단 기준 상대 좌표. phase 0 = 휘두름(큰 호), 1 = 마무리
  function attackParts(cb, dir, weaponId, phase) {
    const out = { spr: cb[dir][1], under: [], over: [] };
    const hand = (cb.hand || HAND)[dir], w = weapon(weaponId);
    if (w) {
      const wd = w[dir];
      (dir === 'up' ? out.under : out.over).push({ spr: wd.p, x: hand[0] - wd.gx, y: hand[1] + 1 - wd.gy });
    }
    const sl = slash(dir, phase || 0), reach = w && (weaponId === 'spear' || weaponId === 'hornspear' || weaponId === 'harpoon') ? 14 : 9;
    const off = { down: [0, reach], up: [0, -reach], left: [-reach, 0], right: [reach, 0] }[dir];
    out.over.push({ spr: sl, x: hand[0] + off[0] - (sl.w >> 1), y: hand[1] + off[1] - (sl.h >> 1) });

        '..fF...DD....DD.fF...',
        '.CC....cc....cc..CC..'],
    // 걷기: 반대
    2: ['....DD.fF...fF.DD....',
        '...DD...fF.fF...DD...',
        '..cc....CC.CC....cc..']
  };
  // 달리기(갤럽) 다리 4장: 뻗기 → 앞발 디딤 → 네 발 모아 뜀(몸 전체 1px 뜸) → 뒷발 디딤. 진돗개라 꼬리는 달려도 말려 있다
  const DOG_RUN_LEGS = [
    ['..fF.DD.......DD.fF..',
     '.fF..DD........DD.fF.',
     'CC..cc..........cc.CC'],
    ['....fFDD.....DD.fF...',
     '....fFDD......DD.fF..',
     '...CCcc........cc.CC.'],
    ['.....fF.DD..DD.fF....',
     '......fF.DDDD.fF.....',
     '.......CCccccCC......'],
    ['...fF.DD....fFDD.....',
     '..fF..DD....fFDD.....',
     '.CC..cc....CCcc......']];
  function dogRun(n) {
    const p = new D.Pix(25, 17), air = n === 2 ? 1 : 0, y0 = 2 - air * 2; // 디딤 장은 1px 낮게, 뜬 장은 1px 높게
    p.tmpl(DOG_RUN_LEGS[n], DOG_PAL, 2, 12 - air);
    p.tmpl(DOG_BODY, DOG_PAL, 2, y0);
    p.tmpl(DOG_HEAD, DOG_PAL, 2, y0);
    p.px(3, y0 + 8, DOG_PAL.T); // 헥헥 내민 혀
    return p.outline(P.outline);
  }
  // 앉은 꼬미: 머리를 1px 들고, 앞다리는 곧게 세우고, 엉덩이는 땅에 붙이고, 꼬리는 등 위로 말았다 (연출: 모닥불 곁)
  const DOG_SIT = [
    '.....................',
    '.....................',
    '.....................',
    '.....................',
    '..............fD.....',
    '.............fFD.....',
    '...........ffFFD.....',
    '.....RRRFFFFFFFD.....',
    '....cRrYFFFFFFFFD....',
    '....CCCFFFFFFFFFD....',
    '....CCcFFFFFFFFFFD...',
    '....CCcFFFFFFFFFFD...',
    '....fF.DFFFFFFFFFD...',
    '....fF.DFFFFFFFFD....',
    '...CC..cCCCDDDDD.....'];
  function dogSit() {
    const p = new D.Pix(25, 17);
    p.tmpl(DOG_SIT, DOG_PAL, 2, 0);
    p.tmpl(DOG_HEAD, DOG_PAL, 2, 0);
    return p.outline(P.outline);
  }
  // 가방에서 고개를 내민 꼬미 (프롤로그: 옆자리 학생의 분홍 가방). 오른쪽(하루 쪽)을 본다. 앞발 둘을 가방 테에 걸쳤다
  // mode: 'blink' 눈 감음 · 'empty' 꼬미가 뛰쳐나간 빈 가방 (입구가 벌어져 있다)
  function dogBag(mode) {
    const p = new D.Pix(19, 19), B = '#ec8fa8', Bs = '#c86a88', Bh = '#f8bccb', In = '#6a2a44';
    // 손잡이 끈 (머리 뒤로 넘어가는 고리)
    p.line(2, 8, 4, 3, Bs).line(4, 3, 7, 1, Bs).line(16, 8, 14, 3, Bs).line(14, 3, 11, 1, Bs);
    if (mode === 'empty') p.line(7, 1, 11, 1, Bs); // 머리가 가리던 고리 윗부분 (빈 가방이면 보인다)
    else {
      const head = DOG_HEAD.slice();
      if (mode === 'blink') { head[4] = '.FFFFFFFFFD'; head[5] = 'KCCKKFFFFFF'; }
      p.tmpl(head, DOG_PAL, 5, 1, true);
    }
    // 가방: 안쪽 그늘 → 몸통(빛은 왼쪽 위) → 바닥
    p.rect(1, 9, 17, mode === 'empty' ? 2 : 1, In);
    p.rect(1, 10 + (mode === 'empty' ? 1 : 0), 17, mode === 'empty' ? 6 : 7, B); p.rect(1, 10, 2, 7, Bh); p.rect(15, 10, 3, 7, Bs); p.rect(1, 17, 17, 1, Bs);
    p.rect(5, 12, 9, 1, Bh); // 주머니 테
    if (mode !== 'empty') p.px(6, 9, DOG_PAL.C).px(7, 9, DOG_PAL.C).px(11, 9, DOG_PAL.C).px(12, 9, DOG_PAL.C); // 가방 테에 걸친 앞발
    return p.outline(P.outline);
  }
  function dog(pose, name) {
    if (name && name.startsWith('run')) return dogRun(+name[3]);
    if (name === 'sit') return dogSit();
    const p = new D.Pix(25, 17);
    const f = pose.f || 0, lunge = pose.strike ? -2 : 0, bob = f ? 1 : 0, low = pose.windup ? 1 : 0;
    if (pose.dead) {
      // 옆으로 누워 기절: 몸을 낮게 펴고 짧은 다리는 옆으로, 눈은 감음
      const rows = [
        '...fF..fD..............',
        '..fFeF.fFD.............',
        '..FFFFFFFFD.........fD.',
        '.fFFFFFFFFFFFFFFFFFFFD.',
        'KCCFKKFFFFFFFFFFFFFFD..',
        'CCCCCRRRFFFFFFFFFFFFD..',
        '.cCCCRrYFFFFFFFFFFFD...',
        '..ccCCCCDDDDDDDDDDD....',
        '.....fFfF....fFfF......'];
      p.tmpl(rows, DOG_PAL, 1, 7);
      return p.outline(P.outline);
    }
    const head = DOG_HEAD.slice();
    if (pose.blink) { head[4] = '.FFFFFFFFFD'; head[5] = 'KCCKKFFFFFF'; }
    const y0 = 1 + bob + low;
    p.tmpl(DOG_LEGS[f], DOG_PAL, 2, 12);
    p.tmpl(DOG_BODY, DOG_PAL, 2, y0);
    // 물기: 머리를 앞으로 내밀되 목이 끊기지 않게 원래 자리에 뒤통수(목) 쪽만 한 번 찍음
    if (lunge) p.tmpl(DOG_HEAD.map((r, i) => i < 3 ? '' : '......' + r.slice(6)), DOG_PAL, 2, y0 + 1);
    p.tmpl(head, DOG_PAL, 2 + lunge, y0 + (lunge ? 1 : 0));
    if (pose.strike) {
      // 입을 벌려 물기: 아래턱을 벌리고 혀
      const hx = 2 + lunge, hy = y0 + 1;
      p.px(hx, hy + 6, P.outline).px(hx + 1, hy + 6, P.outline).px(hx + 2, hy + 6, P.outline);
      p.px(hx, hy + 7, DOG_PAL.T).px(hx + 1, hy + 7, DOG_PAL.T).px(hx + 2, hy + 7, DOG_PAL.c);
      p.px(hx + 1, hy + 8, DOG_PAL.c).px(hx + 2, hy + 8, DOG_PAL.c).px(hx + 3, hy + 8, DOG_PAL.c);
    }
    return p.outline(P.outline);
  }

  /* ================= 콤프소: 닭만 한 공룡 20×12 ================= */
  function compy(pose) {
    const { S, k } = mk(20, 12);
    const body = R('#c6c64a', { hi: '#e8e888', sh: '#96a03a' }), far = R('#96a03a');
    const f = pose.f || 0, lf = legPhase(f) * 2, bob = f ? 1 : 0, dead = pose.dead;
    const dy = dead ? 4 : 0, hx = pose.strike ? -2 : 0, hy = dead ? 2 : 0; // (쓰러지면 머리도 땅에)
    if (!dead) S.limb(k(11), k(7 + bob), k(11 + lf), k(11), 2, 1, far, sh(1));
    else S.limb(k(14), k(9), k(19), k(9), 1, 1, far, sh(1)); // 쓰러짐: 두 다리를 꼬리 밑으로 뻗는다 (먼 다리가 위)
    S.poly([[k(11), k(4 + bob + dy)], [k(19), k(2 + bob + dy)], [k(19), k(3 + bob + dy)], [k(12), k(7 + bob + dy)]], body, sh(1));
    const b = S.ellipse(k(7), k(3 + bob + dy), 7, 5, body, sh(1));
    S.rect(k(9), k(3 + bob + dy), 1, 3, R('#8a6a3a'), { flat: true, clip: b });
    S.rect(k(11), k(3 + bob + dy), 1, 3, R('#8a6a3a'), { flat: true, clip: b });
    if (!dead) S.limb(k(8), k(7 + bob), k(8 - lf), k(11), 2, 1, body, sh(1));
    else S.limb(k(10), k(11), k(18), k(11), 1, 1, body, sh(1));
    S.limb(k(8), k(5 + bob + dy), k(4 + hx), k(3 + bob + dy + hy), 2, 2, body, sh(1));
    S.ellipse(k(0 + hx), k(1 + bob + dy + hy), 6, 4, body, sh(1));
    S.detail(p => {
      if (dead) p.px(k(2 + hx), k(2 + bob + dy + hy), EYE).px(k(3 + hx), k(3 + bob + dy + hy), EYE);
      else { p.px(k(2 + hx), k(2 + bob + dy), EYE); p.eyeAt = [k(2 + hx), k(2 + bob + dy), 1]; }
      if (pose.strike) p.px(k(0 + hx), k(4 + bob), EYE);
    });
    return S.build();
  }

  /* ================= 랩터: 사람 가슴 높이 44×28 =================
     bridled: 구왕국이 길들인 랩터 (2장 · 1장 끝의 선발대) — 등에 금 테를 두른 붉은 깔개와 가죽 안장, 머리엔 굴레(코끈 · 정수리끈 · 입꼬리의 쇠고리)와
     안장으로 이어진 고삐. 색은 사자 깃발(landmarks.js LION)과 같다 */
  function raptor(pose, name, bridled) {
    const { S, k } = mk(44, 28);
    const bc = '#dc8f4c';
    const body = R(bc, { hi: '#f3bd7a', sh: '#b0633a' }), far = R('#b0633a', { sh: '#8a4630' }), belly = R('#f6dfa8', { sh: '#dcb87a' });
    const f = pose.f || 0, lf = legPhase(f) * 3, bob = f ? 1 : 0, dead = pose.dead;
    const hx = pose.strike ? -4 : pose.windup ? 3 : 0, hy = pose.strike ? 2 : pose.windup ? -2 : dead ? 7 : 0, jaw = pose.strike ? 3 : 0; // (쓰러지면 머리도 땅에)
    const dy = dead ? 9 : 0, crouch = pose.windup ? 2 : 0;
    const B = bob + dy + crouch;
    if (!dead) {
      S.ellipse(k(21 + lf / 2), k(11 + B), 8, 9, far, sh(2));
      S.limb(k(25 + lf / 2), k(18 + B), k(24 + lf), k(25), 3, 3, far, sh(1));
      S.poly([[k(20 + lf), k(25)], [k(27 + lf), k(25)], [k(27 + lf), k(27)], [k(19 + lf), k(27)]], far, sh(1));
    } else {
      // 쓰러짐: 먼 다리는 꼬리 밑으로 뒤로 뻗는다 (가까운 다리보다 조금 높게)
      S.limb(k(24), k(22), k(32), k(23), 3, 3, far, sh(1));
      S.limb(k(32), k(23), k(37), k(24), 2, 2, far, sh(1));
      S.poly([[k(36), k(22)], [k(38), k(22)], [k(40), k(25)], [k(37), k(25)]], far, sh(1));
    }
    S.poly([[k(26), k(8 + B)], [k(43), k(3 + B)], [k(43), k(5 + B)], [k(40), k(6 + B)], [k(28), k(15 + B)]], body, sh(2));
    const b = S.ellipse(k(13), k(7 + B), 17, 11, body, sh(3));
    S.ellipse(k(13), k(12 + B), 12, 6, belly, Object.assign(sh(1), { clip: b }));
    S.limb(k(16), k(11 + B), k(10 + hx / 2), k(7 + B + hy / 2), 6, 4, body, sh(2));
    const hd = S.ellipse(k(1 + hx), k(2 + B + hy), 12, 7, body, sh(2));
    S.poly([[k(1 + hx), k(7 + B + hy)], [k(11 + hx), k(7 + B + hy)], [k(11 + hx), k(9 + B + hy + jaw)], [k(3 + hx), k(10 + B + hy + jaw)]], belly, sh(1));
    if (!dead) {
      S.ellipse(k(17 - lf / 2), k(10 + B), 9, 10, body, Object.assign(sh(2), { edge: col.darken(bc, 0.5) }));
      S.limb(k(21 - lf / 2), k(18 + B), k(20 - lf), k(25), 3, 3, body, sh(1));
      S.poly([[k(15 - lf), k(25)], [k(23 - lf), k(25)], [k(23 - lf), k(27)], [k(14 - lf), k(27)]], body, sh(1));
    } else {
      // 가까운 다리: 땅에 붙은 허벅지에서 꼬리 쪽으로 뻗는다 (발가락 끝이 뒤로)
      S.ellipse(k(18), k(21), 12, 6, body, Object.assign(sh(1), { edge: col.darken(bc, 0.5) }));
      S.limb(k(28), k(24), k(34), k(25), 3, 3, body, sh(1));
      S.poly([[k(33), k(24)], [k(36), k(24)], [k(39), k(27)], [k(33), k(27)]], body, sh(1));
    }
    S.limb(k(14), k(13 + B), k(11 + hx / 3), k(17 + B), 2, 2, body, sh(1));
    const tack = bridled === true && !dead;
    if (tack) S.poly([[k(16), k(7 + B)], [k(26), k(7 + B)], [k(25), k(13 + B)], [k(17), k(13 + B)]], R('#c8403a', { hi: '#e8685a', sh: '#922c34' }), sh(1)); // 안장 깔개
    S.detail(p => {
      for (const x of [16, 20, 24, 28, 33]) if (!tack || x > 26) p.line(k(x), k(7 + B), k(x + 1), k(10 + B), '#8f4630');
      if (tack) {
        for (let x = 17; x <= 25; x++) p.px(k(x), k(13 + B), '#f3c14c'); // 깔개 아래 금 테
        p.rect(k(18), k(5 + B), 6, 2, '#8a5a3a'); p.rect(k(18), k(5 + B), 6, 1, '#b07a52'); p.px(k(18), k(4 + B), '#6a4430'); // 가죽 안장 (앞 머리가 솟는다)
        const L = '#3a2a26', RING = '#d6dcee';
        p.line(k(3 + hx), k(3 + B + hy), k(3 + hx), k(6 + B + hy), L); // 코끈 (주둥이를 두른다)
        p.line(k(10 + hx), k(2 + B + hy), k(10 + hx), k(6 + B + hy), L); // 정수리끈 (눈 뒤)
        p.px(k(10 + hx), k(7 + B + hy), RING); // 입꼬리의 쇠고리
        p.line(k(11 + hx), k(7 + B + hy), k(18), k(6 + B), L); // 고삐 → 안장
      }
      const ex = k(7 + hx), ey = k(3 + B + hy);
      if (dead) deadEye(p, ex, ey);
      else {
        p.rect(ex, ey, 2, 1, '#ffe066'); p.px(ex + 1, ey, EYE); p.eyeAt = [ex, ey, 2];
        p.line(ex - 1, ey - 1, ex + 2, ey - (pose.windup || pose.strike ? 0 : 1), EYE);
      }
      p.line(k(1 + hx), k(7 + B + hy), k(10 + hx), k(7 + B + hy), EYE);
      if (jaw) { p.line(k(3 + hx), k(8 + B + hy), k(10 + hx), k(8 + B + hy), '#6a2030'); }
      for (let x = 2; x < 10; x += 2) p.px(k(x + hx), k(7 + B + hy) + 1, WHITE);
      if (!dead) { p.px(k(15 - lf), k(27), WHITE); p.px(k(20 + lf), k(27), '#e8e0d0'); p.px(k(15 - lf) + 1, k(26), WHITE); }
      else { p.px(k(39), k(27), WHITE).px(k(34), k(23), WHITE).px(k(35), k(22), WHITE); p.px(k(40), k(25), '#e8e0d0'); } // 발톱 · 치켜든 낫 발톱
    });
    return S.build();
  }

  /* ================= 파키: 박치기 공룡 50×32 ================= */
  function pachy(pose) {
    const { S, k } = mk(50, 32);
    const bc = '#9a7ac2';
    const body = R(bc, { hi: '#c4a8e4', sh: '#72569c' }), far = R('#72569c', { sh: '#5a4280' }), dome = R('#f0dfb8', { sh: '#cdb688' }), belly = R('#efe0f0', { sh: '#cbb6d8' });
    const f = pose.f || 0, lf = legPhase(f) * 3, bob = f ? 1 : 0, dead = pose.dead;
    const hx = pose.strike ? -3 : pose.windup ? 2 : 0, hy = pose.windup || pose.strike ? 3 : 0;
    const dy = dead ? 9 : 0, B = bob + dy;
    if (!dead) {
      S.ellipse(k(24 + lf / 2), k(13 + B), 10, 11, far, sh(2));
      S.limb(k(28 + lf / 2), k(22 + B), k(27 + lf), k(29), 4, 4, far, sh(1));
      S.rect(k(23 + lf), k(29), 7, 2, far, sh(1));
    } else {
      // 쓰러짐: 먼 다리는 꼬리 밑으로 뒤로 뻗는다 (가까운 다리보다 조금 높게)
      S.limb(k(27), k(26), k(39), k(28), 4, 3, far, sh(1));
      S.rect(k(39), k(25), 2, 5, far, sh(1));
    }
    S.poly([[k(34), k(11 + B)], [k(49), k(8 + B)], [k(49), k(11 + B)], [k(36), k(19 + B)]], body, sh(2));
    const b = S.ellipse(k(13), k(8 + B), 25, 16, body, sh(3));
    S.ellipse(k(12), k(14 + B), 17, 9, belly, Object.assign(sh(1), { clip: b }));
    S.limb(k(17), k(13 + B), k(10 + hx), k(10 + B + hy), 9, 8, body, sh(2));
    S.ellipse(k(0 + hx), k(7 + B + hy), 14, 10, body, sh(2));
    S.ellipse(k(2 + hx), k(1 + B + hy), 14, 10, dome, { sh: 2, hi: 1, spot: [k(4 + hx), k(2 + B + hy), 4, 3] });
    if (!dead) {
      S.ellipse(k(20 - lf / 2), k(12 + B), 11, 12, body, Object.assign(sh(2), { edge: col.darken(bc, 0.45) }));
      S.limb(k(24 - lf / 2), k(22 + B), k(23 - lf), k(29), 4, 4, body, sh(1));
      S.rect(k(19 - lf), k(29), 7, 2, body, sh(1));
    } else {
      // 가까운 다리: 허벅지에서 꼬리 쪽으로 땅에 뻗는다
      S.ellipse(k(19), k(19), 11, 10, body, Object.assign(sh(2), { edge: col.darken(bc, 0.45) }));
      S.limb(k(26), k(27), k(35), k(29), 4, 3, body, Object.assign(sh(1), { edge: col.darken(bc, 0.45) }));
      S.rect(k(35), k(26), 2, 5, body, sh(1));
    }
    S.limb(k(13), k(15 + B), k(10), k(19 + B), 2, 2, body, sh(1));
    S.detail(p => {
      const ex = k(4 + hx), ey = k(10 + B + hy);
      if (dead) deadEye(p, ex, ey); else eye(p, ex, ey, false, pose.blink);
      p.line(k(1 + hx), k(14 + B + hy), k(5 + hx), k(14 + B + hy), EYE);
      for (const [x, y] of [[14, 4], [15, 7], [13, 1], [11, 0]]) p.px(k(x + hx), k(y + B + hy), '#fbf3dc');
      for (const x of [20, 25, 30]) p.line(k(x), k(9 + B), k(x + 1), k(12 + B), '#72569c');
      if (dead) p.px(k(37), k(28), BONE).px(k(37), k(30), BONE).px(k(41), k(27), BONE); // 뻗은 발의 발톱
    });
    return S.build();
  }

  /* ================= 갈리미무스: 타조를 닮은 겁쟁이 달리기 선수 37×26 =================
     작은 머리 · 이빨 없는 긴 부리 · 가늘고 긴 S자 목 · 짧은 몸통 · 곧게 뻗은 긴 꼬리 · 새처럼 꺾인 긴 다리(무릎은 앞, 발목은 뒤, 발가락 셋) ·
     깃털 난 짧은 팔. 약한 공룡이라 랩터보다 작고 가늘다 (머리가 하루 머리 높이쯤).
     목 · 다리가 두세 칸 굵기라 도형 음영이 뭉개져서, 꼬미처럼 몸은 픽셀 템플릿으로 찍고 다리만 관절 자리를 이어 그린다.
     b B d 몸(밝게/기본/그림자)  x 짙은 깃(꼬리 끝 · 팔)  C c 크림(목 앞 · 배)  h K k 부리  E 눈  T 발톱 */
  const GAL_PAL = {
    b: '#f0cc94', B: '#d9a86a', d: '#b07e48', x: '#8e6038', C: '#f6e6c4', c: '#dcc49a',
    h: '#aa988a', K: '#8c7868', k: '#66544e', E: EYE, T: BONE
  };
  // 비늘 다리 [밝게, 기본, 그림자] · 허벅지는 깃털 몸 색 (가까운 허벅지만 배와의 경계에 짙은 선)
  const GAL_LEG = { near: ['#d4c0a4', '#b89c80', '#8c7462'], far: ['#9c8470', '#8c7462', '#6c5a5a'] };
  const GAL_THIGH = { near: { hi: '#f0cc94', base: '#d9a86a', sh: '#b07e48', edge: '#8e6038' }, far: { hi: '#b88a56', base: '#b07e48', sh: '#8e6038' } };
  // 머리 · 목 · 몸통 · 꼬리 (0~15줄, 땅은 25줄)
  const GAL_BODY = [
    '....bbBB',
    '...bBBEBd',
    '.hKKBBEBd',
    'KkkkCCBd',
    '.....CBd',
    '.....CBd',
    '......CBd',
    '.......CBd',
    '........CBd',
    '........CCBd',
    '........CCBBbbbbbbbbb',
    '........CCBBBBBBBBBBBBbbbbbbbbbbb',
    '........CCBBBBBBBBBBBBBBBBBBBBBBBBBbx',
    '.........CCBBBBBBBBBBBBBBBBBBBddddxx',
    '..........cCCBBBBBBBBBBBddddd',
    '............cccddddddd'];
  // 가슴 앞의 짧은 팔: 날개깃과 발톱 (11줄부터)
  const GAL_ARM = [
    '.........bBd',
    '........dBd',
    '......xBd',
    '.....TxT'];
  // 쓰러짐: 옆으로 누워 긴 목을 땅에 뻗었다 (18줄부터)
  const GAL_DEAD = [
    '...........bbbbbbbbb',
    '.........bbBBBBBBBBBBbbbbbbbbbb',
    '....bb..bBBBBBBBBBBBBBBBBBBBBBBbbbbx',
    '...bBBbbBBBBBBBBBBBBBBBBBBBBBBBBBddxx',
    '.hKBBBBBCBBBBBBBBBBBBBBBBBBBddddd',
    'KkkCCBBCCCBBBBBBBBBBBBBBdddd',
    '....cc..ccccccddddddddd'];
  // 포즈마다 관절 자리 (템플릿 좌표). bx · by: 몸을 옮김 (걸을 때 오르내림 · 찰 때 몸을 뒤로) — 무릎은 몸을 따라가고,
  //   땅을 디딘 발목 · 발가락은 제자리. lift 든 발 · kick 앞으로 찬 발은 몸을 따라간다
  const GAL_POSE = {
    walk0: { near: { knee: [14, 16], ankle: [18, 21], toe: [16, 25] }, far: { knee: [20, 16], ankle: [24, 21], toe: [22, 25] } },
    walk1: { by: 1, near: { knee: [12, 17], ankle: [15, 21], toe: [13, 25] }, far: { knee: [20, 17], ankle: [24, 21], toe: [24, 25] } },
    walk2: { by: 1, near: { knee: [19, 17], ankle: [23, 21], toe: [23, 25] }, far: { knee: [14, 17], ankle: [17, 21], toe: [15, 25] } },
    windup: { bx: 1, by: 1, near: { knee: [13, 14], ankle: [15, 18], toe: [12, 20], lift: true }, far: { knee: [19, 17], ankle: [22, 21], toe: [20, 25] } },
    strike: { bx: 1, near: { knee: [13, 17], ankle: [9, 18], toe: [6, 19], kick: true }, far: { knee: [19, 16], ankle: [22, 21], toe: [20, 25] } }
  };
  const GAL_HIP = [18, 13];
  // 허벅지: 엉덩이에서 무릎으로 가늘어지는 북 (윗왼쪽 밝게 · 아랫오른쪽 그늘 · 앞쪽 테두리는 짙게).
  //   top 줄보다 위로는 이미 칠한 몸 안에만 칠한다 (등에 혹이 솟지 않게)
  function galThigh(p, hx, hy, kx, ky, c, top) {
    const m = new D.Mask(p.w, p.h), edge = [];
    m.ellipse(hx - 3, hy - 3, 6, 6); m.limb(hx, hy, kx, ky, 5, 3);
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      if (!m.has(x, y) || (top != null && y < top && !p.get(x, y))) continue;
      if (c.edge && (!m.has(x - 1, y) || !m.has(x, y + 1)) && p.get(x - 1, y) && y >= hy) edge.push(x, y);
      p.px(x, y, !m.has(x + 1, y + 1) ? c.sh : !m.has(x - 1, y - 1) ? c.hi : c.base);
    }
    for (let i = 0; i < edge.length; i += 2) p.px(edge[i], edge[i + 1], c.edge);
  }
  // 정강이 · 발허리: 두 줄을 나란히 그어 2칸 굵기 (앞줄 밝게 · 뒷줄 그늘, lo면 한 단 어둡게)
  function galShank(p, a, b, c, lo) {
    const [dx, dy] = Math.abs(b[1] - a[1]) >= Math.abs(b[0] - a[0]) ? [1, 0] : [0, 1];
    p.line(a[0], a[1], b[0], b[1], lo ? c[1] : c[0]);
    p.line(a[0] + dx, a[1] + dy, b[0] + dx, b[1] + dy, lo ? c[2] : c[1]);
  }
  function galLeg(p, j, side, bx, by) {
    const c = GAL_LEG[side], air = j.lift || j.kick;
    const at = (v, move) => [1 + v[0] + (move ? bx : 0), 1 + v[1] + (move ? by : 0)];
    const K = at(j.knee, true), A = at(j.ankle, air), T_ = at(j.toe, air), H = at(j.hip || GAL_HIP, true);
    galShank(p, K, A, c, false);
    galShank(p, A, [T_[0], T_[1] - 1], c, true);
    if (j.kick) { for (let x = T_[0] - 3; x <= T_[0]; x++) p.px(x, T_[1], c[1]); p.px(T_[0] - 4, T_[1], BONE); }
    else if (j.lift) p.px(T_[0], T_[1], c[1]).px(T_[0] - 1, T_[1] + 1, c[1]).px(T_[0] - 2, T_[1] + 1, BONE);
    else { for (let x = T_[0] - 3; x <= T_[0] + 1; x++) p.px(x, T_[1], c[1]); p.px(T_[0] - 3, T_[1], BONE); }
    galThigh(p, H[0], H[1], K[0], K[1], GAL_THIGH[side], side === 'near' ? 1 + by + (j.top || 15) : null);
  }
  function galli(pose, name) {
    const p = new D.Pix(40, 28);
    if (pose.dead) {
      galLeg(p, { hip: [21, 21], knee: [24, 22], ankle: [29, 22], toe: [33, 23], kick: true }, 'far', 0, 0);
      p.tmpl(GAL_DEAD, GAL_PAL, 1, 19);
      galLeg(p, { hip: [19, 21], top: 24, knee: [22, 24], ankle: [27, 24], toe: [31, 25], kick: true }, 'near', 0, 0);
      deadEye(p, 6, 22);
      return p.outline(P.outline);
    }
    const q = GAL_POSE[name] || GAL_POSE.walk0, bx = q.bx || 0, by = q.by || 0;
    galLeg(p, q.far, 'far', bx, by);
    p.tmpl(GAL_BODY, GAL_PAL, 1 + bx, 1 + by);
    galLeg(p, q.near, 'near', bx, by);
    p.tmpl(GAL_ARM, GAL_PAL, 1 + bx, 12 + by);
    const ex = 7 + bx, ey = 2 + by;
    if (pose.blink) p.px(ex, ey, GAL_PAL.B).px(ex - 1, ey + 1, EYE); // 눈 감음 (밤잠도 이 모습)
    else p.eyeAt = [ex, ey, 1];
    return p.outline(P.outline);
  }

  /* ================= 새끼 갈리미무스 21×17 (1장 약초 수업: 덫에 걸린 새끼) =================
     어미 키의 절반쯤. 머리와 눈이 크고 부리 · 목 · 꼬리가 짧다. 옅은 솜털에 짙은 줄무늬 두 줄(타조 · 에뮤 새끼처럼 풀숲에 숨는 무늬),
     다리는 새끼치고 길고 발이 크다. 어미처럼 템플릿 + 관절 다리 (GAL 참고) */
  const BABY_PAL = {
    b: '#f8e4bc', B: '#e8c896', d: '#c4a070', x: '#a07850', C: '#fbf0dc', c: '#ecd8b4',
    h: '#b8a494', K: '#a08c7c', k: '#7a6658', E: EYE, W: WHITE
  };
  const BABY_LEG = { near: ['#d8c4ac', '#c0a890', '#96806e'], far: ['#a89078', '#96806e', '#76625e'] };
  // 머리 · 목 · 몸통 · 꼬리 (0~11줄, 땅은 16줄). 눈은 2×3 (흰 점 하나)
  const BABY_BODY = [
    '...bbBB',
    '..bBBBBBd',
    '..bBWEBBd',
    '.hBBEEBBd',
    'KkkCEEBBd',
    '...CCBBd',
    '....CBBdbbbbbb',
    '....CCBBBBBBBBBbbb',
    '....CCBxxxxxxxBBBBBbx',
    '....CCCBBBBBBBBBddxx',
    '.....CCBxxxxxxBdd',
    '......cccccdddd'];
  const BABY_DEAD = [
    '....bbbbbbbb',
    '..bbBBBBBBBBbbbx',
    'bBWEBBBBBBBBBBBxx',
    'KkEEBxxxxxxBBddd',
    '..CCccccddddd'];
  const BABY_POSE = {
    walk0: { near: { knee: [9, 12], ankle: [11, 14], toe: [10, 16] }, far: { knee: [14, 12], ankle: [16, 14], toe: [15, 16] } },
    walk1: { by: 1, near: { knee: [8, 13], ankle: [9, 14], toe: [8, 16] }, far: { knee: [14, 13], ankle: [17, 14], toe: [17, 16] } },
    walk2: { by: 1, near: { knee: [12, 13], ankle: [15, 14], toe: [15, 16] }, far: { knee: [10, 13], ankle: [11, 14], toe: [10, 16] } }
  };
  function babyLeg(p, j, side) {
    const c = BABY_LEG[side], K = [1 + j.knee[0], 1 + j.knee[1]], A = [1 + j.ankle[0], 1 + j.ankle[1]], T_ = [1 + j.toe[0], 1 + j.toe[1]];
    galShank(p, K, A, c, false);
    galShank(p, A, [T_[0], T_[1] - 1], c, true);
    for (let x = T_[0] - 2; x <= T_[0] + 1; x++) p.px(x, T_[1], c[1]);
  }
  function galliBaby(pose, name) {
    const p = new D.Pix(23, 19);
    if (pose.dead) {
      // 옆으로 누워 두 다리를 꼬리 밑으로 뻗었다 (어미처럼): 먼 다리가 위, 가까운 다리는 땅에 · 끝에 발톱
      p.tmpl(BABY_DEAD, BABY_PAL, 1, 13);
      for (let x = 18; x <= 20; x++) p.px(x, 16, BABY_LEG.far[1]);
      for (let x = 14; x <= 20; x++) p.px(x, 17, BABY_LEG.near[x < 17 ? 2 : 1]);
      p.px(21, 16, BONE).px(21, 17, BONE);
      return p.outline(P.outline);
    }
    const q = BABY_POSE[name] || BABY_POSE.walk0, by = q.by || 0;
    babyLeg(p, q.far, 'far');
    p.tmpl(BABY_BODY, BABY_PAL, 1, 1 + by);
    babyLeg(p, q.near, 'near');
    const ex = 5, ey = 3 + by;
    if (pose.blink) p.rect(ex, ey, 2, 3, BABY_PAL.B).px(ex - 1, ey + 1, EYE).px(ex, ey + 2, EYE).px(ex + 1, ey + 2, EYE);
    else p.eyeAt = [ex, ey, 2];
    return p.outline(P.outline);
  }

  /* ================= 파라사우롤로푸스: 관 모양 볏 88×56 ================= */
  function para(pose) {
    const { S, k } = mk(88, 56);
    const bc = '#5b8fd0';
    const body = R(bc, { hi: '#8ab8ec', sh: '#3f68a8' }), far = R('#3f68a8', { sh: '#314f86' }), belly = R('#e6ecf6', { sh: '#b8c6dc' });
    const crest = R('#e0445a', { hi: '#f7808a', sh: '#a82c44' });
    const f = pose.f || 0, lf = legPhase(f) * 4, bob = f ? 1 : 0, dead = pose.dead;
    const dy = dead ? 14 : 0, B = bob + dy;
    const hx = pose.strike ? 2 : 0, tail = pose.strike ? -6 : pose.windup ? 3 : 0; // 꼬리 휘두르기
    const hy = dead ? 20 : 0; // 쓰러지면 긴 목을 땅에 뉘인다
    if (!dead) {
      S.limb(k(30 + lf / 2), k(36 + B), k(29 + lf), k(52), 5, 5, far, sh(1));
      S.ellipse(k(50 + lf / 2), k(26 + B), 16, 18, far, sh(2));
      S.limb(k(56 + lf / 2), k(40 + B), k(55 + lf), k(52), 6, 5, far, sh(1));
      S.rect(k(50 + lf), k(51), 9, 3, far, sh(1));
    } else {
      // 쓰러짐: 먼 뒷다리는 꼬리 밑으로 뒤로 뻗는다 (가까운 다리보다 조금 높게)
      S.limb(k(60), k(47), k(76), k(49), 6, 5, far, sh(1));
      S.rect(k(76), k(45), 3, 7, far, sh(1));
    }
    S.poly([[k(62), k(24 + B)], [k(87), k(22 + B + tail)], [k(87), k(26 + B + tail)], [k(64), k(36 + B)]], body, sh(2));
    const b = S.ellipse(k(22), k(20 + B), 46, 24, body, sh(3));
    S.ellipse(k(24), k(30 + B), 38, 14, belly, Object.assign(sh(1), { clip: b }));
    S.limb(k(28), k(28 + B), k(15 + hx), k(13 + B + hy), 11, 7, body, sh(2));
    S.limb(k(16 + hx), k(10 + B + hy), k(38 + hx), k(0 + B + hy), 5, 3, crest, sh(1));
    const hd = S.ellipse(k(3 + hx), k(8 + B + hy), 17, 10, body, sh(2));
    S.poly([[k(0 + hx), k(13 + B + hy)], [k(7 + hx), k(11 + B + hy)], [k(7 + hx), k(17 + B + hy)], [k(1 + hx), k(17 + B + hy)]], R('#f3c14c', { sh: '#d0962e' }), sh(1));
    if (!dead) {
      S.limb(k(34 - lf / 2), k(36 + B), k(33 - lf), k(52), 5, 5, body, sh(1));
      S.rect(k(29 - lf), k(51), 8, 3, body, sh(1));
      S.ellipse(k(46 - lf / 2), k(25 + B), 17, 19, body, Object.assign(sh(2), { edge: col.darken(bc, 0.45) }));
      S.limb(k(53 - lf / 2), k(40 + B), k(52 - lf), k(52), 7, 6, body, sh(1));
      S.rect(k(47 - lf), k(51), 10, 3, body, sh(1));
    } else {
      // 가까운 다리: 앞다리는 가슴 밑에서 머리 쪽으로, 뒷다리는 허벅지에서 꼬리 쪽으로 땅에 뻗는다
      S.limb(k(35), k(49), k(27), k(53), 5, 4, body, sh(1));
      S.rect(k(24), k(50), 3, 5, body, sh(1));
      S.ellipse(k(42), k(36), 17, 17, body, Object.assign(sh(2), { edge: col.darken(bc, 0.45) }));
      S.limb(k(55), k(50), k(71), k(53), 7, 6, body, Object.assign(sh(1), { edge: col.darken(bc, 0.45) }));
      S.rect(k(71), k(48), 3, 8, body, sh(1));
    }
    S.detail(p => {
      for (let x = 26; x < 62; x += 6) p.line(k(x), k(20 + B), k(x + 2), k(26 + B), '#f3c14c');
      for (let t = 0.2; t < 0.9; t += 0.25) p.px(k(16 + hx + (22 * t)), k(10 + B + hy - 10 * t), '#f7c0c8');
      const ex = k(12 + hx), ey = k(11 + B + hy);
      if (dead) deadEye(p, ex, ey); else eye(p, ex, ey, false, pose.blink);
      p.line(k(1 + hx), k(16 + B + hy), k(6 + hx), k(16 + B + hy), EYE);
      if (pose.windup) p.px(k(0 + hx), k(12 + B), '#fbf8ff');
    });
    return S.build();
  }

  /* ================= 트리케라톱스 92×46 =================
     덧붙인 포즈: flinch (움찔 — 머리를 뒤로 젖히고 눈을 질끈. 1장 사냥터에서 렉스에게 물릴 때) */
  function trike(pose, name) {
    const { S, k } = mk(92, 46);
    const bc = '#6f96c6';
    const body = R(bc, { hi: '#a3c4e6', sh: '#50709e' }), far = R('#50709e', { sh: '#3f5a86' }), frill = R('#ec8f44', { hi: '#f7c070', sh: '#c4602e' });
    const horn = R('#f4ead0', { hi: '#fffaf0', sh: '#cfc0a0' }), belly = R('#d8e6f2', { sh: '#aabcd4' }), beak = R('#4a4a66', { sh: '#34344a' });
    const f = pose.f || 0, lf = legPhase(f) * 3, bob = f ? 1 : 0, dead = pose.dead, fl = name === 'flinch';
    const dy = dead ? 10 : 0, B = bob + dy;
    const hy = pose.windup || pose.strike ? 4 : 0, hx = pose.strike ? -3 : fl ? 4 : 0; // 머리 숙여 돌진 · 움찔하면 뒤로 젖힌다
    if (!dead) {
      S.rect(k(66 + lf), k(28), 8, 14, far, sh(2)); S.rect(k(64 + lf), k(41), 11, 3, far, sh(1));
      S.rect(k(34 - lf), k(28), 8, 14, far, sh(2)); S.rect(k(32 - lf), k(41), 11, 3, far, sh(1));
    } else {
      // 쓰러짐: 먼 뒷다리는 꼬리 밑으로 뒤로 뻗는다 (가까운 다리보다 조금 높게)
      S.limb(k(70), k(33), k(86), k(35), 8, 7, far, sh(1));
      S.rect(k(85), k(30), 3, 9, far, sh(1));
    }
    S.poly([[k(76), k(14 + B)], [k(91), k(22 + B)], [k(90), k(25 + B)], [k(76), k(28 + B)]], body, sh(2));
    const b = S.ellipse(k(26), k(4 + B), 56, 32, body, sh(4));
    S.ellipse(k(30), k(22 + B), 46, 14, belly, Object.assign(sh(1), { clip: b }));
    if (!dead) {
      S.ellipse(k(58 - lf), k(14 + B), 18, 20, body, Object.assign(sh(3), { edge: col.darken(bc, 0.4) }));
      S.rect(k(60 - lf), k(28), 11, 14, body, sh(2)); S.rect(k(58 - lf), k(41), 14, 3, body, sh(1));
      S.rect(k(40 + lf), k(27), 11, 15, body, Object.assign(sh(2), { edge: col.darken(bc, 0.4) })); S.rect(k(38 + lf), k(41), 14, 3, body, sh(1));
    } else {
      // 가까운 뒷다리: 허벅지에서 꼬리 쪽으로 땅에 뻗는다 · 앞다리는 프릴 밑에서 머리 쪽으로
      S.ellipse(k(54), k(22), 18, 18, body, Object.assign(sh(3), { edge: col.darken(bc, 0.4) }));
      S.limb(k(64), k(36), k(81), k(40), 11, 10, body, Object.assign(sh(2), { edge: col.darken(bc, 0.4) }));
      S.rect(k(80), k(34), 4, 11, body, sh(1));
      S.limb(k(47), k(34), k(37), k(41), 10, 9, body, Object.assign(sh(2), { edge: col.darken(bc, 0.4) }));
      S.rect(k(32), k(36), 4, 10, body, sh(1));
    }
    S.ellipse(k(13 + hx), k(0 + B + hy), 28, 30, frill, Object.assign(sh(3), { edge: col.darken('#ec8f44', 0.35) }));
    S.poly([[k(2 + hx), k(24 + B + hy)], [k(8 + hx), k(16 + B + hy)], [k(18 + hx), k(13 + B + hy)], [k(29 + hx), k(17 + B + hy)], [k(31 + hx), k(26 + B + hy)], [k(27 + hx), k(34 + B + hy)], [k(14 + hx), k(36 + B + hy)], [k(6 + hx), k(32 + B + hy)]], body, Object.assign(sh(3), { edge: col.darken(bc, 0.4) }));
    S.poly([[k(0 + hx), k(28 + B + hy)], [k(6 + hx), k(23 + B + hy)], [k(9 + hx), k(30 + B + hy)], [k(3 + hx), k(33 + B + hy)]], beak, sh(1));
    S.poly([[k(20 + hx), k(13 + B + hy)], [k(5 + hx), k(3 + B + hy - (hy ? -2 : 0))], [k(23 + hx), k(11 + B + hy)]], horn, sh(1));
    S.poly([[k(16 + hx), k(16 + B + hy)], [k(1 + hx), k(6 + B + hy - (hy ? -2 : 0))], [k(19 + hx), k(14 + B + hy)]], horn, sh(1));
    S.poly([[k(8 + hx), k(21 + B + hy)], [k(5 + hx), k(15 + B + hy)], [k(11 + hx), k(20 + B + hy)]], horn, sh(1));
    S.detail(p => {
      for (const [x, y] of [[16, 3], [21, 1], [27, 1], [33, 4], [37, 9], [38, 16], [36, 23]]) p.rect(k(x + hx), k(y + B + hy), 2, 2, '#fbe3a0');
      const ex = k(21 + hx), ey = k(19 + B + hy);
      if (dead) deadEye(p, ex, ey);
      else if (fl) { p.line(ex - 1, ey, ex + 2, ey + 1, EYE); p.line(ex + 2, ey + 1, ex - 1, ey + 2, EYE); }
      else eye(p, ex, ey, true, pose.blink);
      p.line(ex - 2, ey - 1, ex + 2, ey - 2, col.darken(bc, 0.5));
      p.line(k(4 + hx), k(32 + B + hy), k(12 + hx), k(34 + B + hy), EYE);
      for (let x = 44; x < 76; x += 7) p.px(k(x), k(10 + B), '#a3c4e6');
      if (!dead) for (const x of [38 + lf, 58 - lf]) { p.px(k(x), k(43), BONE); p.px(k(x + 3), k(43), BONE); }
      else { for (const y of [36, 39, 42]) p.px(k(83), k(y), BONE).px(k(87), k(y - 4), BONE); for (const y of [38, 41, 44]) p.px(k(32), k(y), BONE); } // 뻗은 발바닥의 발톱
    });
    return S.build();
  }

  /* ================= 스테고사우루스 98×50 ================= */
  function stego(pose) {
    const { S, k } = mk(98, 50);
    const bc = '#8aa84e';
    const body = R(bc, { hi: '#b4cc78', sh: '#687f3a' }), far = R('#687f3a', { sh: '#52672e' }), belly = R('#e0d890', { sh: '#bfb468' });
    const plate = R('#e8703a', { hi: '#f7b060', sh: '#b8502e' }), spike = R(BONE, { sh: '#cfc0a0' });
    const f = pose.f || 0, lf = legPhase(f) * 3, bob = f ? 1 : 0, dead = pose.dead;
    const dy = dead ? 10 : 0, B = bob + dy, tail = pose.strike ? -8 : pose.windup ? 4 : 0;
    if (!dead) {
      S.rect(k(66 + lf), k(30), 8, 16, far, sh(2)); S.rect(k(64 + lf), k(45), 11, 3, far, sh(1));
      S.rect(k(30 - lf), k(34), 7, 12, far, sh(1)); S.rect(k(28 - lf), k(45), 10, 3, far, sh(1));
    } else {
      // 쓰러짐: 먼 뒷다리는 꼬리 밑으로 뒤로 뻗는다 (가까운 다리보다 조금 높게)
      S.limb(k(70), k(42), k(86), k(44), 8, 7, far, sh(1));
      S.rect(k(85), k(39), 3, 8, far, sh(1));
    }
    S.poly([[k(74), k(22 + B)], [k(97), k(30 + B + tail)], [k(96), k(34 + B + tail)], [k(74), k(34 + B)]], body, sh(2));
    for (const [x, y] of [[88, 28], [93, 29]]) {
      S.poly([[k(x), k(y + B + tail)], [k(x + 5), k(y - 9 + B + tail)], [k(x + 3), k(y + B + tail)]], spike, sh(1));
      S.poly([[k(x + 1), k(y + 2 + B + tail)], [k(x + 7), k(y - 3 + B + tail)], [k(x + 4), k(y + 3 + B + tail)]], spike, sh(1));
    }
    const plates = [[30, 14, 9], [37, 10, 12], [45, 7, 15], [54, 6, 16], [63, 8, 14], [71, 12, 11], [78, 17, 8]];
    plates.forEach(([x, y, h], i) => {
      const yy = y + B + 2;
      S.poly([[k(x - 4), k(yy + 4)], [k(x), k(yy - h + 4)], [k(x + 5), k(yy + 3)], [k(x + 1), k(yy + 8)]], plate, Object.assign(sh(1), { edge: i % 2 ? col.darken('#e8703a', 0.4) : null }));
    });
    const b = S.poly([[k(20), k(34 + B)], [k(28), k(18 + B)], [k(44), k(10 + B)], [k(58), k(9 + B)], [k(72), k(14 + B)], [k(80), k(24 + B)], [k(78), k(36 + B)], [k(60), k(42 + B)], [k(34), k(42 + B)]], body, sh(4));
    S.ellipse(k(28), k(30 + B), 48, 14, belly, Object.assign(sh(1), { clip: b }));
    S.limb(k(26), k(34 + B), k(12), k(35 + B), 11, 7, body, sh(2));
    S.ellipse(k(0), k(31 + B), 15, 9, body, sh(2));
    if (!dead) {
      S.ellipse(k(58 - lf), k(22 + B), 16, 20, body, Object.assign(sh(3), { edge: col.darken(bc, 0.45) }));
      S.rect(k(60 - lf), k(32), 10, 14, body, sh(2)); S.rect(k(58 - lf), k(45), 13, 3, body, sh(1));
      S.rect(k(35 + lf), k(34), 8, 12, body, Object.assign(sh(1), { edge: col.darken(bc, 0.45) })); S.rect(k(33 + lf), k(45), 11, 3, body, sh(1));
    } else {
      // 가까운 뒷다리: 허벅지에서 꼬리 쪽으로 땅에 뻗는다 · 앞다리는 목 밑에서 머리 쪽으로
      S.ellipse(k(54), k(28), 16, 18, body, Object.assign(sh(3), { edge: col.darken(bc, 0.45) }));
      S.limb(k(62), k(43), k(79), k(46), 10, 9, body, Object.assign(sh(2), { edge: col.darken(bc, 0.45) }));
      S.rect(k(78), k(41), 4, 10, body, sh(1));
      S.limb(k(38), k(44), k(26), k(47), 8, 7, body, Object.assign(sh(1), { edge: col.darken(bc, 0.45) }));
      S.rect(k(22), k(43), 4, 8, body, sh(1));
    }
    S.detail(p => {
      const ex = k(5), ey = k(33 + B);
      if (dead) deadEye(p, ex, ey); else eye(p, ex, ey, false, pose.blink);
      p.line(k(1), k(37 + B), k(6), k(37 + B), EYE);
      for (let x = 30; x < 76; x += 6) p.px(k(x), k(22 + B + ((x / 6) & 1) * 3), '#b4cc78');
      if (dead) { for (const y of [43, 46, 49]) p.px(k(81), k(y), BONE); for (const y of [45, 48]) p.px(k(22), k(y), BONE); p.px(k(87), k(41), BONE).px(k(87), k(44), BONE); } // 뻗은 발바닥의 발톱
    });
    return S.build();
  }

  /* ================= 바리오닉스: 강가 · 호숫가의 물고기 사냥꾼 90×44 (땅은 42줄) =================
     현대 복원을 따른다: 악어처럼 길고 낮은 주둥이(끝이 숟가락처럼 부푼 로제트, 그 뒤로 파인 홈에 아래턱 끝이 맞물린다) · 뒤로 물러난 콧구멍 ·
     콧등의 작은 볏 · 머리 뒤쪽 높이 붙은 작은 눈 · 곧게 뻗은 목 · 깊은 가슴 · 굵은 팔과 커다란 엄지 발톱(이름이 '무거운 발톱') ·
     새처럼 꺾인 다리(무릎은 앞, 발목은 뒤) · 길고 곧은 꼬리 · 비늘 피부.
     색은 다른 공룡에 없던 물빛 청록에 모래색 배(물가 짐승의 보호색)와 등 · 꼬리의 짙은 띠, 볏에만 주황 한 점.
     체급은 파라와 트리케라 사이 — 트리케라보다 가늘고 낮게. 앞으로 내민 주둥이가 잘리지 않게 틀 왼쪽에 3px을 비워 둔다.
     포즈: 걷기 3 · 눈 깜빡 · 낚아채기(windup · strike) · 갈고리(hook0 치켜듦 · hook1 긁어 내림) · 낚시(fish0 주둥이를 물에 · fish1 물고기를 물고) ·
       엎드려 기다리기(crouch — 밤의 물가) · 쓰러짐 */
  const BARY_C = { body: '#4f8c7f', hi: '#80bca4', sh: '#376a63', far: '#3a6b66', farSh: '#2b5153', belly: '#ecdfb2', bellySh: '#cbb98a',
    band: '#2b4a4f', crest: '#ee7a3c', crestHi: '#f8b46a', crestSh: '#bc5530', iris: '#ffe066' };
  // hx · hy 머리 옮김 · tilt 머리 숙임(라디안, +면 주둥이가 아래로) · jaw 아래턱 벌림(px, 턱끝 기준) · lf 걸음(+면 가까운 다리가 앞) ·
  //   by 몸 오르내림 · arm 가까운 팔(0 가슴 앞 · 1 치켜듦 · 2 앞으로 긁어 내림 · 3 뒤로 접음) · tail 꼬리 끝 흔들림 · lean 앞몸 낮춤
  const BARY_POSE = {
    walk0: {}, walk1: { lf: 3, by: 1, tail: -1 }, walk2: { lf: -3, by: 1, tail: 1 },
    windup: { hx: 4, hy: -3, jaw: 2, tilt: -0.1, eye: 'angry', tail: 1 },
    strike: { hx: -3, hy: 1, jaw: 7, eye: 'angry', lean: 1, tail: -1 },
    hook0: { hx: 5, hy: -8, tilt: -0.3, jaw: 4, arm: 1, eye: 'angry', tail: 2 },
    hook1: { hx: -4, hy: 3, tilt: 0.12, jaw: 3, arm: 2, eye: 'angry', lean: 2, tail: -1 },
    fish0: { hx: -3, hy: 12, tilt: 0.55, lean: 2, arm: 3 },
    fish1: { hx: 1, hy: -4, tilt: -0.28, jaw: 2, fish: true },
    crouch: { crouch: true }
  };
  BARY_POSE.roar = BARY_POSE.stomp = BARY_POSE.windup;
  const BARY_EXTRA = ['hook0', 'hook1', 'fish0', 'fish1', 'crouch'];
  function bary(pose, name) {
    const C = BARY_C, q = Object.assign({ hx: 0, hy: 0, tilt: 0, jaw: 0, lf: 0, by: 0, arm: 0, tail: 0, lean: 0, eye: 'open' }, BARY_POSE[name] || {});
    const body = R(C.body, { hi: C.hi, sh: C.sh }), far = R(C.far, { sh: C.farSh }), belly = R(C.belly, { sh: C.bellySh });
    const crest = R(C.crest, { hi: C.crestHi, sh: C.crestSh }), claw = R(BONE, { sh: '#cbb894' }), mouth = R('#8a2c34', { sh: '#5e1a26' });
    const EDGE = col.darken(C.body, 0.45);
    if (pose.blink) q.eye = 'closed';
    if (pose.dead) Object.assign(q, { dead: true, hx: 1, hy: 17, tilt: 0.06, jaw: 1 });
    if (q.crouch) Object.assign(q, { hy: 17 });
    const OX = 3, S = new Shape(90, 44), k = v => Math.round(v + OX) + 1;
    const lying = q.dead || q.crouch, B = q.by + (q.dead ? 11 : q.crouch ? 9 : 0), lf = q.lf, L = q.lean; // 땅에 엎드리거나 누우면 몸이 내려온다
    // 머리 좌표: (21, 11)이 정수리 뒤끝. 숙이면(tilt) 그 둘레로 돌리고, jaw는 아래턱 경첩(23)에서 턱끝으로 갈수록 벌어진다
    const HX = q.hx, HY = q.hy + L - (lying ? 0 : 2), ct = Math.cos(q.tilt), st = Math.sin(q.tilt);
    const hp = (x, y) => { const dx = x - 21, dy = y - 11; return [k(21 + HX + dx * ct + dy * st), k(11 + (lying ? 0 : B) + HY - dx * st + dy * ct)]; };
    const jw = (x, y) => hp(x, y + q.jaw * Math.max(0, 23 - x) / 23);
    const H = pts => pts.map(([x, y]) => hp(x, y)), J = pts => pts.map(([x, y]) => jw(x, y)), kp = pts => pts.map(([x, y]) => [k(x), k(y)]);
    const G = 41; // 땅 (발바닥 줄)
    // 다리 관절: 엉덩이 → 무릎(앞) → 발목(뒤) → 발. 디딘 발은 제자리, 무릎은 몸을 따라간다
    const leg = (dx, ph) => ({ hip: [50 + dx, 17 + B], knee: [46 + dx - ph / 2, 28 + B], ankle: [51 + dx - ph, 35.5], foot: 44 + dx - ph });

    // 먼 다리 · 먼 팔 (어둡게)
    if (!lying) {
      const g = leg(5, -lf);
      S.ellipse(k(g.hip[0] - 7), k(g.hip[1] - 6), 12, 18, far, { sh: 2, hi: 1 });
      S.limb(k(g.knee[0]), k(g.knee[1]), k(g.ankle[0]), k(g.ankle[1]), 5, 4, far, { sh: 1 });
      S.limb(k(g.ankle[0]), k(g.ankle[1]), k(g.ankle[0] - 1), k(G - 2), 4, 3, far, { sh: 1 });
      S.poly(kp([[g.foot, G - 2.5], [g.foot + 8, G - 2.5], [g.foot + 9, G], [g.foot - 1, G]]), far, { sh: 1 });
      if (q.arm !== 3) {
        S.limb(k(37), k(20 + B + L), k(35.5), k(25 + B + L), 4, 3, far, { sh: 1 });
        S.limb(k(35.5), k(25 + B + L), k(31.5), k(27.5 + B + L), 3, 3, far, { sh: 1 });
      }
    } else if (q.dead) {
      // 쓰러짐: 먼 뒷다리는 꼬리 밑으로 뒤로 뻗는다 (가까운 다리보다 조금 높게)
      S.limb(k(56), k(30), k(68), k(33), 6, 4, far, { sh: 1 });
      S.limb(k(68), k(33), k(74), k(33), 4, 3, far, { sh: 1 });
      S.poly(kp([[73, 30], [76, 30], [77, 36], [74, 36]]), far, { sh: 1 });
    }
    // 꼬리: 굵은 밑동에서 끝으로 가늘게, 끝은 살짝 흔들린다 (누우면 땅에 늘어진다). 밑면의 모래색은 밑동 쪽에만
    const t1 = q.tail * 0.5, t2 = q.tail, dl = lying ? 1 : 0;
    const tail = S.poly(kp([[55, 9 + B], [66, 10.5 + B + t1 + dl * 3], [75, 13 + B + t2 + dl * 7], [84, 15.5 + B + t2 + dl * 11], [84, 17 + B + t2 + dl * 11],
      [75, 18.5 + B + t2 + dl * 7], [66, 20.5 + B + t1 + dl * 3], [57, 25 + B]]), body, { sh: 2, hi: 1 });
    S.poly(kp([[56, 21.5 + B], [66, 18.8 + B + t1 + dl * 3], [74, 17.4 + B + t2 * 0.8 + dl * 6], [74, 20 + B + t2 * 0.8 + dl * 6], [66, 21.5 + B + t1 + dl * 3], [57, 26 + B]]),
      belly, { sh: 1, hi: 0, clip: tail });
    // 몸통 · 배 (깊은 가슴, 엉덩이가 가장 높다)
    const tor = S.poly(kp([[30, 17 + B + L], [32, 12 + B + L], [37, 9 + B + L / 2], [45, 7 + B], [53, 7.5 + B], [59, 10 + B], [61, 15 + B], [59, 21 + B], [53, 26 + B],
      [43, 28 + B], [35, 27.5 + B + L], [31, 23 + B + L]]), body, { sh: 3, hi: 1, spot: [k(43), k(9 + B), 10, 3] });
    S.ellipse(k(28), k(19 + B + L), 31, 11, belly, { sh: 1, hi: 0, clip: tor });
    // 목: 가슴에서 머리통 뒤 아래쪽으로 곧게 (정수리와 목덜미 사이가 파여 목이 보인다 · 목 밑은 모래색)
    const nx0 = q.dead ? 32 : 34, ny0 = (q.dead ? 22 : 16) + B + L;
    const nk = S.limb(k(nx0), k(ny0), ...hp(23, 15.4), 9, 6, body, { sh: 2, hi: 1 });
    S.limb(k(nx0), k(ny0 + 4), ...hp(22, 18.4), 4, 2, belly, { sh: 1, hi: 0, clip: nk });
    // 머리: 벌린 입속 → 위턱 · 머리통 → 콧등 볏 → 아래턱 (밑면은 모래색)
    if (q.jaw > 0) S.poly([...H([[0.2, 18.4], [2, 18], [3.2, 17], [4.6, 17.2], [6, 17.6], [12, 17.7], [18, 17.9], [23, 18.6]]),
      ...J([[23, 19.4], [18, 18.6], [12, 18.4], [5, 18.3], [2.6, 18.4], [0.6, 19.4]])], mouth, { sh: 1, hi: 0 });
    S.poly(H([[20.6, 10.9], [17, 10.6], [14, 11.6], [9, 13.4], [4, 14.2], [0.8, 14.2], [-0.6, 14.5], [-1.2, 16.2], [-0.8, 18], [0.6, 18.9], [2, 18.2], [3.2, 16.8],
      [4.6, 17.1], [6, 17.6], [12, 17.6], [18, 17.8], [22, 18.4], [23.6, 16.6], [23.6, 13.8], [22.4, 11.6]]), body, { sh: 1, hi: 1, edge: EDGE });
    S.poly(H([[9.2, 13.6], [11, 10.2], [12.6, 9.7], [14.6, 11]]), crest, { sh: 1, hi: 1 });
    const lj = S.poly(J([[0.4, 19.2], [1.6, 19], [2.6, 17.8], [4.2, 17.8], [6, 18.2], [12, 18.2], [18, 18.4], [22, 18.7], [23.4, 19.5], [22, 20.6], [16, 20.5], [8, 20.2], [3, 20.4], [0.4, 20.2]]),
      body, { sh: 1, hi: 0, edge: EDGE });
    S.poly(J([[0, 19.8], [8, 19.6], [22, 20], [22, 21.5], [0, 21.5]]), belly, { sh: 0, hi: 0, clip: lj });

    // 가까운 다리: 굵은 허벅지 → 무릎 → 발목 → 발 (앞 발톱)
    if (!lying) {
      const g = leg(0, lf);
      S.ellipse(k(g.hip[0] - 7), k(g.hip[1] - 6), 13, 19, body, { sh: 2, hi: 1, edge: EDGE });
      S.limb(k(g.knee[0]), k(g.knee[1]), k(g.ankle[0]), k(g.ankle[1]), 6, 4, body, { sh: 1, edge: EDGE });
      S.limb(k(g.ankle[0]), k(g.ankle[1]), k(g.ankle[0] - 1), k(G - 2), 4, 3, body, { sh: 1 });
      S.poly(kp([[g.foot, G - 2.5], [g.foot + 8, G - 2.5], [g.foot + 9, G], [g.foot - 1, G]]), body, { sh: 1 });
    } else if (q.crouch) {
      // 엎드림: 다리를 배 밑에 접고 발만 앞으로 살짝
      S.ellipse(k(43), k(24), 16, 12, body, { sh: 2, hi: 1, edge: EDGE });
      S.poly(kp([[39, G - 2], [47, G - 2], [48, G], [38, G]]), body, { sh: 1 });
    } else {
      // 쓰러짐: 가까운 뒷다리는 허벅지에서 꼬리 쪽으로 땅에 뻗는다
      S.ellipse(k(43), k(24), 15, 12, body, { sh: 2, hi: 1, edge: EDGE });
      S.limb(k(53), k(33), k(64), k(37), 6, 4, body, { sh: 1, edge: EDGE });
      S.limb(k(64), k(37), k(70), k(37.5), 4, 3, body, { sh: 1, edge: EDGE });
      S.poly(kp([[69, 34.5], [72, 34.5], [73, 41], [70, 41]]), body, { sh: 1 });
    }
    // 가까운 팔: 굵은 위팔 → 아래팔 → 커다란 엄지 발톱 (갈고리처럼 휜 크림색)
    const ay = B + L;
    const ARM = {
      0: { sh: [35, 20 + ay], el: [33, 25 + ay], wr: [28.5, 27.5 + ay], cl: [[28.8, 26.8], [26.2, 26.4], [24, 27.6], [23, 30.2], [23.5, 32.6], [24.6, 30.8], [26, 29.4], [28.6, 29]] },
      1: { sh: [35, 19 + ay], el: [31, 23 + ay], wr: [25.5, 19.5 + ay], cl: [[26, 18.8], [24, 16.2], [21.6, 14.6], [18.8, 14.6], [21, 16], [22.6, 18.2], [24.2, 20.6]] },
      2: { sh: [35, 20 + ay], el: [31, 27 + ay], wr: [25.5, 31 + ay], cl: [[25.6, 30.2], [22.8, 30.6], [21, 32.4], [20.6, 35], [21.4, 37.4], [22.2, 35.2], [23.4, 33.2], [25.6, 32.6]] },
      3: { sh: [36, 20 + ay], el: [35.5, 25 + ay], wr: [32.5, 27.5 + ay], cl: [[32.6, 27], [30.6, 27.2], [29.4, 28.6], [29.4, 30.4], [30.4, 29.2], [32.4, 29]] },
      dead: { sh: [34, 28], el: [30, 33], wr: [25, 36], cl: [[25.4, 35.4], [22.6, 35.4], [20.8, 36.8], [20.2, 39.2], [21.4, 38], [23, 37.2], [25.4, 37.6]] }
    };
    const A_ = q.dead ? ARM.dead : q.crouch ? null : ARM[q.arm];
    if (A_) {
      S.limb(k(A_.sh[0]), k(A_.sh[1]), k(A_.el[0]), k(A_.el[1]), 5, 4, body, { sh: 1, hi: 1, edge: EDGE });
      S.limb(k(A_.el[0]), k(A_.el[1]), k(A_.wr[0]), k(A_.wr[1]), 4, 4, body, { sh: 1, hi: 1, edge: EDGE });
      const cy = q.dead || q.arm === 1 || q.arm === 2 ? 0 : ay;
      S.poly(kp(A_.cl.map(([x, y]) => [x, y + cy])), claw, { sh: 1, hi: 0 });
    }

    S.detail(p => {
      const cb = col.c32(C.body), ch = col.c32(C.hi), cs = col.c32(C.sh), isBody = v => v === cb || v === ch || v === cs;
      // 등 · 꼬리의 짙은 띠: 그 줄의 맨 위 칸(실루엣)에서 몇 칸 아래로, 몸 색 위에만 (살짝 비스듬히 · 꼬리 끝으로 갈수록 짧게)
      for (const x0 of [40, 46, 52, 58, 64, 70, 76, 81]) {
        const x = k(x0);
        let top = -1;
