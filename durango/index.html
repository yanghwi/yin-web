<style>:root {
color-scheme: dark;
--bg: #0c0a1d; --ink: #f7f3ff; --dim: #9a92d0; --print: #8a82cc; --print-hi: #b9b2e0; --accent: #ffe066;
--err-bg: #3a1020; --err-ink: #ffd0d0; --run: #ffe066; --run-no: #ff8a7a;
--pw: 100px; --kw: 56px; 
}
html { height: 100%; background: var(--bg); overscroll-behavior: none; }
body {
height: 100%; margin: 0; overflow: hidden; color: var(--ink); background: var(--bg);
font-family: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 12px;
touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#screen { position: fixed; left: 0; top: 0; display: block; image-rendering: crisp-edges; image-rendering: pixelated; background: #0e0a16; }
#controls { display: none; }
body.touch #controls { display: block; }
.btn { font: inherit; color: inherit; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; touch-action: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.dpad { position: fixed; left: 0; top: 0; width: var(--pw); height: var(--pw); touch-action: none; }
.dpad::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; } 
.dpad svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.dpad .cross { position: absolute; inset: 0; pointer-events: none; transition: transform .05s linear;
transform: perspective(calc(var(--pw) * 1.8)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.dpad .arms rect { fill: #000; opacity: 0; transition: opacity .05s linear; }
.dpad.pu .au, .dpad.pd .ad, .dpad.pl .al, .dpad.pr .ar { opacity: .38; }
#runring { position: absolute; inset: -9%; border-radius: 50%; box-sizing: border-box; border: 2px dashed rgba(138, 130, 204, .6); opacity: 0; pointer-events: none; transition: opacity .12s; }
.dpad.held #runring { opacity: .8; }
.dpad.run #runring { opacity: 1; border-style: solid; border-color: var(--run); box-shadow: 0 0 8px var(--run); }
.dpad.norun #runring { opacity: .9; border-color: var(--run-no); }
.key { position: fixed; left: 0; top: 0; width: var(--kw); height: var(--kw); }
.keybtn { position: relative; display: block; width: 100%; height: 100%; border-radius: 50%;
background: radial-gradient(circle at 58% 62%, #1d1a3a 0, #0b0a17 58%, #05040b 100%);
box-shadow: inset 3px 4px 6px rgba(0, 0, 0, .95), inset -1px -2px 2px rgba(90, 80, 170, .35), 0 0 0 1px rgba(0, 0, 0, .55), -1px -1px 0 1px rgba(150, 140, 220, .1); }
.keybtn::before { content: ""; position: absolute; inset: 8%; border-radius: 50%;
background: radial-gradient(circle at 36% 30%, #8e8b99 0, #5c5966 17%, #3d3b46 45%, #27262d 78%, #18171d 100%);
box-shadow: 2px 4px 4px rgba(0, 0, 0, .75), inset 1px 1.5px 1px rgba(255, 255, 255, .22), inset -2px -3px 5px rgba(0, 0, 0, .5);
transition: transform .04s linear, box-shadow .04s linear, filter .04s linear; }
.keybtn::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; } 
.keybtn.on::before { transform: translateY(1.5px) scale(.975); filter: brightness(.84);
box-shadow: 1px 1px 1px rgba(0, 0, 0, .8), inset 1px 1px 1px rgba(255, 255, 255, .14), inset -1px -2px 4px rgba(0, 0, 0, .55); }
.print { position: absolute; left: 50%; top: 100%; margin-top: 3px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 4px;
white-space: nowrap; pointer-events: none; color: var(--print); font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 10px; }
.print b { font-family: "Galmuri11 Bold", "Galmuri11", sans-serif; font-weight: normal; font-size: 13px; color: var(--print-hi); }
#keyA .print span { color: var(--accent); }
#sys { position: fixed; left: 0; top: 0; display: flex; flex-direction: column; gap: 2px; }
.sysbtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; color: var(--print); font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 11px; }
.sysbtn i { position: relative; flex: none; width: 22px; height: 22px; border-radius: 50%;
background: radial-gradient(circle at 58% 62%, #1d1a3a 0, #0b0a17 60%, #05040b 100%);
box-shadow: inset 2px 2px 3px rgba(0, 0, 0, .95), inset -1px -1px 1px rgba(90, 80, 170, .35), -1px -1px 0 1px rgba(150, 140, 220, .08); }
.sysbtn i::before { content: ""; position: absolute; inset: 3px; border-radius: 50%;
background: radial-gradient(circle at 38% 32%, #a19eac 0, #6e6b79 30%, #4b4955 70%, #35333c 100%);
box-shadow: 1px 2px 2px rgba(0, 0, 0, .7), inset -1px -1px 2px rgba(0, 0, 0, .4); transition: transform .04s linear, filter .04s linear; }
.sysbtn.on i::before { transform: translateY(1px); filter: brightness(.82); box-shadow: 0 .5px 1px rgba(0, 0, 0, .8); }
.sysbtn.on span { color: var(--print-hi); }
#keys { position: fixed; left: 0; right: 0; top: 0; text-align: center; pointer-events: none; white-space: nowrap; font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 10px; color: var(--print); }
#keys span { padding: 3px 8px; border-radius: 4px; }
#keys.over span { background: rgba(12, 10, 29, .78); }
#keys[hidden] { display: none; }
#rotate { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; box-sizing: border-box;
background: #110e22 radial-gradient(circle at 50% 42%, #1d1940 0, #110e22 70%); text-align: center; }
#rotate[hidden] { display: none; }
#rotate .phone { position: relative; width: 36px; height: 62px; margin-bottom: 22px; box-sizing: border-box; border: 3px solid var(--print-hi); border-radius: 8px; animation: turn 2.6s ease-in-out infinite; }
#rotate .phone::before { content: ""; position: absolute; inset: 5px 4px 9px; border-radius: 2px; background: #3d3670; }
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 8px; height: 2px; margin-left: -4px; border-radius: 1px; background: var(--print-hi); }
#rotate p { margin: 0; font-size: 16px; color: var(--ink); }
#rotate small { font-family: "Galmuri9", "Galmuri11", sans-serif; font-size: 11px; color: var(--dim); }
@keyframes turn { 0%, 22% { transform: rotate(0deg); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
#err { position: fixed; z-index: 6; left: 16px; right: 16px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding: 8px; background: var(--err-bg); color: var(--err-ink); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
.dpad .cross, .dpad .arms rect, #runring, .keybtn::before, .sysbtn i::before { transition: none; }
#rotate .phone { animation: none; transform: rotate(-90deg); }
}</style>
</head>

const pickLine=lines=>lines[Math.floor(G.t/7)%lines.length];const nowOrOwn=(now,own)=>{const slot=Math.floor(G.t/7);return now&&slot%2===0?now:own[(now?slot>>1:slot)%own.length];};const stageId=()=>Q[G.quest.stage]?Q[G.quest.stage].id:'free';const before=id=>G.quest.stage<G.stageOf(id);function halmaeTalk(){const id=stageId(),now={armor:'요즘 밤마다 울타리 밖에서 뭔가 긁는 소리가 나. 늙은이 귀에도 또렷하단다.',raid:'오늘 밤은 문을 단단히 걸어 잠가야겠구나. …하루야, 너도 몸조심하거라.',bary:'고원 호수엔 요즘 물고기가 통 안 뛰는구나. 물가에 뭔가 큰 게 지키고 있는 게지. 조심하거라.',trike:'그날 밤 종소리에 심장이 떨어지는 줄 알았단다. 고맙다, 하루야.',hornspear:'그날 밤 종소리에 심장이 떨어지는 줄 알았단다. 고맙다, 하루야.',salve:'약초를 찾니? 남동쪽 갈대 연못가에 가 보렴. 물가엔 늘 약초가 모여 난단다.',fawn:'새끼 공룡을 살리러 간다고? 겐조 영감, 무뚝뚝해도 속은 따뜻하지.',rexSee:'렉스가 마을 코앞까지 내려왔다니… 이런 일은 처음이구나. 멀찍이서 보기만 하거라.',rexTell:'얼굴이 하얗구나, 하루야. …겐조 영감한테 먼저 가 보거라.',rex:'둥지까지 간다고? …꼭 살아서 돌아오거라. 배추 한 포기 아껴 두마.',free:'숲에서 새소리가 다시 들리는구나. 배추도 기운이 나는지 쑥쑥 크네.'}[id];const own=['물질하다 숨 한 번 참고 올라왔더니 여기더구나. 1974년, 제주 바다에서 말이다.','남서쪽 바닷가에 배가 한 척 얹혀 있단다. 토마스 영감 배지. 떠밀려 온 상자를 뒤지면 쓸 만한 게 나오기도 해.','남동쪽 연못가 갈대는 베면 섬유가 되고, 그 둘레엔 약초도 곧잘 난단다.','배추 잘 컸지? 공룡들이 풀은 뜯어도 배추는 안 건드려. 콤프소 녀석들만 빼고.'];return[halmae(nowOrOwn(now,own))];}
function thomasTalk(){const id=stageId(),now={armor:'바다가 유난히 잔잔한 밤이 제일 위험하지. 요즘 밤이 딱 그렇다네.',raid:'오늘 밤은 불 곁을 떠나지 말게. 어둠 속에선 저 녀석들이 우리보다 눈이 밝아.',bary:'호숫가의 주둥이 긴 녀석 말인가? 물가에선 등을 보이지 말게. 바다에서 배운 거라네.',trike:'종을 친 게 몇 해 만인지. …자네 덕에 다들 살았네.',hornspear:'북쪽 고원의 뿔 달린 녀석을 잡았다고? 허, 처음 봤을 땐 배만 한 짐승인 줄 알았지.',salve:'겐조 영감이 수업을 한다고? 나한텐 한 번도 안 가르쳐 주던데.',fawn:'새끼를 살려 주러 간다고? …겐조 영감답군.',rexSee:'렉스가 사냥터까지 내려왔다고? …폭풍이 오기 전엔 물고기가 먼저 도망치지. 바다에서도 그랬다네.',rexTell:'…자네 얼굴을 보니 뭘 봤는지 알겠군. 겐조 영감에게 먼저 가 보게.',rex:'그 숲에 간다고? 새도 울지 않는 곳이네. …무운을 비네, 젊은이.',free:G.flags.lionSeen?'그날 밤 뿔나팔 소리… 북쪽 곶 쪽이었네. 난 거기서 석 달을 버텼지만\n바다 말고는 아무것도 못 봤는데.':'자네가 렉스를 몰아냈다고? …그 숲에 새가 다시 울지는 모르겠군.'}[id];const own=['1912년, 북대서양. 안개 낀 밤에 배째로 이 섬에 떨어졌지. 살아남은 건… 나 하나였네.','남서쪽 모래톱에 내 배 「메리 앤」이 있네. 파도가 가끔 새 상자를 밀어 올려. 어디서 오는지는 나도 모르지.','북동쪽 숲엔 가지 말게. 새도 울지 않는 곳이야. 그 끝에 렉스 둥지가 있지.'];return[thomas(nowOrOwn(now,own))];}
G.buddyTalk=function(b){const id=stageId();if(b.id==='kom'){const acts=['(꼬미가 꼬리를 흔들며 하루를 올려다본다.)','(꼬미가 하루의 손을 핥는다.)','(꼬미가 킁킁 바람 냄새를 맡는다. …무언가를 찾는 걸까.)','(목줄의 이름표가 달랑거린다. 주인이 보고 싶은 걸까.)'];return[{emote:{who:'kom',e:pickLine(['♥','♪','?','…'])}},{sfx:'bark'},say('꼬미',1100,pickLine(acts))];}
if(b.id==='jack')return[jack({spear:'부싯돌은 바위를 곡괭이로 깨야 나와. 바위는 곳곳에 있지만 북서쪽 옛 망루 터 언덕에 몰려 있지.',pachy:'파키는 먼저 덤비진 않지만 가까이 가면 들이받는다. 내가 도발하면 뒤로 돌아가서 찔러.',armor:'가죽이 모자라면 파라사우롤로푸스도 괜찮아. 순해서 먼저 덤비지 않지. 꼬리만 조심해.',raid:'밤엔 불빛 안에 있어. 모닥불 곁이면 우리가 유리하다. 녀석들은 다치면 들어온 문으로 달아나.',bary:'호숫가 녀석은 발톱이 올라가면 굴러. 걸리면 입 앞으로 끌려간다. 싫으면 그냥 지나가도 돼.',trike:'트리케라는 돌진이 무섭다. 바닥이 길게 번쩍이면 옆으로, 옆으로 피해.',hornspear:'뿔 하나에 나뭇가지 둘, 가죽 하나. 작업대에서 만들면 돼.',salve:'겐조 영감님 수업이라… 나도 처음엔 연고 하나 달이는 데 반나절 걸렸지.',fawn:'…새끼를 살리러 간다고. 영감님다운 수업이군.',rexSee:'보기만 하는 거다. 발소리 죽이고, 덤비지 마.',rexTell:'…겐조 영감님께 먼저 알리자. 그다음 일은 그다음이다.',rex:'렉스는 한 방이 무겁다. 포효가 오면 몸이 굳기 전에 멀리 떨어져.',free:'렉스 가죽으로 갑옷을 지어 볼까. 트럭 시트보다 질기겠군.'}[id]||'큰 녀석은 혼자서는 못 잡아. 같이 가자.')];return[mina({spear:'돌창 만들면 나한테도 보여 줘! …무기는 무서우니까 하루가 들고.',pachy:'다치면 내가 치료할게. 대신 약 주머니는 쉬어야 다시 차니까 무리는 금지!',armor:'가죽옷 입으면 한결 든든할 거야. 할머니 빨랫줄에 널어 두면 금방 마르고.',raid:'무섭지만… 내가 뒤에서 계속 치료할게. 불빛 안으로만 오면 돼.',bary:'낚시하는 동안엔 우릴 신경 안 써. 조용히 지나가도 되고… 싸울 거면 배부터 채우자!',trike:'배고프면 모닥불에서 요리해 먹자. 든든하면 한 대 정도는 버틸 수 있어!',hornspear:'뿔창이라니, 하루 벌써 사냥꾼 다 됐다!',salve:'겐조 할아버지 연고는 정말 잘 들어. 나한테도 좀 가르쳐 주시면 좋을 텐데.',fawn:'새끼 공룡… 꼭 살려 주자, 하루.',rexSee:'…보기만 하는 거지? 절대 덤비지 마, 하루.',rexTell:'손이 아직도 떨려…. 빨리 마을로 가자.',rex:'싸우기 전에 모닥불에서 쉬어 가자. 내 약 주머니도 채워야 하고.',free:'하루, 부산 바다는 엄청 예뻐. …언젠가 같이 가 보자. 약속!'}[id]||'안녕! 오늘은 뭐 먹을까?')];};G.inVillage=e=>{const V=G.W0&&G.W0.V;return!!V&&!G.inside&&V.inside(Math.floor(e.x/T),Math.floor(e.y/T));};const genzoSpot=()=>{const C=G.W0.CAMP;return{x:(C.x+2)*T+8,y:(C.y+3)*T+12};};function placeGenzo(at){let n=G.npcById('genzo');if(!n){n=new NPC('genzo','genzo','겐조',0,0,GENZO,genzoTalk);G.npcs.push(n);}
const s=at||genzoSpot();n.x=s.x;n.y=s.y;n.hidden=false;n.dir='down';n.route=null;n.sitting=false;return n;}
function genzoHome(){const n=G.npcById('genzo')||placeGenzo(),s=genzoSpot();if(hyp(n.x-s.x,n.y-s.y)>280&&!onScreen(n.x,n.y)){placeGenzo();return;}
walkTo(n,[...(G.inVillage(n)?[]:northWay().reverse()),s],'down',36);}
const genzoNear=r=>{const n=G.npcById('genzo');return!!n&&!n.hidden&&hyp(n.x-G.player.x,n.y-G.player.y)<r;};function genzoTalk(){const id=Q[G.quest.stage]&&Q[G.quest.stage].id;if(id==='salve')return[genzo('약초는 연못가나 호숫가에 모여 난다.\n세 줌에 섬유 하나, 모닥불에서 달이면 된다.')];if(id==='fawn')return[genzo(G.count('salve')?'새끼는 저 덫에 걸려 있다. 연고를 들고 다가가 발라 줘라.\n겁먹지 않게 천천히.':'연고가 없구나. 약초를 뜯어 모닥불에서 다시 달여라.')];if(id==='rexSee')return[genzo('멀찍이서 보기만 해라. 오늘은 덤빌 때가 아니다.')];if(id==='rex')return[genzo(pickLine(['죽이지는 마라. 물러나게만 해.','렉스는 둥지에서 잔다. 알에 손을 대거나 먼저 건드리면 깬다.','렉스는 마을에 들어온 적이 없어. 늘 북쪽 길목만 지켰지.\n여기까지 내려온 건 처음이다.']))];if(G.flags.lionSeen&&!G.flags.lionTold)return lionTalk();return[genzo(pickLine(['산의 주인은 죽이는 게 아니야. 물러나게 할 뿐이지.','연고가 떨어지면 약초를 뜯어라. 잡을 땐 잡고, 살릴 땐 살린다.',...(G.flags.lionSeen?['북쪽 곶의 깃발, 가서 봤느냐. 렉스가 비운 길목이다.','다음엔 한 줌이 아닐 게다. …울타리부터 손봐 둬야겠군.']:[])]))];}
function lionTalk(){return[{face:{who:'genzo',to:'player'}},genzo('새벽에 북쪽 곶에 다녀왔다. 흙길 끝에 붉은 깃발이 꽂혀 있더군.\n사자 문장이었다.'),genzo('모래엔 쇠 박은 신발 자국과 랩터 발자국이 뒤엉켜 있었다.\n랩터를 부리는 사람들이다.'),haru('랩터를… 부려요?'),genzo('북쪽 곶 너머 땅엔 성을 쌓고 사는 자들이 있다. 공룡에 굴레를 씌우지.\n렉스가 있는 동안엔 길목을 넘어오지 못했다.'),{emote:{who:'genzo',e:'…'}},{wait:0.8},genzo('깃발은 돌아오겠다고 꽂는 거다. …다음엔 한 줌이 아닐 게다.'),{call:()=>{G.flags.lionTold=true;}}];}
function genzoArrives(){const p=G.player,g=placeGenzo(G.findSpot(p.x-3,p.y+24,0)||{x:p.x,y:p.y+24});g.dir='up';G.flags.genzoMet=true;G.runScript([{cine:true},{face:{who:'kom',to:'genzo'}},{emote:{who:'kom',e:'♥'}},{wait:0.9},genzo('…그 뿔창, 네가 만들었나.'),{call:()=>{p.say('!',1);G.sfx('ok');}},{face:{who:'player',to:'genzo'}},{wait:0.7},{form:{to:'genzo'}},jack('하하, 놀랐지? 겐조 영감님은 발소리가 없어.\n영감님, 사냥에서 돌아오셨군요.'),haru('하, 하루예요. 트리케라톱스 뿔로 만들었어요!'),jack('겐조 영감님은 이 섬에서 가장 오래 산 워퍼야. 1970년대에 일본 아키타에서 왔지.\n산에서 짐승을 쫓던 마타기였다나.'),{emote:{who:'genzo',e:'…'}},{wait:0.9},genzo('창은 짐승을 쓰러뜨린다. 하지만 사냥꾼은 상처를 다스릴 줄도 알아야 하지.'),...(G.count('salve')?[]:[genzo('약초 세 줌에 섬유 하나. 모닥불에서 연고를 달여 봐라.\n약초는 연못가나 호숫가에 모여 난다.'),genzo('다 달이면 모닥불로 가져와라. 거기 있으마.')])],()=>{genzoHome();G.questCheck();G.save(true);});}
