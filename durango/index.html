  // 내구도 HUD: 손(방금 쓴 도구, 아니면 든 무기) · 입은 옷 중 가장 닳은 것. 싸우는 중이거나 방금 닳았거나 곧 부서질 때만 보인다
  function gearRows() {
    const g = G.player.gear, frac = s => s[2] / D.Items[s[0]].dur;
    const hand = G.gearT > 0 && G.gearLast && (G.inv.indexOf(G.gearLast) >= 0 || g.weapon === G.gearLast) ? G.gearLast : g.weapon;
    const worst = ['head', 'top', 'bottom'].map(k => g[k]).filter(Boolean).sort((a, b) => frac(a) - frac(b))[0];
    const rows = [hand, worst].filter(s => s && G.durable(s[0])).map(s => ({ icon: D.Items[s[0]].icon, frac: frac(s) }));
    const show = G.combatT > 0 || G.gearT > 0 || rows.some(r => r.frac <= DUR_WARN) ? rows : [];
    // 켜진 횃불은 계속 타니 밤새 맨 위에 (얼마나 남았는지)
    const tc = G.player.torchLit && G.torchSlot();
    return tc ? [{ icon: D.Items[tc[0]].icon, frac: frac(tc) }, ...show] : show;
  }
  G.hudTarget = function () {
    if (G.inside) return null;
    const p = G.player;
    let best = null, bd = 200;
    for (const d of G.dinos) {
      if (d.dead) continue;
      const engaged = (d.hostile && d.target && d.target.team === 'party') || d === G.lastTarget;
      if (!engaged) continue;
      const dd = hyp(d.x - p.x, d.y - p.y) - (d.S.boss ? 100 : 0);
      if (dd < bd) { bd = dd; best = d; }
    }
    return best;
  };
  function drawScript(l, t) {
    const s = G.script, st = s.steps[s.i];
    if (st && st.say && s.dlg.lines) UI.drawDialog(l, s.dlg, t);
  }

  /* ---------------- 저장 ---------------- */
  // 바깥 맵의 지금 상태: 지금 선 맵이면 G.* (방 안이면 G.inside에 맡긴 땅 · 물체), 떠나온 맵이면 G.fields
  function fieldNow(id) {
    if (id !== G.field) return G.fields[id];
    const F = {};
    for (const k of FIELD_KEYS) F[k] = G[k];
    if (G.inside) Object.assign(F, { map: G.inside.map, grid: G.inside.grid, ground: G.inside.ground, objs: G.inside.objs });
    return F;
  }
  const placedOf = objs => objs.filter(o => o.placed && !(o.trap && o.gone)).map(o => ({ type: o.type, tx: o.tx, ty: o.ty, dir: o.dir, item: Object.keys(D.Items).find(k => D.Items[k].prop === o.type) }));
  const goneOf = objs => objs.filter(o => !o.placed && o.gone).map(o => [o.id, Math.max(0, o.respawnAt - G.t)]);
  const bundlesOf = list => list.map(b => ({ x: Math.round(b.x), y: Math.round(b.y), items: b.items }));
  // 저장: 섬의 설치물 · 캐 간 채집물 · 꾸러미 · 물러난 보스는 예전 자리 그대로 (옛 저장 · hot 복원과 같은 꼴).
  //   field: 지금 선 바깥 맵 (p는 그 맵에서의 자리 — 방 안이면 문 앞) · fields: 섬 말고 가 본 바깥 맵마다 설치물 · 채집물 · 꾸러미
  //   (이번에 가 보지 않은 맵은 불러온 그대로 넘긴다)
  G.saveData = function () {
    const p = G.player, pos = G.worldPos(), I = fieldNow('island'), fields = Object.assign({}, G.fieldSaves);
    for (const id of new Set([...Object.keys(G.fields), G.field])) {
      const F = id === 'island' ? null : fieldNow(id);
      if (F && F.objs) fields[id] = { placed: placedOf(F.objs), gone: goneOf(F.objs), bundles: bundlesOf(F.bundles) };
    }
    return {
      v: 1, mv: MAP_V, t: Date.now(), clock: G.clock, day: G.day, gt: G.t, field: G.field,
      p: { x: pos.x, y: pos.y, hp: p.hpT, maxHp: p.maxHp, sta: p.sta, hunger: p.hunger, lv: p.lv, exp: p.exp, gear: p.gear, wounds: p.wounds, hearty: Math.round(p.hearty) },
      inv: G.inv, chest: G.chest, luck: G.luck, party: G.party.map(b => ({ id: b.id, hp: b.hp, maxHp: b.maxHp, gear: b.gear, wounds: b.wounds, pouch: b.pouch })),
      bundles: bundlesOf(I.bundles),
      placed: placedOf(I.objs),
      gone: goneOf(I.objs),
      flags: G.flags, quest: G.questToSave(), kills: G.kills,
      boss: I.spawns.filter(g => g.boss && g.alive <= 0 && g.deadAt).map(g => g.id),
      fields
    };
  };
  G.save = function (quiet) {
    const data = G.saveData();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); if (!quiet) G.toast('저장했다!', null, 0, P.accent); return true; }
    catch (e) { if (!quiet) G.toast('저장할 수 없다 (브라우저 저장소 막힘)', null, 0, '#ff8a7a'); return false; }
  };
  G.loadData = function () { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } };
  G.hasSave = () => !!G.loadData();
  G.load = function (d) {
    const p = G.player;
    Object.assign(p, { x: d.p.x, y: d.p.y, hp: d.p.hp, hpT: d.p.hp, maxHp: d.p.maxHp, sta: d.p.sta, hunger: d.p.hunger, hungerShow: d.p.hunger, lv: d.p.lv, exp: d.p.exp });
    // 최대 체력은 레벨로 다시 센다 (레벨 성장 수치가 바뀌어도 옛 저장이 맞게) · 부상 · 든든함
    p.wounds = d.p.wounds || 0; p.hearty = d.p.hearty || 0; p.maxHp = D.hpFor(p.lv);
    p.hpT = p.hp = Math.min(p.hpT, p.hpCap);
    G.clock = d.clock; G.day = d.day; G.inv = normInv(d.inv); G.chest = normInv(d.chest); G.luck = d.luck || {};
    // 장비칸. 옛 저장(무기 · 옷 두 가지만, 장비한 것도 가방에 있던 때)은 가방에서 그 한 개를 꺼내 칸에 넣는다
    // 무기 칸에 들려 있던 횃불(하루 · 동료)은 가방으로 (횃불은 이제 장비칸 없이 가방에서 켜진다)
    torchToBag(d.p.gear); for (const b of d.party || []) torchToBag(b.gear);
    if (d.p.gear) p.gear = G.normGear(d.p.gear);
    else {
      const pick = (id, i) => !id ? null : G.inv[i] && G.inv[i][0] === id ? G.inv[i] : G.inv.find(s => s[0] === id);
      const w = pick(d.p.weapon, d.p.wi), a = pick(d.p.armor, d.p.ai);
      if (w) G.equipTo(p, w);
      if (a) G.equipTo(p, a);
    }
    G.flags = d.flags || {}; G.quest = G.questFromSave(d.quest); G.kills = d.kills || {};
    const oldMap = (d.mv || 1) < MAP_V, MAP_K = oldMap ? D.World.W / (MAP_W[d.mv || 1] || 96) : 1;
    let refunded = 0;
    // 같은 섬이라도 지형이 바뀌어(렉스 둥지 둘레의 모래톱이 바다가 되는 등) 발밑이 물 · 절벽이 된 자리는 가까운 빈자리로 옮긴다 (설치물 · 꾸러미 · 하루)
    const sunk = (tx, ty) => G.grid.t[ty * G.grid.w + tx] === 1, sunkPx = (x, y) => sunk(Math.floor(x / T), Math.floor(y / T));
    for (const o of d.placed || []) {
      // 옛 섬에 놓았던 설치물: 1.25배 옮긴 자리 둘레에서 빈칸을 찾고, 없으면 가방으로 돌려준다
      let tx = o.tx, ty = o.ty;
      if (oldMap || sunk(o.tx, o.ty)) {
        const at = placedSpot(o, Math.round(o.tx * MAP_K), Math.round(o.ty * MAP_K));
        if (!at) { if (D.Items[o.item]) { const sl = G.inv.find(x => x[0] === o.item); if (sl) sl[1]++; else G.inv.push([o.item, 1]); refunded++; } continue; }
        [tx, ty] = at;
      }
      placeSaved(o, tx, ty);
    }
    if (!oldMap) applyGone(d.gone); // (옛 섬의 채집물 id는 칸 좌표라 맞지 않는다 — 모두 새로 자란 셈)
    // 물러났거나(옛 저장은 쓰러진) 보스 무리 (id로 남는다. 옛 저장은 무리 순번이었고 렉스 = OLD_REX_I, 나머지 순번은 버린다)
    for (const k of d.boss || []) {
      const g = G.spawns.find(o => o.boss && (o.id === k || (k === OLD_REX_I && o.id === 'rex')));
      if (!g) continue;
      G.dinos = G.dinos.filter(dd => dd.group !== g); g.alive = 0; g.deadAt = -1e9;
    }
    delete G.flags.rexBackDay; // 옛 저장: 렉스가 다시 오던 날 (이제 렉스는 돌아오지 않는다)
    G.pendingParty = d.party || [];
    // 쓰러진 자리에 떨군 꾸러미 (옛 섬이면 자리를 섬 배율로 옮긴다)
    G.bundles = (d.bundles || []).map(b => {
      const s = !oldMap && sunkPx(b.x, b.y) && G.findSpot(b.x, b.y, 0);
      return new A.Bundle(b.items, s ? s.x : b.x * MAP_K, s ? s.y : b.y * MAP_K);
    });
    // 옛 섬의 자리: 1.25배 옮긴 곳 가까이 걸어서 갈 수 있는 빈자리 (없으면 마을)
    if (oldMap) {
      const s = G.findSpot(d.p.x * MAP_K, d.p.y * MAP_K, 0) || { x: G.campPt.x, y: G.campPt.y };
      p.x = s.x; p.y = s.y;
      G.toast('섬이 넓어졌다!', null, 0, P.accent);
    } else if (sunkPx(p.x, p.y)) {
      const s = G.findSpot(p.x, p.y, 0) || { x: G.campPt.x, y: G.campPt.y };
      p.x = s.x; p.y = s.y;
    }
    if (refunded) G.toast('옛 자리에 둘 수 없던 설치물은 가방에 넣었다', null, 0, '#b9b2e0');
    // 섬 말고 다른 바깥 맵에서 저장했으면: 섬 쪽 자리는 마을로 두고(무리를 세우고 이야기 쪽이 준비하는 동안), 그 뒤 그 맵으로 건너간다 (G.resumeField)
    G.fieldSaves = d.fields || {};
    const away = d.field && d.field !== 'island' && D.Maps[d.field] && D.Maps[d.field].kind === 'field' ? d.field : null;
    if (away) { G.pendingField = { id: away, p: { x: d.p.x, y: d.p.y } }; p.x = G.campPt.x; p.y = G.campPt.y; }
  };
  // 저장된 설치물 하나를 (tx, ty) 칸에 놓는다 · 캐 간 채집물([id, 다시 자라기까지 남은 초])은 캔 모습으로
  function placeSaved(o, tx, ty) {
    const obj = { type: o.type, tx, ty, x: tx * T + 8, y: ty * T + 15, placed: true, id: 'p' + tx + '_' + ty, dir: o.dir };
    Object.assign(obj, PLACED[o.item]);
    addObj(obj);
  }
  function applyGone(list) {
    const byId = new Map(G.objs.map(o => [o.id, o]));
    for (const [id, left] of list || []) {
      const o = byId.get(id);
      if (!o || !o.node) continue;
      deplete(o, D.Nodes[o.node]);
      o.respawnAt = G.t + left;
    }
  }
  // 섬 말고 다른 바깥 맵의 저장을 되살린다 (buildField가 그 맵을 처음 지을 때)
  function restoreField(S) {
    for (const o of S.placed || []) placeSaved(o, o.tx, o.ty);
    applyGone(S.gone);
    G.bundles = (S.bundles || []).map(b => new A.Bundle(b.items, b.x, b.y));
  }
  // 옛 저장의 설치물을 둘 칸: (tx,ty) 둘레 3칸 안에서 발밑이 모두 비고 걸어서 갈 수 있는 곳
  function placedSpot(o, tx, ty) {
    const pr = D.Props.get(o.type, o.dir), f = (pr && pr.foot) || [1, 1], w = Math.max(1, f[0]), rows = Math.max(1, f[1] || 1);
    const ok = (x0, y0) => {
      for (let j = 0; j < rows; j++) for (let i = 0; i < w; i++) {
        const x = x0 - Math.floor((w - 1) / 2) + i, y = y0 - j, c = D.Terrain.tileAt(G.map, x, y);
        if (x < 0 || y < 0 || x >= G.map.w || y >= G.map.h || G.grid.solidTile(x, y) || c === 'w' || c === 'b' || !G.reach[y * G.map.w + x]) return false;
        if (G.objs.some(q => !q.gone && q.tx === x && q.ty === y)) return false;
      }
      return true;
    };
    for (let r = 0; r <= 3; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) === r && ok(tx + dx, ty + dy)) return [tx + dx, ty + dy];
    }
    return null;
  }
  G.clearSave = function () { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 없음 */ } };
})(window.D = window.D || {});

</script>
<script>
/* 듀랑고 GBA — 메뉴: 명령 창(가방·제작·장비·지도·저장) · 잠자기 · 보관함
   MOTHER식 겹겹 창 + 까딱이는 손가락. 메뉴가 열리면 필드는 멈춘다. */
'use strict';
(function (D) {
  const G = D.Play, UI = D.UI, TX = D.Text, P = D.PAL;
  const MAIN = [['가방', 'bag'], ['제작', 'craft'], ['장비', 'equip'], ['지도', 'map'], ['저장', 'save'], ['음악', 'music']]; // 음악: 켜고 끄기 (이름은 지금 누르면 할 일)
  const KIND_NAME = { mat: '재료', food: '음식', weapon: '도구', light: '도구', armor: '옷', use: '회복', place: '설치' };
  const kindName = it => it.kind === 'armor' ? D.SLOT_NAME[it.slot] : KIND_NAME[it.kind]; // 옷은 부위로 (머리 · 상의 · 하의)
  const ROLE_NAME = { tank: '돌격 · 도발', support: '투척 · 치료', pet: '물기 · 교란' };
  // 장비 창의 사람 탭: 장비하는 사람(하루 · 잭 · 미나) 먼저, 장비를 못 하는 꼬미는 끝에 (상태만)
  const roster = () => [...G.members(), ...G.party.filter(b => !b.gear)];
  // 장비 창에 칸을 늘어놓는 순서: 무기 먼저, 옷은 머리부터 아래로
  const EQUIP_ORDER = ['weapon', 'head', 'top', 'bottom'];

  G.openMenu = function (type, o) {
    G.menu = Object.assign({ type, sel: 0, top: 0, t: 0, sub: null, back: null }, o || {});
    G.sfx('open');
  };
  function back() {
    const m = G.menu;
    if (m.sub) { m.sub = null; G.sfx('cancel'); return; }
    if (m.back) { const b = m.back; G.menu = b; G.sfx('cancel'); return; }
    G.menu = null; G.sfx('cancel');
  }
  function sub(type, o) { G.menu = Object.assign({ type, sel: 0, top: 0, t: 0, sub: null, back: G.menu }, o || {}); G.sfx('ok'); }
  function move(m, I, n, cols) {
    cols = cols || 1;
    const prev = m.sel;
    if (I.rep.down) m.sel = Math.min(n - 1, m.sel + cols);
    if (I.rep.up) m.sel = Math.max(0, m.sel - cols);
    if (cols > 1) { if (I.rep.right) m.sel = Math.min(n - 1, m.sel + 1); if (I.rep.left) m.sel = Math.max(0, m.sel - 1); }
    if (m.sel !== prev) G.sfx('cursor');
  }
  // 가방 목록 (종류 순, 옷은 머리 · 상의 · 하의 순)
  function bagList() {
    const order = ['weapon', 'light', 'armor', 'use', 'food', 'place', 'mat'];
    const rank = s => { const it = D.Items[s[0]]; return order.indexOf(it.kind) * 4 + (it.kind === 'armor' ? D.SLOTS.indexOf(it.slot) : 0); };
    return G.inv.slice().sort((a, b) => rank(a) - rank(b));
  }
  function itemActions(s) {
    const it = D.Items[s[0]], acts = [];
    if (it.kind === 'food' || it.kind === 'use') acts.push(['먹기', 'use']);
    if (it.kind === 'weapon') acts.push(['들기', 'equip']);
    if (it.kind === 'armor') acts.push(['입기', 'equip']);
    if (it.kind === 'place') acts.push(['설치', 'place']);
    if (it.kind === 'light' && G.isNight()) acts.push([G.torchOn ? '끄기' : '켜기', 'torch']); // 횃불은 밤에만 (낮엔 저절로 꺼 둔다)
    acts.push(['버리기', 'drop']);
    acts.push(['그만두기', 'cancel']);
    if (it.kind === 'use') acts[0][0] = '쓰기';
    return acts;
  }
  function useItem(id) {
    const it = D.Items[id], p = G.player;
    if (it.kind === 'food' || it.kind === 'use') {
      if (it.food) p.feed(it.food);
      if (it.heal > 0) p.heal(it.heal);
      if (it.heal < 0) { p.hpT = Math.max(1, p.hpT + it.heal); G.toast('으… 배탈이 났다', null, 0, '#ff8a7a'); }
      G.take(id, 1);
      G.sfx(it.kind === 'use' ? 'heal' : 'eat');
      G.fx.burst(p.x, p.y - 16, 8, { speed: 30, types: ['star', 'dot'], colors: ['#7ad07a', '#ffe066'], life: 0.6, up: 20 });
      G.toast(D.josa(it.name, '을를') + (it.kind === 'use' ? ' 썼다' : ' 먹었다'), it.icon, 0);
      if (it.hearty) { p.hearty = Math.max(p.hearty, it.hearty); G.toast('든든하다! 크게 맞아도 한 번은 버틴다', null, 0, P.accent); }
      G.questCheck();
    }
  }
  // 가방의 그 한 개를 mb에게 (그 칸에 있던 것은 가방으로)
  function equipFromBag(mb, s) {
    const it = D.Items[s[0]];
    if (!G.equipTo(mb, s)) return;
    G.sfx('equip');
    if (mb !== G.player) G.toast(D.josa(mb.name, '이가') + ' ' + D.josa(it.name, '을를') + (it.kind === 'weapon' ? ' 들었다' : ' 입었다'), it.icon, 0);
  }

  G.updateMenu = function (dt, I) {
    const m = G.menu;
    m.t += dt;
    if (m.sub) return updateSub(m, I);
    switch (m.type) {
      case 'main': {
        const prev = m.sel;
        if (I.rep.right) m.sel = (m.sel + 1) % MAIN.length;
        if (I.rep.left) m.sel = (m.sel + MAIN.length - 1) % MAIN.length;
        if (I.rep.down && m.sel < 3) m.sel = Math.min(MAIN.length - 1, m.sel + 3); if (I.rep.up && m.sel >= 3) m.sel -= 3;
        if (m.sel !== prev) G.sfx('cursor');
        if (I.pressed.a) {
          const k = MAIN[m.sel][1];
          if (k === 'save') { G.save(false); G.sfx('ok'); }
          else if (k === 'music') { D.Audio.unlock(); D.Audio.setMusic(!D.Audio.music); G.sfx('ok'); }
          else sub(k, k === 'craft' ? { filter: null } : {});
        }
        if (I.pressed.b || I.pressed.menu) back();
        break;
      }
      case 'bag': {
        const list = bagList();
        move(m, I, Math.max(1, list.length));
        if (I.pressed.a && list[m.sel]) { const s = list[m.sel]; m.sub = { kind: 'act', id: s[0], slot: s, sel: 0, acts: itemActions(s) }; G.sfx('ok'); }
        if (I.pressed.b || I.pressed.menu || I.pressed.bag) back();
        break;
      }
      case 'craft': {
        const rows = G.recipeList(m.filter);
        move(m, I, rows.length);
        if (I.pressed.a && rows[m.sel]) G.craft(rows[m.sel]);
        if (I.pressed.b || I.pressed.menu || I.pressed.craft) back();
        break;
      }
      case 'equip': {
        // ←→ 사람(하루 · 잭 · 미나 · 꼬미), ↑↓ 칸(머리 · 상의 · 하의 · 무기), A 가방에서 골라 바꾸기. 꼬미 탭은 상태만
        const ms = roster();
        m.who = Math.min(m.who || 0, ms.length - 1);
        if ((I.pressed.left || I.pressed.right) && ms.length > 1) { m.who = (m.who + (I.pressed.right ? 1 : ms.length - 1)) % ms.length; G.sfx('cursor'); }
        const mb = ms[m.who];
        if (mb.gear) {
          move(m, I, EQUIP_ORDER.length);
          if (I.pressed.a) {
            const slot = EQUIP_ORDER[m.sel], opts = G.inv.filter(s => D.slotOf(s[0]) === slot);
            m.sub = { kind: 'pick', who: mb, slot, opts: [null, ...opts], sel: opts.length ? 1 : 0 };

  //   to 쪽으로 가로만 조금 틀어서, 위에 있는 것(무리 · 렉스)의 발치가 함께 보이게
  const partyShot = to => { const p = G.player; return { x: p.x + (to ? (to.x - p.x) * 0.3 : 0), y: p.y - 24 }; };

  const onScreen = (x, y) => x > G.cam.x - 16 && x < G.cam.x + 256 && y > G.cam.y - 8 && y < G.cam.y + 196;
  // a에서 b로 걸어갈 길: 곧게 갈 수 있으면 [], 아니면 곧게 이어지는 중간 자리 하나 [w] (통나무집 · 울타리를 돌아간다). 못 찾으면 null
  function detour(a, b) {
    if (G.clearLine(a, b)) return [];
    let best = null, bd = 1e9;
    for (const r of [40, 64, 96, 128]) for (let k = 0; k < 24; k++) {
      const ang = k / 24 * Math.PI * 2, w = { x: b.x + Math.cos(ang) * r, y: b.y + Math.sin(ang) * r * 0.8 };
      if (!G.okSpot(w.x, w.y, 0) || !G.clearLine(a, w) || !G.clearLine(w, b)) continue;
      const d = hyp(w.x - a.x, w.y - a.y) + hyp(b.x - w.x, b.y - w.y);
      if (d < bd) { bd = d; best = w; }
    }
    return best ? [best] : null;
  }
  // 사람을 pts를 따라 걸려 보낸다 (산책 길처럼 — 마지막 자리에서 face를 보고 선다). 자리 사이가 곧지 않으면 돌아가는 자리를 끼워 넣는다
  function walkTo(n, pts, face, spd) {
    const route = [];
    let from = n;
    for (const q of pts) { for (const w of detour(from, q) || []) route.push([w.x, w.y, 0.01]); route.push([q.x, q.y, 0.01]); from = q; }
    const last = route[route.length - 1];
    route[route.length - 1] = [last[0], last[1], 1e9, face];
    Object.assign(n, { route, ri: 0, waitT: 0.4, spd: spd || 20, hidden: false, clear: null, trip: true });
  }

  //   단계는 이름으로 부른다(G.stageOf). 단계를 끼워 넣어도 코드 · 저장이 어긋나지 않게 (저장에는 번호 · 이름 · 장이 함께 남는다)

    const r = D.Recipes.find(x => x.id === rid);

    const miss = r.need.filter(([id, n]) => G.count(id) < n).map(([id, n]) => D.Items[id].name + ' ' + G.count(id) + '/' + n);
    return miss.length ? ' (' + miss.join(' · ') + ')' : ready ? ' ' + ready : '';

  // 저장에는 { stage, id }. 이름이 있으면 이름으로 찾고, 이름이 없는 옛 저장은 그때의 단계 표(OLD_Q)로 옮긴다

  const OLD_Q = ['sticks', 'axe', 'logs', 'fire', 'compy', 'cook', 'village', 'spear', 'pachy', 'armor', 'raid', 'trike', 'hornspear', 'salve', 'free'];
  G.questToSave = () => ({ stage: G.quest.stage, id: Q[G.quest.stage] ? Q[G.quest.stage].id : null, ch: G.chapter() });
  G.questFromSave = function (q) {
    if (!q) return { stage: 0 };

  // 남은 습격대: 마을 안에서 버티는 녀석(달아나는 녀석은 뺀다) + 아직 문 밖에서 들어올 녀석

  G.raidOn = () => G.atStage('raid') && !!G.flags.raidStarted && !G.flags.raidWon;
  // 습격 날 해가 진 뒤 (습격이 끝나기 전): 잠들면 습격 밤을 통째로 건너뛰니 침대에서 자지 않는다

  G.raidDue = () => G.atStage('raid') && !G.flags.raidWon && !!G.flags.raidArmed && G.phase() !== 'day' && G.phase() !== 'dawn';
  G.goalText = () => { const q = Q[G.quest.stage]; return q ? fitGoal(q.goal()) : ''; };
  // 목표 줄이 HUD(224px)보다 길면 모자란 재료를 '첫째 외 N'으로 줄인다 (잘려서 무엇이 모자란지 안 보이지 않게)
  function fitGoal(t) {

    // 이야기를 나누기 전에 쓰러진 동료를 일으킨다 (쓰러져 누운 채 "해냈다!"라고 말하지 않게)

  };

  G.npcById = id => G.npcs.find(n => n.id === id);
  // 워프 지점의 심 박사
  function simTalk() {

      compy: '콤프소는 겁이 많아. 쫓아가서 공격하렴.',

  // 마을 사람들이 평소에 있는 자리: 심 박사는 모닥불 곁, 잭은 작업대에서 창을 손보고, 미나는 포장마차 뒤에서 무언가를 끓인다
  function placeCampNpcs() {

      if (!G.npcById('minaCamp')) { const n = new NPC('minaCamp', 'mina', '미나', (C.x - 11) * T + 8, (C.y - 4) * T + 12, MINA, () => [mina('안녕! 나는 미나. 너도 워프해 온 거지?')]); n.dir = 'down'; G.npcs.push(n); }

  }
  // 튜토리얼: 심 박사가 하루 곁으로 걸어와서 말한다 (멀리 있으면 화면 밖 가까이에 세워 두고 걸어 들어온다)
  function simWalksUp() {
    const s = G.npcById('sim'), p = G.player;
    if (!s || s.hidden) return;
    // 설 자리: 하루 옆 (심 박사가 있던 쪽 먼저, 막혔으면 반대쪽)
    let side = s.x >= p.x ? 1 : -1, to = null;
    for (const k of [side, -side]) { const c = { x: p.x + k * 28, y: p.y + 2 }; if (G.okSpot(c.x, c.y, 0)) { to = c; side = k; break; } }
    to = to || G.findSpot(p.x + side * 28, p.y + 2, 0) || { x: p.x, y: p.y + 20 };
    // 멀거나 곧게 오는 길이 막혀 있으면 화면 밖 가까이, 곧게 걸어올 수 있는 곳에 세워 둔다
    if (hyp(s.x - p.x, s.y - p.y) > 150 || !G.clearLine(s, to)) { const st = G.approachFrom(to, 118, s); if (st) { s.x = st.x; s.y = st.y; } else { s.x = to.x; s.y = to.y; } }
    G.runScript([{ move: { who: 'sim', x: to.x, y: to.y, spd: 56, face: 'player' } }, { face: { who: 'player', to: 'sim' } }]);
  }
  // 튜토리얼 '콤프소 사냥': 워프 지점 곁을 지키던 콤프소 무리(stay)를 하루 눈앞으로 데려온다 — 모닥불을 어디에 피웠든,
  //   재료를 줍는 사이 겁먹고 달아나 멀어졌든 (콤프소는 도망친 자리를 새 집으로 삼는다). 찾아 헤매지 않게.
  //   설 자리: 하루 옆, 대화창에 가리지 않게 조금 위쪽 · 하루와 꼬미에게서 겁먹지 않을 만큼(낮 45px) 떨어진 곳. 무리가 있던 쪽을 먼저 본다.
  //   scene이면(모닥불을 피운 참) 화면 밖의 녀석은 화면 밖 가까이에서, 보이던 녀석은 제자리에서 종종걸음으로 들어오고
  //   꼬미가 먼저 알아챈 뒤 심 박사가 '저기'를 가리킨다. 아니면(이 단계에서 이어하기) 그 자리에 바로 세운다.
  //   이미 잡았으면(재료를 줍다 먼저 잡기도 한다) 가리킬 것 없이 그대로 — 곧바로 '잘했다!'로 이어진다
  function compyComes(scene) {
    if (G.kills.compy) return;
    const line = sim('저기 작은 콤프소를 사냥해 보렴.\n겁이 많아서 금방 도망가니 쫓아가서 A를 누르렴.'), point = () => { if (scene) G.runScript([line]); };
    const g = G.spawns.find(o => o.sp === 'compy' && o.stay), p = G.worldPos();
    const ds = g ? G.dinos.filter(d => d.group === g && !d.dead) : [];
    if (!ds.length) return point();
    const kom = !G.inside && G.party.find(b => b.id === 'kom' && !b.down), Wd = G.world();
    // 대사 중 카메라: 하루의 발이 화면 y 66 (대화창이 뜨면 카메라가 내려간다) · 맵 가장자리에선 멈춘다
    const cx = Math.max(0, Math.min(Wd.map.w * T - 240, p.x - 120)), cy = Math.max(0, Math.min(Wd.map.h * T - 160, p.y - 66));
    // offCam: 몸이 다 화면 밖 (여기서 걸어 들어온다) · onCam: 조금이라도 보인다 (옮기면 눈앞에서 사라지니 제자리에서 걸어온다).
    //   지금 카메라로도 잰다 — 앞 대사를 빨리 넘기면 카메라가 아직 대사 자리로 내려오는 중이다
    const cams = [{ x: cx, y: cy }, G.cam];
    const offCam = q => cams.every(c => q.x < c.x - 12 || q.x > c.x + 252 || q.y < c.y - 1 || q.y > c.y + 175), onCam = q => !offCam(q);
    const calm = q => hyp(q.x - p.x, q.y - p.y) > 56 && (!kom || hyp(q.x - kom.x, q.y - kom.y) > 52);
    // 보이는 자리인가: 대화창(화면 y 108~ · 이름표 95~) 위로 넉넉히(카메라가 뒤따라오는 동안에도), 왼쪽 위 하루 창 · 오른쪽 위 시계와 장비 칸 밖,
    //   앞(아래)에 선 나무 · 야자수 · 집처럼 키 큰 그림에 가리지 않는 곳 (화면 안이어도 잎이나 HUD 뒤에 서면 안 보인다)
    const big = Wd.objs.filter(o => !o.gone && o.pr && (o.pr.pix || o.pr.frames[0]).h > 24 && Math.abs(o.x - p.x) < 220 && Math.abs(o.y - p.y) < 180);
    const inSight = (q, d) => {
      const hw = d.art.w >> 1, x0 = q.x - cx - hw, x1 = q.x - cx + hw, y0 = q.y - cy - d.art.foot - 2, y1 = q.y - cy + 1;
      if (x0 < 2 || x1 > 238 || y0 < 0 || y1 > 96 || (x0 < 86 && y0 < 44) || (x1 > 204 && y0 < 66)) return false;
      return !big.some(o => {
        const S = o.pr.pix || o.pr.frames[0], ox = o.x - o.pr.ax;
        return o.y - (o.pr.sortUp || 0) > q.y && ox + 4 < q.x + hw && ox + S.w - 4 > q.x - hw && o.y - o.pr.ay < q.y - 2;
      });
    };
    const good = (q, d) => G.okSpot(q.x, q.y, d.hw) && calm(q) && inSight(q, d);
    // 설 자리 후보: 하루 둘레 여러 거리 · 방향 (아래쪽 · HUD 쪽 · 나무 뒤는 inSight가 거른다)
    const spots = [];
    for (const r of [72, 64, 84, 96, 58]) for (let a = 0; a < 16; a++) spots.push({ x: p.x + Math.cos(a * Math.PI / 8) * r, y: p.y + Math.sin(a * Math.PI / 8) * r * 0.75 });
    // 화면 밖에서 q까지 걸어 들어올 길 { from, via }: 곧게(q 바깥쪽 화면 밖 가까이에서) · 막혔으면 칸 격자로 가장 가까운 화면 밖 칸에서 돌아서
    const straightIn = q => {
      const a0 = Math.atan2(q.y - p.y, q.x - p.x);
      for (const r of [64, 90, 120]) for (const da of [0, -0.5, 0.5, -1, 1]) {
        const f = { x: q.x + Math.cos(a0 + da) * r, y: q.y + Math.sin(a0 + da) * r * 0.7 };
        if (offCam(f) && G.okSpot(f.x, f.y, 0) && G.clearLine(f, q)) return { from: f, via: [] };
      }
      return null;
    };
    // 칸 격자 길찾기: q에서 걸을 수 있는 칸 가운데를 네 방향으로 넓혀 가다 found인 칸에 닿으면, 거기(또는 from)에서 q까지 걸어올 길
    const gridPath = (q, found, from) => {
      const x0 = Math.floor(cx / T) - 6, y0 = Math.floor(cy / T) - 6, w = 27, h = 22, s = (Math.floor(q.y / T) - y0) * w + Math.floor(q.x / T) - x0;
      const at = i => ({ x: (x0 + i % w) * T + 8, y: (y0 + Math.floor(i / w)) * T + 8 }), prev = new Int32Array(w * h).fill(-1), queue = [s];
      prev[s] = s;
      for (let n = 0; n < queue.length; n++) {
        const i = queue[n];
        if (found(at(i))) {
          const pts = [];
          for (let j = i; j !== s; j = prev[j]) pts.push(at(j));
          pts.push(q);
          if (from) pts.unshift(from);
          const out = [pts[0]]; // 곧게 이어지는 점은 건너뛴다
          for (let a = 0; a < pts.length - 1;) { let b = pts.length - 1; while (b > a + 1 && !G.clearLine(pts[a], pts[b])) b--; out.push(pts[b]); a = b; }
          return { from: out[0], via: out.slice(1, -1) };
        }
        const tx = i % w, ty = Math.floor(i / w);
        for (const [nx, ny] of [[tx + 1, ty], [tx - 1, ty], [tx, ty + 1], [tx, ty - 1]]) {
          const j = ny * w + nx, c = at(j);
          if (nx >= 0 && ny >= 0 && nx < w && ny < h && prev[j] < 0 && G.okSpot(c.x, c.y, 0)) { prev[j] = i; queue.push(j); }
        }
      }
      return null;
    };
    const gridIn = q => gridPath(q, offCam), gridFrom = (d, q) => gridPath(q, c => hyp(c.x - d.x, c.y - d.y) < 16, { x: d.x, y: d.y });
    // 보이던 녀석이 q까지 곧게 걸어갈 수 있나: 하루 발치를 가로지르지 않고(22px 밖으로), 막히지 않고
    //   (첫 8px는 빼고 잰다 — 나무 밑동에 붙어 선 녀석은 제자리부터 okSpot이 막혀 나온다)
    const walkable = (d, q) => {
      const L = hyp(q.x - d.x, q.y - d.y) || 1, k = Math.min(1, 8 / L);
      const t = Math.max(0, Math.min(1, ((p.x - d.x) * (q.x - d.x) + (p.y - d.y) * (q.y - d.y)) / (L * L)));
      return hyp(d.x + (q.x - d.x) * t - p.x, d.y + (q.y - d.y) * t - p.y) > 22 && G.clearLine({ x: d.x + (q.x - d.x) * k, y: d.y + (q.y - d.y) * k }, q);
    };
    // 한 마리씩 자리를 정한다: 첫째는 있던 쪽(그쪽 72px 자리에 가까운 곳)부터, 둘째는 첫째 곁부터 (16px 넘게 떨어져).
    //   좁아서 보이는 자리가 모자라면 가려도 곁에 선다. 걸어올 길은 곧은 길 먼저, 없으면 돌아서:
    //   보이던 녀석은 제자리에서 (길이 아예 없으면 그대로 선다 — 눈앞에서 사라지지 않게), 화면 밖의 녀석은 화면 밖에서
    //   (들어올 길이 아예 없는 좁은 곳이면 그 자리에 바로 선다)
    const plan = [];
    for (const d of ds) {
      const u = hyp(d.x - p.x, d.y - p.y) || 1, aim = plan.length ? plan[0].to : { x: p.x + (d.x - p.x) / u * 72, y: p.y + (d.y - p.y) / u * 72 };
      const free = q => !plan.some(o => hyp(o.to.x - q.x, o.to.y - q.y) < 16), byAim = (a, b) => hyp(a.x - aim.x, a.y - aim.y) - hyp(b.x - aim.x, b.y - aim.y);
      let list = spots.filter(q => good(q, d) && free(q)).sort(byAim);
      if (!list.length) list = spots.filter(q => G.okSpot(q.x, q.y, d.hw) && calm(q) && free(q)).sort(byAim);
      const top = list.slice(0, 10), seen = scene && onCam(d);
      const route = fn => { for (const q of top) { const w = fn(q); if (w) return Object.assign(w, { to: q }); } return null; };
      let o = !scene ? null : seen ? route(q => walkable(d, q) ? { from: d, via: [] } : null) || route(q => gridFrom(d, q)) || { from: d, via: [], to: { x: d.x, y: d.y } }
        : route(straightIn) || route(gridIn);
      if (!o && list.length) o = { from: list[0], via: [], to: list[0] };
      if (o) plan.push(Object.assign(o, { d }));
    }
    if (!plan.length) return point();
    g.site = [Math.floor(plan[0].to.x / T), Math.floor(plan[0].to.y / T)];
    plan.forEach(({ d, from, to }, k) => {
      if (d.napping) d.wake(false);
      Object.assign(d, { x: from.x, y: from.y, home: { x: to.x, y: to.y }, goal: null, target: null, state: 'wander', t: 0, wait: 2.5 + k, fleeN: 0, tiredT: 0, detour: null, stuckT: 0, angryT: 0 });
      d.threat.clear();
    });
    if (!scene) return;
    const d0 = plan[0].d;
    G.runScript([
      ...plan.map(o => ({ move: { who: o.d, x: o.to.x, y: o.to.y, via: o.via, spd: 60, nowait: true } })),
      { wait: 0.3 },
      { face: { who: 'kom', to: d0 } }, { emote: { who: 'kom', e: '💢' } }, { sfx: 'bark' },
      { face: { who: ['player', 'sim'], to: d0 } }, { emote: { who: 'player', e: '!' } },
      { join: true, max: 4 },
      { face: { who: plan.map(o => o.d), to: 'player' } }, { emote: { who: d0, e: '?' } }, { wait: 0.7 },
      line
    ]);
  }
  // 튜토리얼 끝: 심 박사는 먼저 마을로 간다 (동쪽으로 걸어가 화면 밖으로)

      trike: '트리케라는 돌진이 무섭다. 바닥이 길게 번쩍이면 옆으로, 옆으로 피해.',

      salve: '겐조 영감님 수업이라… 나도 처음엔 연고 하나 달이는 데 반나절 걸렸지.',
      fawn: '…새끼를 살리러 간다고. 영감님다운 수업이군.',
      rexSee: '보기만 하는 거다. 발소리 죽이고, 덤비지 마.',
      rexTell: '…겐조 영감님께 먼저 알리자. 그다음 일은 그다음이다.',
      rex: '렉스는 한 방이 무겁다. 포효가 오면 몸이 굳기 전에 멀리 떨어져.',
      free: '렉스 가죽으로 갑옷을 지어 볼까. 트럭 시트보다 질기겠군.'
    }[id] || '큰 녀석은 혼자서는 못 잡아. 같이 가자.')];
    return [mina({
      spear: '돌창 만들면 나한테도 보여 줘! …무기는 무서우니까 하루가 들고.',
      pachy: '다치면 내가 치료할게. 대신 약 주머니는 쉬어야 다시 차니까 무리는 금지!',
      armor: '가죽옷 입으면 한결 든든할 거야. 할머니 빨랫줄에 널어 두면 금방 마르고.',
      raid: '무섭지만… 내가 뒤에서 계속 치료할게. 불빛 안으로만 오면 돼.',
      bary: '낚시하는 동안엔 우릴 신경 안 써. 조용히 지나가도 되고… 싸울 거면 배부터 채우자!',
      trike: '배고프면 모닥불에서 요리해 먹자. 든든하면 한 대 정도는 버틸 수 있어!',
      hornspear: '뿔창이라니, 하루 벌써 사냥꾼 다 됐다!',
      salve: '겐조 할아버지 연고는 정말 잘 들어. 나한테도 좀 가르쳐 주시면 좋을 텐데.',
      fawn: '새끼 공룡… 꼭 살려 주자, 하루.',
      rexSee: '…보기만 하는 거지? 절대 덤비지 마, 하루.',
      rexTell: '손이 아직도 떨려…. 빨리 마을로 가자.',
      rex: '싸우기 전에 모닥불에서 쉬어 가자. 내 약 주머니도 채워야 하고.',
      free: '하루, 부산 바다는 엄청 예뻐. …언젠가 같이 가 보자. 약속!'
    }[id] || '안녕! 오늘은 뭐 먹을까?')];
  };
  G.inVillage = e => { const V = G.W0 && G.W0.V; return !!V && !G.inside && V.inside(Math.floor(e.x / T), Math.floor(e.y / T)); };

  /* ---------------- 겐조: 마을의 노사냥꾼 (1장 보강 — 약초 수업 · 렉스에 관한 두 마디) ---------------- */
  // 섬에서 가장 오래 산 워퍼. 뿔창을 만들 무렵 사냥에서 돌아와 마을 모닥불 곁에 머문다
  const genzoSpot = () => { const C = G.W0.CAMP; return { x: (C.x + 2) * T + 8, y: (C.y + 3) * T + 12 }; };
  function placeGenzo(at) {
    let n = G.npcById('genzo');
    if (!n) { n = new NPC('genzo', 'genzo', '겐조', 0, 0, GENZO, genzoTalk); G.npcs.push(n); }
    const s = at || genzoSpot();
    n.x = s.x; n.y = s.y; n.hidden = false; n.dir = 'down'; n.route = null; n.sitting = false;
    return n;
  }
  // 겐조가 제 발로 마을 모닥불 곁으로 돌아간다 (하루가 움직이는 동안 천천히 걷는다 — 산책 길 한 점짜리)
  //   (멀리 있고 보이지 않으면 그냥 제자리에 — 보이면 순간이동하지 않고 걷는다. 북문 밖이면 북문으로 들어와 통나무집을 돌아서)
  function genzoHome() {
    const n = G.npcById('genzo') || placeGenzo(), s = genzoSpot();
    if (hyp(n.x - s.x, n.y - s.y) > 280 && !onScreen(n.x, n.y)) { placeGenzo(); return; }
    walkTo(n, [...(G.inVillage(n) ? [] : northWay().reverse()), s], 'down', 36);
  }
  const genzoNear = r => { const n = G.npcById('genzo'); return !!n && !n.hidden && hyp(n.x - G.player.x, n.y - G.player.y) < r; };
  function genzoTalk() {
    const id = Q[G.quest.stage] && Q[G.quest.stage].id;
    if (id === 'salve') return [genzo('약초는 연못가나 호숫가에 모여 난다.\n세 줌에 섬유 하나, 모닥불에서 달이면 된다.')];
    if (id === 'fawn') return [genzo(G.count('salve') ? '새끼는 저 덫에 걸려 있다. 연고를 들고 다가가 발라 줘라.\n겁먹지 않게 천천히.' : '연고가 없구나. 약초를 뜯어 모닥불에서 다시 달여라.')];
    if (id === 'rexSee') return [genzo('멀찍이서 보기만 해라. 오늘은 덤빌 때가 아니다.')];
    if (id === 'rex') return [genzo(pickLine(['죽이지는 마라. 물러나게만 해.', '렉스는 둥지에서 잔다. 알에 손을 대거나 먼저 건드리면 깬다.',
      '렉스는 마을에 들어온 적이 없어. 늘 북쪽 길목만 지켰지.\n여기까지 내려온 건 처음이다.']))];
    if (G.flags.lionSeen && !G.flags.lionTold) return lionTalk();
    return [genzo(pickLine(['산의 주인은 죽이는 게 아니야. 물러나게 할 뿐이지.', '연고가 떨어지면 약초를 뜯어라. 잡을 땐 잡고, 살릴 땐 살린다.',
      ...(G.flags.lionSeen ? ['북쪽 곶의 깃발, 가서 봤느냐. 렉스가 비운 길목이다.', '다음엔 한 줌이 아닐 게다. …울타리부터 손봐 둬야겠군.'] : [])]))];
  }
  // 1장 끝 뒤 처음 말을 걸면 (북문에서 북쪽을 보고 서 있다): 새벽에 북쪽 곶에 다녀온 이야기 — 사자 깃발 · 발자국 → 랩터를 부리는 사람들 →
  //   렉스 때문에 넘어오지 못했다 → 깃발은 돌아오겠다는 뜻 (2장 침공의 예고. 하루 일행은 선발대를 보지 못했다 — 본 건 뿔나팔 소리뿐)
  function lionTalk() {
    return [
      { face: { who: 'genzo', to: 'player' } },
      genzo('새벽에 북쪽 곶에 다녀왔다. 흙길 끝에 붉은 깃발이 꽂혀 있더군.\n사자 문장이었다.'),
      genzo('모래엔 쇠 박은 신발 자국과 랩터 발자국이 뒤엉켜 있었다.\n랩터를 부리는 사람들이다.'),
      haru('랩터를… 부려요?'),
      genzo('북쪽 곶 너머 땅엔 성을 쌓고 사는 자들이 있다. 공룡에 굴레를 씌우지.\n렉스가 있는 동안엔 길목을 넘어오지 못했다.'),
      { emote: { who: 'genzo', e: '…' } }, { wait: 0.8 },
      genzo('깃발은 돌아오겠다고 꽂는 거다. …다음엔 한 줌이 아닐 게다.'),
      { call: () => { G.flags.lionTold = true; } }
    ];
  }
  // 뿔창을 만들면: 겐조가 소리 없이 하루 등 뒤에 와 서 있다 (꼬미만 먼저 알아채고 꼬리를 친다) → 약초 수업
  function genzoArrives() {
    const p = G.player, g = placeGenzo(G.findSpot(p.x - 3, p.y + 24, 0) || { x: p.x, y: p.y + 24 });
    g.dir = 'up';
    G.flags.genzoMet = true;
    G.runScript([
      { cine: true },
      { face: { who: 'kom', to: 'genzo' } }, { emote: { who: 'kom', e: '♥' } }, { wait: 0.9 },
      genzo('…그 뿔창, 네가 만들었나.'),
      { call: () => { p.say('!', 1); G.sfx('ok'); } }, { face: { who: 'player', to: 'genzo' } }, { wait: 0.7 },
      { form: { to: 'genzo' } },
      jack('하하, 놀랐지? 겐조 영감님은 발소리가 없어.\n영감님, 사냥에서 돌아오셨군요.'),
      haru('하, 하루예요. 트리케라톱스 뿔로 만들었어요!'),
      jack('겐조 영감님은 이 섬에서 가장 오래 산 워퍼야. 1970년대에 일본 아키타에서 왔지.\n산에서 짐승을 쫓던 마타기였다나.'),
      { emote: { who: 'genzo', e: '…' } }, { wait: 0.9 },
      genzo('창은 짐승을 쓰러뜨린다. 하지만 사냥꾼은 상처를 다스릴 줄도 알아야 하지.'),
      // (연고를 이미 지니고 있으면 달이라는 말은 건너뛴다 — 곧바로 약초 수업 단계가 끝나 '연고가 있군'으로 이어진다)
      ...(G.count('salve') ? [] : [genzo('약초 세 줌에 섬유 하나. 모닥불에서 연고를 달여 봐라.\n약초는 연못가나 호숫가에 모여 난다.'),
        genzo('다 달이면 모닥불로 가져와라. 거기 있으마.')])
    ], () => { genzoHome(); G.questCheck(); G.save(true); });
  }

  /* ---------------- 덫에 걸린 새끼 갈리미무스 (약초 연고를 바르면 어미에게 돌아간다 — 3장 렉스 치료의 복선) ---------------- */
  // 북문 밖 풀밭의 덫. 겐조가 곁에서 기다린다. 덫은 저장되지 않는 소품이라 불러오면 다시 놓는다
  //   walk: 연고 수업을 마친 겐조가 보이는 데 있으면 덫까지 걸어간다 (북문으로 — 눈앞에서 사라지지 않게)
  G.placeFawn = function (walk) {
    if (G.dinos.some(d => d.tag === 'fawn')) return;
    const V = G.W0.V, s = G.findSpot((V.x + 9) * T + 8, (V.y0 - 8) * T + 8, 12) || { x: (V.x + 9) * T + 8, y: (V.y0 - 8) * T + 8 };
    const trap = G.addObj({ type: 'trapProp', tx: Math.floor(s.x / T), ty: Math.floor(s.y / T), x: s.x, y: s.y + 1, id: 'fawnTrap' });
    const d = new D.Actors.Dino('gallibaby', s.x, s.y, {});
    Object.assign(d, { tag: 'fawn', care: { trap }, dir: 'left', wait: 99 });
    G.dinos.push(d);
    const side = G.findSpot(s.x + 36, s.y + 6, 0) || { x: s.x + 36, y: s.y + 6 }, g = G.npcById('genzo');
    if (walk && g && !g.hidden && onScreen(g.x, g.y)) walkTo(g, [...northWay(), side], 'left', 40);
    else placeGenzo(side).dir = 'left';
  };
  G.fawnAt = () => G.dinos.find(d => d.tag === 'fawn' && d.care) || null; // 지도 표시
  // 연고를 발라 주면: 새끼 치료 장면 (fawnScene)
  G.onDinoCared = function (d) {
    if (d.tag !== 'fawn') return;
    G.flags.fawnHealed = true;
    fawnScene(d);
  };
  // 덫이 풀리고 → 새끼가 다리를 디뎌 보고 하루를 올려다본다 → 숲 가장자리에서 어미가 부른다 → 둘이 함께 하루를 돌아보고 풀숲으로 →
  // 겐조: "잡을 땐 잡고, 살릴 땐 살린다." (다 끝나면 fawnFreed — 이어서 렉스의 포효)
  function fawnScene(d) {
    const p = G.player, away = d.x <= p.x ? -1 : 1; // 새끼와 어미는 하루 반대쪽 풀숲으로
    const edge = G.findSpot(d.x + away * 120, d.y - 44, 10) || { x: d.x + away * 120, y: d.y - 44 };
    const momAt = G.findSpot(d.x + away * 62, d.y - 18, 10) || { x: d.x + away * 62, y: d.y - 18 };
    const gs = G.findSpot(p.x - away * 34, p.y + 6, 0) || { x: p.x - away * 34, y: p.y + 6 }; // 겐조는 하루 뒤쪽 옆에서 지켜본다
    const watch = { x: (p.x + momAt.x) / 2, y: (p.y + momAt.y) / 2 };
    // 겐조가 아직 멀리(덫으로 오는 길)에 있으면: 보이지 않을 때 가까이 데려다 두고, 막힌 데는 돌아서 걸어온다
    const gz = G.npcById('genzo');
    if (gz && hyp(gz.x - gs.x, gz.y - gs.y) > 140 && !onScreen(gz.x, gz.y)) { const a = G.approachFrom(gs, 100, gz); if (a) { gz.x = a.x; gz.y = a.y; } }
    if (gz) gz.route = null;
    let mom = null;
    G.runScript([
      { cine: true },
      { music: D.Music.bond },
      { move: { who: 'genzo', x: gs.x, y: gs.y, spd: 40, nowait: true, face: 'fawn', via: (gz && detour(gz, gs)) || [] } },
      { form: { to: 'fawn' } },
      { wait: 0.6 },
      { call: () => { const o = G.objs.find(q => q.id === 'fawnTrap'); if (o) G.objs.splice(G.objs.indexOf(o), 1); G.sfx('trap'); G.fx.burst(d.x, d.y - 3, 8, { speed: 40, types: ['dot'], colors: ['#c8a070', '#8a6a4a'], life: 0.5, g: 120 }); } },
      { wait: 0.8 },
      // 다친 다리를 디뎌 본다
      { move: { who: 'fawn', x: d.x + away * 7, y: d.y, spd: 18 } }, { move: { who: 'fawn', x: d.x, y: d.y, spd: 18 } }, { wait: 0.3 },
      { emote: { who: 'fawn', e: '!' } }, { wait: 0.7 },
      { face: { who: 'fawn', to: 'player' } }, { sfx: 'chirp' }, { emote: { who: 'fawn', e: '♥' } }, { wait: 1.3 },
      // 숲 가장자리에서 어미가 부른다
      { focus: watch },
      { call: () => { mom = new D.Actors.Dino('galli', edge.x, edge.y, {}); mom.tag = 'fawnMom'; mom.wait = 99; mom.dir = away < 0 ? 'right' : 'left'; G.dinos.push(mom); } },
      { move: { who: 'fawnMom', x: momAt.x, y: momAt.y, spd: 42 } },
      { sfx: 'chirp' }, { emote: { who: 'fawnMom', e: '♪' } }, { wait: 0.7 },
      { face: { who: 'fawn', to: 'fawnMom' } }, { emote: { who: 'fawn', e: '!' } }, { wait: 0.4 },
      { move: { who: 'fawn', x: momAt.x - away * 16, y: momAt.y + 6, spd: 78 } },
      { face: { who: ['fawn', 'fawnMom'], to: 'player' } }, { wait: 0.6 },
      { emote: { who: 'fawnMom', e: '…' } }, { wait: 0.5 }, { emote: { who: 'fawn', e: '♥' } }, { sfx: 'chirp' }, { wait: 1.5 },
      { move: { who: 'fawnMom', x: edge.x + away * 90, y: edge.y - 26, spd: 88, nowait: true } },
      { move: { who: 'fawn', x: edge.x + away * 76, y: edge.y - 16, spd: 92, nowait: true } },
      { join: { max: 3 } },
      { call: () => { d.remove = true; if (mom) mom.remove = true; G.fx.burst(edge.x + away * 80, edge.y - 20, 8, { speed: 30, types: ['dot'], colors: ['#8dc55e', '#aad97a'], life: 0.6 }); } },
      { wait: 0.8 },
      { focus: null },
      { face: { who: 'genzo', to: 'player' } }, { face: { who: 'player', to: 'genzo' } },
      genzo('잡을 땐 잡고, 살릴 땐 살린다. 그게 사냥꾼이다.'),
      haru('…다리를 절지 않아요! 엄마한테 갔어요.'),
      { emote: { who: 'genzo', e: '…' } }, { wait: 1.0 },
      { call: () => { G.flags.fawnFreed = true; } }
    ]);
  }

  /* ---------------- 살펴보기: 마을 물건 · 섬 곳곳의 흔적 ---------------- */
  const note = t => say('', 520, t);
  const LOOK = {
    board: () => [
      say('게시판', 520, '「워프 기록」\n1912 토마스 · 1962 심 · 1974 박 · 1987 잭 · 2031 미나' + (G.flags.partyJoined ? '\n(맨 끝에 새로 적힌 이름) 하루 · 꼬미' : '')),
      say('게시판', 520, '알림: 해가 지면 울타리 밖에 나가지 말 것.\n북동쪽 렉스 둥지에는 절대 혼자 가지 말 것. — 심'),
      say('게시판', 520, '찾습니다: 휴대폰 (2031년식, 분홍색).\n주우면 미나에게.')
    ],
    signpost: () => [say('이정표', 520, '← 워프 지점   ↑ 북쪽 고원 · 옛 망루 터\n→ 워프 마을')],
    well: () => [note('두레박을 내려 물을 떠 보았다. 차갑고 맑다.')],
    bell: () => [note(G.flags.raidWon ? '밤에 사나운 녀석들이 몰려오면 치는 종.\n그날 밤 이후로 종에 발톱 자국이 하나 늘었다.' : '밤에 사나운 녀석들이 몰려오면 이 종을 친다.')],
    mailbox: () => [note('빨간 우체통. 편지를 넣어도 어디로도 가지 않는다.\n그래도 다들 가끔 편지를 쓴다.'), haru('(…엄마한테 편지 써 볼까.)')],
    scarecrow: () => [note('허수아비. 머리에 쓴 건… 도로 공사용 고깔이다.')],
    crop: () => [note('박 할머니의 밭. 함부로 뽑았다간 혼난다.')],
    laundry: () => [note('빨랫줄에 여러 시대의 옷이 나란히 마른다.\n흰 셔츠, 색동 저고리, 청바지, 줄무늬 선원 셔츠…')],
    stall: () => [note('미나의 포장마차. 차림표: 파키 떡볶이 · 랩터 꼬치 · 트리케라 국밥.\n…전부 품절이다.')],
    antenna: () => [note('심 박사의 워프 탐지기. 계기판 바늘이 ' + (G.isNight() ? '가늘게 떨리며… 북서쪽을 가리킨다.' : '가만히 멈춰 있다.'))],
    truck: () => [note('잭의 픽업트럭. 1987년식.\n기름이 떨어진 지 오래라 지금은 짐 창고로 쓴다.'), ...(G.party.some(b => b.id === 'jack') ? [jack('내 애마지. 언젠가 다시 시동을 걸 거다.')] : [])],
    booth: () => [note('공중전화 부스. 수화기를 들어도 아무 소리가 없다.\n지금은 샤워실로 쓴다.')],
    rack: () => [note('가죽 건조대. 파키 가죽이 바람에 마르고 있다.')],
    wreck: () => [note('모래톱에 얹힌 낡은 화물선.\n뱃머리 이름판에 「메리 앤 · 1912」라고 적혀 있다.')],
    anchor: () => [note('녹슨 닻이 모래에 반쯤 묻혀 있다.')],
    ruins: () => [note('오래된 돌담. 누가, 언제 쌓았는지 아무도 모른다.')],
    banner: () => [note('빛바랜 깃발. 사자 문장이 희미하게 남아 있다.\n' + (G.flags.lionSeen ? '…북쪽 곶에 꽂힌 그 깃발과 같은 문장이다.' : '…이 섬에 성을 쌓은 사람들이 있었던 걸까?'))],
    // 1장 끝에 구왕국 선발대가 북쪽 곶의 흙길 끝에 꽂고 간 새 깃발 (plantLion)
    lionCape: () => [note('모래에 깊이 꽂힌 새 깃발. 붉은 천에 금빛 방패, 사자 얼굴.\n둘레엔 쇠 박은 신발 자국과 랩터 발자국이 북쪽으로 이어진다.'),
      haru('(…그날 밤 뿔나팔을 분 사람들이 여기까지 왔었어.)')],
    helmet: () => [note('녹슨 투구. 아주 오래된 것 같다.')],
    stones: () => [note('둥글게 선 돌기둥. 옛 망루의 돌담보다 훨씬 오래돼 보인다.')],
    altar: () => [note(G.isNight() ? '가운데 돌판의 소용돌이 홈을 따라 푸른 빛이 흐른다.\n낮보다 훨씬 밝다. …무언가를 기다리는 것처럼.' : '가운데 돌판에 소용돌이 무늬가 새겨져 있다.\n홈을 따라 희미하게 푸른 빛이 돈다…')],
    oldTent: () => [note('비바람에 바랜 텐트. 안은 텅 비었다.\n누군가 여기서 버티다 떠났다.')],
    vendingB: () => [note('파란 자판기. 버튼을 눌러도 아무것도 나오지 않는다.\n동전 넣는 곳에 모래가 가득하다.')],
    busStop: () => [note('버스 정류장 표지판. 노선도에 처음 보는 동네 이름이 적혀 있다.\n…이것도 어딘가에서 떨어져 온 걸까.')],
    skullSign: () => [note('(나무판에 거칠게 새긴 글씨)\n돌아가라. 렉스의 땅.')],
    tornTent: () => [note('갈기갈기 찢긴 텐트.\n누군가 여기서 밤을 보내려다… 급히 떠난 것 같다.')],
    brokenSpear: () => [note('부러진 창. 창끝이 무언가에 물어뜯겼다.')],
    bones: () => [note('거대한 뼈. 무엇이 이걸 먹어 치웠을까.')]
  };
  G.lookVerb = o => (o.look === 'board' || o.look === 'signpost' || o.look === 'skullSign') ? '읽기' : '조사';
  G.lookAt = function (o) { const f = LOOK[o.look]; if (f) G.runScript(f(o)); };

  /* ---------------- 통나무집: 처음 들어서면 동료들이 집을 소개한다 ---------------- */
  // 동료가 된 뒤 처음 통나무집에 몇 걸음 들어서면 (하루는 제자리에서 돌아볼 뿐 걷지 않는다 — 문간은 대화창에 가린다):
  //   미나가 침대 곁으로 앞질러 가 돌아서고 → 꼬미가 벽난로 앞에 자리를 잡는다(벽난로 = 모닥불: 요리 · 쉬기) → 잭은 보관함 곁에서(짐 맡기기) →
  //   미나는 침대(잠 · 기록) → 식탁을 본 하루가 엄마의 문자("저녁 차려 놨어")를 떠올리고, 미나가 다독인다 → 꼬미가 하루 발치로
  //   자리는 maps.js hut의 칸 (벽난로 8,4 · 보관함 6,4 · 침대 11,4~5 · 식탁 7~8,6). 방 안에선 G.grid가 방의 격자다
  const HUT = { fire: { x: 138, y: 91 }, chest: { x: 88, y: 100 }, bed: { x: 166, y: 104 }, table: { x: 120, y: 102 } };
  const hutSpot = (x, y) => [[0, 0], [0, -6], [6, 0], [-6, 0], [0, 6]].map(([dx, dy]) => ({ x: x + dx, y: y + dy })).find(s => !G.grid.hit(s.x, s.y, 6)) || null;
  function hutTour() {
    G.flags.hutTour = true;
    const p = G.player, kom = G.party.find(b => b.id === 'kom');
    // 꼬미는 식탁을 돌아서 벽난로로 (식탁 왼쪽에 있으면 왼쪽으로, 아니면 오른쪽으로 — 하루 몸을 가로지르지 않게) · 끝에 하루 발치로.
    //   잭은 문간 줄을 따라 왼쪽으로 가서 보관함 곁으로 올라간다
    const komVia = kom && kom.x < HUT.table.x ? [{ x: 98, y: 118 }, { x: 102, y: 92 }] : [{ x: 158, y: 122 }];
    const komBack = hutSpot(p.x + (p.x < 150 ? 15 : -15), p.y + 5) || { x: p.x, y: p.y + 8 };
    G.runScript([
      { cine: true }, { rally: true },
      { move: { who: 'mina', x: HUT.bed.x, y: HUT.bed.y, spd: 76, face: 'player' } },
      { face: { who: 'player', to: 'mina' } },
      mina('짠! 여기가 마을 통나무집이야.\n다 같이 먹고 자는 곳이지!'),
      { move: { who: 'kom', x: HUT.fire.x, y: HUT.fire.y, spd: 70, via: komVia } },
      { sit: { who: 'kom' } }, { emote: { who: 'kom', e: '♥' } }, { sfx: 'bark' }, { wait: 0.7 },
      { face: { who: ['player', 'mina'], to: 'kom' } },
      mina('꼬미는 벌써 자리 잡았네! 벽난로는 모닥불이랑 똑같아.\n고기도 굽고, 쉬면 다친 데도 나아.'),
      { move: { who: 'jack', x: HUT.chest.x, y: HUT.chest.y, spd: 50, face: 'player', via: [{ x: 100, y: 142 }] } },
      { face: { who: 'player', to: 'jack' } },
      jack('당장 안 쓸 짐은 보관함에 부려 둬.\n가방이 꽉 차면 가죽 한 장 못 챙겨.'),
      { face: { who: 'mina', dir: 'right' } }, { face: { who: 'player', to: 'mina' } }, { wait: 0.4 }, { face: { who: 'mina', to: 'player' } },
      mina('그리고 이 침대! 밤엔 여기서 자면 돼.\n푹 자면 몸이 싹 낫고, 기록도 남아.'),
      { face: { who: 'player', to: HUT.table } }, { wait: 1.0 },
      haru('(…엄마가 저녁 차려 놨다고 했는데.)'),
      { emote: { who: 'mina', e: '…' } }, { wait: 0.9 },
      mina('…집 생각나지? 나도 처음엔 밤마다 울었어.\n따뜻한 거 먹고 푹 자면 좀 나아져.'),
      { sit: { who: 'kom', on: false } },
      { move: { who: 'kom', x: komBack.x, y: komBack.y, spd: 56, face: 'player' } },
      { face: { who: 'player', to: 'kom' } },
      { emote: { who: 'kom', e: '♥' } }, { sfx: 'bark' }, { wait: 1.0 }
    ], () => G.save(true));
  }
  // G.checkNest가 매 프레임: 동료가 된 뒤 · 1장 이야기 동안('free' 전 — 엔딩 뒤 아침엔 통나무집 안에서 깬다) · 습격 밤이 아니고 연출 · 메뉴 중이 아닐 때.
  //   방 안이면 문간에서 몇 걸음 들어섰을 때 안내를 시작하고, 아직 안 들어가 봤으면 마을에서 계단 앞을 지날 때 미나가 한 번 알려 준다 (말풍선)
  function hutCheck() {
    if (G.flags.hutTour || !G.flags.partyJoined || !before('free') || G.script || G.menu || G.raidDue() || G.raidOn()) return;
    const p = G.player;
    if (G.inside) { if (G.inside.id === 'hut' && p.y < D.Maps.hut.enter[1] - 20) hutTour(); return; }
    if (G.flags.hutHint || !G.inVillage(p) || G.inCombat()) return;
    const door = G.doors.find(o => o.room === 'hut');
    if (door && hyp(p.x - door.x, p.y - door.y) < 72 && G.bark('mina', '저 통나무집이 우리 집이야! 들어가 보자!', { dur: 3 })) G.flags.hutHint = true;
  }

  /* ---------------- 밤 습격 ---------------- */
  G.onPhase = function (ph) {
    const home = G.field === 'island'; // 첫 밤 안내 · 밤 들짐승 · 습격은 1장 이야기라 섬에서만
    if (ph === 'dusk') { G.toast('해가 진다… 밤에는 사나운 녀석들이 나온다', null, 0, '#ffb890'); D.Audio.play(G.ambientSong()); if (home) firstDusk(); }
    if (ph === 'dawn') { G.toast('날이 밝아 온다', null, 0, '#ffe066'); }
    if (ph === 'day') D.Audio.play(G.ambientSong());
    // 습격 날 밤은 G.nightRaid가 어둠이 내려앉은 뒤(RAID_AT) 종을 친다
    if (home && ph === 'night' && !G.atStage('raid') && G.flags.partyJoined && Math.random() < 0.35) nightProwlers(); // 동료를 만나기 전(튜토리얼)의 밤엔 오지 않는다
    // 밤: 초식 공룡 무리는 그 자리에서 잠든다 · 횃불이 없으면 알려 준다 (처음 한 번은 만드는 법까지)
    if (ph === 'night') {
      for (const d of G.dinos) if (!d.dead && d.S.night === 'sleep' && d.state === 'wander') d.sleep();
      if (!G.inside && !G.torchSlot()) {
        G.toast('어두워서 불빛 밖이 보이지 않는다…', null, 0, '#b9b2e0');
        if (!G.flags.torchHint) { G.flags.torchHint = true; G.toast('횃불: 나뭇가지 1 · 섬유 2 (맨손 제작)', 'torch', 0, P.accent); }
      }
    }
    // 새벽: 남은 습격대는 달아난다 → 마을을 지켜 냈다
    if (home && ph === 'dawn' && G.atStage('raid') && G.flags.raidStarted && !G.flags.raidWon) {
      for (const d of G.dinos) if (d.raid && !d.dead) d.remove = true;
      G.raidQueue = null;
      G.flags.raidWon = true;
      G.toast('남은 랩터들이 달아났다!', null, 0, P.accent);
    }
  };
  // 튜토리얼의 첫 해 질 녘: 심 박사가 걸어와 밤을 알려 준다 (갑자기 캄캄해지기만 하지 않게)
  function firstDusk() {
    const s = G.npcById('sim');
    if (G.flags.firstDusk || !before('village') || !s || s.hidden || G.inside || G.script || G.menu) return;
    G.flags.firstDusk = true;
    const fire = G.objs.some(o => o.placed && o.station === 'fire' && hyp(o.x - G.player.x, o.y - G.player.y) < 400);
    G.runScript([{ call: () => simWalksUp() },
      sim('해가 지는구나. 곧 캄캄해질 게다.\n' + (G.count('torch') ? '횃불이 저절로 켜지면 그 불빛 안만 보인단다.' : '어둠 속에선 불빛 안만 보인단다.') + ' 서두르지 말고 천천히 움직이렴.'),
      sim(fire ? '모닥불 곁에 있으면 사나운 짐승도 못 다가온단다. 겁나면 불 곁으로 오렴.' : '어둠 속에선 짐승 눈만 번뜩인단다. 노란 눈빛이 보이면 조심하렴.')]);
  }
  // 해가 지면 랩터 다섯 마리가 네 문으로 마을에 들이닥친다 (종이 울린다). 울타리는 넘지 못하니 문 안쪽에서 나타난다
  //   다섯이 한꺼번에 오면 모두 하루에게 달려들어 버틸 수가 없다. 두 마리로 시작해 문마다 차례로 더 들어온다
  //   RAID: [문, 종이 울리고 나서 들어오는 초] · 문 칸은 raidGates
  const RAID = [['w', 0], ['e', 0], ['n', 10], ['s', 20], ['w2', 20]];
  function raidGates() {
    const V = G.W0.V;
    return { w: [V.x0 + 1, V.y, '서문'], n: [V.x + 9, V.y0 + 1, '북문'], e: [V.x1 - 1, V.y + 1, '동문'], s: [V.x, V.y1 - 1, '남문'], w2: [V.x0 + 2, V.y + 1, '서문'] };
  }
  // 밤이 되면: 종이 울리고, 카메라가 문으로 — 등불 아래로 뛰어든 랩터가 울부짖는다 → 싸움
  function startRaid() {
    G.flags.raidStarted = true;
    G.raidQueue = RAID.map(([g, t]) => ({ g, at: G.t + t }));
    hideVillagers();
    raidArrive(true);
    G.sfx('bell');
    const p = G.player, first = G.dinos.filter(d => d.raid && !d.fled).sort((a, b) => hyp(a.x - p.x, a.y - p.y) - hyp(b.x - p.x, b.y - p.y))[0];
    if (!first || G.inside || G.script || hyp(first.x - p.x, first.y - p.y) > 420) {
      const far = !G.inVillage(p) && !G.inside;
      G.toast(far ? '멀리 마을 쪽에서 종이 울린다! 랩터가 들이닥쳤다' : '랩터 무리가 문으로 들이닥쳤다!', null, 0, '#ff6a5a'); D.Audio.play(D.Music.battle); return;
    }
    D.Audio.play(null);
    G.runScript([
      { cine: true },
      { pan: { x: first.x, y: first.y - 8, t: 0.9 } },
      { call: () => { first.dir = first.x > p.x ? 'left' : 'right'; first.pose = 'windup'; first.say('💢', 1.4); G.sfx('screech'); G.shake.hit(2, 0.3); } }, { wait: 1.0 },
      { call: () => { first.pose = 'walk0'; G.sfx('bell'); } },
      sim('습격이다! 랩터가 문으로 들어왔어!'),
      { pan: { who: 'player', t: 0.6 } },
      { call: () => D.Audio.play(D.Music.battle) }
    ]);
  }
  // 습격 날 해 질 녘 (마을 안에 있을 때): 박 할머니와 토마스는 통나무집 안으로, 동료는 모닥불 곁에 자리를 잡는다
  function raidPrep() {
    G.flags.raidPrep = true;
    const f = campFire(), door = G.doors[0], hal = G.npcById('halmae'), tho = G.npcById('thomas');
    const foot = door ? { x: door.x, y: door.y + 6 } : { x: f.x, y: f.y - 50 }, top = door ? { x: door.x, y: door.y - door.pr.door[1] - 4 } : foot;
    const walkers = [hal, tho].filter(n => n && !n.hidden), p = G.player;
    // 멀리 있던 사람은 보이지 않을 때만 계단 가까이(되도록 화면 밖 자리)로 옮겨 두고, 막힌 데(통나무집)는 돌아서 걸어온다 — 눈앞에서 튀어나오지 않게
    for (const n of walkers) {
      if (hyp(n.x - foot.x, n.y - foot.y) <= 90 || onScreen(n.x, n.y)) continue;
      const st = [110, 90, 64].map(r => G.approachFrom(foot, r, n)).find(q => q && !onScreen(q.x, q.y));
      if (st) { n.x = st.x; n.y = st.y; }
    }
    const spots = walkers.map((n, i) => ({ x: foot.x + (i ? 9 : -9), y: foot.y + 4 }));
    G.runScript([
      { cine: true },
      { focus: { x: (p.x + foot.x) / 2, y: (p.y + foot.y) / 2 + 6 } },
      { face: { who: 'player', to: 'simCamp' } },
      sim('해가 지는구나… 다들 채비하자.'),
      ...walkers.map((n, i) => ({ move: { who: n.id, x: spots[i].x, y: spots[i].y, spd: 46, nowait: true, via: detour(n, spots[i]) || [] } })),
      { focus: { x: foot.x, y: foot.y - 6 } }, // 통나무집으로 가는 두 사람을 비춘다 (말하는 사람이 화면 위 띠에 잘리지 않게)
      halmae('우린 안에 들어가 있으마. 다들 조심하거라.'),
      thomas('…문단속은 내가 하지. 무운을 비네, 젊은이들.'),
      { join: { max: 8 } },
      ...walkers.map((n, i) => ({ move: { who: n.id, x: top.x + (i ? 4 : -4), y: top.y, spd: 40, nowait: true } })),
      { join: true },
      { call: () => { hideVillagers(); G.sfx('door'); } },
      { focus: null },
      { form: { to: f } },
      jack('문이 넷이다. 어디로 들어올지 몰라. 모닥불을 등지고 버텨.'),
      mina('다치면 불가로 와! 한숨 돌리면 불빛 안에선 금방 나아.'),
      { emote: { who: 'kom', e: '💢' } }, { sfx: 'bark' }, { wait: 0.6 }
    ]);
  }
  // 습격 동안 마을 사람(박 할머니 · 토마스)은 통나무집 안에 숨어 있다
  function hideVillagers() { for (const id of ['halmae', 'thomas']) { const n = G.npcById(id); if (n) n.hidden = true; } }
  // 습격을 막아 낸 이튿날 아침: 모두 모닥불 곁 (밤새 지키며 쉬었다 — 다친 데가 낫는다), 주민들이 나온다
  function raidMorning() {
    if (G.inside) G.goMap(G.field);
    if (G.clock > 0.5) G.day++;
    G.clock = 0.27;
    G.healAll();
    for (const d of G.dinos) if (d.raid) d.remove = true;
    G.raidQueue = null; G.zones = [];
    const f = campFire(), p = G.player, at = G.findSpot(f.x - 4, f.y + 24, 0) || { x: f.x, y: f.y + 24 };

  };
  // 렉스는 죽지 않는다 (D.Species.rex.retreat). play.js가 렉스를 세울 때마다 이름표와 물러날 곳을 붙인다:
  //   몰아내기 단계 전의 둥지 렉스는 다치면 둥지로 물러나 다시 잠들고(다친 데가 낫는다, 전리품 없음),
  //   몰아내기 단계(사냥터 장면을 본 뒤)의 둥지 렉스는 몰아내면 북쪽 능선 너머로 사라져 다시 오지 않는다 (armRex)
  G.onBossSpawn = function (d) {
    d.tag = 'rex';
    d.retreat = { at: d.S.retreat, to: { x: d.x, y: d.y }, safe: true, back: true };
    if (G.rexFinal()) armRex(d);
  };
  const rexOf = () => G.dinos.find(d => d.sp === 'rex' && !d.dead && !d.remove);
  const rexPrey = () => G.dinos.find(d => d.tag === 'rexPrey' && !d.remove);
  G.rexAtHunt = () => { const r = rexOf(); return r && r.scene ? r : null; }; // 사냥터에 내려와 트리케라톱스와 맞선 렉스 (지도 표시)
  G.rexToDrive = () => { const r = rexOf(); return r && r.hunt ? r : null; }; // 몰아낼 둥지의 렉스 (지도 표시)
  // 몰아내기 단계: 사냥터 장면을 보고 겐조에게 알리러 가는 참부터 몰아낼 때까지
  G.rexFinal = () => G.quest.stage >= G.stageOf('rexTell') && G.quest.stage <= G.stageOf('rex') && !G.flags.rexDriven;
  // 마지막 싸움의 규칙: 체력이 retreat 아래로 떨어지면 둥지 북쪽 테두리(능선)를 넘어 사라진다 (driveOff — 대본의 걸음이라 절벽에 막히지 않고,
  //   능선 위에서 흐려진다. 그 너머는 바다 — 렉스는 북쪽으로 갔다: 2장에서 구왕국 요새 지하에 끊어진 사슬만 남는다)
  function armRex(d) {
    const N = G.W0.nest;
    d.hunt = true; d.scene = false; d.roam = false;
    d.retreat = { at: d.S.retreat, to: { x: N.x * T + 8 + 24, y: (N.y - N.r) * T }, safe: true };
  }
  // 사냥터: 마을 북문 밖 풀밭 — 북문에서 20~40칸 북쪽, 렉스와 트리케라톱스가 맞설 만큼(19×13칸) 가장 탁 트인 곳
  function huntSpot() {
    const V = G.W0.V, at = G.huntAt || (G.huntAt = G.openSpot([V.x + 9, V.y0], 20, 40, 19, 13, 8) || [V.x + 9, V.y0 - 24]);
    return G.findSpot(at[0] * T + 8, at[1] * T + 8, D.Species.rex.hw) || { x: at[0] * T + 8, y: at[1] * T + 8 };
  }

  /* ---------------- 사냥터의 렉스: 트리케라톱스를 압도하는 장면 (싸우지 않는다) ----------------
     새끼를 어미에게 돌려보낸 날, 렉스가 처음으로 둥지를 떠나 북문 밖 사냥터로 내려와 트리케라톱스 한 마리와 맞선다.
     가까이 가면 일행이 몸을 숨기고 지켜본다: 트리케라톱스가 머리를 낮추고 땅을 긁는다 → 렉스의 포효('섬의 주인 · 렉스') →
     하루 일행을 몇 번이고 굴리던 그 돌진을 렉스는 가슴으로 받아 내고 → 목덜미를 물어 흔들고 → 발을 구르자 쓰러진다 →
     쓰러진 녀석 곁에서 포효 → 멈칫 (이쪽을 알아챘나?) → 사냥감을 물고 둥지 쪽으로 끌고 간다.
     그렇게 힘들게 잡은 녀석이 몇 번 물리고 끝났다 — 지금은 이길 수 없다는 걸 싸우지 않고 보여 준다.
     렉스는 둥지로 돌아가 잠들고, 마지막 싸움(몰아내기)은 둥지에서 한다 */
  // 연출 도우미 (moodTick이 매 프레임 부른다): 걷는 동안에도 자세를 붙들어 둔다(돌진하는 트리케라톱스 · 사냥감을 문 렉스) ·
  //   물고 가는 사냥감은 렉스 입에 붙어 따라간다 · nudge: 보는 쪽을 바꾸지 않고 조금 밀려나거나 흔들린다 (대본의 move는 가는 쪽으로 돌려세운다)
  //   fade: 흐려지거나(1 → 0 — 능선을 넘어가는 렉스) 나타난다(0 → 1 — 횃불이 켜지며 드러나는 병사)
  const scene = { hold: null, carry: null, nudges: [], fades: [] };
  const nudge = (e, dx, dy, t) => scene.nudges.push({ e, dx, dy, t: 0, T: t || 0.12 });
  const fade = (e, from, to, t) => { e.alpha = from; scene.fades.push({ e, from, to, t: 0, T: t || 0.6 }); };
  function sceneTick(dt) {
    if (scene.hold) for (const [e, ps] of scene.hold) e.pose = typeof ps === 'function' ? ps(e) : ps;
    const c = scene.carry;
    if (c) { c.prey.x = c.rex.x + c.ox; c.prey.y = c.rex.y + c.oy; }
    if (scene.nudges.length) scene.nudges = scene.nudges.filter(n => { const k = Math.min(dt, n.T - n.t); n.e.x += n.dx * k / n.T; n.e.y += n.dy * k / n.T; n.t += k; return n.t < n.T - 1e-6; });
    if (scene.fades.length) scene.fades = scene.fades.filter(f => { f.t = Math.min(f.T, f.t + dt); f.e.alpha = f.from + (f.to - f.from) * f.t / f.T; return f.t < f.T; });
  }
  function sceneClear() { scene.hold = null; scene.carry = null; scene.nudges = []; scene.fades = []; }
  // 렉스가 둥지를 떠나 사냥터로 내려와 트리케라톱스 한 마리와 맞서 있다. 둘 다 'scene' — 아무것도 알아채지 않고 쫓지도 않는다 (장면이 움직인다).
  //   둘레의 무리는 겁을 먹고 다른 곳으로 옮겨 가 있다
  G.rexDescends = function () {
    const g = G.spawns.find(o => o.boss);
    if (!g) return null;
    let rex = rexOf();
    if (!rex) { rex = new D.Actors.Dino('rex', 0, 0, { herd: g.herdId }); rex.group = g; G.onBossSpawn(rex); G.dinos.push(rex); }
    g.alive = 1; g.deadAt = 0;
    const s = huntSpot(), st = stageSpot(s, rex), at = st.rex;
    Object.assign(rex, { x: at.x, y: at.y, home: { x: at.x, y: at.y }, state: 'scene', wait: 0, goal: null, pose: 'walk0', dir: 'right',
      hp: rex.maxHp, ghost: 1, enraged: false, fled: false, hunt: false, scene: true, roam: true, target: null, emote: null });
    rex.threat.clear();
    // 맞선 트리케라톱스: 이야기용 한 마리 (무리에 들지 않고 다시 태어나지 않는다)
    let tk = rexPrey();
    if (!tk) { tk = new D.Actors.Dino('trike', 0, 0, {}); tk.tag = 'rexPrey'; G.dinos.push(tk); }
    const ts = st.tk;
    Object.assign(tk, { x: ts.x, y: ts.y, home: { x: ts.x, y: ts.y }, state: 'scene', wait: 0, goal: null, pose: 'walk0', dir: 'left', target: null, emote: null });
    tk.threat.clear();
    G.flags.rexAwake = true;
    for (const o of G.spawns) if (!o.boss && o.alive > 0 && G.dinos.some(d => d.group === o && !d.dead && hyp(d.x - s.x, d.y - s.y) < 360)) G.moveHerd(o, s, 480);
    return rex;
  };
  // 둘이 맞설 자리: 사냥터 한가운데 가까이에서, 렉스(왼쪽)와 140px 오른쪽의 트리케라톱스 사이 띠(돌진 · 물기 · 쓰러짐 · 끌고 감)에
  //   나무 · 바위 · 덤불이 끼지 않는 곳 (사냥터는 땅만 트여 있을 뿐 나무가 드문드문 서 있다). 못 찾으면 한가운데 그대로
  //   · 그 남쪽 90~130px에 일행이 숨어 지켜볼 트인 자리(hideSpot)도 있어야 한다
  function stageSpot(s, rex) {
    const hwT = D.Species.trike.hw;
    const clear = (x, y) => G.okSpot(x, y, rex.hw) && G.okSpot(x + 140, y - 4, hwT) && G.clearLine({ x, y }, { x: x + 140, y: y - 4 }) &&
      !G.objs.some(o => !o.gone && o.block && o.x > x - 96 && o.x < x + 200 && o.y > y - 40 && o.y < y + 12) && !!hideSpot({ x: x + 70, y }, x + 70);
    for (let k = 0; k < 120; k++) {
      const a = k * 2.39996, r = k ? 8 + k * 3 : 0, x = s.x - 64 + Math.cos(a) * r, y = s.y + Math.sin(a) * r * 0.7;
      if (clear(x, y)) return { rex: { x, y }, tk: { x: x + 140, y: y - 4 } };
    }
    const at = G.findSpot(s.x - 64, s.y, rex.hw) || s;
    return { rex: at, tk: G.findSpot(at.x + 140, at.y - 4, hwT) || { x: at.x + 140, y: at.y - 4 } };
  }
  // 일행이 숨어 지켜볼 자리: 둘이 맞선 한가운데(C)의 남쪽 90~130px, 하루가 온 쪽(px)으로 조금. 설 수 있고, 바로 앞(남쪽)에 나무 · 바위가 없어
  //   일행이 가려지지 않는 트인 곳 (먼저 가까운 가운데부터). 없으면 null
  function hideSpot(C, px) {
    const lean = Math.max(-40, Math.min(40, px - C.x));
    for (const dy of [104, 94, 116, 128, 88]) for (const dx of [0, -28, 28, -56, 56, -84, 84]) {
      const q = { x: C.x + lean + dx, y: C.y + dy };
      if (!G.okSpot(q.x, q.y, 0) || !G.okSpot(q.x - 24, q.y, 0) || !G.okSpot(q.x + 24, q.y, 0)) continue;
      if (G.objs.some(o => !o.gone && o.block && Math.abs(o.x - q.x) < 40 && o.y > q.y - 12 && o.y < q.y + 48)) continue;
      return q;
    }
    return null;
  }
  // 사냥터 장면 뒤: 렉스는 (보이지 않는 곳에서) 둥지로 돌아가 잠든다 — 이제부터는 몰아내기 규칙
  function rexHome(rex) {
    const N = G.W0.nest, s = G.findSpot(N.x * T + 8, N.y * T + 8, rex.hw) || { x: N.x * T + 8, y: N.y * T + 8 };
    Object.assign(rex, { x: s.x, y: s.y, home: { x: s.x, y: s.y }, state: 'sleep', pose: 'sleep0', zzT: 1.5, wait: 0, goal: null, dir: 'left', target: null, emote: null });
    rex.threat.clear();
    armRex(rex);
  }
  function rexVsTrike(rex) {
    const p = G.player, tk = rexPrey();
    if (!tk) { rexHome(rex); G.flags.rexSeen = true; return; }
    const dir = tk.x >= rex.x ? 1 : -1; // 렉스가 보는 쪽 (트리케라톱스 쪽)
    rex.dir = dir > 0 ? 'right' : 'left'; tk.dir = dir > 0 ? 'left' : 'right';
    const C = { x: (rex.x + tk.x) / 2, y: Math.max(rex.y, tk.y) };
    const shot = { x: C.x - dir * 12, y: C.y - 40 }; // 싸움을 비추는 자리 (렉스 몸통 높이, 꼬리 쪽으로 조금)
    // 숨어서 지켜볼 자리: 싸움터 남쪽 트인 곳, 하루가 온 쪽으로 조금 (곧게 걸어갈 수 없으면 잠깐 어두워졌다가 거기에 있다)
    const hide = hideSpot(C, p.x) || G.findSpot(C.x, C.y + 104, 0) || { x: C.x, y: C.y + 104 };
    const walk = hyp(hide.x - p.x, hide.y - p.y) < 200 && G.clearLine(p, hide);
    const hit = { x: rex.x + dir * 72, y: tk.y }; // 뿔끝이 렉스 가슴에 닿는 자리
    const burst = (x, y, n, colors, speed) => G.fx.burst(x, y, n, { speed: speed || 50, types: ['dot'], colors, life: 0.7, g: 140 });
    const dust = (x, y) => burst(x, y - 2, 14, ['#c89a62', '#e6a766', '#8a5a3c'], 70);
    const blood = () => burst(tk.x - dir * 16, tk.y - 30, 8, ['#c0303a', '#8a1a2a'], 36);
    const hideSteps = walk
      ? [{ move: { who: 'player', x: hide.x, y: hide.y, spd: 52, face: 'up' } }, { form: { to: shot, nowait: true } }, { join: { max: 3 } }]
      : [{ fadeOut: 0.5 }, { call: () => {
        p.x = hide.x; p.y = hide.y; p.dir = 'up';
        const fs = G.formSpots(shot, p);
        for (const b of G.party) { const s = fs[b.id]; if (s) { b.x = s.x; b.y = s.y; b.dir = 'up'; b.detour = null; } }
        G.snapCam();
      } }, { fadeIn: 0.6 }];
    G.runScript([
      { cine: true }, { music: null }, { rally: true },
      { emote: { who: 'player', e: '!' } }, { face: { who: 'player', to: C } }, { wait: 0.4 },
      jack('쉿…! 몸 낮춰. 저기, 풀밭 한가운데.'),
      ...hideSteps,
      { face: { who: ['player', 'jack', 'mina', 'kom'], dir: 'up' } },
      { pan: { x: shot.x, y: shot.y, t: 1.3 } }, { wait: 0.7 },
      // 트리케라톱스가 머리를 낮추고 땅을 긁는다 (두 번)
      { call: () => { tk.pose = 'windup'; tk.say('💢', 1.8); G.sfx('thud'); dust(tk.x + dir * 26, tk.y); } }, { wait: 0.6 },
      { call: () => { tk.pose = 'walk0'; } }, { wait: 0.3 },
      { call: () => { tk.pose = 'windup'; G.sfx('thud'); dust(tk.x + dir * 26, tk.y); } }, { wait: 0.7 },
      // 렉스의 포효 (이름 카드)
      { call: () => { rex.pose = 'roar'; rex.say('💢', 2); G.shake.hit(5, 1.2); G.sfx('roar'); G.flash.fire('#ffffff', 0.5, 1.5); } },
      { card: { style: 'boss', sub: '섬의 주인', title: '렉스', t: 2.6, nowait: true } }, { wait: 1.6 },
      { call: () => { rex.pose = 'walk0'; } }, { wait: 1.3 }, // (이름 카드가 걷힌 뒤에 — 돌진과 물기는 렉스 머리가 다 보이게)
      // 돌진: 하루 일행을 몇 번이고 굴리던 그 돌진 — 렉스는 가슴으로 받아 내고 한 발짝도 밀리지 않는다
      { call: () => { scene.hold = new Map([[tk, 'strike']]); G.sfx('charge'); } },
      { move: { who: 'rexPrey', x: hit.x, y: hit.y, spd: 210 } },
      { call: () => { scene.hold = null; tk.pose = 'walk0'; G.sfx('smash'); G.shake.hit(6, 0.5); G.flash.fire('#ffffff', 0.45, 2.2); dust(rex.x + dir * 36, rex.y); nudge(rex, -dir * 3, 0, 0.08); nudge(tk, dir * 6, 0, 0.15); } },
      { wait: 0.3 }, { call: () => nudge(rex, dir * 3, 0, 0.3) }, { wait: 0.5 },
      // 목덜미를 물어 흔든다
      { call: () => { rex.pose = 'windup'; G.sfx('growl'); } }, { wait: 0.35 },
      { call: () => { rex.pose = 'strike'; G.sfx('bite'); G.shake.hit(4, 0.35); blood(); tk.flashT = 0.3; tk.pose = 'flinch'; tk.say('💢', 1); } }, { wait: 0.28 },
      { call: () => { nudge(tk, -dir * 5, 2, 0.1); G.sfx('bite'); blood(); tk.flashT = 0.2; } }, { wait: 0.2 },
      { call: () => { nudge(tk, dir * 5, -2, 0.1); blood(); } }, { wait: 0.2 },
      { call: () => { nudge(tk, -dir * 4, 1, 0.1); G.sfx('bite'); blood(); tk.flashT = 0.2; } }, { wait: 0.35 },
      // 놓아주자 비틀거리며 물러난다 → 발을 구르자 쓰러진다
      { call: () => { rex.pose = 'walk0'; tk.say('💧', 1.4); nudge(tk, dir * 14, 0, 0.6); } }, { wait: 0.9 },
      { call: () => { rex.pose = 'stomp'; } }, { wait: 0.45 },
      { call: () => { rex.pose = 'walk0'; G.sfx('smash'); G.shake.hit(7, 0.6); dust(rex.x + dir * 16, rex.y); } }, { wait: 0.3 },
      { call: () => { tk.pose = 'dead'; tk.emote = null; G.sfx('down'); G.shake.hit(3, 0.3); dust(tk.x, tk.y); } }, { wait: 1.2 },
      // 쓰러진 녀석 곁에서 포효
      { call: () => { rex.pose = 'roar'; G.shake.hit(6, 1.3); G.sfx('roar'); G.flash.fire('#ffffff', 0.45, 1.5); } }, { wait: 1.7 },
      { call: () => { rex.pose = 'walk0'; } }, { wait: 0.4 },
      // 멈칫 — 이쪽을 알아챘나? (낮게 으르렁) … 사냥감을 문다
      { call: () => { rex.say('!', 1.2); G.sfx('growl'); } }, { emote: { who: ['player', 'jack', 'mina'], e: '💧' } }, { wait: 1.8 },
      { call: () => { scene.hold = new Map([[rex, e => /^step/.test(e.pose) ? 'hold' + e.pose : 'hold0']]); scene.carry = { rex, prey: tk, ox: tk.x - rex.x, oy: tk.y - rex.y }; G.sfx('bite'); } }, { wait: 0.7 },
      // 사냥감을 물고 둥지 쪽(북동쪽)으로 끌고 간다 — 보이지 않을 때까지
      { move: { who: 'rex', x: rex.x + dir * 70, y: rex.y - 150, spd: 42 } },
      { call: () => { sceneClear(); tk.remove = true; rexHome(rex); } },
      { wait: 1.2 },
      { pan: { x: hide.x, y: hide.y - 24, t: 1.0 } }, // 숨어 있던 일행을 대화창 위로 (partyShot은 대본을 짤 때의 자리라 여기선 쓰지 않는다)
      mina('…트리케라톱스가… 몇 번 물리고 그대로….'),
      jack('우리 넷이 한참을 구르고 찔러서 겨우 잡은 녀석이다.\n그걸 저렇게….'),
      jack('뿔창이면 렉스 가죽도 뚫을 거라고? …내가 헛소리를 했군.'),
      haru('저런 걸… 어떻게 물러나게 해요?'),
      jack('지금은 못 해. 오늘 덤볐으면 우리가 저 꼴이었다.'),
      { emote: { who: 'kom', e: '💧' } }, { wait: 0.6 },
      mina('마을로 돌아가자. 겐조 할아버지께 알려야 해.'),
      { call: () => { G.flags.rexSeen = true; D.Audio.play(G.ambientSong()); } }
    ], () => { G.questCheck(); G.save(true); });
  }
  // 겐조에게 알린다 (마을 모닥불 곁): 그게 이 섬의 주인이다 → 둥지로 가서 몰아내라 · 죽이지는 마라 → 채비 이야기
  function tellGenzo() {
    return [
      { cine: true },

  /* ---------------- 1장 끝: 잔치 밤 → 먼 뿔나팔 → 북쪽 곶의 사자 깃발 → 캐스트 롤 → 이튿날 아침 ---------------- */
  // 렉스를 몰아낸 밤, 마을 모닥불에 모두 둘러앉아 잔치를 연다. 겐조가 말없이 일어나 불빛 밖 어둠 쪽으로 걸어가 북쪽을 본다.

  /* 북쪽 곶의 선발대: 자리는 사자 깃발을 꽂는 칸(흙길 끝 — W0.cape)의 발밑(bx, by)에서 잰 픽셀. 모래톱을 따라 내려오는 길(WAY)은

    if (rex && rex.state === 'sleep' && k > 0.45) {
      mood.snore -= dt;
      if (mood.snore <= 0) { mood.snore = 5 + Math.random() * 5; G.sfx('snore'); if (k > 0.75) G.shake.hit(1, 0.5); }
    }
  };
  // 화면: 색이 빠지고 보랏빛으로 어두워지며, 가장자리가 좁아지고 옅은 안개가 흐른다

    const k = G.dreadK;
    if (k < 0.02 || G.inside) return;
    D.FX.desaturate(l, 240, 160, k * 0.6);
    D.FX.multiply(l, D.col.mix('#ffffff', '#b09cb8', k), 240, 160);
    D.FX.fog(l, 240, 160, t, k * 0.22);
    D.FX.vignette(l, 240, 160, k);

  // 이야기 쪽 흐르는 상태 (한 페이지에서 새 게임 · 불러오기를 되풀이해도 앞 판의 것이 남지 않게)
  function resetStory() { G.raidQueue = null; G.dreadK = 0; G.rexStepAt = 0; sceneClear(); Object.assign(mood, { snore: 3, birds: false, told: -999, amb: 4 }); }
  G.setupNewGame = function () {
    resetStory();
    const C = G.W0.CITY;
    G.npcs.push(new NPC('sim', 'sim', '심 박사', (C.x + 15) * T + 8, (C.y + 5) * T + 12, SIM, simTalk));
    G.addBuddy('kom', G.player.x + 14, G.player.y + 6);
    placeVillagers();
  };
  G.setupLoaded = function () {
    resetStory(); // (들어올 습격대는 저장되지 않는다 — 습격 중 저장이면 아래에서 종부터 다시)
    // 동료 복원: 최대 체력은 레벨로 다시 세고(addBuddy), 부상 · 미나의 약 주머니는 저장대로
    for (const b of G.pendingParty || []) {

      if (!x) continue;
      x.wounds = b.wounds || 0; if (b.pouch != null) x.pouch = b.pouch;

    if (G.atStage('rexSee') && !G.flags.rexSeen) G.rexDescends();
    if (G.rexFinal()) { const r = rexOf(); if (r) armRex(r); }
    // 습격 날 해 질 녘 대비를 마친 뒤의 저장: 마을 사람은 통나무집 안에 있다 (불러오는 때는 장면이 바뀌니 눈앞에서 사라지는 게 아니다)
    if (G.atStage('raid') && G.flags.raidPrep && !G.flags.raidWon) hideVillagers();
    // 습격 중에 (메뉴로) 저장했으면: 들어올 무리는 저장되지 않으니 종부터 다시 — 밤이 깊었으면 곧바로 다시 들이닥친다
    if (G.atStage('raid') && G.flags.raidStarted && !G.flags.raidWon) G.flags.raidStarted = false;
    // 엔딩 도중에 저장됐으면(탭을 가리면 대본 중에도 저장한다) 능선의 불빛을 보기 전이면 엔딩을 처음부터 다시
    if (G.flags.ridgeSeen) { G.flags.lionSeen = true; delete G.flags.ridgeSeen; } // 옛 저장: 둥지 능선의 먼 불빛을 본 엔딩 → 곶의 사자 깃발이 선 뒤로 친다
    if (G.flags.lionSeen) plantLion(true); // 곶의 사자 깃발 · 발자국은 저장하지 않고 늘 다시 꽂는다
    if (G.atStage('free') && G.flags.rexDriven && !G.flags.lionSeen) ending();

  function fillIcons() {
    // 탭: 1배가 꼭 16px, 2배가 32px — 글자만
    document.querySelectorAll('link[rel="icon"][sizes]').forEach(el => { el.href = TX.title('듀', { scale: parseInt(el.getAttribute('sizes'), 10) / 16 }).toDataURL(); });
    // iOS: 모서리를 둥글게 깎으니 가장자리를 비운다 (180에 8배 — 몸통 120px)
    const touch = document.querySelector('link[rel="apple-touch-icon"]');
    if (touch) touch.href = homeIcon(180, 8);
    // 안드로이드: 매니페스트를 여기서 붙인다. 보통 아이콘은 iOS와 같은 비율,
    //   maskable은 지름 80% 원 안에 그림자 끝까지 든다 (192에 7배 · 512에 19배 — 가운데서 37%까지)
    //   data: 매니페스트라 상대 주소가 풀리지 않는다 — start_url은 이 페이지의 절대 주소로 (없거나 상대면 설치가 안 된다)
    let man = document.querySelector('link[rel="manifest"]');
    if (!man) { man = document.createElement('link'); man.rel = 'manifest'; document.head.appendChild(man); }

      name: document.title, short_name: '듀랑고', start_url: location.href.split(/[?#]/)[0], display: 'standalone', orientation: 'landscape',
      background_color: '#110e22', theme_color: '#110e22',

  // hot: 새 버전이 게시되면 하던 게임을 이어서 (저장 데이터 형식 그대로)
  async function boot(resume) {
    fit();

    await TX.load();
    fillIcons();
    // 글은 그 일을 하는 동안 떠 있다 (그린 뒤 tick으로 화면에 내보내고 나서 일을 시작한다)
    drawLoading('사람들 그리는 중…', 0.15); await tick();
    for (const id of Object.keys(D.Chars.CAST)) D.Chars.build(D.Chars.CAST[id]);
    drawLoading('공룡 그리는 중…', 0.3); await tick();
    const sp = Object.keys(D.Dinos.DEF);
    for (let i = 0; i < sp.length; i++) { D.Dinos.build(sp[i]); drawLoading('공룡 그리는 중… ' + D.Dinos.DEF[sp[i]].name, 0.3 + 0.5 * (i + 1) / sp.length); await tick(); }
    for (const id of Object.keys(D.Props.MAKERS)) D.Props.get(id);

  function go(sc, arg) { scene = sc; I.clear(); if (sc.enter) sc.enter(arg); }
  function loop(now) {
    if ((D.dbg && D.dbg.paused) || turnAsk) { last = now; requestAnimationFrame(loop); return; } // (휴대폰 세로: 가로로 돌릴 때까지 멈춤)
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt * 1000;
    I.update(dt);
    try { scene.update(dt); scene.render(); } catch (e) { console.error(e); showError(e); }
    S.present();
    // A · B 옆에 찍힌 글: 지금 누르면 하는 일 (메뉴에선 결정 · 뒤로, 대사 중엔 다음)
    if (touchUI) {
      const la = scene !== Play ? '결정' : G.menu ? '결정' : G.lock ? '다음' : G.actionLabel();
      const lb = scene !== Play ? '' : G.menu ? '뒤로' : G.lock ? '' : G.bLabel();
      if (aLabel.textContent !== la) aLabel.textContent = la;
      if (bLabel.textContent !== lb) bLabel.textContent = lb;
      // 십자 버튼의 달리기 고리: 누르는 동안 보이고(held), 달리면 노랗게(run), 달리려는데 못 달리면 붉게(norun — 지침 · 싸움)
      const st = I.stick, p = scene === Play ? G.player : null;
      const cls = !st.active ? '' : p && p.running ? 'run' : p && st.run ? 'norun' : 'held';
      if (cls !== padCls) { if (padCls) padEl.classList.remove(padCls); if (cls) padEl.classList.add(cls); padCls = cls; }
    } else {
      // PC 키 안내: 게임 아래에 자리가 있으면 늘, 없으면 타이틀에서만 (게임 아래 끝에 얹어서)
      const hide = !(keysRoom || scene === Title);
      if (keysEl.hidden !== hide) keysEl.hidden = hide;
    }
    requestAnimationFrame(loop);
  }

      for (const o of [this.haru, this.pass2]) o.ay = D.Chars.AY + jolt;

        const k = this.qt / 2.8, x = 120 + Math.sin(t / 300) * 30, y = 40 + k * 60;
        const r = D.Chars.roll(D.Chars.CAST.haru, Math.floor(t / 90) % 2).silhouette('#fbf8ff');
        l.drawImage(r.canvas(), Math.round(x - 8), Math.round(y));
        const dog = D.Dinos.build('dog'), ds = dog.white[Math.floor(t / 180) % 2 ? 'left' : 'right'].run2;
        l.drawImage(ds.canvas(), Math.round(120 + Math.sin(t / 300 + 2.4) * 34 - 12), Math.round(y - 22 + Math.cos(t / 260) * 6));
        if (Math.floor(t / 120) % 2) TX.draw(l, '!!', 120, 20, { font: 'g11b', color: P.accent, align: 'center', outline: P.outline });
      } else {
        const sh = this.warping ? Math.round((Math.random() - 0.5) * 6 * this.warp) : (this.dlg && this.dlg.glitch ? Math.round((Math.random() - 0.5) * 2) : 0);
        const camX = 8 + sh, camY = 8;
        for (const o of this.objs) if (o.win) o.spr = D.Props.get('trainWin').frames[this.flick ? 0 : (Math.floor(t / 90) + o.fl) % 4];
        D.drawWorld(l, this.g, this.objs, camX, camY, t, { water: false, bg: P.voidC });
        // 조명: 평소엔 형광등 빛, 이상한 일이 생기면 깜빡인다 (초당 세 번이 넘지 않게 — 번쩍임에 민감한 눈을 위해)
        if (this.flick) { if (Math.floor(t / 130) % 3 === 0) D.FX.multiply(l, '#3a3a6a', VW, VH); }
        else D.FX.multiply(l, '#e8e0ff', VW, VH);
        if (this.dlg) UI.drawDialog(l, this.dlg, t);
      }
      if (this.dark > 0) { l.globalAlpha = this.dark; l.fillStyle = '#0c0a1d'; l.fillRect(0, 0, VW, VH); l.globalAlpha = 1; }
      if (this.flash > 0) { l.globalAlpha = this.flash; l.fillStyle = '#fbf8ff'; l.fillRect(0, 0, VW, VH); l.globalAlpha = 1; }
    }
  };

  /* ---------------- 필드 ---------------- */
  const Play = {
    enter(arg) {
      G.init(arg && arg.load);
      if (arg && arg.load) { G.setupLoaded(); G.resumeField(); G.snapCam(); D.Audio.play(G.ambientSong ? G.ambientSong() : G.phase() === 'night' ? D.Music.night : D.Music.field); if (!G.script) G.toast('이어서 시작', null, 0, P.accent); }
      else { G.setupNewGame(); G.snapCam(); wakeUp(); }
      fit();
    },
    update(dt) {
      G.update(dt, I);
      if (G.checkNest) G.checkNest();
    },
    render() {
      G.render(S, t);
      if (G.credits) drawCredits(S.l, G.credits.t);
    }
  };
  // 섬에서 깨어나기: 검은 화면에 '제1장 워프 마을' → 도로 조각(워프 지점) 한가운데 쓰러진 하루와 꼬미, 하늘의 틈이 닫힌다 →
  // 꼬미가 먼저 깨어 하루를 깨운다 → 주인에게 데려다주겠다는 약속 → 심 박사가 걸어온다 → 발치를 스쳐 가는 첫 공룡(콤프소)
  function wakeUp() {
    const p = G.player, kom = G.party.find(b => b.id === 'kom'), C = G.W0.CITY, TS = 16;
    const at = G.findSpot((C.x + 7) * TS + 8, (C.y + 2) * TS + 8, 0) || { x: p.x, y: p.y }; // 중앙선 위
    p.x = at.x; p.y = at.y; p.state = 'sleep'; p.dir = 'right';
    kom.x = p.x + 24; kom.y = p.y + 3; kom.down = true; kom.emote = null; kom.dir = 'left'; // 옆으로 누워 기절한 꼬미
    G.snapCam(); G.fade = 1;
    const sim = G.npcById('sim');
    if (sim) sim.hidden = true;
    const haru = t => ({ say: { name: '하루', voice: 660, text: t } }), simS = t => ({ say: { name: '심 박사', voice: 300, text: t } });
    const run = (I.source === 'touch' ? '섬이 아주 넓단다. 먼 길은 십자 버튼을 누른 채 바깥으로 쭉 밀어서 달리렴.' : '섬이 아주 넓단다. 먼 길은 Shift를 누른 채 움직여서 달리렴.') + '\n달리면 기력이 조금씩 줄고, 싸우는 중엔 달릴 수 없단다.';
    let compy = null;
    G.runScript([
      { cine: true },
      { wait: 0.8 },
      { music: D.Music.chapter },
      G.chapterCard(1, 3.6),
      { call: () => G.sfx('wave') },
      { fadeIn: 1.8 },
      // 하늘의 틈이 닫힌다
      { call: () => { G.addRing(p.x + 10, p.y - 34, 54, 2, 1.3, '#bfe8ff'); G.fx.burst(p.x + 10, p.y - 34, 16, { speed: 26, types: ['star', 'dot'], colors: ['#bfe8ff', '#fbf8ff'], life: 1.4, g: 24 }); G.sfx('whoosh'); } },
      { wait: 1.6 },
      { call: () => { G.sfx('caw'); G.fx.birds(p.x + 70, p.y - 60, 3, -1); } }, { wait: 1.0 },
      { call: () => G.sfx('wave') }, { wait: 0.8 },
      // 꼬미가 먼저 깨어나 하루를 깨운다
      { call: () => { kom.down = false; kom.hp = kom.maxHp; kom.say('!', 0.8); } }, { wait: 0.8 },
      { move: { who: 'kom', x: p.x + 15, y: p.y + 2, spd: 24 } },
      { emote: { who: 'kom', e: '?' } }, { wait: 0.9 },
      { call: () => G.sfx('bark') }, { emote: { who: 'kom', e: '♥' } }, { wait: 1.0 },
      { call: () => { p.state = 'idle'; p.dir = 'right'; p.say('!', 1.2); G.sfx('ok'); } }, { wait: 0.9 },
      { face: { who: 'player', dir: 'left' } }, { wait: 0.4 }, { face: { who: 'player', dir: 'down' } }, { wait: 0.4 }, { face: { who: 'player', dir: 'right' } }, { wait: 0.3 },
      haru('으… 여긴 어디지? 지하철은…?'),
      { emote: { who: 'kom', e: '♪' } }, { call: () => G.sfx('bark') }, { wait: 0.5 },
      haru('너… 옆자리 학생 가방에 있던 강아지구나.\n이름이… 꼬미였지?'),
      { face: { who: 'player', dir: 'up' } }, { wait: 0.5 }, { face: { who: 'player', dir: 'left' } }, { wait: 0.6 },
      haru('주인은…? 아무도 없어….'),
      { emote: { who: 'kom', e: '💧' } }, { wait: 0.7 }, { face: { who: 'player', dir: 'right' } }, { wait: 0.3 },
      haru('…괜찮아, 꼬미. 주인한테 꼭 데려다줄게.'),
      { emote: { who: 'kom', e: '♥' } }, { wait: 0.8 },
      // 심 박사가 동쪽에서 걸어온다
      { call: () => { if (sim) { sim.hidden = false; sim.x = p.x + 132; sim.y = p.y + 18; sim.dir = 'left'; } D.Audio.play(D.Music.field); } },
      { move: { who: 'sim', x: p.x + 40, y: p.y + 2, spd: 40, face: 'left' } },
      simS('허허, 이번엔 아이 하나에 강아지까지 떨어졌구나. 괜찮니?\n나는 심 박사. 1962년 서울에서 실험을 하다가 여기로 왔지.'),
      haru('1962년이요? 여긴… 대체 어디예요?'),
      simS('여긴 듀랑고란다. 공룡이 사는 섬이지.'),
      // 첫 공룡: 콤프소 한 마리가 발치를 쪼르르 지나간다
      { call: () => { compy = new D.Actors.Dino('compy', p.x - 80, p.y + 26, {}); compy.tag = 'firstCompy'; compy.wait = 99; G.dinos.push(compy); } },
      { move: { who: 'firstCompy', x: p.x + 8, y: p.y + 14, spd: 70, nowait: true } }, { wait: 0.9 },
      { call: () => { p.say('!', 1); p.dir = 'down'; kom.say('💢', 1); G.sfx('bark'); } },
      { move: { who: 'firstCompy', x: p.x + 150, y: p.y + 40, spd: 110, nowait: true } }, { wait: 0.4 },
      haru('고, 공룡…?!'),
      { call: () => { p.dir = 'right'; } }, // (콤프소는 화면 밖까지 달려가고, 대본이 끝나면 치운다)
      simS('콤프소라는 녀석이란다. 겁이 많아서 제 발로 도망가지.\n너처럼 다른 시대에서 떨어진 사람들을 우린 [워퍼]라고 부른단다.'),
      haru('집에… 돌아갈 수 있어요? 꼬미도 주인한테 데려다줘야 해요.'),
      { emote: { who: 'sim', e: '…' } }, { wait: 1.0 },
      simS('…그 얘기는 천천히 하자꾸나.\n우선은 오늘 밤을 넘기는 게 먼저란다.'),
      simS('살아남으려면 먼저 도구가 필요해.\n저기 나뭇가지와 돌을 세 개씩 주워 오렴. 가까이 가서 A 버튼!'),
      simS('메뉴는 START, 구르기는 B.\n위험한 공룡이 달려들면 B로 굴러서 피하는 거다.'),
      // 달리기 안내: 손에 쥔 조작에 맞춰 (십자 버튼 · Shift). 들었으니 걷다가 뜨는 안내 쪽지는 건너뛴다
      simS(run),
      { call: () => { G.flags.runTip = 1; } }
    ], () => { if (compy) compy.remove = true; G.save(true); });
  }
  // 캐스트 롤 (G.credits.t초): 로고 → 인물이 차례로 걸어 들어와 이름과 떨어진 때 · 곳 → '1장 워프 마을 끝' · 다음 장 예고
  function drawCredits(l, ct) {
    l.fillStyle = '#0c0a1d'; l.fillRect(0, 0, VW, VH);
    const fadeAB = (t0, t1, f) => Math.max(0, Math.min(1, (ct - t0) / f, (t1 - ct) / f));
    // 1) 로고
    let a = fadeAB(0.3, 3.4, 0.6);
    if (a > 0) {
      l.globalAlpha = a;
      const logo = TX.title('듀랑고', { scale: 3 });
      l.drawImage(logo, 120 - (logo.width >> 1), 42);
      TX.draw(l, '잃어버린 섬', 120, 50 + logo.height, { font: 'g11', color: P.uiLight, align: 'center' });
      l.globalAlpha = 1;
    }
    // 2) 인물: 한 사람에 2초씩 (걸어 들어와 멈춰 선다)
    const roll = G.CAST_ROLL || [], per = 2, t0 = 3.6;
    const i = Math.floor((ct - t0) / per);
    if (i >= 0 && i < roll.length) {
      const lt = ct - t0 - i * per, [id, name, from] = roll[i];
      l.globalAlpha = Math.max(0, Math.min(1, lt / 0.3, (per - lt) / 0.3));
      const walk = Math.min(1, lt / 0.7), x = Math.round(46 + walk * 38), y = 96;
      if (id === 'kom') {
        const d = D.Dinos.build('dog'), pose = walk < 1 ? 'walk' + D.Chars.WALK[Math.floor(lt * 10) % 4] : 'sit';
        l.drawImage(d.right[pose].canvas(), x - (d.w >> 1), y - d.foot);
      } else {
        const cb = G.CH[id];
        if (cb) { const spr = walk < 1 ? cb.right[D.Chars.WALK[Math.floor(lt * 10) % 4]] : cb.down[0]; l.drawImage(spr.canvas(), x - cb.ax, y - cb.ay); }
      }
      TX.draw(l, name, 108, 70, { font: 'g11', color: P.accent });
      TX.draw(l, from, 108, 86, { font: 'g9', color: '#b9b2e0' });
      l.globalAlpha = 1;
    }
    // 3) 그리고 렉스: 떠나간 섬의 주인은 어두운 실루엣으로
    const tRex = t0 + roll.length * per;
    a = fadeAB(tRex + 0.1, tRex + 2.6, 0.5);
    if (a > 0) {
      l.globalAlpha = a;
      const rex = D.Dinos.build('rex'), lt = ct - tRex, x = Math.round(150 - Math.min(1, lt / 1.2) * 30);
      const body = rex.left.walk0.silhouette('#221d46').canvas(), rim = rex.left.walk0.silhouette('#6a62b0').canvas();
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1]]) l.drawImage(rim, x - (rex.w >> 1) + dx, 142 - rex.foot + dy);
      l.drawImage(body, x - (rex.w >> 1), 142 - rex.foot);
      TX.draw(l, '그리고, 렉스', 120, 24, { font: 'g11', color: P.accent, align: 'center' });
      TX.draw(l, '섬의 주인', 120, 38, { font: 'g9', color: '#b9b2e0', align: 'center' });
      l.globalAlpha = 1;
    }
    // 4) 끝 · 다음 장 예고
    const tEnd = tRex + 3;
    a = fadeAB(tEnd, G.CREDITS_T || 27, 0.8);
    if (a > 0) {
      l.globalAlpha = a;
      const logo = TX.title('듀랑고', { scale: 2 });
      l.drawImage(logo, 120 - (logo.width >> 1), 46);
      const [c1, c2] = D.Chapters;
      TX.draw(l, '잃어버린 섬 · ' + c1.n + '장 ' + c1.name + ' 끝', 120, 54 + logo.height, { font: 'g11', color: P.uiLight, align: 'center' });
      TX.draw(l, c2.n + '장 ' + c2.name + ' — 이어집니다', 120, 72 + logo.height, { font: 'g9', color: P.accent, align: 'center' });
      TX.draw(l, '글꼴 갈무리(OFL)', 120, 142, { font: 'g9', color: '#8a82cc', align: 'center' });
      l.globalAlpha = 1;
    }
  }

  D.dbg = {
    go: (n, a) => go({ Title, Prologue, Play }[n], a),
    scene: () => scene === Title ? 'title' : scene === Prologue ? 'prologue' : scene === Play ? 'play' : '?',
    // 프레임을 직접 n번 진행 (창이 가려져 rAF가 멈춰도 테스트 가능)
    step: (n, dt) => { dt = dt || 1 / 60; for (let i = 0; i < n; i++) { t += dt * 1000; I.update(dt); scene.update(dt); } scene.render(); S.present(); },
    press: k => I.simPress(k), hold: (k, on) => I.simHold(k, on),
    // 터치 조작부를 켜고 끈다 (null이면 기기대로) — PC 브라우저에서 십자 버튼 테스트 · 배치 확인용
    touchUI: null, fit: () => fit()
  };
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => (scene === Play ? G.saveData() : null)); } catch (e) { /* 없음 */ }
  let booted = false;
  const start = data => { if (booted) return; booted = true; boot(data && data.v === 1 && data.p ? data : null); };
  if (hot && typeof hot.ready === 'function') { try { hot.ready(start); } catch (e) { start(null); } setTimeout(() => start(null), 4000); }
  else start(hot && hot.data);
})(window.D = window.D || {});

</script>
</body>
</html>
