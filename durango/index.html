      const [[sx, sy], [kx, ky]] = rot([[70 + tx, 44 + ly], [88 + tx, 70 + ly]], hx0, hy0, q.nA); // 허벅지 광택 · 무릎
      S.poly(P(thigh), body, { sh: 4, hi: 1, edge: DEEP, spot: [X(sx), Y(sy), 12, 6] });
      const fy = GROUND - 6 - lift - q.nUp, ft = footAt(68 + q.nearL, fy, 30, q.nToe, q.nUp, 84 + q.nearL);
      if (ky < fy - 2) S.limb(X(kx), Y(ky), X(ft.a[0]), Y(ft.a[1]), 14, 11, body, { sh: 3 });
      drawFoot(ft, body, { sh: 2 });
    } else if (q.legOut) {
      // 쓰러짐: 뒷다리를 뒤로 뻗는다
      S.ellipse(X(72 + bx), Y(58), 32, 24, body, { sh: 3, edge: DEEP });
      S.limb(X(100 + bx), Y(74), X(122 + bx), Y(80), 11, 9, body, { sh: 2 });
      S.poly(P([[118 + bx, 77], [136 + bx, 79], [136 + bx, 86], [116 + bx, 86]]), body, { sh: 1 });
      claw([[136 + bx, 79], [141 + bx, 82], [136 + bx, 84]]);
    } else {
      // 잠: 다리를 접어 배 밑에, 발은 앞으로 살짝
      S.ellipse(X(60 + bx), Y(56 - q.breathe), 36, 28, body, { sh: 3, edge: DEEP });
      S.poly(P([[48 + bx, 82], [70 + bx, 82], [72 + bx, 88], [46 + bx, 88]]), body, { sh: 1 });
      for (const x of [47, 53]) claw([[x + bx, 84], [x - 5 + bx, 88], [x + 1 + bx, 88]]);
    }
    // 가까운 팔: 짧고 굵게 가슴 앞으로 굽혀, 크림색 발톱 둘
    const ay = 59 + by - q.armUp, hy2 = 62 + by - q.armUp * 1.5;
    S.limb(X(56 + bx), Y(50 + by), X(50 + bx), Y(ay), 11, 9, body, { sh: 2, edge: DEEP });
    S.limb(X(50 + bx), Y(ay), X(45 + bx), Y(hy2), 9, 7, body, { sh: 1, edge: DEEP });
    claw([[44 + bx, hy2 - 2], [40 + bx, hy2 + 1], [44 + bx, hy2 + 1]]);
    claw([[45 + bx, hy2 + 1], [42 + bx, hy2 + 4], [47 + bx, hy2 + 3]]);

    S.detail(p => {
      // 눈: 작고 까만 눈 · 그 위로 앞쪽이 내려앉은 굵은 눈썹 (사납게)
      const ex = X(33 + HX), ey = Y(9 + HY);
      const brow = () => { p.line(ex - 4, ey - 1, ex + 4, ey - 3, INK); p.line(ex - 3, ey - 2, ex + 5, ey - 4, INK); };
      if (q.eye === 'open') { p.rect(ex, ey, 2, 3, INK); p.px(ex, ey, '#f4f0ff'); p.px(ex + 2, ey + 1, DEEP).px(ex + 2, ey + 2, DEEP); p.eyeAt = [ex, ey + 1, 2]; brow(); }
      else if (q.eye === 'closed') { p.line(ex - 1, ey + 1, ex + 3, ey + 1, INK); brow(); }
      else if (q.eye === 'squeeze') { p.line(ex - 1, ey - 1, ex + 2, ey + 1, INK); p.line(ex + 2, ey + 1, ex - 1, ey + 3, INK); p.line(ex - 4, ey - 3, ex + 5, ey - 3, INK); }
      else if (q.eye === 'x') deadEye(p, ex + 1, ey);
      else if (q.eye === 'sleep') { p.px(ex - 2, ey, INK); p.line(ex - 1, ey + 1, ex + 2, ey + 1, INK); p.px(ex + 3, ey, INK); p.line(ex - 4, ey - 2, ex + 4, ey - 3, DEEP); }
      // 콧구멍
      p.rect(X(-1 + HX), Y(12 + HY - T), 2, 2, INK); p.px(X(1 + HX), Y(13 + HY - T), DEEP);
      // 입선 · 이빨: 위턱에서 크림색 송곳니가 드문드문, 입을 벌리면 아래턱 이빨도. 뒤끝은 뺨 주름으로 치켜 올라간다
      const gum = Y(28 + HY), m0 = X(-1 + HX), m1 = X(45 + HX);
      p.line(m0, gum, m1, gum, INK);
      for (let x = m0 + 3; x < m1 - 3; x += 6) { p.rect(x - 1, gum + 1, 3, 1, TOOTH); p.px(x, gum + 2, TOOTH); }
      if (jaw >= 3) for (let x = m0 + 6; x < m1 - 6; x += 6) {
        const jy = Y(29 + HY + jaw * Math.max(0, 1 - (x - m0) / 46));
        p.rect(x - 1, jy - 1, 3, 1, TOOTH); p.px(x, jy - 2, TOOTH);
      }
      p.line(m1, gum, m1 + 5, gum - 6, INK); p.line(m1 + 1, gum, m1 + 6, gum - 6, DEEP);
      if (q.tongue) p.rect(X(2 + HX), Y(30 + HY + jaw), 4, 2, '#e0968a');
      // 배 주름: 짙은 초록 위에 조금 더 짙은 가로 주름
      const U = col.c32(under.base);
      for (const [y, x0, x1] of [[60, 50, 74], [66, 56, 82], [71, 64, 88]]) for (let x = x0; x < x1; x++) { const px = X(x + bx), py = Y(y + by); if (p.get(px, py) === U && ((x + y) & 1)) p.px(px, py, under.sh); }
    });
    return S.build();
  }

  /* ================= 렉스 (정면) — 드라고의 앞모습 52×68 (타이틀 · 시트의 흰 실루엣) =================
     울퉁불퉁한 정수리(혹 셋) · 작은 눈과 굵은 눈썹 · 콧등 광택 · 콧구멍 둘 · V자 입선 · 턱 밑 분홍 · 짙은 초록 가슴 · 짧은 팔 · 넓은 발과 크림색 발톱 */
  function rexFront(pose) {
    const S = new Shape(54, 70), k = v => Math.round(v) + 1;
    const body = R('#48c060', { hi: '#6cd884', sh: '#309828' }), under = R('#288810', { hi: '#329a24', sh: '#1d680c' });
    const clawC = R('#f8e0b8', { hi: '#fff6e2', sh: '#d4ae84' }), pinkC = R('#c87868', { sh: '#a45a50' }), mouthC = R('#a8382a', { sh: '#6e2016' });
    const B = pose.f === 1 ? 1 : 0, roar = pose.roar || pose.strike, DEEP = '#184808';
    // 다리 · 넓은 발 (발톱 셋씩)
    for (const s of [-1, 1]) {
      const cx = 26 + s * 12;
      S.ellipse(k(cx - 8), k(48 + B), 16, 14, body, { sh: 2, hi: 1 });
      S.ellipse(k(cx - 10 + s), k(59), 20, 8, body, { sh: 2, hi: 1 });
      for (const t of [-6, 0, 6]) S.poly([[k(cx + t + s - 2), k(64)], [k(cx + t + s + 2), k(64)], [k(cx + t + s * 2), k(67)]], clawC, { sh: 1, hi: 0 });
    }
    // 가슴 · 배 (짙은 초록)
    const tor = S.ellipse(k(10), k(36 + B), 32, 26, body, { sh: 3, hi: 1 });
    S.ellipse(k(15), k(38 + B), 22, 24, under, { sh: 2, hi: 0, clip: tor });
    // 짧은 팔 (발톱 둘씩)
    for (const s of [-1, 1]) {
      const x0 = 26 + s * 14;
      S.limb(k(x0), k(42 + B), k(x0 + s * 2), k(52 + B), 6, 5, body, { sh: 1, edge: DEEP });
      for (const t of [-1.5, 1.5]) S.poly([[k(x0 + s * 2 + t - 1), k(53 + B)], [k(x0 + s * 2 + t + 1), k(53 + B)], [k(x0 + s * 2 + t), k(56 + B)]], clawC, { sh: 0, hi: 0 });
    }
    // 머리: 정수리 혹 셋 → 머리통 → 볼이 불룩한 얼굴 → 턱 → 턱 밑 분홍
    S.ellipse(k(10), k(3 + B), 8, 7, body, { sh: 1, hi: 1 }); S.ellipse(k(34), k(3 + B), 8, 7, body, { sh: 1, hi: 1 });
    S.ellipse(k(21), k(2 + B), 10, 7, body, { sh: 1, hi: 1 });
    S.ellipse(k(7), k(5 + B), 38, 24, body, { sh: 2, hi: 1 });
    const face = S.ellipse(k(2), k(13 + B), 48, 28, body, { sh: 3, hi: 1, spot: [k(20), k(18 + B), 12, 8] });
    if (roar) S.ellipse(k(12), k(31 + B), 28, 9, mouthC, { sh: 1, hi: 0, clip: face });
    S.ellipse(k(12), k(33 + B + (roar ? 4 : 0)), 28, 11, under, { sh: 1, hi: 1 });
    S.rect(k(17), k(43 + B + (roar ? 3 : 0)), 18, 2, pinkC, { sh: 0, hi: 0 });
    S.detail(p => {
      // 눈 · 눈썹 (안쪽 끝이 내려간 V)
      for (const [x, s] of [[15, 1], [36, -1]]) {
        p.rect(k(x), k(15 + B), 1, 3, EYE); if (pose.blink) p.rect(k(x) - 1, k(16 + B), 3, 1, EYE);
        p.line(k(x - 2 * s), k(12 + B), k(x + 2 * s), k(13 + B), EYE); p.line(k(x - 2 * s), k(11 + B), k(x + 2 * s), k(12 + B), DEEP);
      }
      p.rect(k(23), k(25 + B), 1, 2, EYE); p.rect(k(28), k(25 + B), 1, 2, EYE); // 콧구멍
      // V자 입선 (볼 양끝에서 가운데로 내려온다) · 이빨
      p.line(k(6), k(28 + B), k(25), k(33 + B), EYE); p.line(k(26), k(33 + B), k(45), k(28 + B), EYE);
      for (const x of [12, 18, 24, 29, 34, 40]) { const y = x < 26 ? 28 + (x - 6) * 5 / 19 : 28 + (45 - x) * 5 / 19; p.px(k(x), k(y + 1 + B), '#fbf2dc'); }
      if (roar) for (let x = 16; x < 36; x += 4) p.px(k(x), k(38 + B), '#fbf2dc');
    });
    return S.build();
  }

  /* ================= 낮잠 공룡 (장식) ================= */
  function sleeper(pose) {
    const { S, k } = mk(64, 32);
    const bc = '#4fa6a0';
    const body = R(bc, { hi: '#86d0c4', sh: '#35807e' }), belly = R('#d6ecd0');
    const br = pose.f === 1 ? 1 : 0;
    S.poly([[k(44), k(16)], [k(63), k(22)], [k(60), k(30)], [k(42), k(28)]], body, sh(2));
    const b = S.ellipse(k(16), k(6 - br), 38, 24 + br, body, sh(4));
    S.ellipse(k(18), k(20), 26, 9, belly, Object.assign(sh(1), { clip: b }));
    S.ellipse(k(0), k(12), 24, 18, body, sh(3));
    S.ellipse(k(18), k(24), 10, 8, body, sh(2));
    S.detail(p => {
      p.line(k(6), k(18), k(9), k(18), EYE);
      p.line(k(2), k(24), k(12), k(24), EYE);
      for (const x of [26, 32, 38]) p.line(k(x), k(7 - br), k(x + 1), k(12 - br), col.darken(bc, 0.35));
    });
    return S.build();
  }

  /* ---------- 종 정의: 크기·발밑 그림자·스탯 기본값은 게임 데이터에서 ---------- */
  const DEF = {
    dog: { name: '꼬미', fn: dog, extra: ['run0', 'run1', 'run2', 'run3', 'sit'] },
    baby: { name: '꼬미', fn: dog }, // 예전 이름 (스프라이트 시트 호환)
    compy: { name: '콤프소', fn: compy },
    raptor: { name: '랩터', fn: raptor },
    raptorK: { name: '굴레 쓴 랩터', fn: (p, n) => raptor(p, n, true) }, // 구왕국이 길들인 랩터 (그림만 — 싸움 수치는 랩터 그대로)
    pachy: { name: '파키', fn: pachy },
    galli: { name: '갈리미무스', fn: galli },
    gallibaby: { name: '새끼 갈리미무스', fn: galliBaby },
    para: { name: '파라사우롤로푸스', fn: para },
    trike: { name: '트리케라톱스', fn: trike, extra: ['flinch'] },
    bary: { name: '바리오닉스', fn: bary, extra: BARY_EXTRA },
    stego: { name: '스테고사우루스', fn: stego },
    rex: { name: '렉스', fn: rex, extra: REX_EXTRA, gaits: REX_GAITS },
    rexFront: { name: '렉스', fn: rexFront },
    sleeper: { name: '낮잠 공룡', fn: sleeper }
  };
  const POSES = {
    walk0: { f: 0 }, walk1: { f: 1 }, walk2: { f: 2 },
    blink: { f: 0, blink: true },
    windup: { f: 0, windup: true }, strike: { f: 0, strike: true },
    roar: { f: 0, roar: true, windup: true }, stomp: { f: 0, stomp: true, windup: true },
    dead: { f: 0, dead: true }
  };
  const cache = {};
  // 한 종의 모든 포즈: {left:{pose:Pix}, right:{pose:Pix}, white:{...}}
  function build(id) {
    if (cache[id]) return cache[id];
    const d = DEF[id], left = {}, right = {}, whiteL = {}, whiteR = {};
    for (const pn of Object.keys(POSES).concat(d.extra || [])) {
      const p = d.fn(POSES[pn] || { f: 0 }, pn);
      left[pn] = p; right[pn] = p.flip();
      if (p.eyeAt) right[pn].eyeAt = [p.w - p.eyeAt[0] - p.eyeAt[2], p.eyeAt[1], p.eyeAt[2]]; // 뒤집은 그림의 눈 자리
      whiteL[pn] = p.silhouette(WHITE); whiteR[pn] = whiteL[pn].flip();
    }
    const base = left.walk0;
    // 발 위치: 가장 아래 불투명 줄
    let foot = base.h - 1;
    outer: for (let y = base.h - 1; y >= 0; y--) for (let x = 0; x < base.w; x++) if (base.get(x, y)) { foot = y; break outer; }
    const out = { id, name: d.name, left, right, white: { left: whiteL, right: whiteR }, w: base.w, h: base.h, foot, gaits: d.gaits || null };
    // 예전 API 호환: left[0..2]
    out.left[0] = left.walk0; out.left[1] = left.walk1; out.left[2] = left.walk2;
    out.right[0] = right.walk0; out.right[1] = right.walk1; out.right[2] = right.walk2;
    cache[id] = out;
    return out;
  }
  // 걸은 거리 d(px)에 맞춘 걷기 한 바퀴의 한 장 (kind: 'step' 걷기 · 'charge' 돌진). 한 바퀴를 따로 그린 종(렉스)만 — 아니면 null (walk 세 장을 쓴다)
  const gaitPose = (art, kind, d) => { const g = art.gaits && art.gaits[kind]; return g ? kind + (Math.floor(d / g.len) % g.n) : null; };
  const bags = {};
  D.Dinos = { build, DEF, POSES, gaitPose, dogBag: mode => bags[mode || 'open'] || (bags[mode || 'open'] = dogBag(mode)) };
})(window.D = window.D || {});

</script>
<script>
/* 듀랑고 GBA — 지형(타일) 렌더러
   3/4 탑뷰, 타일 16×16. 맵 전체 또는 섹터(영역)를 바닥 캔버스로 굽는다.
   섹터는 1타일 여백을 붙여 그린 뒤 가운데만 잘라내고, 모든 노이즈·해시는 절대 좌표라 이음새가 없다.
   자연 지형(물<모래<흙<잔디)은 타일 중심 사이 보간 + 좌표 시드 노이즈로 경계를 흔들어 반복감을 없애고,
   경계를 인식해서 그린다: 잔디 턱과 그림자, 물가의 둑과 물거품, 인도-차도 사이 연석,
   도시 조각의 찢긴 아스팔트 가장자리, 실내 바닥-허공 사이 2px 어두운 테두리 + 1px 밝은 선. */
'use strict';
(function (D) {
  const { Pix, col } = D;
  const { hash, vnoise } = D.rand;
  const P = D.PAL;
  const T = 16;
  const c32 = col.c32;

  // 타일 문자 → 자연 지형 높이 (0 물, 1 모래, 2 흙, 3 잔디)
  // x 말라 죽은 풀(렉스 둥지 둘레) · o 갈아 놓은 밭 · u 옛 돌바닥. 렉스 발자국은 칸이 아니라 map.prints (drawPrints)
  const LV = { w: 0, b: 0, s: 1, d: 2, r: 2, y: 2, k: 2, g: 3, f: 3, l: 3, c: 3, t: 3, h: 3, x: 3, o: 2, u: 2 };
  const NATURAL = new Set(['w', 's', 'd', 'g', 'f', 'l', 't', 'x', 'o', 'u']);
  // 마른 풀: 잔디 색 → 누렇게 바랜 색
  const WITHER = { grass: '#b0a66c', grassD: '#9a9058', grassL: '#c8be86', grassEdge: '#7c7248', grassLip: '#665c3e' };
  const CITY = new Set(['r', 'y', 'k']);
  const INDOOR = new Set(['F', 'U', 'L', ' ', '.', 'M', 'Q']);

  function tileAt(map, tx, ty) {
    if (map.parent) return tileAt(map.parent, tx + map.tox, ty + map.toy);
    tx = Math.max(0, Math.min(map.w - 1, tx)); ty = Math.max(0, Math.min(map.h - 1, ty));
    return map.rows[ty][tx];
  }
  // 영역 보기: 로컬 타일 좌표 -> 부모 맵 절대 좌표 (범위 밖은 가장자리 반복)
  function view(map, tx0, ty0, tw, th) {
    const rows = [];
    for (let j = 0; j < th; j++) {
      let r = '';
      for (let i = 0; i < tw; i++) r += tileAt(map, tx0 + i, ty0 + j);
      rows.push(r);
    }
    return { w: tw, h: th, rows, seed: map.seed, parent: map, tox: tx0, toy: ty0, ox: tx0 * T, oy: ty0 * T };
  }

  // 체커 디더로 두 색 섞기 (패치형 변화)
  function patch(x, y, seed, s) {
    return vnoise(x, y, s || 20, seed);
  }

  // reg: {tx, ty, tw, th} 타일 영역 (없으면 맵 전체). 영역이면 1타일 여백을 붙여 그린 뒤 잘라낸다.
  function render(full, reg) {
    let map = full, M = 0;
    if (reg) { M = 1; map = view(full, reg.tx - M, reg.ty - M, reg.tw + M * 2, reg.th + M * 2); }
    const OX = map.ox || 0, OY = map.oy || 0, TOX = map.tox || 0, TOY = map.toy || 0;
    const W = map.w * T, H = map.h * T, seed = map.seed || 7;
    const pix = new Pix(W, H), d = pix.d;
    const lv = new Int8Array(W * H).fill(-1);
    const deep = new Float32Array(W * H);

    /* 1) 자연 지형 분류 */
    for (let y = 0; y < H; y++) {
      const gy = (y + 0.5) / T - 0.5, ty0 = Math.floor(gy), fy = gy - ty0;
      for (let x = 0; x < W; x++) {
        const gx = (x + 0.5) / T - 0.5, tx0 = Math.floor(gx), fx = gx - tx0;
        const own = map.rows[Math.floor(y / T)][Math.floor(x / T)];
        if (INDOOR.has(own)) continue;
        const la = LV[tileAt(map, tx0, ty0)] ?? 3, lb = LV[tileAt(map, tx0 + 1, ty0)] ?? 3;
        const lc = LV[tileAt(map, tx0, ty0 + 1)] ?? 3, ld = LV[tileAt(map, tx0 + 1, ty0 + 1)] ?? 3;
        let L = 0;
        for (let k = 3; k >= 1; k--) {
          const F = (la >= k ? 1 : 0) * (1 - fx) * (1 - fy) + (lb >= k ? 1 : 0) * fx * (1 - fy) + (lc >= k ? 1 : 0) * (1 - fx) * fy + (ld >= k ? 1 : 0) * fx * fy;
          if (k === 1) deep[y * W + x] = F;
          if (F >= 1) { L = k; break; }
          if (F <= 0) continue;
          const n = (vnoise(x + OX, y + OY, 7, seed + k * 31) - 0.5) * 0.46 + (vnoise(x + OX, y + OY, 2.5, seed + k * 17) - 0.5) * 0.16;
          if (F + n > 0.5) { L = k; break; }
        }
        lv[y * W + x] = L;
      }
    }
    const lvAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? -2 : lv[y * W + x];

    /* 2) 바탕 질감 */
    const G = c32(P.grass), GD = c32(P.grassD), GL = c32(P.grassL);
    const DI = c32(P.dirt), DD = c32(P.dirtD), DL = c32(P.dirtL);
    const SA = c32(P.sand), SD = c32(P.sandD), SL = c32(P.sandL);
    const WA = c32(P.water), WD = c32(P.waterD), WL = c32(P.waterL);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const L = lv[y * W + x];
      if (L < 0) continue;

    S.detail(p => {

      const inLeaf = (x, y) => y < 29 && p.get(x, y) !== 0;
      speckle(p, inLeaf, [lr.hi, lr.sh], 26, kind === 'green' ? 5 : 9);
      if (kind === 'fruit') for (const [x, y] of [[8, 16], [22, 18], [14, 22], [26, 10], [12, 8]]) { p.rect(x, y, 2, 2, '#e8404a'); p.px(x, y, '#ff9a9a'); }
    });
    const pix = S.build();
    return { pix, ax: 17, ay: 45, foot: [1, 1] };
  }

  function bareTree() {
    const S = new Shape(30, 38);
    S.poly([[11, 37], [12, 22], [14, 15], [17, 15], [18, 22], [19, 37]], BARK, { sh: 2 });
    S.limb(14, 19, 6, 9, 4, 2, BARK, { sh: 1 });
    S.limb(6, 9, 3, 3, 2, 1, BARK, { sh: 0 });
    S.limb(16, 17, 23, 7, 4, 2, BARK, { sh: 1 });
    S.limb(23, 7, 27, 4, 2, 1, BARK, { sh: 0 });
    S.limb(15, 15, 13, 3, 3, 1, BARK, { sh: 0 });
    S.limb(17, 22, 25, 17, 3, 1, BARK, { sh: 0 });
    S.poly([[8, 37], [11, 33], [13, 37]], BARK, { sh: 1 });
    S.poly([[17, 37], [19, 33], [22, 37]], BARK, { sh: 1 });
    S.detail(p => { p.line(14, 26, 14, 33, BARK.sh); p.px(16, 24, BARK.sh); p.px(9, 7, LEAF_AUT.base); p.px(24, 6, LEAF_AUT.hi); });
    return { pix: S.build(), ax: 15, ay: 37, foot: [1, 1] };
  }

  // 곡선 띠: 가운데 선 f(t)를 따라 굵기 w(t)인 다각형. saw면 아래를 향한 가장자리를 톱니로 (야자 잎의 작은 잎들)
  const bez = (a, c, b, t) => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
  function ribbon(f, w, n, saw) {
    const a = [], b = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, p = f(t), q = f(Math.min(1, t + 0.01)), r = f(Math.max(0, t - 0.01));
      let dx = q[0] - r[0], dy = q[1] - r[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
      const nx = -dy, ny = dx, h = w(t) / 2, cut = saw && i % 2 && i < n ? saw : 0;
      a.push([p[0] + nx * (h + (ny > 0 ? cut : 0)), p[1] + ny * (h + (ny > 0 ? cut : 0))]);
      b.push([p[0] - nx * (h + (ny < 0 ? cut : 0)), p[1] - ny * (h + (ny < 0 ? cut : 0))]);
    }
    return a.concat(b.reverse()).map(([x, y]) => [Math.round(x), Math.round(y)]);
  }

  // 야자수: 비스듬히 휘어 오른 줄기(마디 고리) 끝에서 깃털 잎 아홉 장이 둥글게 퍼져 끝이 늘어지고, 잎 밑에 코코넛이 매달린다.
  // 뒤쪽 잎은 어둡게 먼저, 옆 · 앞 잎은 밝게 나중에. dir 'left'면 왼쪽으로 기운다 (빛은 늘 왼쪽 위라 좌우 반전 대신 다시 그린다)
  function palm(dir) {
    const L = dir === 'left' ? -1 : 1;
    const S = new Shape(58, 58);
    const TRUNK = R('#b88a5a', { hi: '#dcb07a', sh: '#8a643e' }), COCO = R('#86582f', { hi: '#b8885a', sh: '#5a3820' });
    const LEAF = { hi: '#a8dc6a', base: '#5cae4a', sh: '#3a8544' }, BACK = { hi: '#78bc58', base: '#4a9a46', sh: '#2f6e3c' };
    const RIB = '#8ccc5a', RING = '#6e4c2e', SEAM = '#2c6a38';
    const B = [29, 57], TOP = [29 + L * 8, 17], Q = [29 + L, 35]; // 밑동(기준점) · 잎이 모이는 꼭대기 · 줄기가 휘는 정도
    const trunk = t => bez(B, Q, TOP, t), tw = t => 6.4 - 2.6 * t;
    const is = (p, x, y, rp) => { const c = p.get(x, y); return c === col.c32(rp.base) || c === col.c32(rp.hi) || c === col.c32(rp.sh); };
    S.ellipse(B[0] - 4, B[1] - 2, 9, 3, TRUNK, { sh: 1, hi: 0 });
    S.poly(ribbon(trunk, tw, 20, 0), TRUNK, { sh: 2, hi: 1 });
    // 잎 일곱 장을 부채꼴로: 꼭대기에서 화면 각도 deg 쪽으로 len만큼, 가운데가 lift만큼 솟았다가 끝이 droop만큼 늘어진다.
    // 가늘어서 잎 사이로 하늘이 보인다. 위로 뻗은 뒤 잎은 어둡게 먼저, 옆 · 아래 잎은 나중에
    const FRONDS = [];
    const frond = (deg, len, lift, droop, rp) => {
      const a = deg * Math.PI / 180, tip = [TOP[0] + Math.cos(a) * len, TOP[1] + Math.sin(a) * len + droop];
      const ctl = [TOP[0] + Math.cos(a) * len * 0.5, TOP[1] + Math.sin(a) * len * 0.5 - lift], f = t => bez(TOP, ctl, tip, t);
      S.poly(ribbon(f, t => Math.max(0.9, 3.3 * Math.pow(Math.sin(Math.PI * Math.min(1, 0.12 + t * 0.95)), 0.6) * (1 - t * 0.25)), 18, 1.2), rp, { sh: 1, hi: 1, edge: SEAM });
      if (rp === LEAF) FRONDS.push(f);
    };
    frond(-90 - L * 8, 9, 3, 1, BACK); frond(-128, 14, 4, 6, BACK); frond(-52, 14, 4, 6, BACK);
    frond(184, 19, 8, 10, LEAF); frond(-4, 19, 8, 10, LEAF);
    const NUTS = [[-3, 2], [1, 3], [-1, 5]].map(([dx, dy]) => [TOP[0] + dx * L - 2, TOP[1] + dy - 1]);
    for (const [x, y] of NUTS) S.ellipse(x, y, 5, 5, COCO, { sh: 1, hi: 1, edge: COCO.sh }); // 잎 밑동에 매달린 코코넛
    frond(140, 14, 3, 8, LEAF); frond(40, 14, 3, 8, LEAF);
    S.detail(p => {
      // 줄기 마디: 3px마다 줄기 축에 직각인 고리. 고리 바로 밑 왼쪽은 불룩하게 볕
      for (let i = 1; i < 13; i++) {
        const t = i / 13, [cx, cy] = trunk(t), [qx, qy] = trunk(t + 0.01), h = tw(t) / 2;
        let nx = -(qy - cy), ny = qx - cx; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
        for (let s = -h; s <= h; s += 0.5) {
          const x = Math.round(cx + nx * s), y = Math.round(cy + ny * s);
          if (is(p, x, y, TRUNK)) p.px(x, y, p.get(x, y) === col.c32(TRUNK.sh) ? RING : TRUNK.sh);
        }
        const lx = Math.round(cx - h + 1), ly = Math.round(cy) + 1;
        if (is(p, lx, ly, TRUNK)) p.px(lx, ly, TRUNK.hi);
      }
      // 옆 · 앞 잎: 밝은 잎맥, 잎맥에서 끝 쪽으로 비스듬히 갈라지는 작은 잎 틈 (깃털처럼)
      for (const f of FRONDS) {
        for (let t = 0.15; t < 0.82; t += 0.04) { const [x, y] = f(t); if (is(p, Math.round(x), Math.round(y), LEAF)) p.px(Math.round(x), Math.round(y), RIB); }
        for (const t of [0.32, 0.5, 0.68]) {
          const [x, y] = f(t), [x2, y2] = f(t + 0.02);
          let tx = x2 - x, ty = y2 - y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
          let nx = -ty, ny = tx; if (ny < 0) { nx = -nx; ny = -ny; } // 아래를 향한 쪽
          for (const k of [1, 2]) { const px = Math.round(x + (nx + tx * 0.7) * k), py = Math.round(y + (ny + ty * 0.7) * k); if (is(p, px, py, LEAF)) p.px(px, py, LEAF.sh); }
        }
      }
      // 코코넛: 보이는 것만 볕 한 점
      for (const [x, y] of NUTS) if (p.get(x + 1, y + 1) === col.c32(COCO.base)) p.px(x + 1, y + 1, COCO.hi);
    });
    return { pix: S.build(), ax: B[0], ay: B[1], foot: [1, 1] };
  }

  function fern() {
    const S = new Shape(26, 20);
    const fr = { hi: '#9ed468', base: '#5fae4a', sh: '#3f8741' };
    const tips = [[1, 12], [3, 4], [10, 0], [16, 0], [23, 4], [25, 12], [13, 2]];
    tips.forEach(([x, y]) => {
      const bx = 13, by = 19, mx = (x + bx) / 2, my = (y + by) / 2;
      const nx = -(y - by), ny = (x - bx), L = Math.hypot(nx, ny) || 1, w = 2.2;
      S.poly([[bx, by], [Math.round(mx + nx / L * w), Math.round(my + ny / L * w)], [x, y], [Math.round(mx - nx / L * w), Math.round(my - ny / L * w)]], fr, { sh: 1, hi: 1, edge: fr.sh });
    });
    S.detail(p => { for (let y = 3; y < 18; y += 3) for (let x = 2; x < 25; x += 4) if (p.get(x, y) && ((x + y) & 2)) p.px(x, y, fr.hi); });
    return { pix: S.build(), ax: 13, ay: 19, foot: [1, 1] };
  }

  function bush(berry) {
    const S = new Shape(18, 15);
    const lr = LEAF_DEEP;
    S.ellipse(1, 4, 9, 10, lr, { sh: 2, spot: [3, 5, 3, 2] });
    S.ellipse(8, 3, 9, 11, lr, { sh: 2, spot: [10, 4, 3, 2] });
    S.ellipse(4, 0, 10, 9, lr, { sh: 2, spot: [6, 1, 3, 2], edge: col.darken(lr.sh, 0.15) });
    S.detail(p => {
      if (berry) for (const [x, y] of [[4, 8], [9, 5], [13, 9], [7, 11], [11, 2]]) { p.rect(x, y, 2, 2, '#d8344a'); p.px(x, y, '#ff8a9a'); }
      else for (const [x, y] of [[5, 6], [12, 7], [8, 10]]) p.px(x, y, lr.hi);
    });
    return { pix: S.build(), ax: 9, ay: 14, foot: [1, 1] };
  }

  function rock(big) {
    const w = big ? 26 : 16, h = big ? 18 : 12;
    const S = new Shape(w, h);
    const rr = R('#b4a6b0', { hi: '#dcd0d4', sh: '#83748a' });
    if (big) {
      S.poly([[1, 16], [2, 8], [6, 3], [13, 1], [20, 3], [24, 9], [25, 16], [18, 17], [8, 17]], rr, { sh: 3, hi: 1 });
      S.poly([[14, 17], [16, 10], [21, 8], [25, 12], [25, 17]], rr, { sh: 2, hi: 1, edge: col.darken(rr.sh, 0.2) });
    } else {
      S.poly([[1, 11], [2, 5], [6, 1], [11, 1], [14, 5], [15, 11], [9, 12]], rr, { sh: 2, hi: 1 });
    }
    S.detail(p => {
      if (big) { p.line(9, 5, 11, 9, rr.sh); p.line(11, 9, 10, 12, rr.sh); p.rect(8, 2, 4, 1, '#8dc55e'); p.px(9, 1, '#aad97a'); }
      else { p.line(6, 4, 8, 7, rr.sh); p.rect(5, 1, 3, 1, '#8dc55e'); }
    });
    // 큰 바위는 두 칸(tx, tx+1)을 막으니 그림 가운데를 두 칸 사이에 둔다
    return { pix: S.build(), ax: big ? (w >> 1) - 8 : w >> 1, ay: h - 1, foot: [big ? 2 : 1, 1] };
  }

  function stump() {
    const S = new Shape(16, 12);
    S.rect(2, 4, 12, 7, BARK, { sh: 2 });
    S.poly([[0, 11], [2, 7], [4, 11]], BARK, { sh: 1 });
    S.poly([[12, 11], [14, 7], [16, 11]], BARK, { sh: 1 });
    S.ellipse(2, 1, 12, 6, R('#e8c08a', { sh: '#c89a62' }), { sh: 1, hi: 1 });
    S.detail(p => { p.ellipse(5, 2, 6, 4, '#c89a62'); p.ellipse(6, 3, 4, 2, '#e8c08a'); p.px(8, 3, '#c89a62'); });
    return { pix: S.build(), ax: 8, ay: 11, foot: [1, 1] };
  }

  // 전봇대 (전선 고정점 wires: 스프라이트 좌표).
  // cut이면 줄 끝의 전봇대: 이어 줄 이웃이 없어 끊어진 전선이 애자에서 늘어져 땅에 닿고, 남은 길이는 바닥에 눕는다 (play.js makeWires가 고른다)
  const WIRE = '#3a2e40'; // 전선 색 (screen.js 전선과 같게)
  function pole(cut) {
    const S = new Shape(cut ? 42 : 18, 62);
    const cr = R('#bdb4c4', { hi: '#e2dce6', sh: '#8a8096' }), wood = R('#6a5a64', { hi: '#8e7e88', sh: '#4a3e48' });
    S.rect(7, 4, 4, 57, cr, { sh: 1, hi: 1, band: 0 });
    S.rect(1, 9, 16, 3, wood, { sh: 1 });
    S.ellipse(10, 18, 7, 9, R('#8aa39a', { sh: '#607a74' }), { sh: 2 });
    S.detail(p => {
      for (const x of [2, 8, 14]) { p.rect(x, 7, 2, 2, '#f4eef8'); p.px(x + 1, 8, '#b8b0c8'); }
      for (let y = 26; y < 56; y += 5) p.px(y % 2 ? 6 : 11, y, '#4a3e48');
      p.rect(7, 34, 4, 6, '#f3c14c'); p.line(7, 36, 10, 36, '#281a2e'); p.line(7, 38, 10, 38, '#281a2e');
      p.px(8, 5, '#f4eef8');
    });
    const pix = S.build();
    if (cut) {
      // 외곽선 없이 전선 굵기(1px)로 3차 곡선을 긋는다. behind면 전봇대 · 변압기에 가리는 칸은 건너뛰어 그 뒤로 지나가 보인다
      const cubic = (a, b, c, d, t) => [0, 1].map(k => (1 - t) ** 3 * a[k] + 3 * (1 - t) ** 2 * t * b[k] + 3 * (1 - t) * t * t * c[k] + t ** 3 * d[k]);
      const drape = (a, b, c, d, behind) => {
        const put = (x, y) => { if (!behind || !pix.get(x, y)) pix.px(x, y, WIRE); };
        let [px, py] = a;
        for (let i = 1; i <= 40; i++) { const [x, y] = cubic(a, b, c, d, i / 40).map(Math.round); D.raster.bresenham(px, py, x, y, put); px = x; py = y; }
      };
      // 양쪽 전선: 애자에서 늘어져 땅에 닿으며 누워, 남은 길이는 바닥에 널브러진다 (끝이 살짝 말려 오름)
      drape([3, 8], [1, 36], [3, 60], [13, 60], true); pix.line(13, 60, 22, 60, WIRE); pix.px(23, 59, WIRE); pix.px(24, 59, WIRE);
      drape([15, 8], [24, 24], [20, 59], [28, 59], true); pix.line(28, 59, 37, 59, WIRE); pix.px(38, 58, WIRE); pix.px(39, 58, WIRE);
      // 가운데 전선은 애자 가까이에서 끊겨 짧게 늘어진 토막 (가닥이 풀린 끝)
      drape([9, 8], [11, 9], [13, 11], [13, 14], false); pix.px(12, 15, WIRE); pix.px(14, 15, WIRE);
    }
    return { pix, ax: 9, ay: 61, foot: [1, 1], wires: [[3, 7], [9, 7], [15, 7]] };
  }

  /* ---------- 방향이 있는 소품 ----------
     dir = 앞면이 향한 쪽. down 앞모습(기본) · up 뒷모습 · left 옆모습(앞면이 왼쪽) · right는 left를 좌우 반전.
     시점은 남쪽 위에서 비스듬히 내려다보는 3/4라서 보이는 면은 남쪽 면과 윗면이다. */

  // 자판기: 앞모습은 밤에 빛을 낸다. 옆은 광고판, 뒤는 환풍구와 전선
  function vending(color, dir) {
    const c = color || '#d8484a';
    const body = R(c, { hi: col.lighten(c, 0.28), sh: col.darken(c, 0.24) });
    const lid = R(col.lighten(c, 0.38), { sh: col.lighten(c, 0.12) });
    if (dir === 'left') {
      const S = new Shape(15, 32);
      S.rect(3, 3, 11, 28, body, { sh: 2, hi: 1 });
      S.rect(3, 1, 11, 3, lid, { sh: 0, hi: 0 });
      S.rect(0, 3, 4, 28, R('#e6e0ee', { hi: '#fbf8ff', sh: '#b8b0c8' }), { sh: 1, hi: 1 });
      S.detail(p => {
        // 앞면 가장자리: 유리 반사 · 버튼 · 반환구
        p.line(1, 6, 1, 17, '#7ac8ee'); p.px(1, 7, '#e6f7ff'); p.line(2, 6, 2, 17, '#2c3a6a');
        p.px(1, 19, '#7ad07a'); p.px(1, 21, '#f7f3ff'); p.rect(0, 25, 3, 3, '#3a2a3e');
        // 옆판 광고: 병 그림
        p.rect(5, 6, 7, 15, col.lighten(c, 0.22)); p.line(5, 6, 11, 6, '#fbf8ff');
        p.rect(8, 8, 1, 2, '#fbf8ff'); p.rect(7, 10, 3, 8, '#fbf8ff'); p.line(7, 13, 9, 13, c); p.line(7, 15, 9, 15, c);
        for (let y = 24; y < 30; y += 2) p.line(6, y, 11, y, col.darken(c, 0.42));
      });
      return { pix: S.build(), ax: 8, ay: 31, foot: [1, 1], light: [2, 12, 12] };
    }
    if (dir === 'up') {
      const back = R(col.darken(c, 0.12), { hi: c, sh: col.darken(c, 0.38) });
      const S = new Shape(18, 32);
      S.rect(1, 3, 16, 28, back, { sh: 2, hi: 1 });
      S.rect(1, 1, 16, 3, lid, { sh: 0, hi: 0 });
      S.detail(p => {
        const dk = col.darken(c, 0.5);
        for (let y = 6; y < 15; y += 2) p.line(4, y, 13, y, dk);
        p.rect(5, 18, 8, 5, '#f4eef8'); p.line(6, 19, 11, 19, '#8a8096'); p.line(6, 21, 9, 21, '#8a8096');
        for (const [x, y] of [[2, 4], [15, 4], [2, 29], [15, 29]]) p.px(x, y, col.lighten(c, 0.2));
        p.line(13, 25, 13, 30, OL); p.px(14, 31, OL); p.px(15, 31, OL); p.px(16, 31, '#3a2e40');
      });
      return { pix: S.build(), ax: 9, ay: 31, foot: [1, 1] };
    }
    const S = new Shape(18, 32);
    S.rect(1, 3, 16, 28, body, { sh: 2, hi: 1 });
    S.rect(1, 1, 16, 3, lid, { sh: 0, hi: 0 });
    S.detail(p => {
      p.rect(2, 5, 14, 2, '#f7f3ff'); p.line(4, 6, 13, 6, c);
      p.rect(3, 8, 12, 11, '#2c3a6a');
      const cans = ['#f3c14c', '#6ec6f0', '#f07a8a', '#7ad07a', '#f7f3ff', '#e98a3b'];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
        const x = 4 + c * 3, y = 9 + r * 3, cc = cans[(r * 4 + c) % cans.length];
        p.rect(x, y, 2, 2, cc); p.px(x, y, '#fbf8ff');
      }
      p.line(3, 18, 14, 18, '#fbf8ff');
      for (let c = 0; c < 4; c++) p.px(4 + c * 3, 20, c === 1 ? '#7ad07a' : '#f7f3ff');
      p.rect(12, 21, 3, 4, '#8a8096'); p.line(13, 22, 13, 23, '#281a2e');
      p.rect(3, 25, 9, 4, '#3a2a3e'); p.line(3, 25, 11, 25, '#6a5a70');
    });
    return { pix: S.build(), ax: 9, ay: 31, foot: [1, 1], light: [9, 12, 18] };
  }

  function busStop(dir) {
    const pl = R('#b8b0c4', { sh: '#8a8096' }), blue = R('#3f7ad0', { hi: '#78a8ec', sh: '#2c5aa6' });
    if (dir === 'left') {
      // 옆모습: 둥근 표지판과 시간표가 얇은 판으로
      const S = new Shape(10, 36);
      S.rect(4, 10, 2, 25, pl, { sh: 1, hi: 0 });
      S.rect(3, 0, 4, 12, blue, { sh: 1, hi: 1 });
      S.rect(3, 15, 4, 9, R('#dcd6e6', { sh: '#a8a0b8' }), { sh: 1 });
      S.detail(p => { p.line(4, 1, 4, 10, '#78a8ec'); p.px(6, 5, '#f7f3ff'); p.px(5, 17, '#8a8096'); p.px(5, 20, '#8a8096'); });
      return { pix: S.build(), ax: 5, ay: 35, foot: [1, 1] };
    }
    const S = new Shape(14, 36);
    S.rect(6, 10, 2, 25, pl, { sh: 1, hi: 0 });
    if (dir === 'up') {
      // 뒷모습: 회색 뒤판과 나사
      S.ellipse(1, 0, 12, 12, R('#a8a0b8', { hi: '#cfc8dc', sh: '#7e7690' }), { sh: 1, hi: 1 });
      S.rect(3, 15, 8, 9, R('#b8b0c4', { sh: '#8a8096' }), { sh: 1 });
      S.detail(p => { p.rect(6, 5, 2, 2, '#6a6280'); for (const [x, y] of [[4, 16], [9, 16], [4, 22], [9, 22]]) p.px(x, y, '#6a6280'); });
      return { pix: S.build(), ax: 7, ay: 35, foot: [1, 1] };
    }
    S.ellipse(1, 0, 12, 12, blue, { sh: 1, hi: 1 });
    S.rect(3, 15, 8, 9, R('#f4eef8', { sh: '#c8c0d8' }), { sh: 1 });
    S.detail(p => {
      p.rect(4, 4, 6, 3, '#f7f3ff'); p.px(4, 7, '#f7f3ff'); p.px(9, 7, '#f7f3ff'); p.px(5, 4, '#3f7ad0'); p.px(8, 4, '#3f7ad0');
      for (let y = 17; y < 23; y += 2) p.line(4, y, 9, y, '#8a8096');
    });
    return { pix: S.build(), ax: 7, ay: 35, foot: [1, 1] };
  }

  // 모닥불 3프레임 (불꽃 흔들림)
  function campfire() {
    const frames = [];
    for (let f = 0; f < 3; f++) {
      const S = new Shape(18, 18);
      const st = R('#a89aa8', { sh: '#7a6a80' }), lg = BARK;
      S.limb(3, 15, 14, 11, 3, 3, lg, { sh: 1 });
      S.limb(3, 11, 14, 15, 3, 3, lg, { sh: 1, edge: lg.sh });
      for (const [x, y] of [[0, 13], [4, 15], [9, 16], [14, 14], [15, 11]]) S.ellipse(x, y, 4, 3, st, { sh: 1 });
      const fl = [[[5, 12], [7, 4 + f], [8, 8], [9, 1 + (f === 1 ? 1 : 0)], [11, 7], [12, 3 + (f === 2 ? 2 : 0)], [13, 12]]];
      S.poly(fl[0], { hi: '#fff0a0', base: '#f39a3a', sh: '#e0503a' }, { sh: 2, hi: 0, band: 1 });
      S.poly([[7, 12], [8, 7 + (f === 0 ? 1 : 0)], [9, 9], [10, 5 + f % 2], [11, 12]], { hi: '#fff7d0', base: '#ffe066', sh: '#f7b040' }, { sh: 1, hi: 0 });
      frames.push(S.build());
    }
    return { frames, pix: frames[0], ax: 9, ay: 17, foot: [1, 1], light: [9, 8, 34] };
  }

  function tent(dir) {

      const S = new Shape(42, 26);

        p.line(1, 25, 0, 25, OL);

    S.detail(p => {
      p.line(16, 1, 16, 8, '#c07e3a'); p.line(6, 16, 11, 17, '#fff0c0');
      p.line(1, 25, 0, 25, OL);

    return { pix: S.build(), ax: 9, ay: 25, foot: [2, 1] };

  // 워프 마을 통나무집: MOTHER 3 플린트 집처럼 사람 키의 약 7배.
  // 박공지붕 두 면의 앞 끝 = 앞 삼각벽 윗변(같은 선)이라 지붕과 벽 사이에 빈틈이 없고,
  // 처마 끝은 모서리 통나무 기둥 위에 걸친다. 삼각벽엔 트러스와 다락 창, 아래엔 두 층 높이 통나무 벽 · 기둥 위 앞마루 · 통나무 계단 · 옆 장작 헛간.
  // 위에서 내려다보는 시점이라 통나무마다 햇빛 받는 윗면이 보인다: 벽 통나무의 둥근 윗면 · 계단 디딤면 · 장작더미 윗줄 · 헛간 지붕 윗면
  function hut() {
    const S = new Shape(168, 178);
    const LOG = R('#b97a48', { hi: '#dca06a', sh: '#8a5634' }), LOG2 = R('#a86c40', { hi: '#cf915f', sh: '#7a4a30' });
    const CUT = R('#d6a26a', { hi: '#ecc48c', sh: '#b07a4a' });                    // 통나무 자른 면 (나이테)
    const LOGTOP = '#cb8c56', LOG2TOP = '#bd7f4e', CHINK = '#6a4430';               // 벽 · 계단 통나무의 윗면, 통나무 사이 틈
    const SHEDROOF = R('#8e5c3a', { hi: '#aa744a', sh: '#6a4430' });
    const PILECUT = R('#bf8756', { hi: '#d6a46e', sh: '#9a6a44' });                 // 헛간 지붕 그늘 속 장작의 자른 면
    const PLANK = R('#9a6a44', { hi: '#c08858', sh: '#6e4830' }), ROOF = R('#a8693e', { hi: '#cc8c56', sh: '#7c4c2e' });
    const ROOFD = R('#8a563a', { hi: '#9c6644', sh: '#66402a' }), BOARD = R('#7a4e32', { hi: '#9c6a46', sh: '#553422' });
    const VERGE = R('#64402a', { hi: '#8a5a3a', sh: '#48291a' });
    const STONE = R('#a89aa8', { hi: '#d2c8d0', sh: '#7a6e84' }), GLASS = R('#8ad0f0', { hi: '#d0f0ff', sh: '#5aa0d0' });
    const DOOR = R('#6e4630', { hi: '#8e6446', sh: '#4c2e20' }), SHADE = R('#5a3824', { hi: '#6a442c', sh: '#4a2e20' });
    const CX = 66, EY = 98, AY = 34, DEP = 27; // 가운데 · 처마 높이 · 앞 꼭대기 · 지붕이 뒤로 보이는 깊이
    const RL = 2, RR = 130;                    // 처마 끝 (모서리 통나무 기둥 바깥선)
    const SHED_D = 14;                         // 헛간 지붕 윗면이 뒤로 보이는 깊이
    // 장작 자른 면 자리(왼쪽 위): 아래 줄부터 다섯 줄을 엇갈려 쌓는다. 맨 윗줄(PILE_TOP)은 껍질 윗면도 보인다
    const PILE = [], PILE_TOP = [];
    for (let r = 0; r < 5; r++) for (let j = r % 2 ? -1 : 0; j < 4; j++) {
      const at = [124 + j * 8 + (r % 2 ? 4 : 0), 161 - r * 7];
      PILE.push(at); if (r === 4) PILE_TOP.push(at);
    }
    const STEPS = [[48, 152, 36], [45, 160, 42], [42, 168, 48]]; // 계단 통나무 [왼쪽, 위, 폭] (위 칸부터)
    // 옆 장작 헛간: 오른쪽 벽에 붙은 외쪽 지붕. 위에서 보면 지붕 윗면이 벽을 따라 뒤로 뻗는다
    const shed = S.rect(124, 112, 38, 58, SHADE, { sh: 0, hi: 0 });
    S.poly([[120, 104 - SHED_D], [166, 113 - SHED_D], [166, 113], [120, 104]], SHEDROOF, { sh: 1, hi: 1 });
    // 장작더미: 안쪽으로 뻗은 장작을 엇갈려 쌓았다. 앞은 나이테가 보이는 자른 면, 맨 윗줄은 껍질 윗면이 헛간 안쪽으로 보인다
    for (const [x, y] of PILE_TOP) S.rect(x, y - 3, 9, 5, LOG2, { sh: 1, hi: 1, clip: shed, edge: SHADE.base });
    for (const [x, y] of PILE) { S.ellipse(x, y, 9, 8, LOG2, { sh: 1, hi: 1, clip: shed }); S.ellipse(x + 1, y + 1, 7, 6, PILECUT, { sh: 1, hi: 1, clip: shed }); }
    S.rect(158, 114, 5, 56, BOARD, { sh: 1 });
    S.poly([[120, 104], [166, 113], [166, 119], [120, 110]], PLANK, { sh: 2, hi: 1 });
    // 굴뚝: 아랫부분은 지붕에 묻힌다
    S.rect(28, 2, 14, 62, STONE, { sh: 2 });
    // 지붕 두 면 (용마루는 앞 꼭대기에서 뒤로)
    S.poly([[RL, EY], [CX, AY], [CX, AY - DEP], [RL, EY - DEP]], ROOF, { sh: 2, hi: 1 });
    S.poly([[RR, EY], [CX, AY], [CX, AY - DEP], [RR, EY - DEP]], ROOFD, { sh: 2, hi: 0 });
    // 앞 삼각벽: 지붕 앞 끝과 같은 선을 쓴다
    S.poly([[RL, EY], [CX, AY], [RR, EY]], PLANK, { sh: 2, hi: 1 });
    // 삼각벽 트러스: 대공 · 빗대 · 보 (굵은 각재)
    S.rect(CX - 2, AY + 22, 5, EY - AY - 26, BOARD, { sh: 1, hi: 1 });
    S.limb(CX, AY + 30, 22, EY - 5, 4, 4, BOARD, { sh: 1, hi: 1 }); S.limb(CX + 1, AY + 30, 110, EY - 5, 4, 4, BOARD, { sh: 1, hi: 1 });
    S.rect(34, AY + 24, 65, 4, BOARD, { sh: 1, hi: 1 });
    // 통나무 벽 (두 층 높이)
    S.rect(8, EY, 116, 47, LOG, { sh: 3, hi: 1 });
    // 창 · 문 (문은 어른 키보다 크게)
    S.rect(20, 107, 22, 20, GLASS, { sh: 1 }); S.rect(90, 107, 22, 20, GLASS, { sh: 1 });
    S.rect(54, 112, 24, 33, DOOR, { sh: 2, hi: 1 });
    // 삼각벽 밑 들보 · 모서리 통나무 끝
    S.rect(4, EY - 5, 124, 6, BOARD, { sh: 1, hi: 1 });
    // 모서리 통나무 끝: 앞으로 튀어나온 옆벽 통나무의 껍질 테두리와 자른 면
    for (let i = 0; i < 8; i++) for (const x of [1, 118]) {
      S.ellipse(x, EY + 1 + i * 6, 13, 7, LOG2, { sh: 1, edge: LOG2.sh });
      S.ellipse(x + 2, EY + 2 + i * 6, 9, 5, CUT, { sh: 1, hi: 1 });
    }
    // 박공 끝판 (지붕 앞 끝을 덮는 두꺼운 거꾸로 된 V) · 꼭대기 장식
    S.limb(RL - 1, EY + 3, CX, AY - 3, 7, 7, VERGE, { sh: 2, hi: 1 }); S.limb(RR + 1, EY + 3, CX, AY - 3, 7, 7, VERGE, { sh: 2, hi: 1 });
    S.rect(CX - 2, AY - 9, 5, 7, VERGE, { sh: 1, hi: 1 });
    // 앞마루 · 기둥 · 모서리 난간
    S.rect(0, 144, 132, 8, PLANK, { sh: 1, hi: 1 });
    S.rect(0, 152, 132, 4, BOARD, { sh: 1, hi: 0 });
    for (const x of [4, 34, 93, 123]) S.rect(x, 156, 5, 13, BOARD, { sh: 1 });
    S.rect(0, 124, 4, 28, BOARD, { sh: 1 }); S.rect(128, 124, 4, 28, BOARD, { sh: 1 });
    S.rect(0, 124, 16, 3, PLANK, { sh: 1 }); S.rect(116, 124, 16, 3, PLANK, { sh: 1 });
    S.rect(0, 133, 16, 2, PLANK, { sh: 0 }); S.rect(116, 133, 16, 2, PLANK, { sh: 0 });
    // 통나무 계단 (가운데, 아래로 넓어짐): 몸통 · 양끝의 둥근 자른 면. 디딤면(윗면)은 아래 detail에서
    for (const [x0, y0, w] of STEPS) {
      S.rect(x0 + 2, y0, w - 4, 8, LOG2, { sh: 1, hi: 0 });
      S.ellipse(x0, y0, 5, 8, CUT, { sh: 1, hi: 1, edge: LOG2.sh }); S.ellipse(x0 + w - 5, y0, 5, 8, CUT, { sh: 1, hi: 1, edge: LOG2.sh });
    }
    S.detail(p => {
      const is = (x, y, rp) => { const c = p.get(x, y); return c === col.c32(rp.base) || c === col.c32(rp.hi) || c === col.c32(rp.sh); };
      const onRoof = (x, y) => is(x, y, ROOF) || is(x, y, ROOFD);
      // 지붕 널: 앞 끝과 나란한 줄 (처마→용마루 방향 널) + 엇갈린 이음매
      for (let d = 5; d < DEP; d += 5) {
        for (let x = RL; x <= RR; x++) {
          const t = x <= CX ? (x - RL) / (CX - RL) : (RR - x) / (RR - CX), y = Math.round(EY - d - t * (EY - AY));
          if (onRoof(x, y)) p.px(x, y, x <= CX ? ROOF.sh : ROOFD.sh);
        }
        for (let x = RL + 6 + (d % 10 ? 0 : 5); x < RR - 4; x += 11) {
          if (Math.abs(x - CX) < 3) continue;
          const t = x <= CX ? (x - RL) / (CX - RL) : (RR - x) / (RR - CX), y = Math.round(EY - d - t * (EY - AY));
          for (let k = 1; k <= 3; k++) if (onRoof(x, y + k)) p.px(x, y + k, x <= CX ? ROOF.sh : ROOFD.sh);
        }
      }
      p.line(CX, AY - DEP + 1, CX, AY - 8, ROOF.hi);
      // 굴뚝 머리 · 돌 이음
      p.rect(26, 1, 18, 4, STONE.sh); p.rect(27, 1, 16, 1, STONE.hi);
      for (let y = 9; y < 62; y += 6) { for (let x = 29; x <= 40; x++) if (is(x, y, STONE)) p.px(x, y, STONE.sh); const jx = 33 + (y % 12 === 9 ? 0 : 4); if (is(jx, y + 3, STONE)) p.px(jx, y + 3, STONE.sh); }
      // 삼각벽: 세로 널 · 트러스(대공 · 빗대 · 보) · 다락 창
      for (let x = 6; x < 128; x += 5) for (let y = AY + 4; y < EY - 5; y++) if (is(x, y, PLANK)) p.px(x, y, PLANK.sh);
      p.rect(59, AY + 7, 14, 14, BOARD.sh); p.rect(60, AY + 8, 12, 12, GLASS.base);
      p.line(CX, AY + 8, CX, AY + 19, BOARD.base); p.line(60, AY + 13, 71, AY + 13, BOARD.base);
      p.px(61, AY + 9, GLASS.hi); p.px(62, AY + 9, GLASS.hi); p.px(61, AY + 10, GLASS.hi);
      for (const x of [34, 98]) { p.px(x + 1, AY + 25, '#c8a070'); }
      // 통나무 벽: 한 줄(6px)마다 통나무 사이 틈 · 햇빛 받는 둥근 윗면 두 줄 · 옆면 · 그늘진 밑면. 들보 밑 첫 줄은 그늘. 껍질 결 · 옹이
      for (let x = 8; x < 124; x++) if (is(x, EY + 1, LOG)) p.px(x, EY + 1, LOG.sh);
      for (let y0 = EY + 5, n = 0; y0 < 145; y0 += 6, n++) for (let x = 8; x < 124; x++) {
        const px = (y, c) => { if (is(x, y, LOG)) p.px(x, y, c); };
        px(y0 - 1, LOG.sh); px(y0, CHINK); px(y0 + 1, LOG.hi); px(y0 + 2, LOGTOP);
        if (D.rand.hash(x >> 2, n, 7) < 0.22 && (x & 3) !== 3) px(y0 + 4, LOG.sh);
      }
      for (const [x, y] of [[13, 118], [46, 106], [84, 137], [116, 112], [31, 136], [103, 131], [50, 143], [12, 142]]) {
        if (!is(x, y, LOG)) continue;
        p.px(x, y, CHINK); p.px(x + 1, y, LOG.sh); p.px(x - 1, y, LOG.sh); p.px(x, y - 1, LOG.hi);
      }
      // 모서리 통나무 자른 면: 나이테와 한가운데 심
      for (let i = 0; i < 8; i++) for (const cx of [7, 124]) {
        const cy = EY + 4 + i * 6;
        p.px(cx - 1, cy, CUT.sh); p.px(cx + 1, cy, CUT.sh); p.px(cx, cy, '#8a5a3c'); p.px(cx - 3, cy - 1, CUT.hi);
      }
      // 창틀 · 창살 · 창턱 · 햇빛 반사
      for (const x0 of [20, 90]) {
        p.rect(x0 - 1, 106, 24, 1, BOARD.base); p.rect(x0 - 2, 127, 26, 2, BOARD.sh);
        p.line(x0 + 10, 107, x0 + 10, 126, BOARD.base); p.line(x0 + 11, 107, x0 + 11, 126, BOARD.sh); p.line(x0, 116, x0 + 21, 116, BOARD.base);
        p.px(x0 + 2, 109, GLASS.hi); p.px(x0 + 3, 109, GLASS.hi); p.px(x0 + 2, 110, GLASS.hi); p.px(x0 + 14, 119, GLASS.hi);
      }
      // 문: 문틀 · 널 · 작은 창 · 손잡이 · 문 앞 그늘
      p.line(53, 111, 78, 111, BOARD.sh); p.line(53, 111, 53, 144, BOARD.sh); p.line(78, 111, 78, 144, BOARD.sh);
      p.line(60, 126, 60, 144, DOOR.sh); p.line(66, 126, 66, 144, DOOR.sh); p.line(72, 126, 72, 144, DOOR.sh);
      p.rect(58, 116, 16, 7, BOARD.sh); p.rect(59, 117, 14, 5, GLASS.base); p.line(CX, 117, CX, 121, DOOR.sh); p.px(60, 118, GLASS.hi);
      p.px(74, 133, '#f3c14c'); p.px(74, 134, '#c8962e');
      // 앞마루 널 (앞뒤로 놓인 판) · 등불
      for (let x = 6; x < 132; x += 6) p.line(x, 145, x, 151, PLANK.sh);
      p.line(0, 144, 131, 144, PLANK.hi);
      p.rect(47, 121, 3, 4, '#ffe066'); p.px(48, 120, BOARD.sh); p.px(48, 125, BOARD.sh);
      // 계단 통나무: 뒤쪽 틈 그늘 · 햇빛 받는 디딤면(윗면) 세 줄 · 둥근 앞 모서리 · 앞면 결. 양끝 자른 면엔 나이테
      for (const [x0, y0, w] of STEPS) {
        for (let x = x0 + 2; x < x0 + w - 2; x++) {
          const px = (y, c) => { if (is(x, y, LOG2)) p.px(x, y, c); };
          px(y0, CHINK); px(y0 + 1, LOG2.hi); px(y0 + 2, LOG2TOP); px(y0 + 3, LOG2TOP); px(y0 + 4, LOG2.hi);
          if (D.rand.hash(x >> 2, y0, 9) < 0.3 && (x & 3) < 2) px(y0 + 6, LOG2.sh);
        }
        for (const cx of [x0 + 2, x0 + w - 3]) { p.px(cx, y0 + 3, CUT.sh); p.px(cx, y0 + 4, '#8a5a3c'); p.px(cx, y0 + 5, CUT.sh); }
      }
      // 헛간 지붕 윗면: 앞 끝과 나란한 널 줄
      for (let d = 4; d < SHED_D; d += 4) for (let x = 121; x < 166; x++) {
        const y = Math.round(104 - d + (x - 120) * 9 / 46);
        if (is(x, y, SHEDROOF)) p.px(x, y, SHEDROOF.sh);
      }
      // 장작: 윗줄 껍질 윗면 (헛간 안쪽 끝은 어둡고, 가운데가 볼록하게 밝다) · 자른 면 나이테와 심.
      // 왼쪽 끝은 모서리 통나무 기둥(x ≤ RR)에 가려지니 그 오른쪽만 칠한다 (기둥에 장작 점이 찍히지 않게)
      const shedPx = (x, y, c) => { if (x > RR) p.px(x, y, c); };
      for (const [x, y] of PILE_TOP) for (let xx = x; xx < x + 9; xx++) {
        const px = (yy, c) => { if (is(xx, yy, LOG2)) shedPx(xx, yy, c); };
        const side = xx === x || xx === x + 8, ridge = xx === x + 3 || xx === x + 4;
        px(y - 3, SHADE.hi); px(y - 2, side ? LOG2.sh : ridge ? LOG2.hi : LOG2TOP); px(y - 1, side ? LOG2.sh : ridge ? LOG2.hi : LOG2.base);
      }
      for (const [x, y] of PILE) {
        const cx = x + 4, cy = y + 4;
        if (cx > 157) continue;
        shedPx(cx - 1, cy, PILECUT.sh); shedPx(cx + 1, cy, PILECUT.sh); shedPx(cx, cy, '#7a4e34'); shedPx(cx - 2, cy - 2, PILECUT.hi);
      }
    });
    // sortUp: 앞뒤 가림 선 = 벽 밑동(앞마루 안쪽 끝), 기준점에서 위로 31px. 계단 · 앞마루에 선 사람이 집 앞에 그려진다
    // door: [문 반폭, 앞마루 앞 끝(기준점에서 위로 px)] — 앞마루에서 문 쪽으로 걸으면 들어간다 (play.js)
    return { pix: S.build(), ax: CX, ay: 176, foot: [1, 1], sortUp: 176 - 145, door: [12, 176 - 152] };
  }

  // 작업대: 뒷다리가 그대로 올라간 두 기둥(머리에 나이테) 사이에 널 공구판을 세워 톱(톱니 · 붉은 손잡이)과 망치를 걸고, 오른쪽 기둥엔 끈 뭉치.
  // 햇빛 받는 두꺼운 상판 위엔 만들던 돌창 · 부싯돌 조각 · 대팻밥 · 뼈, 다리 사이 선반엔 재료로 쟁여 둔 통나무와 돌.
  // 탁자 · 의자와 달리 키 큰 공구판과 걸어 둔 공구로 한눈에 작업대로 읽힌다. 옆모습은 긴 상판이 뒤로 뻗어 2칸, 뒷모습은 공구판 뒷면
  function workbench(dir) {
    const TOP = R('#dcaa74', { hi: '#f0c894', sh: '#b88450' }), FACE = R('#b0764a', { hi: '#d49a66', sh: '#7e5234' });
    const BOARD = R('#9a6a44', { hi: '#c08858', sh: '#6e4830' }), CUT = R('#e8c08a', { hi: '#f7dcae', sh: '#c89a62' });
    const METAL = R('#b0a8bc', { hi: '#e6e0ee', sh: '#6e6680' }), GRIP = R('#c0643c', { hi: '#e08a5a', sh: '#8a4028' });
    const SHAFT = R('#b07a48', { hi: '#dca06a', sh: '#7a4e30' }), HEAD = R('#9aa0b8', { hi: '#d6dcee', sh: '#666c86' });
    const ROPE = R('#d0a860', { hi: '#ecd08a', sh: '#a07a40' }), STONE = R('#b4a6b0', { hi: '#dcd0d4', sh: '#83748a' });
    const BONE = R('#ece2c8', { hi: '#fffaf0', sh: '#bcac8a' });
    const E = '#4a3024', CURL = '#fff0cc'; // 공구 · 물건 둘레 선, 대팻밥
    const is = (p, x, y, rp) => { const c = p.get(x, y); return c === col.c32(rp.base) || c === col.c32(rp.hi) || c === col.c32(rp.sh); };
    const endGrain = (p, x, y, w) => { p.rect(x, y, w, 1, CUT.base); p.px(x + 1, y, CUT.hi); if (w > 3) p.px(x + 2, y, CUT.sh); }; // 기둥 머리 (위에서 본 자른 면)
    const logEnd = (p, x) => { p.px(x + 1, 22, CUT.hi); p.px(x + 2, 23, CUT.sh); p.px(x + 3, 23, CUT.sh); p.px(x + 2, 24, CUT.sh); p.px(x + 3, 24, '#a8703e'); }; // 나이테와 심
    // 선반의 통나무(자른 면이 앞) 둘 · 돌. 윗부분은 상판 앞면에 가린다
    const shelf = (S, logs, sx) => {
      S.rect(6, 26, 20, 2, BOARD, { sh: 1, hi: 1 });
      logs.forEach((x, i) => { S.ellipse(x, 21, 6, 6, BARK, { sh: 0, hi: 0, edge: i ? E : null }); S.ellipse(x + 1, 22, 4, 4, CUT, { flat: true }); });
      S.ellipse(sx, 22, 6, 4, STONE, { sh: 1, hi: 1, edge: E });
    };
    if (dir === 'left') {
      // 옆모습(앞이 왼쪽): 오른쪽 가장자리의 공구판은 모서리만 보이고 톱 손잡이 · 망치 머리가 옆으로 삐죽, 가까운 기둥 앞에 끈 뭉치.
      // 상판 위엔 뒤로 뻗게 놓인 돌창과 뼈, 남쪽 끝면은 두꺼운 널의 자른 면, 선반엔 옆으로 누운 통나무
      const S = new Shape(18, 37);
      S.rect(15, 1, 3, 12, BARK, { sh: 1, hi: 1 });
      S.rect(15, 3, 2, 11, BOARD, { sh: 0, hi: 1 });
      S.rect(1, 12, 14, 12, TOP, { sh: 0, hi: 0 });
      S.rect(1, 24, 14, 4, FACE, { sh: 1, hi: 0 });
      S.rect(12, 5, 3, 4, GRIP, { sh: 1, hi: 1, edge: E });
      S.rect(12, 10, 3, 2, METAL, { sh: 1, hi: 1, edge: E });
      S.rect(5, 13, 2, 7, SHAFT, { sh: 1, hi: 1, band: 0, edge: E });
      S.poly([[4, 20], [6, 24], [8, 20]], HEAD, { sh: 1, hi: 1, edge: E });
      S.poly([[9, 17], [12, 17], [12, 18], [11, 18], [11, 21], [12, 21], [12, 22], [9, 22], [9, 21], [10, 21], [10, 18], [9, 18]], BONE, { sh: 1, hi: 1, band: 0, edge: E });
      S.rect(5, 28, 7, 4, BARK, { sh: 1, hi: 1, band: 0 });
      S.ellipse(4, 28, 3, 4, CUT, { flat: true });
      S.ellipse(11, 29, 4, 3, STONE, { sh: 1, hi: 1, edge: E });
      S.rect(4, 32, 11, 2, BOARD, { sh: 1, hi: 1 });
      S.rect(1, 28, 3, 9, BARK, { sh: 1, hi: 1 });
      S.rect(15, 13, 3, 24, BARK, { sh: 1, hi: 1, edge: E });
      S.rect(13, 14, 2, 7, ROPE, { sh: 1, hi: 1, edge: E });
      S.detail(p => {
        endGrain(p, 15, 1, 3); endGrain(p, 15, 13, 3);
        p.line(1, 12, 14, 12, TOP.sh);
        for (let x = 1; x < 15; x++) if (p.get(x, 23) === col.c32(TOP.base)) p.px(x, 23, TOP.hi);
        for (const [x, y] of [[2, 13], [3, 14], [2, 15], [8, 15], [3, 21]]) if (is(p, x, y, TOP)) p.px(x, y, CURL);
        for (const [x, y] of [[8, 22], [3, 19], [9, 23]]) if (is(p, x, y, TOP)) p.px(x, y, HEAD.sh);
        for (const x of [5, 10]) for (let y = 24; y < 27; y++) p.px(x, y, FACE.sh);
        p.px(4, 29, '#a8703e');
      });
      return { pix: S.build(), ax: 9, ay: 36, foot: [1, 2] };
    }
    if (dir === 'up') {
      // 뒷모습: 가까워진 기둥이 땅부터 서고, 공구판 뒷면엔 가로 띠장 두 줄과 못. 공구는 반대편이라 안 보이고
      // 앞모습 오른쪽 기둥에 건 끈 뭉치가 (뒤에선 왼쪽) 기둥 옆으로 조금 비친다. 선반은 좌우가 바뀐다
      const S = new Shape(32, 31);
      S.ellipse(0, 10, 6, 7, ROPE, { sh: 1, hi: 1 });
      S.rect(6, 9, 20, 9, BOARD, { sh: 1, hi: 1 });
      S.rect(6, 10, 20, 2, BARK, { sh: 1, hi: 1, band: 0, edge: E }); S.rect(6, 15, 20, 2, BARK, { sh: 1, hi: 1, band: 0, edge: E });
      shelf(S, [20, 14], 7);
      S.rect(0, 18, 32, 4, FACE, { sh: 1, hi: 0 });
      S.rect(2, 7, 4, 24, BARK, { sh: 1, hi: 1, edge: E }); S.rect(26, 7, 4, 24, BARK, { sh: 1, hi: 1, edge: E });
      S.detail(p => {
        for (const x of [2, 26]) endGrain(p, x, 7, 4);
        for (const x of [10, 15, 20]) for (const y of [9, 12, 13, 14, 17]) if (p.get(x, y) === col.c32(BOARD.base)) p.px(x, y, BOARD.sh);
        for (const x of [8, 13, 18, 23]) { p.px(x, 11, E); p.px(x, 16, E); }
        p.line(0, 18, 31, 18, FACE.hi);
        for (const [x, y] of [[9, 20], [10, 20], [20, 19], [21, 19], [22, 19]]) p.px(x, y, FACE.sh);
        logEnd(p, 20); logEnd(p, 14);
      });
      return { pix: S.build(), ax: 8, ay: 30, foot: [2, 1] };
    }
    const S = new Shape(32, 31);
    S.rect(2, 1, 4, 23, BARK, { sh: 1, hi: 1 }); S.rect(26, 1, 4, 23, BARK, { sh: 1, hi: 1 });
    S.rect(6, 3, 20, 9, BOARD, { sh: 0, hi: 0 });
    // 걸어 둔 공구: 톱(날 끝은 왼쪽, 톱니는 아래로 삐죽삐죽) · 망치(머리가 위) · 오른쪽 기둥의 끈 뭉치와 늘어진 끝
    S.poly([[7, 5], [16, 4], [16, 8], [7, 7]], METAL, { sh: 0, hi: 1, edge: E });
    for (let x = 7; x < 16; x += 2) S.rect(x, x < 11 ? 7 : 8, 1, 1, METAL, { sh: 0, hi: 0, edge: E });
    S.rect(16, 3, 4, 6, GRIP, { sh: 1, hi: 1, edge: E });
    S.rect(22, 7, 2, 5, SHAFT, { sh: 1, hi: 0, band: 0, edge: E });
    S.rect(21, 4, 5, 3, METAL, { sh: 1, hi: 1, edge: E });
    S.ellipse(26, 4, 6, 7, ROPE, { sh: 1, hi: 1, edge: E });
    S.rect(28, 10, 1, 4, ROPE, { sh: 0, hi: 0, edge: E });
    shelf(S, [7, 13], 19);
    S.rect(2, 22, 4, 9, BARK, { sh: 1, hi: 1 }); S.rect(26, 22, 4, 9, BARK, { sh: 1, hi: 1 });
    // 상판: 햇빛 받는 윗면 · 두꺼운 앞면
    S.rect(0, 12, 32, 6, TOP, { sh: 0, hi: 0 });
    S.rect(0, 18, 32, 4, FACE, { sh: 1, hi: 0 });
    // 상판 위: 만들던 돌창(자루 · 끈 감개 · 돌날) · 가로로 누운 뼈
    S.rect(3, 14, 12, 2, SHAFT, { sh: 1, hi: 1, band: 0, edge: E });
    S.rect(15, 13, 2, 4, ROPE, { sh: 0, hi: 1, edge: E });
    S.poly([[17, 12], [22, 15], [17, 18]], HEAD, { sh: 1, hi: 1, edge: E });
    S.poly([[23, 13], [25, 13], [25, 14], [29, 14], [29, 13], [31, 13], [31, 17], [29, 17], [29, 16], [25, 16], [25, 17], [23, 17]], BONE, { sh: 1, hi: 1, band: 0, edge: E });
    S.detail(p => {
      // 기둥 머리 나이테 · 공구판 널 이음과 윗모서리 볕 · 톱 손잡이 구멍 · 끈 뭉치 가운데와 감은 결
      for (const x of [2, 26]) endGrain(p, x, 1, 4);
      for (const x of [11, 16, 21]) for (let y = 4; y < 12; y++) if (p.get(x, y) === col.c32(BOARD.base)) p.px(x, y, BOARD.sh);
      p.line(6, 3, 25, 3, BOARD.hi);
      p.rect(17, 5, 2, 2, E);
      p.ellipse(28, 6, 2, 3, BARK.sh); p.px(27, 5, ROPE.sh); p.px(30, 8, ROPE.sh);
      // 상판: 공구판 밑 그늘 · 둥근 앞 모서리 볕 · 대팻밥 · 부싯돌 조각 · 앞면 결 · 통나무 나이테
      p.line(0, 12, 31, 12, TOP.sh);
      for (let x = 0; x < 32; x++) if (p.get(x, 17) === col.c32(TOP.base)) p.px(x, 17, TOP.hi);
      for (const [x, y] of [[1, 14], [2, 13], [1, 16], [21, 17], [27, 17]]) if (is(p, x, y, TOP)) p.px(x, y, CURL);
      for (const [x, y] of [[21, 13], [23, 17], [20, 16]]) if (is(p, x, y, TOP)) p.px(x, y, HEAD.sh);
      for (const [x, y] of [[9, 19], [10, 19], [16, 20], [17, 20], [18, 20]]) p.px(x, y, FACE.sh);
      logEnd(p, 7); logEnd(p, 13);
    });
    return { pix: S.build(), ax: 8, ay: 30, foot: [2, 1] }; // 두 칸(tx, tx+1) 가운데
  }

  // 렉스 둥지. 알을 가져가면 빈 둥지(nestEmpty)가 된다 — 크기·기준점이 같아 제자리에서 바뀐다
  function nest(empty) {
    const S = new Shape(26, 14);
    const tw = R('#b88a52', { hi: '#d8b07a', sh: '#8a6038' });
    const eg = R('#f4ecd6', { hi: '#fffaf0', sh: '#d8cca8' });
    if (empty) {
      // 뒤쪽 테두리를 높이고 앞 테두리를 낮춰 움푹 팬 안쪽이 보이게
      S.ellipse(0, 3, 26, 11, tw, { sh: 2 });
      S.ellipse(3, 5, 20, 6, R('#6e4a30'), { sh: 0, hi: 0, edge: tw.sh });
      S.ellipse(1, 9, 24, 5, tw, { sh: 2, edge: tw.sh });
    } else {
      S.ellipse(0, 5, 26, 9, tw, { sh: 2 });
      S.ellipse(5, 1, 7, 9, eg, { sh: 2, spot: [6, 2, 2, 2] });
      S.ellipse(11, 0, 7, 10, eg, { sh: 2, spot: [12, 1, 2, 2], edge: col.darken(eg.sh, 0.2) });
      S.ellipse(16, 2, 6, 8, eg, { sh: 2, spot: [17, 3, 2, 2], edge: col.darken(eg.sh, 0.2) });
      S.ellipse(1, 8, 24, 6, tw, { sh: 2, edge: tw.sh });
    }
    S.detail(p => {
      // 빈 둥지엔 알껍데기 조각만 남는다
      if (empty) { p.line(8, 7, 9, 7, eg.base); p.px(9, 6, eg.hi); p.px(10, 7, eg.sh); p.line(15, 7, 16, 7, eg.base); p.px(16, 6, eg.hi); p.px(15, 6, '#8dc55e'); }
      else for (const [x, y] of [[7, 4], [9, 7], [14, 3], [13, 6], [18, 5]]) p.px(x, y, '#8dc55e');
      for (let x = 3; x < 24; x += 3) p.line(x, 10, x + 2, 12, tw.sh);
    });
    return { pix: S.build(), ax: 13, ay: 13, foot: [2, 1] };
  }

  function sign(dir) {
    const wd = R('#c48a58', { hi: '#e6b884', sh: '#96623e' });
    if (dir === 'left') {
      const S = new Shape(8, 18);
      S.rect(3, 8, 2, 9, wd, { sh: 1, hi: 0 });
      S.rect(2, 2, 4, 7, wd, { sh: 1 });
      S.detail(p => p.line(3, 3, 3, 7, wd.hi));
      return { pix: S.build(), ax: 4, ay: 17, foot: [1, 1] };
    }
    const S = new Shape(16, 18);
    S.rect(7, 8, 2, 9, wd, { sh: 1, hi: 0 });
    // 뒷모습은 화살표가 반대로 보이고 글씨 대신 널빤지 이음과 못
    S.poly(dir === 'up' ? [[4, 2], [15, 2], [15, 8], [4, 8], [1, 5]] : [[1, 2], [12, 2], [15, 5], [12, 8], [1, 8]], wd, { sh: 1 });
    S.detail(p => {
      if (dir === 'up') { p.line(5, 5, 14, 5, wd.sh); p.px(6, 3, '#6a4430'); p.px(13, 3, '#6a4430'); p.px(6, 7, '#6a4430'); p.px(13, 7, '#6a4430'); }
      else { p.line(3, 4, 10, 4, wd.sh); p.line(3, 6, 8, 6, wd.sh); }
    });
    return { pix: S.build(), ax: 8, ay: 17, foot: [1, 1] };
  }

  /* 실내 가구 */
  function bed(dir) {
    const wd = R('#a86a44', { sh: '#7a4a32' }), bl = R('#5a8ad0', { hi: '#8ab4ec', sh: '#3f64a8' });
    if (dir === 'left') {
      // 가로로 놓인 침대: 머리판이 왼쪽
      const S = new Shape(32, 18);
      S.rect(0, 0, 5, 16, wd, { sh: 1 });
      S.rect(3, 4, 28, 10, R('#f4eef8', { sh: '#cfc6dc' }), { sh: 1 });
      S.rect(3, 13, 28, 4, wd, { sh: 1 });
      S.rect(5, 5, 7, 7, R('#fbf8ff', { sh: '#d8d0e4' }), { sh: 1 });
      S.rect(13, 3, 18, 11, bl, { sh: 2, hi: 1, edge: col.darken(bl.sh, 0.2) });
      S.detail(p => { for (let x = 16; x < 30; x += 3) p.line(x, 4, x, 12, bl.hi); p.line(13, 3, 13, 13, bl.hi); });
      return { pix: S.build(), ax: 16, ay: 16, foot: [2, 1] };
    }
    const S = new Shape(18, 30);
    S.rect(1, 0, 16, 7, wd, { sh: 1 });
    S.rect(1, 5, 16, 24, R('#f4eef8', { sh: '#cfc6dc' }), { sh: 1 });
    S.rect(3, 7, 12, 6, R('#fbf8ff', { sh: '#d8d0e4' }), { sh: 1 });
    S.rect(1, 14, 16, 15, bl, { sh: 2, hi: 1, edge: col.darken(bl.sh, 0.2) });
    S.detail(p => { for (let y = 17; y < 28; y += 3) p.line(2, y, 15, y, bl.hi); p.line(1, 14, 16, 14, bl.hi); });
    return { pix: S.build(), ax: 9, ay: 29, foot: [1, 2] };
  }
  function table() {
    const S = new Shape(28, 20);
    const wd = R('#b87a4c', { hi: '#dca070', sh: '#8a5436' });
    S.rect(3, 10, 3, 9, wd, { sh: 1 }); S.rect(22, 10, 3, 9, wd, { sh: 1 });
    S.rect(1, 3, 26, 8, wd, { sh: 2, hi: 1 });
    S.detail(p => {
      p.rect(5, 1, 5, 4, '#f4eef8'); p.px(5, 1, '#fbf8ff'); p.rect(6, 2, 3, 1, '#e98a3b');
      p.ellipse(15, 2, 8, 4, '#f4eef8'); p.ellipse(16, 2, 6, 2, '#d45a3a');
    });
    return { pix: S.build(), ax: 14, ay: 19, foot: [2, 1] };
  }
  function shelf() {
    const S = new Shape(18, 28);
    const wd = R('#a86a44', { hi: '#cf915f', sh: '#7a4a32' });
    S.rect(1, 1, 16, 26, wd, { sh: 2 });
    S.detail(p => {
      for (const y of [9, 17]) { p.line(2, y, 15, y, wd.sh); p.line(2, y + 1, 15, y + 1, wd.hi); }
      const b = ['#d45a3a', '#3ea6c9', '#f3c14c', '#7ad07a', '#9a7ac2'];
      for (let i = 0; i < 5; i++) p.rect(3 + i * 2 + (i > 2 ? 1 : 0), 3 + (i % 2), 2, 6 - (i % 2), b[i]);
      p.ellipse(4, 12, 5, 5, '#e8e0d0'); p.ellipse(10, 13, 5, 4, '#c8a070');
      p.rect(3, 20, 12, 5, '#8a6a4a'); p.line(3, 22, 14, 22, '#6a4a3a');
    });
    return { pix: S.build(), ax: 9, ay: 27, foot: [1, 1] };
  }
  function windowWall() {
    const S = new Shape(18, 16);
    S.rect(1, 1, 16, 14, R('#a86a44', { sh: '#7a4a32' }), { sh: 1 });
    S.detail(p => {
      p.rect(3, 3, 12, 10, '#7ac8ee'); p.dither(3, 8, 12, 5, '#5ab0e0', 0);
      p.line(9, 3, 9, 12, '#a86a44'); p.line(3, 8, 14, 8, '#a86a44');
      p.line(4, 4, 6, 4, '#e6f7ff'); p.px(4, 5, '#e6f7ff');
    });
    return { pix: S.build(), ax: 9, ay: 15, foot: [0, 0], onWall: true };
  }
  function fireplace() {
    const frames = [];
    for (let f = 0; f < 3; f++) {
      const S = new Shape(34, 32);
      const st = R('#a89aa8', { hi: '#cfc4cc', sh: '#7a6a80' });

  function pot() {

  /* 채집물 */
  function herb() {

    S.ellipse(1, 5, 6, 6, lf, { sh: 1 }); S.ellipse(6, 4, 7, 7, lf, { sh: 1 }); S.ellipse(3, 1, 7, 6, lf, { sh: 1, edge: lf.sh });
    S.detail(p => { for (const [x, y] of [[4, 2], [9, 5], [5, 7]]) { p.px(x, y, '#fbf8ff'); p.px(x + 1, y, '#f7c0e0'); p.px(x, y + 1, '#f7c0e0'); } });
    return { pix: S.build(), ax: 7, ay: 13, foot: [1, 1] };
  }
  function branches() {
    const S = new Shape(16, 10);
    S.limb(1, 7, 14, 3, 2, 2, BARK, { sh: 1 });
    S.limb(2, 3, 13, 8, 2, 2, BARK, { sh: 1, edge: BARK.sh });
    S.limb(4, 8, 11, 6, 2, 1, R('#a8704a'), { sh: 0 });
    S.detail(p => { p.px(13, 2, LEAF_GRN.base); p.px(14, 2, LEAF_GRN.hi); });
    return { pix: S.build(), ax: 8, ay: 9, foot: [1, 1] };
  }
  function stones() {
    const S = new Shape(14, 9);
    const rr = R('#b4a6b0', { hi: '#dcd0d4', sh: '#83748a' });
    S.ellipse(1, 3, 6, 5, rr, { sh: 1 }); S.ellipse(6, 2, 6, 6, rr, { sh: 1, edge: rr.sh }); S.ellipse(4, 0, 5, 4, rr, { sh: 1, edge: rr.sh });
    return { pix: S.build(), ax: 7, ay: 8, foot: [1, 1] };
  }
  function rubble() {
    const S = new Shape(16, 8);
    const rr = R('#a89aa8', { hi: '#cfc4cc', sh: '#7a6a80' });
    S.ellipse(1, 3, 5, 4, rr, { sh: 1 }); S.ellipse(6, 4, 4, 3, rr, { sh: 1 }); S.ellipse(10, 2, 5, 5, rr, { sh: 1 });

  /* 지하철 */
  function seat() {
    const S = new Shape(48, 18);
    const fab = R('#3f6ab8', { hi: '#6a94dc', sh: '#2c4c8e' }), met = R('#b8b0c4', { sh: '#8a8096' });

  function trainWin() {
    const frames = [];
    for (let f = 0; f < 4; f++) {

      // 지나가는 불빛
      for (let k = 0; k < 3; k++) { const x = 3 + ((f * 7 + k * 9) % 24); p.rect(x, 5 + (k % 2) * 3, 3, 1, k === 1 ? '#ffe066' : '#f7f3ff'); }

      p.outline(D.PAL.outline);

  function strap() {
    const p = new D.Pix(8, 16);
    p.line(3, 0, 3, 8, '#b8b0c4'); p.ellipse(1, 8, 6, 6, '#f4eef8'); p.ellipse(2, 9, 4, 4, 0);
    p.d.fill(0, 0, 0);
    p.line(3, 0, 3, 8, '#b8b0c4');
    for (const [x, y] of [[2, 9], [4, 9], [1, 10], [5, 10], [1, 11], [5, 11], [1, 12], [5, 12], [2, 13], [4, 13], [3, 13], [3, 9]]) p.px(x, y, '#f4eef8');
    p.outline(D.PAL.outline);
    return { pix: p, ax: 4, ay: 15, foot: [0, 0] };

  function trapProp() {
    const S = new Shape(16, 10);
    S.ellipse(0, 3, 16, 7, R('#8a6a4a', { sh: '#6a4a3a' }), { sh: 1 });
    for (let i = 0; i < 5; i++) S.poly([[2 + i * 3, 6], [3 + i * 3, 0], [4 + i * 3, 6]], R('#c8a070', { sh: '#9a7a50' }), { sh: 0 });

  }
  function chest(dir) {
    const wd = R('#b07a4c', { hi: '#d49a66', sh: '#7a4a32' }), lid = R('#c48a58', { hi: '#e2ae7a', sh: '#96623e' }), iron = '#6a6280';
    if (dir === 'left') {
      // 옆모습: 둥근 뚜껑 옆선 · 쇠띠 · 들손 고리, 왼쪽 끝에 자물쇠가 살짝
      const S = new Shape(13, 16);
      S.ellipse(1, 0, 11, 10, lid, { sh: 1 });

        p.rect(5, 8, 3, 3, OL); p.px(6, 9, wd.base);
        p.px(1, 7, '#f3c14c'); p.px(1, 8, '#f3c14c');

      return { pix: S.build(), ax: 6, ay: 15, foot: [1, 1] };

    const S = new Shape(18, 16);
    S.rect(1, 5, 16, 10, wd, { sh: 2 });
    S.rect(1, 1, 16, 6, lid, { sh: 1, edge: '#7a4a32' });
    S.detail(p => {
      p.line(1, 10, 16, 10, '#96623e');
      if (dir === 'up') { p.rect(4, 5, 2, 3, iron); p.rect(12, 5, 2, 3, iron); }
      else { p.rect(7, 6, 4, 3, '#f3c14c'); p.px(8, 7, '#281a2e'); }
    });
    return { pix: S.build(), ax: 9, ay: 15, foot: [1, 1] };
  }

  const MAKERS = {
    seat, trainWin, strap, trapProp, chest,
    herb, branches, stones, rubble,
    treeAut: () => tree('aut'), treeGreen: () => tree('green'), treeFruit: () => tree('fruit'), treeDeep: () => tree('deep'),
    bare: bareTree, palm, fern, bush: () => bush(false), berry: () => bush(true),
    rock: () => rock(false), boulder: () => rock(true), stump, pole: () => pole(false), poleCut: () => pole(true), vending: d => vending('#d8484a', d), vendingB: d => vending('#3f7ad0', d),
    busStop, campfire, tent, hut, workbench, nest: () => nest(false), nestEmpty: () => nest(true), sign, bed, table, shelf, window: windowWall, fireplace, pot
  };
  // 방향이 있는 소품 (그 밖의 것은 방향을 무시하고 앞모습). 야자수는 dir 'left'면 왼쪽으로 기운 나무
  const FACING = { vending: 1, vendingB: 1, busStop: 1, workbench: 1, chest: 1, tent: 1, bed: 1, sign: 1, palm: 1 };
  const cache = {};
  function get(id, dir) {
    if (!MAKERS[id]) return null;
    let d = dir && FACING[id] ? dir : 'down';
    if (id === 'bed' && d === 'up') d = 'down';
    const key = d === 'down' ? id : id + '@' + d;
    if (cache[key]) return cache[key];
    if (d === 'right') {
      const L = get(id, 'left'), W = L.pix.w;
      // 두 칸짜리는 그림 가운데가 두 칸 사이에 오도록 기준점을 그대로 둔다
      return (cache[key] = Object.assign({}, L, {
        pix: L.pix.flip(), frames: L.frames && L.frames.map(f => f.flip()), ax: L.foot && L.foot[0] === 2 ? L.ax : W - 1 - L.ax,
        light: L.light && [W - 1 - L.light[0], L.light[1], L.light[2]]
      }));
    }
    return (cache[key] = MAKERS[id](d));
  }
  D.Props = { get, MAKERS, FACING };
})(window.D = window.D || {});

<script>
/* 듀랑고 GBA — 지역 소품: 워프 마을 · 남쪽 해안과 연못 · 북서쪽 옛 망루 터 · 렉스 둥지로 가는 죽은 숲 · 북쪽 땅 구왕국 요새
   props.js와 같은 방식(도형 + 3단 음영 + 자동 외곽선)으로 그려 D.Props에 더한다.
   여러 칸짜리는 막는 칸을 world.js가 blockTiles로 따로 적고, 여기 foot은 설치 미리보기·기본값용이다.
   두 칸짜리(가로 tx, tx+1)는 그림 가운데가 두 칸 사이에 오도록 ax = 가운데 - 8. */
'use strict';
(function (D) {
  const { Shape, Pix, col } = D;
  const P = D.PAL;
  const R = (b, o) => col.ramp(b, o);
  const OL = P.outline;

  const WOOD = R('#b0764a', { hi: '#d49a66', sh: '#7e5234' });
  const WOODD = R('#8a5a3c', { hi: '#b07a52', sh: '#64402e' });
  const PLANK = R('#c48a58', { hi: '#e6b884', sh: '#96623e' });
  const STONE = R('#b4a6b0', { hi: '#dcd0d4', sh: '#83748a' });
  const METAL = R('#a8a0b4', { hi: '#dcd6e6', sh: '#6e6680' });
  const BONE = R('#e8dcc0', { hi: '#fbf4e2', sh: '#b8a888' });
  const DEAD = R('#7a6e76', { hi: '#9c9098', sh: '#56495a' });
  const LEAF = { hi: '#9ed468', base: '#62ad4a', sh: '#3f8741' };

  /* ---------------- 울타리 ----------------
     가로 울타리는 가로대가 칸 끝까지 이어져 옆 칸과 붙고, 세로 울타리는 기둥 뒤로 위 칸 기둥까지 가로대가 보인다.
     모서리·문 기둥은 이어지는 쪽으로만 반쪽 가로대(E·W)와 위로 가는 가로대(U)를 그린다. 문 기둥(lantern)은 굵고 등불을 단다 */
  function fence(o) {
    const S = new Shape(16, 38);
    const G0 = 37; // 땅 (그림 아래 줄)
    // 위 칸 기둥까지 이어지는 가로대: 기둥 바깥 면에 박혀 기둥 왼쪽으로 비껴 보인다
    if (o.up) S.rect(4, G0 - 28, 3, 23, WOODD, { sh: 1, hi: 1, band: 0 });
    const rails = (x0, x1) => { S.rect(x0, G0 - 12, x1 - x0 + 1, 3, PLANK, { sh: 1, hi: 1, band: 0 }); S.rect(x0, G0 - 6, x1 - x0 + 1, 3, PLANK, { sh: 1, hi: 1, band: 0 }); };
    if (o.full) rails(0, 15); else { if (o.w) rails(0, 8); if (o.e) rails(7, 15); }
    if (o.lantern) {
      S.rect(5, G0 - 24, 6, 25, WOOD, { sh: 2, hi: 1 });
      S.rect(4, G0 - 26, 8, 3, WOODD, { sh: 1, hi: 1, band: 0 });
      S.rect(5, G0 - 33, 6, 7, R('#ffd89a', { hi: '#fff4d0', sh: '#e8a850' }), { sh: 1, hi: 1, band: 0, edge: OL });
      S.poly([[3, G0 - 33], [8, G0 - 36], [13, G0 - 33]], R('#6a4a3a'), { sh: 1, hi: 0 });
    } else S.rect(6, G0 - 15, 4, 16, WOOD, { sh: 1, hi: 1, band: 0 });
    S.detail(p => {
      if (o.lantern) { p.line(8, G0 - 32, 8, G0 - 27, '#e8a850'); p.px(6, G0 - 32, '#fff4d0'); p.line(6, G0 - 18, 6, G0 - 8, WOOD.sh); }
      else { p.px(7, G0 - 14, WOOD.hi); p.px(8, G0 - 3, WOOD.sh); }
    });
    return { pix: S.build(), ax: 8, ay: G0, foot: [1, 1] };
  }

  /* ---------------- 밭 ---------------- */
  function cabbage() {
    const S = new Shape(14, 12);
    const lf = R('#8ccc5a', { hi: '#c2ea8a', sh: '#4f9a42' });
    S.ellipse(0, 3, 8, 8, lf, { sh: 1 }); S.ellipse(6, 3, 8, 8, lf, { sh: 1 });
    S.ellipse(3, 0, 8, 9, R('#b4e07a', { hi: '#e2f6b0', sh: '#78b454' }), { sh: 1, edge: lf.sh });
    S.detail(p => { p.line(6, 2, 7, 6, '#78b454'); p.px(5, 3, '#e2f6b0'); p.line(1, 7, 3, 9, lf.sh); p.line(12, 7, 10, 9, lf.sh); });
    return { pix: S.build(), ax: 7, ay: 11, foot: [1, 1] };
  }
  function corn() {
    const S = new Shape(14, 28);
    const st = R('#7ab84a', { hi: '#a8dc70', sh: '#4a8a3a' });
    S.rect(6, 4, 2, 23, st, { sh: 1, hi: 0, band: 0 });
    S.limb(7, 14, 1, 8, 2, 1, st, { sh: 0 }); S.limb(7, 18, 13, 11, 2, 1, st, { sh: 0 }); S.limb(7, 22, 2, 18, 2, 1, st, { sh: 0 });
    S.limb(7, 9, 12, 3, 2, 1, st, { sh: 0 });
    S.ellipse(8, 11, 4, 8, R('#f3c14c', { hi: '#fbe492', sh: '#d6962e' }), { sh: 1, spot: [8, 12, 2, 3] });
    S.detail(p => { p.line(7, 0, 7, 4, '#e8c878'); p.px(6, 1, '#e8c878'); p.px(8, 1, '#e8c878'); p.line(9, 10, 10, 9, '#a8dc70'); });
    return { pix: S.build(), ax: 7, ay: 27, foot: [1, 1] };
  }
  // 허수아비: 자루 머리에 도로 공사용 고깔을 쓰고 체크무늬 셔츠를 입었다
  function scarecrow() {
    const S = new Shape(24, 38);
    S.rect(11, 12, 3, 26, WOODD, { sh: 1, hi: 1, band: 0 });
    S.rect(2, 17, 20, 3, WOODD, { sh: 1, hi: 1, band: 0 });
    const shirt = R('#c8503a', { hi: '#e98a6a', sh: '#96382e' });
    S.poly([[5, 16], [19, 16], [18, 30], [6, 30]], shirt, { sh: 2 });
    S.rect(1, 16, 6, 5, shirt, { sh: 1 }); S.rect(17, 16, 6, 5, shirt, { sh: 1 });
    S.ellipse(7, 6, 11, 11, R('#dcc08a', { hi: '#f0dcae', sh: '#b0905a' }), { sh: 2 });
    S.poly([[8, 8], [12, -1], [13, -1], [17, 8]], R('#f39a3a', { hi: '#ffc070', sh: '#d0702a' }), { sh: 1, hi: 1 });
    S.rect(6, 7, 13, 2, R('#f39a3a', { sh: '#d0702a' }), { sh: 1, hi: 0, band: 0 });
    S.detail(p => {
      p.line(10, 3, 15, 3, '#fbf8ff'); p.line(9, 5, 16, 5, '#fbf8ff');                 // 고깔 흰 띠
      p.px(10, 11, OL); p.px(15, 11, OL); p.line(10, 14, 15, 14, OL); p.px(11, 13, OL); p.px(14, 13, OL); // 꿰맨 얼굴
      for (let y = 17; y < 30; y += 3) p.line(6, y, 18, y, '#96382e');                    // 체크
      for (let x = 8; x < 18; x += 3) p.line(x, 17, x, 29, '#e98a6a');
      for (const [x, y] of [[1, 21], [3, 22], [22, 21], [20, 22], [9, 31], [15, 31], [12, 32]]) p.px(x, y, '#f3d77a'); // 삐져나온 짚
    });
    return { pix: S.build(), ax: 12, ay: 37, foot: [1, 1] };
  }
  // 빨랫줄: 여러 시대의 옷이 나란히 마른다 (셔츠 · 저고리 · 청바지 · 줄무늬 셔츠 · 양말)
  function laundry() {
    const S = new Shape(48, 34);
    S.rect(3, 4, 3, 30, WOODD, { sh: 1, hi: 1, band: 0 }); S.rect(42, 4, 3, 30, WOODD, { sh: 1, hi: 1, band: 0 });
    const cloth = (x, y, w, h, c, o) => S.rect(x, y, w, h, R(c), Object.assign({ sh: 1, hi: 1, band: 0 }, o));
    cloth(8, 7, 7, 11, '#f4eef8');                      // 흰 셔츠
    S.poly([[17, 8], [25, 8], [26, 14], [16, 14]], R('#f08ab8', { hi: '#f8c0d8', sh: '#c8608e' }), { sh: 1 }); // 저고리
    S.rect(19, 13, 4, 8, R('#f3c14c', { sh: '#d6962e' }), { sh: 1 });
    S.poly([[28, 9], [34, 9], [34, 25], [32, 25], [31, 14], [30, 25], [28, 25]], R('#4a6ab0', { hi: '#7a9ad8', sh: '#34508a' }), { sh: 1 }); // 청바지
    cloth(36, 8, 5, 10, '#f4eef8');                     // 줄무늬 셔츠
    S.detail(p => {
      for (let x = 5; x < 43; x++) p.px(x, 6 + Math.round(Math.sin((x - 5) / 37 * Math.PI) * 2), '#e6e0ee'); // 처진 줄
      for (const x of [9, 13, 18, 24, 29, 33, 37, 40]) p.px(x, 7 + Math.round(Math.sin((x - 5) / 37 * Math.PI) * 2), '#f3c14c'); // 빨래집게
      p.line(11, 8, 11, 17, '#cfc6dc'); p.px(10, 9, '#cfc6dc');
      p.line(21, 9, 21, 13, '#f8c0d8'); p.px(20, 15, '#e0445a'); p.px(21, 15, '#e0445a');
      for (let y = 10; y < 18; y += 2) p.line(36, y, 40, y, '#3a5aa8');
      p.line(31, 11, 31, 13, '#34508a');
    });

  }

  /* ---------------- 마당 ---------------- */
  // 게시판: 작은 지붕 · 쪽지 여러 장 · 빨간 압정 (「워프 기록」)
  function board() {
    const S = new Shape(26, 30);
    S.rect(3, 12, 3, 18, WOODD, { sh: 1, hi: 1, band: 0 }); S.rect(20, 12, 3, 18, WOODD, { sh: 1, hi: 1, band: 0 });
    S.rect(1, 6, 24, 15, PLANK, { sh: 1, hi: 1 });
    S.poly([[0, 7], [3, 1], [23, 1], [26, 7]], R('#8a563a', { hi: '#a8704a', sh: '#66402a' }), { sh: 1, hi: 1 });
    S.detail(p => {
      p.rect(3, 8, 7, 8, '#f4eef8'); p.rect(11, 9, 5, 5, '#f3d77a'); p.rect(17, 8, 6, 6, '#f8c0d8'); p.rect(12, 15, 9, 4, '#f4eef8');
      for (const [x, y, w] of [[4, 10, 5], [4, 12, 4], [4, 14, 5], [12, 11, 3], [18, 10, 4], [18, 12, 3], [13, 17, 7]]) p.line(x, y, x + w - 1, y, '#8a8096');
      p.px(6, 8, '#e0445a'); p.px(13, 9, '#e0445a'); p.px(20, 8, '#3f7ad0'); p.px(16, 15, '#e0445a');
      for (let x = 4; x < 23; x += 4) p.px(x, 3, '#66402a');
    });
    return { pix: S.build(), ax: 13, ay: 29, foot: [1, 1] };
  }
  // 우물: 돌을 둥글게 쌓고 두 기둥에 지붕, 도르래에 두레박
  function well() {
    const S = new Shape(28, 34);

    S.poly([[44, 15], [52, 22], [46, 30], [40, 26], [34, 30], [28, 24]], sail, { sh: 2, hi: 1 });
    // 뒤쪽 선실 (갑판 위)

    S.poly([[82, 15], [86, 10], [102, 10], [106, 15]], R('#8a563a', { hi: '#a8704a', sh: '#66402a' }), { sh: 1, hi: 1 });
    // 앞쪽 선체
    S.poly([[6, 20], ...top, [116, 27], [116, 56], ...bot.slice().reverse(), [8, 38]], hull, { sh: 3, hi: 1 });
    // 뚫린 뱃전과 늑골
    S.poly([[52, 38], [57, 36], [62, 38], [68, 36], [71, 40], [70, 60], [53, 60], [50, 50]], R('#2e2228'), { sh: 0, hi: 0, edge: hull.sh });
    for (let i = 0; i < 3; i++) S.limb(55 + i * 6, 37, 56 + i * 6, 59, 2, 2, R('#a07a54', { hi: '#c49a6c', sh: '#6e4e36' }), { sh: 1, hi: 1 });
    S.detail(p => {
      const H = [col.c32(hull.base), col.c32(hull.hi), col.c32(hull.sh)], inHull = (x, y) => H.includes(p.get(x, y));
      // 널판: 뱃전 윗선과 나란한 줄
      for (let k = 1; k <= 7; k++) for (let x = 8; x < 116; x++) { const y = Math.round(sheer(x)) + k * 4; if (inHull(x, y)) p.px(x, y, hull.sh); }
      // 흘수선: 용골 위 붉은 띠와 흰 줄
      for (let x = 12; x < 116; x++) { const y = Math.round(keel(x)) - 6; if (inHull(x, y)) p.px(x, y, '#e6dcc0'); for (let j = 1; j <= 3; j++) if (inHull(x, y + j)) p.px(x, y + j, j === 3 ? '#8a3a2e' : '#b0503a'); }
      // 갑판 널 · 먼 쪽 뱃전 테두리
      for (let x = 14; x < 112; x += 5) p.line(x, Math.round(sheer(x)) - 6, x + 1, Math.round(sheer(x)), deck.sh);
      for (let x = 12; x < 114; x++) p.px(x, Math.round(sheer(x)) - 7, hull.sh);

      p.rect(18, 31, 18, 5, '#e6dcc0'); for (let x = 20; x < 35; x += 3) p.line(x, 32, x + 1, 34, '#553624');       // 이름판

      p.line(36, 22, 44, 26, sail.sh); p.line(46, 19, 49, 23, sail.sh);                                             // 돛 주름
      for (const [x, y] of [[26, 52], [80, 55], [100, 52], [44, 57]]) { p.px(x, y, '#8dc55e'); p.px(x + 1, y, '#6cc04a'); } // 이끼

    for (const [x, y] of [[0, 4], [13, 3], [6, 6], [11, 6]]) S.ellipse(x, y, 4, 3, STONE, { sh: 1 });

  // 발톱 자국이 난 바위 (캐면 돌 · 부싯돌)

    S.detail(p => { for (let i = 0; i < 3; i++) p.line(4 + i * 3, 3, 6 + i * 3, 9, '#4a3e52'); });

  }

  /* ---------------- 북쪽 땅 · 구왕국 요새 ----------------
     1장 옛 망루 터를 쌓은 사람들(구왕국)이 지금도 지키는 요새. 망루 터의 돌담 · 둥근 망루와 같은 돌, 같은 모양이지만
     온전하고 벽 머리에 흉벽(톱니 모양 담)이 있으며, 깃발은 빛바래지 않은 새것이다 (같은 사자 문장).
     성벽은 한 칸짜리 조각을 이웃을 보고 골라 잇는다(울타리처럼 — world.js populateNorth): 칸마다 벽 위 통로(칸 깊이 16px를 벽 높이만큼
     올려 그림)와 앞면(32px)을 한 그림에 담고, 아래 칸이 위 칸의 앞면을 덮어 세로로 이은 벽은 통로가 이어지고 맨 아래 칸의 앞면만 보인다.
     망루 · 성문은 여러 칸짜리 한 그림이다 — 벽은 망루 가운데 칸과 성문 옆에 붙는다 */
  const KS = { // 구왕국 돌: 볕 받는 흉벽 머리는 밝고, 앞면은 조금 어둡다
    cap: '#ece3e4', capD: '#d4c8ce', walk: '#c4b6bc', walkD: '#aa9ca8', walkS: '#9a8c9e',
    face: '#b4a6b0', faceL: '#cfc3ca', faceD: '#9a8a9e', faceDD: '#83748a', seam: '#6f5f74', notch: '#4a3e54'
  };
  const MOSS = ['#8dc55e', '#6f9e4a'];
  const LION = { red: '#c8403a', redL: '#e8685a', redD: '#922c34', gold: '#f3c14c', goldL: '#fbe492', goldD: '#c8902e', dark: '#4a1e28' };
  const IRON = { base: '#5a5266', hi: '#8a8298', sh: '#3a3446' };
  // 사자 문장 (9×10): 금빛 방패에 붉은 사자 얼굴 — 옛 망루 터의 빛바랜 깃발(banner)에 희미하게 남은 것과 같은 문장
  function lionCrest(p, x, y) {
    p.tmpl([
      'ggggggggg',
      'gGGGGGGGg',
      'gGrGrGrGg',
      'gGrrrrrGg',
      'grrdrdrrg',
      'grrrnrrrg',
      'gGrrmrrGg',
      '.gGrrrGg.',
      '..gGGGg..',
      '...ggg...'], { g: LION.goldD, G: LION.gold, r: LION.red, d: LION.dark, n: LION.redD, m: LION.dark }, x, y);

  // 흉벽 무늬: x번째 픽셀이 머리(솟은 돌)인가 — 8px마다 머리 5 · 틈 3, 끝(이웃 없는 쪽)은 머리로 끝난다
  const merlonAt = (x, e, w) => (!w && x <= 6) || (!e && x >= 10) || ((x + 6) & 7) < 5;

  // 성벽 한 칸 (16×54, 기준점은 칸 바닥 가운데). k: 이어진 쪽('N' 'S' 'E' 'W'를 담은 글자열 — 망루 · 성문도 이어진 쪽이다),
  //   v: 앞면 무늬 (0 민짜 · 1 화살 구멍 · 2 이끼). 줄: 0~7 뒤 흉벽 · 6~21 벽 위 통로 · 13~21 앞 흉벽 · 22~52 앞면 · 53 땅 (외곽선)
  const WALL_H = 54;
  function castleWall(k, v) {
    const n = k.includes('N'), s = k.includes('S'), e = k.includes('E'), w = k.includes('W');
    const p = new Pix(16, WALL_H), X0 = w ? 0 : 1, X1 = e ? 15 : 14, merlon = x => merlonAt(x, e, w);
    const put = (x, y, c) => { if (x >= X0 && x <= X1) p.px(x, y, c); };
    // 1) 벽 위 통로: 엇갈려 깐 판돌 (8px마다 — 옆 칸 · 아래 칸과 이어진다). 흉벽의 그늘이 왼쪽 · 위쪽에 진다
    for (let y = 6; y < 22; y++) for (let x = X0; x <= X1; x++) {
      const r = y - 6, u = (x + ((r >> 3) & 1) * 4) & 7;
      put(x, y, (r & 7) === 7 || u === 7 ? KS.walkD : KS.walk);
    }
    if (!w) for (let y = 6; y < 22; y++) put(4, y, KS.walkS);
    if (!n) for (let x = X0; x <= X1; x++) { put(x, 8, KS.walkS); put(x, 9, (x & 1) ? KS.walkS : KS.walkD); }
    // 2) 뒤 흉벽 (위가 비면): 머리는 1~2줄 볕 · 3~7줄 앞면, 틈은 1~3줄이 어두운 홈 · 4~5줄 볕 · 6~7줄 앞면
    if (!n) for (let x = X0; x <= X1; x++) {
      const m = merlon(x);
      for (let y = m ? 1 : 4; y <= 7; y++) put(x, y, y <= (m ? 2 : 5) ? KS.cap : KS.face);
      if (!m) for (let y = 1; y <= 3; y++) put(x, y, KS.notch);
    }
    // 3) 옆 흉벽 (옆이 비면, 3px 폭): 8px마다 머리 윗면 4줄 · 머리 앞면 3줄 · 틈 1줄 (아래 칸과 이어지는 무늬)
    const side = xs => {
      for (let y = 0; y < 22; y++) {
        const ph = y & 7, c = ph < 4 ? KS.cap : ph < 7 ? KS.face : KS.notch;
        for (const x of xs) p.px(x, y, c);
      }
    };
    if (!w) side([1, 2, 3]);
    if (!e) side([12, 13, 14]);
    if (!e) for (let y = 6; y < 22; y++) put(11, y, KS.walkD);
    // 4) 앞 흉벽 (아래가 비면): 앞면과 한 면으로 솟는다 — 머리는 13~14줄 볕 · 15~21줄 앞면, 틈은 12~16줄이 어두운 홈 · 17~18줄 볕 · 19~21줄 앞면
    if (!s) for (let x = X0; x <= X1; x++) {
      const m = merlon(x);
      p.px(x, 12, KS.notch);
      for (let y = 13; y <= 21; y++) {
        let c = m ? (y <= 14 ? KS.cap : KS.face) : (y <= 16 ? KS.notch : y <= 18 ? KS.capD : KS.face);
        if (m && y > 14 && (x === X0 || !merlon(x - 1))) c = KS.faceL;      // 머리 왼쪽 모서리는 볕
        if (m && y > 14 && (x === X1 || !merlon(x + 1))) c = KS.faceD;      // 오른쪽은 그늘
        p.px(x, y, c);
      }
    }
    // 5) 앞면: 5px 돌 네 켜(켜 사이 줄눈) · 아래 받침돌. 돌마다 윗줄 · 왼쪽은 볕, 오른쪽은 그늘
    const JOINTS = [[4, 13], [0, 8], [5, 12], [1, 9]];
    const Y1 = s ? WALL_H - 1 : WALL_H - 2;
    for (let y = 22; y <= Y1; y++) for (let x = X0; x <= X1; x++) {
      const r = y - 22, course = Math.floor(r / 6), rr = r % 6;
      let c;
      if (course >= 4) { // 받침돌: 튀어나온 윗줄 · 어두운 몸 · 8px마다 줄눈
        c = r === 24 ? KS.faceL : ((x + 3) & 7) === 0 ? KS.seam : r >= 29 ? KS.faceDD : KS.faceD;
      } else if (rr === 5) c = KS.seam;
      else {
        const J = JOINTS[course];
        if (J.includes(x)) c = KS.seam;
        else if (rr === 0 || J.includes(x - 1) || (x === X0 && !w)) c = KS.faceL;
        else if (J.includes(x + 1) || (x === X1 && !e)) c = KS.faceD;
        else c = (course === 1 && x > 8) || (course === 3 && x < 5) ? ((x + y) & 1 ? KS.face : KS.faceD) : KS.face;
      }

    }
    if (!s && v === 1) { // 화살 구멍: 세로 틈에 가로 틈이 엇갈린 십자
      for (let y = 29; y <= 38; y++) { p.px(7, y, '#2a2436'); p.px(8, y, '#3a2e40'); }
      for (let x = 5; x <= 10; x++) p.px(x, 32, x === 5 || x === 10 ? KS.faceD : '#2a2436');
      p.px(7, 39, KS.faceL); p.px(8, 39, KS.faceL);
    }
    if (!s && v === 2) { // 이끼: 받침돌 윗줄 · 줄눈을 타고
      for (const [x, y] of [[2, 46], [3, 46], [4, 46], [3, 47], [11, 46], [12, 46], [12, 45], [13, 44], [6, 45], [9, 21], [10, 20]]) if (x >= X0 && x <= X1) p.px(x, y, MOSS[(x + y) & 1]);
    }
    // 6) 외곽선: 끝(이웃 없는 쪽)의 바깥 줄 · 땅에 닿는 줄 · 뒤 흉벽 머리 위
    const OLc = col.c32(OL);
    if (!w) for (let y = 0; y <= Y1; y++) if (p.get(1, y)) p.d[y * 16] = OLc;
    if (!e) for (let y = 0; y <= Y1; y++) if (p.get(14, y)) p.d[y * 16 + 15] = OLc;
    if (!s) for (let x = 0; x < 16; x++) if (p.get(x, WALL_H - 2)) p.d[(WALL_H - 1) * 16 + x] = OLc;
    if (!n) for (let x = X0; x <= X1; x++) if (merlon(x)) p.d[x] = OLc;
