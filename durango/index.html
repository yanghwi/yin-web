  }
  // 이어진 쪽의 조합 16가지 × 앞면 무늬 (앞면이 보이는 조각 — 아래가 빈 것 — 만 화살 구멍 · 이끼가 있다)
  const WALL_KEYS = ['', 'N', 'S', 'E', 'W', 'NS', 'NE', 'NW', 'SE', 'SW', 'EW', 'NSE', 'NSW', 'NEW', 'SEW', 'NSEW'];
  const WALLS = {};
  for (const k of WALL_KEYS) for (const v of k.includes('S') ? [0] : [0, 1, 2]) WALLS['kwall' + k + (v || '')] = () => castleWall(k, v);

  // 망루 (세 칸 × 두 칸): 옛 망루 터의 무너진 망루와 같은 둥근 돌탑 — 여기 것은 온전하다.
  //   몸통은 밑면 곡선을 따라 6px마다 줄눈, 왼쪽이 볕 · 오른쪽이 그늘. 꼭대기 둘레에 흉벽, 가운데 깃대에 사자 깃발
  function kTower() {
    const W = 50, H = 91, ay = H - 2, cx = 24.5, rx = 24, ry = 9, FH = 52;
    const p = new Pix(W, H), yb = ay - ry, yt = yb - FH;
    const half = x => { const t = (x - cx) / rx; return Math.abs(t) >= 1 ? 0 : ry * Math.sqrt(1 - t * t); };
    const ang = x => Math.asin(Math.max(-1, Math.min(1, (x - cx) / rx)));
    const merl = x => ((ang(x) / 0.42 + 8.25) % 1) < 0.58;
    // 1) 꼭대기 바닥 (흉벽 안쪽): 그늘진 판돌
    for (let x = 1; x <= 48; x++) { const h = half(x); for (let y = Math.round(yt - h); y <= Math.round(yt + h); y++) p.px(x, y, ((x + y) & 3) ? KS.walkS : KS.walkD); }
    // 2) 뒤쪽 흉벽: 안쪽 면이 보인다 (머리 6px · 틈 3px 높이)
    for (let x = 1; x <= 48; x++) {
      const yb0 = Math.round(yt - half(x)), m = merl(x), hg = m ? 6 : 3;
      for (let y = yb0 - hg; y <= yb0 + 1; y++) p.px(x, y, y <= yb0 - hg + 1 ? KS.cap : KS.faceD);
    }
    // 3) 몸통 + 앞쪽 흉벽 (몸통 면이 그대로 솟는다). 밑동은 비스듬히 넓어지는 받침(칸 바닥까지 곧게 — 발밑 세 칸을 다 덮는다)
    for (let x = 1; x <= 48; x++) {
      const t = (x - cx) / rx, h = half(x), yB = Math.round(yb + h), yT = Math.round(yt + h), m = merl(x), hg = m ? 7 : 3;
      const a = ang(x), a1 = ang(x + 1);
      for (let y = yT - hg - 2; y <= ay; y++) {
        const hh = yB - y; // 밑면에서 잰 높이 (받침은 음수까지)
        let c;
        if (y < yT - hg) c = m ? KS.cap : KS.capD;                                   // 흉벽 윗면
        else if (hh <= 5) {                                                             // 받침: 윗줄 볕 · 8px마다 줄눈 · 아래로 갈수록 어둡다 · 왼쪽이 볕
          const seamX = (Math.floor(a / 0.3 + 20) !== Math.floor(a1 / 0.3 + 20)) && hh >= 0;
          c = hh === 5 ? KS.faceL : seamX ? KS.seam : y === ay ? KS.faceDD : t < -0.55 ? KS.face : t > 0.55 ? KS.faceDD : KS.faceD;
          if (hh === 0 && y !== ay) c = KS.seam;
        }
        else {
          const course = Math.floor(hh / 6), rr = hh % 6, off = (course & 1) * 0.5;
          const joint = Math.floor(a / 0.26 + off + 20) !== Math.floor(a1 / 0.26 + off + 20);
          if (rr === 0 && y <= yT) c = KS.seam;
          else if (joint && y > yT - 1) c = KS.seam;
          else if (t < -0.72) c = rr === 5 ? KS.cap : KS.faceL;
          else if (t < -0.45) c = rr === 5 || ((x + y) & 1) ? KS.faceL : KS.face;
          else if (t < 0.35) c = rr === 5 ? KS.faceL : KS.face;
          else if (t < 0.62) c = ((x + y) & 1) ? KS.faceD : KS.face;
          else if (t < 0.86) c = KS.faceD;
          else c = KS.faceDD;
        }
        p.px(x, y, c);
      }
      if (!m) for (let y = yT - 7; y < yT - hg - 2; y++) p.px(x, y, 0); // 틈 위는 비운다 (뒤 흉벽 · 하늘이 보인다)
    }
    // 4) 화살 구멍: 가운데 위 · 양옆 아래 (옆으로 갈수록 좁다)
    for (const [x, y0, y1, w2] of [[24, yb - 36 + 9, yb - 26 + 9, 2], [12, yb - 18 + 7, yb - 11 + 7, 1], [37, yb - 18 + 7, yb - 11 + 7, 1]]) {
      for (let y = y0; y <= y1; y++) { p.px(x, y, '#2a2436'); if (w2 > 1) p.px(x + 1, y, '#3a2e40'); }
      p.px(x, y1 + 1, KS.faceL); if (w2 > 1) p.px(x + 1, y1 + 1, KS.faceL);
    }
    // 5) 깃대 · 사자 깃발 (꼭대기 가운데에서 바람에 오른쪽으로)
    const px0 = 24, top = Math.round(yt) - 25;
    for (let y = top; y <= Math.round(yt) + 1; y++) { p.px(px0, y, '#8a5a3c'); p.px(px0 + 1, y, '#64402e'); }
    p.px(px0, top - 1, LION.goldL); p.px(px0 + 1, top - 1, LION.gold); p.px(px0, top - 2, LION.gold);
    for (let i = 0; i < 16; i++) {
      const x = px0 + 2 + i, wave = Math.round(Math.sin(i * 0.55) * 1.2), y0 = top + 1 + wave, y1 = top + 11 + wave - (i > 12 ? i - 12 : 0);
      for (let y = y0; y <= y1; y++) p.px(x, y, y === y0 ? LION.redL : y === y1 ? LION.redD : (i === 0 ? LION.gold : LION.red));
    }
    ['.G.G.', 'GGGGG', 'GdGdG', 'GGnGG', '.GGG.'].forEach((row, j) => [...row].forEach((ch, i) => { // 깃발의 작은 사자 얼굴 (천의 물결을 따라)
      if (ch === '.') return;
      const x = px0 + 8 + i, wave = Math.round(Math.sin((x - px0 - 2) * 0.55) * 1.2);
      p.px(x, top + 4 + j + wave, ch === 'd' ? LION.dark : ch === 'n' ? LION.redD : LION.gold);
    }));
    // 6) 밑동 이끼
    for (const [x, y] of [[6, -1], [7, -2], [8, -1], [18, 0], [19, 0], [30, 0], [41, -2], [42, -1], [43, -3]]) p.px(x, Math.round(yb + half(x)) + y, MOSS[(x + y) & 1]);
    p.outline(OL);
    return { pix: p, ax: 25, ay, foot: [3, 2] };
  }

  // 성문 (여섯 칸 × 두 칸, 가운데 두 칸이 문길): 성벽보다 높은 문루. 둥근 아치 · 올려 둔 쇠창살 · 양옆에 늘어뜨린 사자 깃발 · 등불 둘
  function kGate() {
    const W = 98, H = 92, ay = H - 2, FH = 48, TOPD = 32;
    const p = new Pix(W, H), yF = ay - FH + 1, yW = yF - TOPD; // 앞면 위 끝 · 통로 위 끝
    const X0 = 1, X1 = 96, ACX = 48.5, AR = 16, AS = ay - 22; // 아치: 가운데 · 반지름 · 반원이 시작하는 줄
    const inArch = (x, y, r) => y > AS ? Math.abs(x - ACX) <= r : Math.hypot(x - ACX, (y - AS) * 1.0) <= r;
    // 1) 꼭대기 통로 (두 칸 깊이)와 둘레 흉벽
    for (let y = yW; y < yF; y++) for (let x = X0; x <= X1; x++) { const r = y - yW, u = (x + ((r >> 3) & 1) * 4) & 7; p.px(x, y, (r & 7) === 7 || u === 7 ? KS.walkD : KS.walk); }
    for (let x = X0; x <= X1; x++) { p.px(x, yW + 2, KS.walkS); p.px(x, yW + 3, (x & 1) ? KS.walkS : KS.walkD); }
    for (let x = X0; x <= X1; x++) { // 뒤 흉벽
      const m = ((x + 5) & 7) < 5 || x < 7 || x > 90;
      for (let y = yW - (m ? 6 : 3); y <= yW + 1; y++) p.px(x, y, y <= yW - (m ? 5 : 2) ? KS.cap : KS.face);
      if (!m) for (let y = yW - 6; y < yW - 3; y++) p.px(x, y, 0);
    }
    for (const x0 of [X0, X1 - 2]) for (let y = yW - 6; y < yF; y++) { const ph = (y - yW + 6) & 7; for (let x = x0; x < x0 + 3; x++) p.px(x, y, ph < 4 ? KS.cap : ph < 7 ? KS.face : KS.notch); } // 옆 흉벽
    for (let y = yW; y < yF; y++) { p.px(X0 + 3, y, KS.walkS); p.px(X1 - 3, y, KS.walkD); }
    // 2) 앞면 (앞 흉벽이 앞면과 한 면으로 솟는다): 돌 켜 · 양 끝 모서리 돌 · 받침돌
    for (let x = X0; x <= X1; x++) {
      const m = ((x + 5) & 7) < 5 || x < 7 || x > 90;
      for (let y = yF - (m ? 9 : 5); y <= ay; y++) {
        const hh = ay - y, r = y - yF;
        let c;
        if (y < yF - (m ? 7 : 3)) c = m ? KS.cap : KS.capD;                         // 흉벽 윗면
        else if (hh <= 5) c = hh === 5 ? KS.faceL : ((x + 3) & 7) === 0 ? KS.seam : hh <= 1 ? KS.faceDD : KS.faceD;
        else if (r < 0) c = m && (x === X0 || !(((x + 4) & 7) < 5)) ? KS.faceL : KS.face;
        else {
          const course = Math.floor(r / 6), rr = r % 6, J = (course & 1) ? [2, 11] : [6, 15];
          const quoin = x < 8 || x > 89; // 모서리 돌: 켜마다 길고 짧게 엇갈린다
          if (rr === 5) c = KS.seam;

      let cur = '', cuts = [0];
      words.forEach((w, i) => {

  function evenCuts(words, measure, maxW, n) {
    const m = words.length, B1 = (0.45 * maxW) ** 2, B2 = (0.25 * maxW) ** 2, P1 = (0.25 * maxW) ** 2;
    const best = [], from = [];
    for (let k = 0; k <= n; k++) { best.push(new Array(m + 1).fill(Infinity)); from.push(new Array(m + 1).fill(-1)); }
    best[0][0] = 0;
    for (let k = 1; k <= n; k++) for (let j = 1; j <= m; j++) for (let i = k - 1; i < j; i++) {

/* 듀랑고 GBA — EarthBound/MOTHER식 전투 배경

'use strict';
(function (D) {

    rings: (x, y, n) => Math.floor(Math.hypot(x - 32, y - 32) / 4) % n,

    spiral: (x, y, n) => {

      return ((Math.floor(d / 5 + a * n) % n) + n) % n;

    plasma: (x, y, n) => {
      const v = Math.sin(x * TAU / 64) + Math.sin(y * TAU / 32) + Math.sin((x + y) * TAU / 64) + Math.sin((x - y) * TAU / 32);
      return Math.min(n - 1, Math.floor((v + 4) / 8 * n));

        if (B.dist === 'h') dxB = wb; else if (B.dist === 'i') dxB = (y & 1) ? wb : -wb; else dyB = wb;
        const rowA = (((y + syA + Math.round(dyA)) & 63) << 6), rowB = (((y + syB + Math.round(dyB)) & 63) << 6);

<script>
/* 듀랑고 GBA — 화면 파이프라인
   논리 해상도(기본 240×160)에 월드 · 창 · 글자를 그리고 → 2배(480×320) 출력 캔버스로 정수 확대.
   지도처럼 논리 화면에 담기지 않는 그림만 hi(fn)으로 넘긴다: 출력 캔버스에 2배 해상도로 먼저 그리고 그 위에 논리 화면을 얹으니,
   논리 화면에서 비워 둔(clearRect) 자리로 비쳐 보인다. 그 뒤에 논리 화면에 그린 것(이름표 · 알림 · 페이드)은 그 위에 온다. */
'use strict';
(function (D) {
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  class Screen {
    constructor(w, h, out) {
      this.w = w || 240; this.h = h || 160;
      this.lc = canvas(this.w, this.h);
      this.l = this.lc.getContext('2d');
      this.oc = out || canvas(this.w * 2, this.h * 2);
      this.o = this.oc.getContext('2d');
      this.l.imageSmoothingEnabled = false;
    }
    clear(c) { this.l.fillStyle = c || D.PAL.voidC; this.l.fillRect(0, 0, this.w, this.h); }
    // 이번 프레임에 논리 화면 밑에 2배 해상도로 그릴 것: fn(출력 ctx). 한 번 쓰면 버린다
    hi(fn) { (this._hi || (this._hi = [])).push(fn); }
    present() {
      const hi = this._hi;
      this._hi = null;
      this.o.imageSmoothingEnabled = false;
      if (hi) {
        this.o.fillStyle = D.PAL.voidC; this.o.fillRect(0, 0, this.w * 2, this.h * 2);
        for (const fn of hi) { this.o.save(); fn(this.o); this.o.restore(); }
      }
      this.o.drawImage(this.lc, 0, 0, this.w * 2, this.h * 2);
    }
  }

  /* 월드 그리기: 바닥 → 물 반짝임 → 그림자(투명도 0.22) → y정렬 스프라이트 → 전선 → 이모트
     obj: { x, y(발 위치), spr(Pix|canvas), ax, ay, shadow, sw(그림자 폭), flash, alpha, emote } */
  function drawWorld(l, ground, objs, camX, camY, t, o) {
    o = o || {};
    const w = l.canvas.width, h = l.canvas.height;
    camX = Math.round(camX); camY = Math.round(camY);
    if (!o.skipGround) {
      l.fillStyle = o.bg || D.PAL.voidC; l.fillRect(0, 0, w, h);
      const sx = Math.max(0, camX), sy = Math.max(0, camY);
      const sw = Math.min(ground.W - sx, w - (sx - camX)), sh = Math.min(ground.H - sy, h - (sy - camY));
      if (sw > 0 && sh > 0) l.drawImage(ground.pix.canvas(), sx, sy, sw, sh, sx - camX, sy - camY, sw, sh);
      if (o.water !== false) D.Terrain.waterSparkles(l, ground, camX, camY, w, h, t, o.seed || 1);
    }
    // 그림자
    l.globalAlpha = 0.22;
    for (const ob of objs) {
      if (!ob.shadow || ob.hidden) continue;
      const swd = ob.sw || 12, shh = Math.max(3, Math.round(swd / (swd > 30 ? 4 : 3)));
      l.drawImage(D.Chars.shadow(swd, shh).canvas(), Math.round(ob.x - swd / 2 - camX), Math.round(ob.y - shh + 1 - camY));
    }
    l.globalAlpha = 1;
    // y정렬
    const list = objs.filter(ob => !ob.hidden).sort((a, b) => (a.y - b.y) || (a.x - b.x));
    for (const ob of list) {
      const spr = ob.spr && ob.spr.canvas ? ob.spr.canvas() : ob.spr;
      if (!spr) continue;
      const dx = Math.round(ob.x - ob.ax - camX), dy = Math.round(ob.y - ob.ay - camY);
      if (dx > w || dy > h || dx + spr.width < 0 || dy + spr.height < 0) continue;
      if (ob.alpha != null) l.globalAlpha = ob.alpha;
      if (ob.under) for (const u of ob.under) l.drawImage(u.spr.canvas ? u.spr.canvas() : u.spr, dx + u.x, dy + u.y);
      const wh = ob.flash && ob.white ? (typeof ob.white === 'function' ? ob.white() : ob.white) : null;
      if (wh && ob.flashA) { // 큰 몸은 반투명하게 번쩍 (화면이 하얘지지 않게)
        l.drawImage(spr, dx, dy);
        l.globalAlpha = (ob.alpha != null ? ob.alpha : 1) * ob.flashA; l.drawImage(wh.canvas ? wh.canvas() : wh, dx, dy);
        l.globalAlpha = ob.alpha != null ? ob.alpha : 1;
      } else l.drawImage(wh ? (wh.canvas ? wh.canvas() : wh) : spr, dx, dy);
      if (ob.over) for (const u of ob.over) l.drawImage(u.spr.canvas ? u.spr.canvas() : u.spr, dx + u.x, dy + u.y);
      l.globalAlpha = 1;
    }
    // 전선 (처지는 곡선, 브레젠험 선분)
    if (o.wires) {
      l.fillStyle = '#3a2e40';
      for (const wr of o.wires) {
        const [x1, y1, x2, y2, sag] = wr, n = Math.max(2, Math.round(Math.abs(x2 - x1) / 8));
        let px = x1, py = y1;
        for (let i = 1; i <= n; i++) {
          const k = i / n, x = x1 + (x2 - x1) * k, y = y1 + (y2 - y1) * k + (sag || 6) * 4 * k * (1 - k);
          D.raster.bresenham(Math.round(px - camX), Math.round(py - camY), Math.round(x - camX), Math.round(y - camY), (a, b) => l.fillRect(a, b, 1, 1));
          px = x; py = y;
        }
      }
    }
    // 이모트
    for (const ob of list) {
      if (!ob.emote) continue;
      const e = D.UI.emote(ob.emote).canvas(), hop = Math.floor(t / 400) % 2;
      l.drawImage(e, Math.round(ob.x + (ob.ex || 0) - 5 - camX), Math.round(ob.y - (ob.head || 24) - 13 - hop - camY));
    }
  }

  D.Screen = Screen;
  D.drawWorld = drawWorld;
  D.makeCanvas = canvas;
})(window.D = window.D || {});

</script>

      CAMPS.some(C => Math.abs(x - C.x) <= 5 && Math.abs(y - C.y) <= 3) || SCRAPS.some(S => x >= S.x - 1 && x <= S.x + S.w && y >= S.y - 1 && y <= S.y + 3) ||

      (y <= gates.pass.y1 + 1 && x >= gates.pass.x0 && x <= gates.pass.x1); // 북쪽 땅으로 건너가는 문 칸과 그 앞 한 줄 (곶의 야자수가 길을 막지 않게)
    for (let ty = 1; ty < MH - 1; ty++) for (let tx = 1; tx < MW - 1; tx++) {
      if (!free(tx, ty) || keepOut(tx, ty)) continue;
      // 길 옆 한 칸은 비워 둠
      let pathNear = false;
      for (let dy = -1; dy <= 1 && !pathNear; dy++) for (let dx = -1; dx <= 1; dx++) if (PATHY.has(tile(tx + dx, ty + dy))) { pathNear = true; break; }
      if (pathNear) continue;
      const dr = dread(tx, ty), jungle = tx > riverX(ty) + 5, north = ty < cliffY(tx) - k(12);
      const dens = vnoise(tx, ty, 7.5, seed + 51), h = hash(tx, ty, seed + 52);
      const lane = Math.abs(vnoise(tx, ty, 12, seed + 77) - 0.5) < 0.035;
      const tree = (type, extra) => { if (!lane && !pinch(tx, ty)) put(type, tx, ty, Object.assign({ node: 'tree' }, extra)); };
      const solid = (type, node, extra) => { if (!lane && !pinch(tx, ty)) put(type, tx, ty, Object.assign({ node }, extra)); };
      if (dr > 0.12) {
        // 죽은 숲: 둥지에 가까울수록 나무는 성기고 뼈가 늘어난다. 새도 풀도 없다
        const h2 = hash(tx, ty, seed + 53);
        if (dens > 0.42 && h < 0.3 * (1 - dr * 0.55)) {
          if (dr < 0.32 && h2 > dr * 2.6) tree(h2 < 0.6 ? 'treeDeep' : 'bare');
          else tree(h2 < 0.3 ? 'snag' : 'deadTree');
        } else if (h > 0.5 && h < 0.5 + 0.07 * dr) put('bones', tx, ty, { flat: true });
        else if (h > 0.62 && h < 0.62 + 0.012 * dr) put('skull', tx, ty, { prop: true, look: 'bones' });
        else if (h > 0.7 && h < 0.716) solid(dr > 0.5 ? 'clawRock' : 'rock', 'rock');
        else if (dr < 0.3 && h > 0.8 && h < 0.83) put('branches', tx, ty, { node: 'branches' });
      } else if (jungle) {
        if (dens > 0.45 && h < 0.34) tree(h < 0.06 ? 'treeFruit' : h < 0.2 ? 'treeDeep' : 'treeGreen');
        else if (h < 0.4) put('fern', tx, ty, { node: 'fern' });
        else if (h < 0.44) solid(h < 0.42 ? 'berry' : 'bush', h < 0.42 ? 'berry' : 'bush');
        else if (h < 0.46) put('herb', tx, ty, { node: 'herb' });
        else if (h < 0.475) solid('rock', 'rock');
        else if (h < 0.49) put('branches', tx, ty, { node: 'branches' });
      } else if (north) {
        if (h < 0.05) solid('rock', 'rock');
        else if (h < 0.07) solid('boulder', 'rock', { big: true });
        else if (h < 0.1) tree('treeAut');
        else if (h < 0.12) put('stones', tx, ty, { node: 'stones' });
        else if (h < 0.13) put('herb', tx, ty, { node: 'herb' });
      } else {
        // 숲: 넓어진 섬에서도 나무가 모자라지 않게 숲 자리를 조금 넓혔다 (막힘은 짐승길 · 대각선 틈 금지 · 갇힌 땅 없애기로 푼다)
        const grove = dens > 0.57;
        if ((grove && h < 0.31) || h < 0.04) tree(h < 0.01 ? 'bare' : h < 0.02 ? 'treeFruit' : (tx < k(50) ? 'treeAut' : 'treeGreen'));
        else if (h < 0.06) solid('berry', 'berry');
        else if (h < 0.075) solid('bush', 'bush');
        else if (h < 0.09) solid('rock', 'rock');
        else if (h < 0.1) put('stones', tx, ty, { node: 'stones' });
        else if (h < 0.115) put('branches', tx, ty, { node: 'branches' });
        else if (h < 0.125) put('herb', tx, ty, { node: 'herb' });
        else if (h < 0.13) put('fern', tx, ty, { node: 'fern' });
      }
    }
    // 해변 야자수: 바닷바람을 맞아 물 쪽으로 기운다 (양쪽 다 물이거나 둘 다 멀면 제멋대로)
    const seaSide = (tx, ty) => {
      let l = 0, r = 0;
      for (let k = 1; k <= 5; k++) { if (!l && tile(tx - k, ty) === 'w') l = k; if (!r && tile(tx + k, ty) === 'w') r = k; }
      return l && (!r || l < r) ? -1 : r && (!l || r < l) ? 1 : hash(tx, ty, seed + 62) < 0.5 ? -1 : 1;
    };
    for (let ty = 1; ty < MH - 1; ty++) for (let tx = 1; tx < MW - 1; tx++) {
      if (tile(tx, ty) !== 's' || occ[ty * MW + tx] || keepOut(tx, ty) || pinch(tx, ty)) continue;
      if (hash(tx, ty, seed + 61) < 0.05 && tile(tx, ty - 1) !== 'w' && tile(tx, ty + 1) !== 'w') put('palm', tx, ty, Object.assign({ node: 'tree', palm: true }, seaSide(tx, ty) < 0 ? { dir: 'left' } : null));
    }

    openPockets(P, (CITY.y + 6) * MW + CITY.x + 13); // 워프 지점에서
    const out = objs.filter(o => !o.gone);
    for (const o of out) delete o._tiles;
    return out;
  }

  /* 갇힌 땅 없애기: 시작 칸(start = y * 가로 + x)에서 걸어서 못 가는 빈 땅이 있으면 그리로 가는 길목의 나무·바위·덤불을 걷어 낸다.
     한 번 탐색할 때마다 갇힌 곳을 모두 찾아 곳마다 가장 싸게 닿는 길 하나씩을 연다 (넓은 섬에서도 몇 번이면 끝난다) */
  function openPockets(P, start) {
    const { objs, occ, blk, inMap, solidT } = P, MW = P.MW, N = P.MW * P.MH, owner = new Map();
    for (const o of objs) for (const [x, y] of o._tiles) if (inMap(x, y)) owner.set(y * MW + x, o);
    const removable = o => o && !o.gone && BLOCKING[o.node];
    const dist = new Int32Array(N), from = new Int32Array(N), dq = new Int32Array(N * 8), seen = new Uint8Array(N);
    const pocket = j => !blk[j] && dist[j] > 0 && dist[j] < 1e9;
    for (let pass = 0; pass < 40; pass++) {
      // 0-1 너비 우선 탐색: 빈칸은 0, 걷어 낼 수 있는 것이 막은 칸은 1
      dist.fill(1e9); from.fill(-1); seen.fill(0);
      let head = N * 4, tail = N * 4, opened = 0;
      dist[start] = 0; dq[tail++] = start;
      while (head < tail) {
        const i = dq[head++], x = i % MW, y = (i / MW) | 0;
        for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
          if (!inMap(nx, ny) || solidT(nx, ny)) continue;
          const j = ny * MW + nx, o = blk[j] ? owner.get(j) : null;
          if (blk[j] && !removable(o)) continue;
          const nd = dist[i] + (blk[j] ? 1 : 0);
          if (nd >= dist[j]) continue;
          dist[j] = nd; from[j] = i;
          if (blk[j]) dq[tail++] = j; else dq[--head] = j;
        }
      }
      for (let j0 = 0; j0 < N; j0++) {
        if (seen[j0] || !pocket(j0)) continue;
        // 이 갇힌 곳을 표시해 두고(다시 열지 않게), 여기서 워프 지점 쪽으로 되짚어 막은 것을 걷어 낸다
        const stack = [j0]; seen[j0] = 1;
        while (stack.length) {
          const i = stack.pop(), x = i % MW, y = (i / MW) | 0;
          for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
            const q = ny * MW + nx;
            if (inMap(nx, ny) && !seen[q] && pocket(q)) { seen[q] = 1; stack.push(q); }
          }
        }
        for (let j = j0; j >= 0 && dist[j] > 0; j = from[j]) {
          const o = blk[j] ? owner.get(j) : null;
          if (!o || o.gone) continue;
          o.gone = true; opened++;
          for (const [x, y] of o._tiles) { blk[y * MW + x] = 0; occ[y * MW + x] = 0; }
        }
      }
      if (!opened) break;
    }
  }

  /* ---------------- 북쪽 맵 (2장): 길목 너머의 땅 ---------------- */
  // 128×96. 생성기가 바탕을 깔고(바다에 둘러싸인 서늘한 땅, 낙엽 진 풀밭에 가을 숲 · 바위 언덕 · 서쪽 호수), 이야기 자리는
  // 맵 목록(maps.js D.Maps.north)의 글자 격자 조각(stamps)으로 그 위에 찍는다. 자리(regions)는 모두 뭍이 되게 땅을 넓힌다.
  // 남쪽 끝 가운데의 길목 통로가 섬의 북쪽 길목과 이어진다 (gates.south: 맨 아래 두 줄 — 그쪽으로 걸어 나가면 섬으로 돌아간다)
  const NW = 128, NH = 96;
  function genNorth(seed, M) {
    M = M || D.Maps.north;
    const g = [];
    for (let y = 0; y < NH; y++) g.push(new Array(NW).fill('w'));
    const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < NW && y < NH) g[y][x] = c; };
    const get = (x, y) => (x >= 0 && y >= 0 && x < NW && y < NH) ? g[y][x] : 'w';
    const grass = (x, y) => { const c = get(x, y); return c === 'g' || c === 'f' || c === 'l'; };
    // 이야기 자리(길목 통로 말고 — 통로는 바다를 건너온다)는 모두 뭍: 자리 안은 들어 올리고, 둘레 다섯 칸에 걸쳐 바다로 내려간다
    const lifts = Object.entries(M.regions || {}).filter(([k]) => k !== 'pass').map(([, r]) => r);
    const lift = (x, y) => {
      let m = 0;
      for (const [x0, y0, w, h] of lifts) { const dx = Math.max(x0 - x, 0, x - (x0 + w - 1)), dy = Math.max(y0 - y, 0, y - (y0 + h - 1)); m = Math.max(m, 1 - Math.hypot(dx, dy) / 5); }
      return m;
    };
    // 1) 땅: 타원 + 노이즈 (섬과 같은 방식) · 이야기 자리. 남쪽은 바다가 넓다 — 길목 통로가 바다를 건너 들어온다
    for (let y = 0; y < NH; y++) for (let x = 0; x < NW; x++) {
      const dx = (x - NW / 2) / 58, dy = (y - 42) / 38, edge = Math.min(x, NW - 1 - x, y, NH - 1 - y);
      const v0 = 1 - Math.sqrt(dx * dx + dy * dy) + (vnoise(x, y, 24, seed) - 0.5) * 0.45 + (vnoise(x, y, 9, seed + 7) - 0.5) * 0.15 + (vnoise(x, y, 4, seed + 9) - 0.5) * 0.07 -
        Math.max(0, 1 - edge / 7) * 0.6; // (지도 가장자리 여섯 칸은 바다로 — 땅이 지도 끝에 닿지 않게)
      const L = lift(x, y), v = L > 0 ? Math.max(v0, L * (0.55 + (vnoise(x, y, 6, seed + 3) - 0.5) * 0.4)) : v0; // (자리에서 먼 바다엔 섬이 생기지 않게)
      if (v > 0.2) set(x, y, 'g');
      else if (v > 0.1) set(x, y, 's');
    }
    // 2) 풀밭 변화: 서늘한 가을 땅이라 낙엽이 넓고 꽃밭은 드물다
    for (let y = 0; y < NH; y++) for (let x = 0; x < NW; x++) {
      if (get(x, y) !== 'g') continue;
      if (vnoise(x, y, 8.75, seed + 13) > 0.62) set(x, y, 'l');
      else if (vnoise(x, y, 7.5, seed + 11) > 0.76) set(x, y, 'f');
    }
    // 3) 서쪽 호수 (구왕국 영지의 북동쪽)
    const LAKE = { x: 40, y: 34, rx: 7, ry: 5 };
    for (let y = LAKE.y - LAKE.ry - 3; y <= LAKE.y + LAKE.ry + 3; y++) for (let x = LAKE.x - LAKE.rx - 3; x <= LAKE.x + LAKE.rx + 3; x++) {
      const d = Math.hypot((x - LAKE.x) / LAKE.rx, (y - LAKE.y) / LAKE.ry) + (vnoise(x, y, 4, seed + 45) - 0.5) * 0.3;
      if (d < 1 && grass(x, y)) set(x, y, 'w');
    }
    // 4) 흙길 (굵기 2, 조각 밖 바탕 위): 초소 북쪽 오솔길이 섬 한가운데 쪽으로
    const trail = M.trail || [];
    for (let i = 0; i + 1 < trail.length; i++) D.raster.bresenham(trail[i][0], trail[i][1], trail[i + 1][0], trail[i + 1][1], (x, y) => {
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) if (get(x + dx, y + dy) !== 'w') set(x + dx, y + dy, 'd');
    });
    // 5) 이야기 자리: 글자 격자 조각을 찍는다 — '.'은 바탕 그대로, 나머지는 그 칸의 땅을 덮는다 (물체는 populateNorth가 놓고,
    //    덮은 칸(reserved)에는 자연물을 두지 않는다)
    const stamps = M.stamps || [], reserved = new Uint8Array(NW * NH), KEY = D.StampKey;
    for (const S of stamps) S.rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '.') continue;
        const k = KEY[ch], x = S.at[0] + i, y = S.at[1] + j;
        if (!k) throw new Error('조각 글자표에 없는 글자: ' + ch + ' (' + S.name + ')');
        set(x, y, typeof k === 'string' ? k : k.tile);
        if (x >= 0 && y >= 0 && x < NW && y < NH) reserved[y * NW + x] = 1;
      }
    });
    // 섬으로 건너가는 문: 맨 아래 두 줄에서 걸을 수 있는 칸 (길목 통로 조각의 모래톱). 들어서는 자리는 그 가운데 세 칸 위
    const walk = (x, y) => { const c = get(x, y); return c !== 'w' && c !== 'c'; };
    let gx0 = NW, gx1 = -1;
    for (let y = NH - 2; y < NH; y++) for (let x = 0; x < NW; x++) if (walk(x, y)) { gx0 = Math.min(gx0, x); gx1 = Math.max(gx1, x); }
    const map = { w: NW, h: NH, rows: g.map(r => r.join('')), seed, prints: [] };
    const P0 = (M.regions || {}).pass, inPass = (x, y) => !!P0 && x >= P0[0] && y >= P0[1] && x < P0[0] + P0[2] && y < P0[1] + P0[3];
    return { map, K: 1, LAKE, inPass, stamps, reserved, gates: { south: { x0: gx0, x1: gx1, y0: NH - 2, y1: NH - 1, out: 'down' } }, start: [Math.round((gx0 + gx1) / 2), NH - 4] };
  }
  // 북쪽 맵의 물체: 호숫가 갈대 · 연잎 · 약초, 가을 숲 무리 · 바위 언덕 · 풀숲, 바닷가에 떠밀려 온 나무 (야자수는 없다 — 서늘한 땅)
  function populateNorth(W0, seed) {
    const { map, LAKE, start, stamps, reserved } = W0, P = placer(map), { occ, tile, solidT, free, span, put, pinch } = P, MW = map.w, MH = map.h;
    // 이야기 자리의 물체 (조각의 대문자 · 기호 — maps.js D.StampKey). 두 칸짜리(천막 · 장작더미)는 옆 칸까지 차지한다
    const KEY = D.StampKey, isF = c => c === '#' || c === '!';
    // 울타리 모양: 가로로 이어지면 가로 울타리(끝은 끝 기둥), 세로로 이어지면 세로 울타리, 꺾이는 곳은 모서리 기둥 — 마을 울타리와 같은 조각.
    //   등불 기둥(!)은 틈 쪽을 보고 고른다 (틈이 동쪽이면 gateW, 서쪽이면 gateE · 세로 줄이면 틈 위 gateU, 아래 gate)
    const fenceType = (ch, e, w, n, s) => {
      const E = isF(e), W = isF(w), N = isF(n), S = isF(s);
      if (ch === '!') return E || W ? (E ? 'gateE' : 'gateW') : (S ? 'gate' : 'gateU');
      if ((E || W) && !N && !S) return E && W ? 'fenceH' : E ? 'postE' : 'postW';
      if ((N || S) && !E && !W) return 'fenceV';
      if (S) return E ? 'postE' : 'postW';
      if (N) return E ? 'postEU' : 'postWU';
      return 'fenceH';
    };
    // 성벽 조각: 이웃한 성벽 · 망루 · 성문 칸(문길은 빼고)이 있는 쪽이 이어진 쪽이다 (landmarks.js castleWall — 'kwall' + NSEW).
    //   앞면이 보이는 조각(아래가 빈 것)엔 세 칸마다 화살 구멍, 가끔 이끼
    const isWall = c => { const k = KEY[c]; return !!k && typeof k !== 'string' && (!!k.wall || (!!k.block && !k.walk)); };
    const wallType = (at, x, y) => {
      const k = (isWall(at(0, -1)) ? 'N' : '') + (isWall(at(0, 1)) ? 'S' : '') + (isWall(at(1, 0)) ? 'E' : '') + (isWall(at(-1, 0)) ? 'W' : '');
      const v = k.includes('S') ? 0 : (x + y) % 3 === 0 ? 1 : hash(x, y, seed + 93) < 0.2 ? 2 : 0;
      return 'kwall' + k + (v || '');
    };
    const blockDone = new Set();
    for (const S of stamps || []) S.rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i], k = KEY[ch];
        if (!k || typeof k === 'string') continue;
        const x = S.at[0] + i, y = S.at[1] + j, at = (di, dj) => (S.rows[j + dj] || '')[i + di];
        if (k.fence) { put(fenceType(ch, at(1, 0), at(-1, 0), at(0, -1), at(0, 1)), x, y, k.lantern ? { prop: true, light: 30, lightC: '#ffd89a' } : { prop: true }); continue; }
        if (k.wall) { put(wallType(at, x, y), x, y, { prop: true, tall: true }); continue; }
        if (k.block) {
          // 여러 칸짜리 한 그림(망루 · 성문): 같은 그림의 글자가 이어진 덩어리마다 하나 — 덩어리 아래 줄 가운데에 놓고, 지나다니는 칸(walk)만 빼고 막는다
          if (blockDone.has(x + ',' + y)) continue;
          const cells = [], q = [[i, j]];
          blockDone.add(x + ',' + y);
          while (q.length) {
            const [a, b] = q.pop();
            cells.push([a, b]);
            for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const k2 = KEY[(S.rows[b + db] || '')[a + da]], id = (S.at[0] + a + da) + ',' + (S.at[1] + b + db);
              if (k2 && k2.block && k2.type === k.type && !blockDone.has(id)) { blockDone.add(id); q.push([a + da, b + db]); }
            }
          }
          const kOf = ([a, b]) => KEY[S.rows[b][a]], xs = cells.map(c => c[0]), x0 = Math.min(...xs), x1 = Math.max(...xs), y1 = Math.max(...cells.map(c => c[1]));
          const extra = Object.assign({}, cells.map(kOf).find(k2 => !k2.walk) || k);
          delete extra.tile; delete extra.type; delete extra.block; delete extra.walk;
          extra.blockTiles = cells.filter(c => !kOf(c).walk).map(([a, b]) => [S.at[0] + a, S.at[1] + b]);
          put(k.type, S.at[0] + x0 + Math.floor((x1 - x0) / 2), S.at[1] + y1, extra);
          continue;
        }
        const extra = Object.assign({}, k);
        delete extra.tile; delete extra.type; delete extra.wide;
        if (k.wide) { extra.blockTiles = span(x, y, k.wide, 1); i += k.wide - 1; }
        put(k.type, x, y, extra);
      }
    });
    for (let y = LAKE.y - LAKE.ry - 3; y <= LAKE.y + LAKE.ry + 3; y++) for (let x = LAKE.x - LAKE.rx - 3; x <= LAKE.x + LAKE.rx + 3; x++) {
      const c = tile(x, y), h = hash(x, y, seed + 81);
      if (reserved[y * MW + x]) continue;
      if (c === 'w' && Math.hypot((x - LAKE.x) / LAKE.rx, (y - LAKE.y) / LAKE.ry) < 0.8 && h < 0.22) { put('lily', x, y, { flat: true }); continue; }
      if (!free(x, y)) continue;

      // 잠: 숨 쉬며 가끔 z. 렉스는 깨우기 전엔 아무것도 알아채지 못하고, 밤잠 자는 초식 공룡은 날이 밝거나 불빛 · 발소리에 깬다

        this.pose = this.art.left.sleep0 ? (Math.floor(this.t / 1.2) % 2 ? 'sleep1' : 'sleep0') : 'blink';
        this.zzT -= dt; if (this.zzT <= 0) { this.say('z', 2.4); this.zzT = 3.6; }
        if (this.napping) this.checkWake(G);
        return;
      }
      // 치료를 기다리는 공룡(care: 덫에 걸려 다친 새끼): 제자리에서 움츠리고 가끔 아파한다. 알아채거나 달아나지 않는다 (G.careFor)
      if (this.care) { this.pose = Math.floor(this.t * 0.8) % 5 === 0 ? 'blink' : 'walk0'; this.careT = (this.careT || 0) - dt; if (this.careT <= 0) { this.careT = 3 + Math.random() * 2; this.say('💧', 1.4); } return; }
      if (this.trapT > 0) { this.trapT -= dt; this.pose = 'walk0'; if (Math.floor(this.t * 8) % 2) this.flashT = 0.02; return; }
      if (this.knockback(G, dt)) return;
      if (this.stunT > 0) return;
      this.angryT = Math.max(0, this.angryT - dt);
      const S = this.S;
      // 물가 짐승(바리오닉스): 0.5초마다 물에서 S.water칸 안인지 본다 — 싸우다 뭍으로 끌려 나오면 땀을 흘리며 굼떠진다 (landMul)
      if (S.water && (this.wetT = (this.wetT || 0) - dt) <= 0) {
        this.wetT = 0.5;
        const wet = G.nearWater(this.x, this.y, S.water);
        if (this.wet && !wet && this.hostile) this.say('💧', 1.2);
        this.wet = wet;
      }
      // 감지: 사나운 녀석은 보이면 쫓고, 방어형은 너무 가까우면 반격, 겁쟁이는 도망 (낚시에 정신 팔린 녀석은 절반 거리에서야 알아챈다)
      if (this.state === 'wander' || this.state === 'return') {
        const near = G.nearestParty(this, this.raid ? 1e4 : S.sight * (this.fishing ? 0.5 : 1)); // 습격대는 어디 있든 안다
        if (near) {
          const d = this.distTo(near);
          if (S.temper === 'hostile' || S.temper === 'boss') { this.provoke(near); this.threat.set(near, (this.threat.get(near) || 0) + 1); }
          else if (S.temper === 'skittish' && d < S.sight * 0.7) this.fleeFrom(near);
          else if (S.fisher && this.state === 'wander') this.guard(G, near, d);
          else if (S.temper === 'defensive' && d < this.hw + 16) { this.provoke(near); this.threat.set(near, 5); }
        }
      }
      switch (this.state) {
        case 'wander': this.wander(G, dt); break;
        case 'flee': this.flee(G, dt); break;
        case 'return': this.goHome(G, dt); break;
        case 'chase': this.chase(G, dt); break;
        case 'windup': this.windup(G, dt); break;
        case 'strike': this.strike(G, dt); break;
        case 'recover': this.pose = 'walk0'; if (this.t > (this.atk ? 0.55 + (this.atk.dash ? 0.35 : 0) : 0.5)) { this.state = 'chase'; this.t = 0; } break;
        case 'retreat': this.retreatStep(G, dt); break;
      }
    }
    walk(G, dx, dy, spd, dt) {
      const d = hyp(dx, dy) || 1;
      let ux = dx / d, uy = dy / d;
      // 막혔으면 잠깐 옆으로 비켜 돌아간다
      if (this.detour && this.detour.t > 0) { ux = this.detour.x; uy = this.detour.y; this.detour.t -= dt; }
      const bx = this.x, by = this.y;
      this.bumpX = this.bumpY = false;
      // 밤의 모닥불 · 등불 안으로는 들어가지 않는다 (막히면 아래처럼 옆으로 비켜 가장자리를 맴돈다)
      G.moveDino(this, ux * spd * dt, uy * spd * dt);
      const moved = hyp(this.x - bx, this.y - by);
      if (moved < spd * dt * 0.25) {
        this.stuckT = (this.stuckT || 0) + dt;
        if (this.stuckT > 0.35) { this.stuckT = 0; const s = Math.random() < 0.5 ? 1 : -1; this.detour = { x: -uy * s, y: ux * s, t: 0.45 + Math.random() * 0.4 }; }
      } else this.stuckT = 0;
      this.walkD += moved;
      this.pose = D.Dinos.gaitPose(this.art, 'step', this.walkD) || 'walk' + WALK[Math.floor(this.walkD / Math.max(7, this.hw / 6)) % 4];
      if (Math.abs(ux) > 0.2) this.dir = ux < 0 ? 'left' : 'right';
      return moved;
    }
    wander(G, dt) {
      // 밤이면 초식 공룡은 쉬는 참에 그 자리에서 잠든다 (놀라 깬 녀석은 awakeT 동안, 지친 녀석은 숨을 고를 때까지 깨어 있다)
      this.awakeT = Math.max(0, (this.awakeT || 0) - dt);
      if (this.S.fisher) { this.fishStep(G, dt); return; } // 바리오닉스는 돌아다니지 않고 물가의 집에서 낚시한다
      if (this.wait > 0 && this.S.night === 'sleep' && !this.awakeT && !this.tiredT && G.isNight()) { this.sleep(); return; }
      if (this.wait > 0) { this.wait -= dt; this.pose = Math.floor(this.t * 0.7) % 6 === 0 ? 'blink' : 'walk0'; return; }
      if (!this.goal) {
        const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 56;
        this.goal = { x: this.home.x + Math.cos(a) * r, y: this.home.y + Math.sin(a) * r * 0.7 };
      }
      const dx = this.goal.x - this.x, dy = this.goal.y - this.y;
      const moved = this.walk(G, dx, dy, this.S.speed, dt);
      if (hyp(dx, dy) < 4 || (moved < this.S.speed * dt * 0.2)) { this.goal = null; this.wait = 1 + Math.random() * 3; }
    }
    // 낚시 (S.fisher — 바리오닉스): 집(물가 자리)에 서서 물 쪽을 보고 주둥이를 물에 담그고 있다가, 가끔 물고기를 낚아 올려 삼킨다(물보라).
    //   그동안(fishing)은 알아채는 거리가 절반이고, 먼저 치면 기습이다 (G.hitDino). 밤엔 물가에 엎드려 기다린다(낚시는 쉰다 — 어둠 속에선 눈만).
    //   곁을 지나가는 사람이 있으면(guard) 고개를 들고 입을 벌려 위협한다 (warnT)
    fishStep(G, dt) {
      const hx = this.home.x - this.x, hy = this.home.y - this.y;
      if (hyp(hx, hy) > 6) { this.fishing = false; this.walk(G, hx, hy, this.S.speed, dt); return; }
      if (this.side === undefined || this.sideAt !== this.home) { this.side = G.waterSide(this.home.x, this.home.y, 4); this.sideAt = this.home; } // 물이 어느 쪽인가 (없으면 0)
      if (this.warnT > 0) { this.warnT -= dt; this.fishing = false; this.pose = 'windup'; return; }
      if (this.side) this.dir = this.side < 0 ? 'left' : 'right';
      if (!this.side || G.isNight()) { this.fishing = false; this.pose = 'crouch'; return; }
      this.fishing = true;
      this.fishT = (this.fishT === undefined ? 2 + Math.random() * 5 : this.fishT) - dt;
      if (this.fishT <= 0) this.catchFish(G);
      this.holdT = Math.max(0, (this.holdT || 0) - dt);
      this.pose = this.holdT > 0 ? 'fish1' : 'fish0'; // 낚아 올린 물고기를 잠깐 물고 있다가 삼킨다
    }
    catchFish(G) {
      this.fishT = 8 + Math.random() * 7; this.holdT = 1.3;
      const x = this.x + (this.dir === 'left' ? -1 : 1) * 40;
      G.fx.burst(x, this.y - 2, 10, { speed: 45, types: ['dot'], colors: ['#e6f7ff', '#9edcf5', '#5ab8e0'], life: 0.5, up: 34, g: 120 });
      const p = G.player;
      if (p && Math.abs(p.x - this.x) < 200 && Math.abs(p.y - this.y) < 140) G.sfx('splash');
    }
    // 낚시하던 녀석 곁에 누가 오면: 하루가 몸에 닿으면 싸우고, 몸 가장자리 곁(hw + 24px)을 지나가면 그쪽을 보며 위협만 한다 (길을 막지 않게).
    //   붙을지는 하루가 고른다 — 따라오던 동료가 꼬리를 스쳐도 위협만 받는다
    guard(G, m, d) {
      const p = G.player;
      if (p.state !== 'down' && capsuleDist(this, p.x, p.y) < this.hd + (p.r || 5) + 4) { this.provoke(p); this.threat.set(p, 5); return; }
      if (d >= this.hw + 24) return;
      if (!(this.warnT > 0)) { this.say('!', 1); if (Math.abs(G.player.x - this.x) < 200) G.sfx('growl'); }
      this.warnT = 1.2; this.fishing = false; this.dir = m.x < this.x ? 'left' : 'right';
    }
    // 뭍에서 굼뜬 정도 (S.water · S.slow): 물에서 멀어지면 걸음이 느려지고 예비동작이 길어진다
    get landMul() { return this.S.water && this.wet === false ? this.S.slow : 1; }
    // 갈고리(a.pull)에 걸린 사람을 입 앞으로 끌어당기고(뒤로 밀려나던 것 대신), 곧바로 이어 칠 공격(a.then)을 적어 둔다 — 구르던 사람은 맞지 않으니 이어지지 않는다
    hookIn(hit, a) {
      const mx = this.x + (this.dir === 'left' ? -1 : 1) * (this.hw + 8), my = this.y;
      for (const m of hit) {
        const dx = mx - m.x, dy = my - m.y, d = hyp(dx, dy) || 1, k = Math.min(d, a.pull) / 0.12;
        m.kx = dx / d * k; m.ky = dy / d * k; m.kT = 0.12;
      }
      if (a.then) this.chain = { id: a.then, tg: hit[0] };
    }
    flee(G, dt) {
      const s = this.fleeSrc || this.home;
      const moved = this.walk(G, this.x - s.x + (Math.random() - 0.5) * 4, this.y - s.y, this.S.run, dt);
      if (this.t > 1.8 || moved < 0.2) { this.state = 'wander'; this.t = 0; this.goal = null; this.wait = 0.8; this.home = { x: this.x, y: this.y }; }
    }
    goHome(G, dt) {
      const dx = this.home.x - this.x, dy = this.home.y - this.y;
      this.walk(G, dx, dy, this.S.speed * 1.4, dt);
      this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.05 * dt);
      // 오래 헤매면 화면 밖에서 집으로 옮겨 둔다
      const p = G.player, seen = Math.abs(this.x - p.x) < 150 && Math.abs(this.y - p.y) < 110;
      if (this.t > 8 && !seen) { this.x = this.home.x; this.y = this.home.y; }
      if (hyp(dx, dy) < 12 || (this.t > 8 && !seen)) {
        this.state = 'wander'; this.threat.clear(); this.target = null; this.homing = false;
        if (this.S.sleeps && !this.roam) { this.state = 'sleep'; this.t = 0; this.zzT = 1.5; this.dir = 'left'; G.flags.rexAwake = false; } // 사냥터로 내려온 렉스(roam)는 자지 않는다
      }
    }
    chase(G, dt) {
      const tg = this.pickTarget(G);
      // 집에서 너무 멀면(D.LEASH) 쫓기를 그만두고 돌아간다 — 방금 맞았으면 그대로 싸운다.
      //   (예전엔 맞든 곁에 서 있든 경계 밖에서 굳었다: 다시 쫓기로 넘어가자마자 같은 프레임에 또 돌아가기라 반격도 귀가도 회복도 없었다)
      const leash = hyp(this.x - this.home.x, this.y - this.home.y) > D.LEASH.r && this.hitAgo > D.LEASH.hit;
      if (!tg || leash || (this.angryT <= 0 && this.S.temper !== 'hostile' && this.S.temper !== 'boss')) {
        this.state = 'return'; this.t = 0; this.target = null; this.homing = leash; return;
      }
      this.target = tg;
      // 사냥감이 모닥불 · 등불 안에 있으면 덤비지 못하고 가장자리를 맴돌다가 (D.NIGHT.ward초) 불을 등지고 달아난다
      const ward = G.fearsFire(this) && G.wardAt(tg.x, tg.y);
      if (ward) {
        this.wardT = (this.wardT || 0) + dt;
        if (this.wardT > D.NIGHT.ward) {
          this.wardT = 0; this.target = null; this.threat.clear(); this.angryT = 0;
          this.fleeFrom(ward); if (this.state === 'chase') { this.state = 'return'; this.t = 0; }
          this.say('💧', 1.2);
          return;
        }
        this.walk(G, tg.x - this.x, tg.y - this.y, this.S.run * 0.5, dt);
        return;
      }
      this.wardT = 0;
      const d = capsuleDist(this, tg.x, tg.y) - this.hd;
      // 쓸 수 있는 공격 고르기
      const ready = this.S.attacks.filter(a => !this.cds[a.id] && (a.zone === 'none' ? this.t > 1.5 : d < a.range * (a.dash ? 1 : 0.85)));
      if (ready.length && this.t > 0.25) {
        const a = ready.sort((p, q) => (q.dash ? 1 : 0) - (p.dash ? 1 : 0) + (Math.random() - 0.5))[0];
        return this.beginAttack(G, a, tg);
      }
      const spd = (this.enraged ? 1.25 : 1) * (d > 60 ? this.S.run : this.S.run * 0.7) * this.landMul;
      if (d > 6) this.walk(G, tg.x - this.x, tg.y - this.y, spd, dt);
      else { this.pose = 'walk0'; this.dir = tg.x < this.x ? 'left' : 'right'; }
    }
    beginAttack(G, a, tg) {
      this.atk = a; this.state = 'windup'; this.t = 0; this.hitSet = new Set(); this.chain = null;
      this.dir = tg.x < this.x ? 'left' : 'right';
      let ux = tg.x - this.x, uy = (tg.y - this.y);
      const m = hyp(ux, uy) || 1; ux /= m; uy /= m;
      if (a.zone === 'tail') { ux = this.dir === 'left' ? 1 : -1; uy = 0; }
      this.aim = { ux, uy };
      this.zone = G.makeZone(this, a, ux, uy);
      this.say('!', a.windup);
      if (G.onDinoWindup) G.onDinoWindup(this, a, tg);
      if (a.id === 'roar') { G.sfx('roar'); G.shake.hit(3, 0.8); }
    }
    windup(G, dt) {
      const a = this.atk;
      const flick = Math.floor(this.t * 14) % 2;
      this.pose = a.pose ? a.pose : (flick ? 'windup' : 'walk0');
      if (this.t >= a.windup * (this.enraged ? 0.8 : 1) / this.landMul) {
        this.state = 'strike'; this.t = 0;
        if (a.dash) { this.dashLeft = a.range; }
        else { const hit = G.applyZone(this, this.zone, a); G.zonesRemove(this); this.zone = null; if (a.pull && hit.length) this.hookIn(hit, a); }
        if (a.id === 'roar') G.roar(this, a);
        if (a.id === 'stomp') { G.shake.hit(5, 0.35); G.fx.burst(this.x, this.y, 16, { speed: 90, types: ['dot'], colors: ['#c89a62', '#e6a766', '#8a5a3c'], life: 0.6 }); G.sfx('smash'); }
        else if (a.dash) G.sfx('charge');
        else G.sfx('bite');
      }
    }
    strike(G, dt) {
      const a = this.atk;
      this.pose = a.hit || a.pose || 'strike'; // (hit: 공격하는 순간의 자세가 준비 자세와 다를 때 — 바리오닉스의 갈고리)
      if (a.dash && this.dashLeft > 0) {
        const step = a.dash * dt;
        const bx = this.x, by = this.y;
        G.moveDino(this, this.aim.ux * step, this.aim.uy * step * 0.9); // 불 앞에서 멈춘다
        const moved = hyp(this.x - bx, this.y - by);
        this.dashLeft -= Math.max(moved, step * 0.25);
        G.dashHit(this, a);
        if (moved < step * 0.2) this.dashLeft = 0;
        if (this.dashLeft <= 0) { G.zonesRemove(this); this.zone = null; this.state = 'recover'; this.t = 0; this.cds[a.id] = a.cd * (this.enraged ? 0.75 : 1); }
        this.walkD += moved;
        if (!a.pose) this.pose = D.Dinos.gaitPose(this.art, 'charge', this.walkD) || this.pose; // 돌진 중에도 다리를 놀린다 (렉스)
        return;
      }
      // 갈고리에 걸린 사람이 있으면(chain) 한 박자 쉬었다가 곧바로 이어 친다 — 맞은 뒤 무적(0.7초)이 끝날 무렵 닿게, 경고 구역은 제 예비동작만큼 보인다
      const c = this.chain;
      if (this.t > (c ? 0.3 : 0.18)) {
        this.cds[a.id] = a.cd * (this.enraged ? 0.75 : 1); this.chain = null;
        const next = c && this.S.attacks.find(b => b.id === c.id);
        if (next && c.tg && !c.tg.down && c.tg.state !== 'down') { this.beginAttack(G, next, c.tg); return; }
        this.state = 'recover'; this.t = 0;
      }
    }
    drawObj(t) {
      const art = this.art;
      let pose = this.pose;
      // 대기 중엔 살짝 위아래로 흔들림
      const bob = (this.state === 'wander' && this.wait > 0 && !this.dead) ? (Math.floor((t / 520) + this.uid) % 2) : 0;
      if (this.hurtT > 0 && art.left.hurt && this.state !== 'windup' && this.state !== 'strike' && this.state !== 'sleep') pose = 'hurt';
      const ob = { x: this.x, y: this.y - bob, ax: art.w >> 1, ay: art.foot, shadow: true, sw: Math.round(art.w * 0.62), spr: art[this.dir][pose], emote: this.emote, head: art.foot + 4, alpha: this.alpha };
      if (art.left.sleep0) { ob.ex = (this.dir === 'left' ? -1 : 1) * 50; ob.head = this.state === 'sleep' || this.dead ? 32 : art.foot - 12; }
      if (this.flashT > 0) { ob.flash = true; ob.white = art.white[this.dir][pose]; if (art.w > 120) ob.flashA = 0.45; }
      return ob;
    }
  }

  /* ================= 떨어진 아이템 ================= */
  // dur: 버린 무기·옷의 남은 내구도 (다시 주우면 그대로)
  class Pickup {
    constructor(item, n, x, y, dur) {
      this.item = item; this.n = n; this.dur = dur; this.x = x; this.y = y; this.z = 6; this.vz = 50 + Math.random() * 30;
      const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 30; this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s * 0.6;
      this.t = 0; this.remove = false; this.area = D.Play.area();
    }
    update(dt, G) {
      this.t += dt;
      if (this.z > 0 || this.vz > 0) { this.vz -= 220 * dt; this.z = Math.max(0, this.z + this.vz * dt); G.moveEnt(this, this.vx * dt, this.vy * dt); if (this.z === 0) { this.vx *= 0.5; this.vy *= 0.5; if (this.vz < 0) this.vz = Math.abs(this.vz) > 30 ? -this.vz * 0.35 : 0; } }
      const p = G.player, d = hyp(p.x - this.x, p.y - this.y);
      if (this.t > 0.45 && p.state !== 'down') {
        if (d < 26) { this.x += (p.x - this.x) * Math.min(1, dt * 10); this.y += (p.y - this.y) * Math.min(1, dt * 10); }
        if (d < 8) { if (G.give(this.item, this.n, true, this.dur)) this.remove = true; }
      }
      if (this.t > 120) this.remove = true;
    }
    drawObj(t) {
      const ic = D.UI.icon(D.Items[this.item].icon);
      const hover = this.z > 0 ? 0 : Math.round(Math.sin(t / 250 + this.x) * 1);
      return { x: this.x, y: this.y, ax: 7, ay: 13 + Math.round(this.z) + hover, spr: ic, shadow: true, sw: 8 };
    }
  }

  /* ================= 떨군 꾸러미 (쓰러진 자리) ================= */
  // 쓰러지며 떨군 재료 묶음 [[id, 개수], …]. 사라지지 않고, 하루가 닿으면 가방에 도로 담는다 (가방이 차면 못 담은 것은 남는다)
  class Bundle {
    constructor(items, x, y) { this.items = items; this.x = x; this.y = y; this.touch = false; this.remove = false; }
    update(dt, G) {
      const p = G.player;

      const s = pick((k, sg) => !g.hit(e.x + dx, e.y + sg * k, r), (k, sg) => !g.hit(e.x, e.y + sg * k, r));
      if (s) g.move(e, 0, s * Math.abs(dx));
    } else if (e.bumpY && dy && Math.abs(dx) < Math.abs(dy) * 0.5) {
      const s = pick((k, sg) => !g.hit(e.x + sg * k, e.y + dy, r), (k, sg) => !g.hit(e.x + sg * k, e.y, r));
      if (s) g.move(e, s * Math.abs(dy), 0);
    }
  };

  /* ---------------- 인벤토리 ---------------- */
  // 가방 한 칸 = [id, 개수]. 닳는 물건(무기·도구·옷)은 한 칸에 하나씩 [id, 1, 남은 내구도]
  // 장비한 물건은 가방에서 빠져 그 사람의 장비칸(gear)에 들어간다
  G.durable = id => !!(D.Items[id] && D.Items[id].dur);
  G.count = id => { let n = 0; for (const s of G.inv) if (s[0] === id) n += s[1]; return n; };
  // 가방 + 모두의 장비칸 ('~ 만들기' 퀘스트 확인용: 만들자마자 장비해도 센다)
  G.has = id => G.count(id) + G.members().reduce((n, m) => n + D.SLOTS.filter(k => m.gear[k] && m.gear[k][0] === id).length, 0);
  G.give = function (id, n, toast, dur) {
    if (!n) return true;
    const it = D.Items[id];
    if (it.dur) {
      for (let i = 0; i < n; i++) {
        if (G.inv.length >= MAX_SLOTS) { G.toast('가방이 가득 찼다!', null, 0, '#ff8a7a'); return false; }
        G.inv.push([id, 1, dur > 0 ? Math.min(it.dur, dur) : it.dur]);
      }
    } else {
      const slot = G.inv.find(s => s[0] === id);
      if (slot) slot[1] = Math.min(999, slot[1] + n);
      else { if (G.inv.length >= MAX_SLOTS) { G.toast('가방이 가득 찼다!', null, 0, '#ff8a7a'); return false; } G.inv.push([id, n]); }
    }
    if (toast) G.toast(it.name, it.icon, n);
    G.sfx('pick');
    G.questCheck();
    return true;
  };
  G.take = function (id, n) {
    for (let i = G.inv.length - 1; i >= 0 && n > 0; i--) {
      const s = G.inv[i];
      if (s[0] !== id) continue;
      const k = Math.min(n, s[1]); s[1] -= k; n -= k;
      if (s[1] <= 0) G.inv.splice(i, 1);
    }
    return n <= 0;
  };
  // 가방에서 그 칸을 통째로 뺀다
  G.removeSlot = function (s) { const i = G.inv.indexOf(s); if (i >= 0) G.inv.splice(i, 1); };

  /* ---------------- 장비 ---------------- */
  // 장비할 수 있는 사람: 하루 · 잭 · 미나 (꼬미는 gear가 없다). 칸은 D.SLOTS (머리 · 상의 · 하의 · 무기)
  G.members = () => [G.player, ...G.party.filter(b => b.gear)];
  G.gear = slot => G.player.gear[slot] || null; // 하루의 그 칸
  // 가방의 그 한 개를 m에게 입히거나 쥐여 준다 (그 칸에 있던 것은 가방으로)
  G.equipTo = function (m, s) {
    const slot = s && D.slotOf(s[0]), i = G.inv.indexOf(s);
    if (!m.gear || !slot || i < 0) return false;
    const old = m.gear[slot];
    G.inv.splice(i, 1);
    if (old) G.inv.push(old);
    m.gear[slot] = s;
    return true;
  };
  // 벗어서 가방에 넣는다 (가방이 가득 차면 못 벗는다)
  G.unequip = function (m, slot) {
    const s = m.gear && m.gear[slot];
    if (!s) return true;
    if (G.inv.length >= MAX_SLOTS) { G.toast('가방이 가득 찼다!', null, 0, '#ff8a7a'); G.sfx('cancel'); return false; }
    m.gear[slot] = null; G.inv.push(s);
    return true;
  };
  // 그 한 개를 누가 어느 칸에 장비하고 있나 (가방에 있으면 null)
  function wornBy(s) { for (const m of G.members()) for (const k of D.SLOTS) if (m.gear[k] === s) return { m, k }; return null; }
  // 저장된 장비칸 정리 (없는 아이템 · 칸에 맞지 않는 것은 버린다)
  G.normGear = function (g) {
    const out = A.newGear();
    for (const k of D.SLOTS) {
      const s = g && g[k], it = s && D.Items[s[0]];
      if (it && it.dur && D.slotOf(s[0]) === k) out[k] = [s[0], 1, s[2] > 0 ? Math.min(it.dur, s[2]) : it.dur];
    }
    return out;
  };

  /* ---------------- 내구도 ---------------- */
  const DUR_WARN = D.DUR_WARN;
  const SKIN_WEAR = 2; // 돌칼로 가죽을 한 번 벗길 때 닳는 양
  // 채집·가죽 벗기기에 쓸 도구: 하루가 든 게 그 도구면 그것, 아니면 가방에서 가장 닳은 것부터
  G.toolSlot = function (tool) {
    const w = G.gear('weapon');
    if (w && D.Items[w[0]].tool === tool) return w;
    let best = null;
    for (const s of G.inv) if (D.Items[s[0]].tool === tool && (!best || s[2] < best[2])) best = s;
    return best;
  };
  G.hasTool = tool => !!G.toolSlot(tool);
  // 닳는 모습: [곧 ~할 것 같다, ~했다]
  const worn = it => it.burn ? ['꺼질', '다 타 버렸다'] : it.soft ? ['해질', '해져 버렸다'] : ['부서질', '부서졌다'];
  G.wear = (slot, n) => G.wearSlot(G.gear(slot), n); // 하루의 그 칸
  G.wearArmor = m => { if (m.gear) for (const k of ['head', 'top', 'bottom']) G.wearSlot(m.gear[k], 1); };
  const ownerOf = who => who ? who.name + '의 ' : ''; // 동료 것이면 '잭의 '
  G.wearSlot = function (s, n) {
    if (!s || !(n > 0) || !G.durable(s[0])) return;
    const it = D.Items[s[0]], before = s[2], at = wornBy(s), who = at && at.m !== G.player ? at.m : null;
    s[2] = Math.max(0, before - n);
    if (!who && it.kind !== 'light') { if (it.kind === 'weapon') G.gearLast = s; G.gearT = 2.5; } // HUD에는 하루 것만 (켜진 횃불은 따로 한 줄)
    if (s[2] <= 0) { breakSlot(s, at); return; }
    if (before > it.dur * DUR_WARN && s[2] <= it.dur * DUR_WARN) {
      G.toast(ownerOf(who) + D.josa(it.name, '이가') + ' 곧 ' + worn(it)[0] + ' 것 같다', it.icon, 0, '#ffb890');
      G.sfx('warn');
    }
  };
  function breakSlot(s, at) {
    const it = D.Items[s[0]], p = G.player, m = at ? at.m : p, who = m !== p ? m : null;
    if (at) m.gear[at.k] = null; else G.removeSlot(s);
    if (G.gearLast === s) G.gearLast = null;
    G.toast(ownerOf(who) + D.josa(it.name, '이가') + ' ' + worn(it)[1] + '!', it.icon, 0, '#ff8a7a');
    G.sfx('break');
    if (!who) G.shake.hit(2, 0.2);
    G.fx.burst(m.x, m.y - 14, 10, { speed: 55, types: ['dot'], colors: it.burn ? ['#9a8ea4', '#5a5068', '#f39a3a'] : ['#dcd0d4', '#9a6a44', '#fbf8ff'], life: 0.5, g: 160, up: 20 });
    // 하루가 장비하던 것: 같은 물건 여벌 → 없으면 가방에서 그 칸에 맞는 가장 좋은 것
    // 동료는 가방을 뒤지지 않는다 (하루의 여벌을 가져가 버리지 않게, [장비]에서 챙겨 준다)
    if (!at || who) return;
    const slot = at.k, key = slot === 'weapon' ? 'atk' : 'def';
    let next = G.inv.find(x => x[0] === s[0]);
    const same = !!next;
    if (!next) for (const x of G.inv) { const xi = D.Items[x[0]]; if (D.slotOf(x[0]) === slot && (!next || xi[key] > D.Items[next[0]][key])) next = x; }
    if (!next) return;
    G.equipTo(p, next);
    G.toast((same ? '새 ' : '') + D.josa(D.Items[next[0]].name, '을를') + (same ? ' 꺼내 ' : ' 대신 ') + (slot === 'weapon' ? '들었다' : '입었다'), D.Items[next[0]].icon, 0);
  }
  // 저장된 가방 정리: 닳는 물건은 한 칸에 하나씩, 내구도가 없던 옛 저장은 새것으로 친다
  function normInv(list) {
    const out = [];
    for (const s of list || []) {
      const it = D.Items[s[0]];
      if (!it || !(s[1] > 0)) continue;
      if (!it.dur) { out.push([s[0], s[1]]); continue; }
      for (let i = 0; i < s[1]; i++) out.push([s[0], 1, i === 0 && s[2] > 0 ? Math.min(it.dur, s[2]) : it.dur]);
    }
    return out;
  }

  /* ---------------- 횃불 ---------------- */
  // 장비칸을 쓰지 않는 도구: 가방에 있으면 밤에 저절로 켜져 하루 둘레를 밝힌다 (손에 든 모습은 그리지 않는다). 켜 둔 동안 가장 많이 탄 것부터 탄다
  // G.torchOn: 이 밤에 켜 둘까. 가방 · F로 끄면 그 밤은 꺼 두고(어둠 속에 숨기), 날이 밝으면 다시 켜는 쪽으로 돌아간다
  G.torchSlot = function () {
    let best = null;
    for (const s of G.inv) if (D.Items[s[0]].kind === 'light' && (!best || s[2] < best[2])) best = s;
    return best;
  };
  G.torchLit = () => G.torchOn && G.isNight() && !G.inside && G.player.state !== 'down' && !!G.torchSlot();
  G.toggleTorch = function () {
    if (!G.torchSlot()) { G.toast('횃불이 없다 (나뭇가지 1 · 섬유 2로 맨손 제작)', 'torch', 0, '#ff8a7a'); G.sfx('cancel'); return; }
    if (!G.isNight()) { G.toast('횃불은 밤이 되면 저절로 켜진다', 'torch', 0, '#b9b2e0'); G.sfx('cancel'); return; }
    G.torchOn = !G.torchOn;
    G.toast(G.torchOn ? '횃불을 켰다' : '횃불을 껐다 (어둠 속에서는 눈에 덜 띈다)', 'torch', 0);
    G.sfx(G.torchOn ? 'ok' : 'cancel');
    G.torchWas = G.player.torchLit = G.torchLit(); // 켜고 끈 알림은 방금 띄웠다
  };
  // 매 프레임: 켜진 횃불이 탄다 (burn이 0이면 대사 · 연출 중이라 멈춤) · 켜지고 꺼질 때 알린다
  function tickTorch(burn) {
    if (!G.isNight()) G.torchOn = true;
    const was = G.torchWas;
    if (G.torchLit() && burn > 0) {
      const s = G.torchSlot();
      G.wearSlot(s, D.Items[s[0]].burn * burn); // 다 타면 wearSlot이 알리고 가방에서 뺀다
      if (G.inv.indexOf(s) < 0 && G.torchSlot()) G.toast('새 횃불에 불을 옮겨 붙였다', 'torch', 0);
    }
    const lit = G.torchLit();
    if (lit && !was) {
      G.toast(G.flags.torchTold ? '횃불을 켰다' : '어두워지자 횃불이 저절로 켜졌다', 'torch', 0);
      if (!G.flags.torchTold) G.toast('F나 [가방]에서 끄고 켠다', null, 0, '#b9b2e0');
      G.flags.torchTold = true;
    }
    if (!lit && was && G.phase() === 'dawn') G.toast('날이 밝아 횃불을 껐다', 'torch', 0, '#b9b2e0');
    G.torchWas = G.player.torchLit = lit;
  }
  // 옛 저장: 무기 칸에 들려 있던 횃불은 가방으로 (횃불은 이제 장비칸을 쓰지 않는다)
  function torchToBag(g) {
    const s = g && g.weapon, it = s && D.Items[s[0]];
    if (!it || it.kind !== 'light') return;
    g.weapon = null;
    G.inv.push([s[0], 1, s[2] > 0 ? Math.min(it.dur, s[2]) : it.dur]);
  }

  /* ---------------- 드랍 ---------------- */
  // 드랍표 굴리기: [아이템, 개수, 확률, 보정] → [[아이템, 개수], ...] (같은 아이템은 합침)
  // 보정 k: k번 연속 꽝이면 다음엔 반드시 (G.luck에 연속 꽝 횟수를 저장)
  G.roll = function (list) {
    const out = [];
    for (const [id, n, pr, pity] of list) {
      let hit = pr == null || Math.random() < pr;
      if (pity) { const miss = G.luck[id] || 0; if (!hit && miss >= pity) hit = true; G.luck[id] = hit ? 0 : miss + 1; }
      if (!hit) continue;
      const r = out.find(r => r[0] === id);
      if (r) r[1] += n; else out.push([id, n]);
    }
    return out;
  };

  /* ---------------- 제작 ---------------- */
  G.stationsNear = function () {
    const p = G.player, out = { hand: true, bench: false, fire: false };
    for (const o of G.objs) {
      if (!o.station || o.gone) continue;
      if (hyp(o.x - p.x, o.y - p.y) < 44) out[o.station] = true;
    }
    return out;
  };
  G.recipeList = function (filter) {
    const st = G.stationsNear();
    return D.Recipes.filter(r => !filter || r.at === filter).map(r => {
      const it = D.Items[r.id];
      const matsOk = r.need.every(([id, n]) => G.count(id) >= n);
      const stOk = st[r.at];
      return { r, id: r.id, name: it.name + (r.n > 1 ? ' ×' + r.n : ''), icon: it.icon, need: r.need, ok: matsOk && stOk, matsOk, stOk, dur: it.dur || 0,
        desc: (stOk ? '' : '[' + D.STATION_NAME[r.at] + ' 근처에서] ') + it.desc };
    });
  };
  G.craft = function (row) {
    if (!row.ok) { G.sfx('cancel'); return false; }
    // 가방에 새 칸이 모자라면 재료를 쓰기 전에 멈춘다 (닳는 물건은 하나마다 한 칸)
    const newSlots = G.durable(row.id) ? row.r.n : G.count(row.id) ? 0 : 1, freed = row.need.filter(([id, n]) => G.count(id) === n).length;
    if (G.inv.length - freed + newSlots > MAX_SLOTS) { G.toast('가방이 가득 찼다!', null, 0, '#ff8a7a'); G.sfx('cancel'); return false; }
    for (const [id, n] of row.need) G.take(id, n);
    G.give(row.id, row.r.n, false);
    G.toast(D.Items[row.id].name + ' 완성!', D.Items[row.id].icon, row.r.n, P.accent);
    G.sfx('craft');
    G.fx.burst(G.player.x, G.player.y - 18, 12, { speed: 50, types: ['star', 'dot'], colors: ['#ffe066', '#fbf8ff'], life: 0.6, up: 20 });
    G.gainExp(4);
    G.flags['made_' + row.id] = true;
    // 무기·옷은 하루의 그 칸이 비었거나 지금 것보다 좋으면 방금 만든 것을 바로 장비 (횃불은 장비칸 없이 가방에서 켠다)
    const it = D.Items[row.id], slot = D.slotOf(row.id), cur = slot && G.gear(slot), key = slot === 'weapon' ? 'atk' : 'def';
    if (slot && (!cur || D.Items[cur[0]][key] < it[key])) G.equipTo(G.player, G.inv.filter(s => s[0] === row.id).pop());
    G.questCheck();
    return true;
  };

  /* ---------------- 알림·숫자·소리 ---------------- */
  // short: 싸움 중 동료 소식처럼 자잘한 알림은 짧게 (화면을 오래 가리지 않게)
  G.toast = function (text, icon, n, color, short) {
    const life = short ? 1.3 : 2.2, last = G.toasts[G.toasts.length - 1];
    if (last && last.text === text && last.icon === icon && last.life > 0.8) { last.n = (last.n || 0) + (n || 0); last.life = life; return; }
    G.toasts.push({ text, icon, n, color, life });
    if (G.toasts.length > 4) G.toasts.shift();
  };
  G.number = function (x, y, v, c, big) { G.nums.push({ x, y, v, c: c || '#fbf8ff', t: 0, big }); };
  // 고리 (연출): 반지름 r0 → r1로 dur초 동안 퍼지거나 줄어든다 (하늘의 틈이 닫힘 · 땅울림)
  G.addRing = (x, y, r0, r1, dur, c) => G.rings.push({ x, y, r0, r1, dur, c, t: 0 });
  // 외침: 게임을 멈추지 않는 짧은 말풍선 (싸움 중 동료의 한마디). key가 있으면 그 말은 cd초 동안 다시 하지 않는다 · 한꺼번에 둘까지
  G.bark = function (k, text, o) {
    o = o || {};

    if (G.barkCD[key] > now || (!o.force && G.barkAt > now - 0.9)) return false; // force: 중요한 외침은 바로 앞 외침과 겹쳐도 띄운다
    G.barkCD[key] = now + (o.cd || 8); G.barkAt = now;
    G.barks = G.barks.filter(b => b.e !== e);
    G.barks.push({ e, text, t: 0, dur: o.dur || 2 });
    if (G.barks.length > 2) G.barks.shift();
    return true;
  };
  G.sfx = n => { if (!G.hushed) D.Audio.sfx(n); }; // (hushed: 연출이 잠깐 소리를 죽인다 — 렉스를 몰아낸 뒤의 고요함)

  /* ---------------- 전투 ---------------- */
  // 칠 수 없는 공룡: 쓰러졌거나, 다치지 않고 물러나는 중(렉스)이거나, 치료를 기다리는 중(덫에 걸린 새끼)
  const untouchable = d => d.dead || (d.fled && d.retreat.safe) || !!d.care;
  G.hitDino = function (d, dmg, src, o) {
    if (!d || untouchable(d)) return;
    o = o || {};
    // 기습: 밤잠 자는 초식 공룡 · 낚시에 정신 팔린 바리오닉스를 하루가 먼저 치면 D.NIGHT.sneak배 (치명타로 보인다). 렉스의 둥지 잠은 빼고
    const fishing = !!d.fishing, sneak = (d.napping || fishing) && src === G.player;
    const crit = sneak || (!o.small && Math.random() < 0.12);
    const val = Math.round(dmg * (0.9 + Math.random() * 0.2) * (sneak ? D.NIGHT.sneak : crit ? 1.6 : 1));
    const dealt = d.hurt(G, val, src, { crit, stagger: o.stagger, pierce: o.pierce, pull: o.pull });
    if (sneak) G.toast((fishing ? '낚시하던 ' : '잠든 ') + D.josa(d.name, '을를') + ' 기습했다!', null, 0, P.accent);
    if (d.state === 'sleep' && d.S.sleeps && !d.dead && G.wakeRex) G.wakeRex(d, 'hit');
    G.number(d.x + (Math.random() - 0.5) * 12, d.y - d.art.foot * 0.7 - 6, dealt, crit ? '#ffe066' : '#fbf8ff', crit);
    G.fx.burst(d.x + (src ? Math.sign(src.x - d.x) * d.hw * 0.4 : 0), d.y - Math.min(30, d.art.foot * 0.5), crit ? 12 : 5,
      { speed: crit ? 80 : 50, types: ['star', 'dot'], colors: ['#ffe066', '#fbf8ff', '#f39a3a'], life: 0.5 });
    if (src === G.player) { G.hitStop = crit ? 0.09 : 0.045; G.lastTarget = d; G.lastTargetT = 6; if (crit) G.shake.hit(3, 0.2); }
    G.combatT = 8;
    G.sfx(crit ? 'smash' : o.small ? 'hit2' : 'hit');
  };
  G.throwStone = function (owner, tg, dmg) { G.projs.push(new A.Stone(owner, tg, dmg)); G.sfx('throw'); };
  // 경고 구역 만들기
  G.makeZone = function (d, a, ux, uy) {

    let pts, cx = d.x, cy = d.y;
    const rect = (sx, sy, len, w) => [[sx + px * w / 2, sy + py * w / 2 * 0.7], [sx + ux * len + px * w / 2, sy + uy * len * 0.8 + py * w / 2 * 0.7],
      [sx + ux * len - px * w / 2, sy + uy * len * 0.8 - py * w / 2 * 0.7], [sx - px * w / 2, sy - py * w / 2 * 0.7]];
    if (a.zone === 'bite') { pts = rect(hx - ux * 6, hy, a.range + 6, a.w); cx = hx + ux * a.range / 2; cy = hy + uy * a.range / 2; }
    else if (a.zone === 'line') { pts = rect(d.x, d.y, a.range + d.hw, a.w); cx = d.x + ux * a.range / 2; cy = d.y + uy * a.range / 2; }

      cx = hx + ux * a.range / 2; cy = hy + uy * a.range / 2;
    } else if (a.zone === 'circle') {
      pts = []; for (let k = 0; k < 20; k++) { const an = k / 20 * Math.PI * 2; pts.push([d.x + Math.cos(an) * a.range, d.y + Math.sin(an) * a.range * 0.6]); }
    } else return null;
    const z = { owner: d, pts, cx, cy, ux, uy, t0: G.t, dur: a.windup, kind: a.zone };

  G.zonesRemove = owner => { G.zones = G.zones.filter(z => z.owner !== owner); };
  G.zoneAt = function (x, y, r) {

  // 부상 (D.WOUND): 최대 체력이 줄어 음식 · 연고로는 그만큼 못 채운다. 하루가 든든하면(요리) 한 번 막는다 (쓰러짐 몫은 못 막는다)

  // 쉬거나 자면: 부상이 낫고 체력 · 기력이 차고, 쓰러진 동료가 일어나고, 미나의 약 주머니가 찬다

  // 공룡 치료: 다친 공룡(care)에게 가방의 약초 연고를 발라 준다. 누가 발랐는지(who)를 받고 그 사람과 유대가 생긴다
  // (멀티를 위해 하루 한 명을 가정하지 않는다. 3장에서 죽어 가는 렉스를 살릴 때 같은 동작을 쓴다)
  G.careFor = function (who, d) {

  G.attack = function (enemy) {

    p.cdLeft = p.cd;

  /* ---------------- 대본 실행 ---------------- */
  // 단계:

  }
  function who(k) {

  }

  const whos = k => (Array.isArray(k) ? k : [k]).map(who).filter(Boolean);
  // w가 to(이름 · 자리)를 바라보게 (공룡은 좌우만)
  function faceTo(w, to) {
    const t = who(to);
    if (!t) return;
    const dx = t.x - w.x, dy = t.y - w.y;
    if (w.pose && !w.cast) { if (Math.abs(dx) > 1) w.dir = dx < 0 ? 'left' : 'right'; }
    else w.dir = A.dir4(dx, dy, w.dir);
  }
  // 대사를 하는 사람: 이름이 같은 사람 가운데 화면 가운데에 가장 가까운 사람 (보이지 않는 사람은 빼고)
  function speakerOf(say) {

  }
  // 쓰러진 동료를 일으킨다 (싸움이 끝나고 이야기를 나눌 때 — 쓰러진 채 말하지 않게)
  G.rally = function () { for (const b of G.party) if (b.down) { b.revive(0.4); b.emote = null; } };

  /* 여럿이 함께 걷기: 걷는 사람 목록 (대본이 흐르는 동안 매 프레임 한 걸음씩) */
  G.movers = [];
  function startMove(m) {
    const w = who(m.who);

    G.movers = G.movers.filter(o => o.w !== w); // 같은 사람이 걷던 길은 버린다
    G.movers.push({ w, x: m.x, y: m.y, spd: m.spd || 50, face: m.face, via: (m.via || []).slice() });
  }
  // 한 걸음. 닿았으면 참

    w.walkD = (w.walkD || 0) + spd * dt;
    if (w.cast || w.id) { w.f = D.Chars.WALK[Math.floor(w.walkD / 7) % 4]; w.dir = A.dir4(dx, dy, w.dir); }

  function finishMoves() { for (const m of G.movers) { m.w.x = m.x; m.w.y = m.y; m.w.f = 0; if (m.w.pose) m.w.pose = 'walk0'; arrive(m); } G.movers = []; }
  // 동료가 설 자리: to(이름 · 자리)를 바라보는 하루(또는 at) 뒤로 잭 · 미나가 양옆, 꼬미는 하루 곁

  //   위아래를 보면 잭은 왼쪽 · 미나는 오른쪽 (한 발 뒤), 옆을 보면 둘 다 하루 뒤에서 위아래로 나란히

        // (연출 중엔 달빛에 흐릿하게라도 보인다 — 장면의 주인공이 어둠에 사라지지 않게. lurk: 연출 중에도 불빛 밖이면 눈빛만 — 1장 끝 굴레 쓴 랩터)

    }
    for (const k of G.pickups) if ((k.area || '') === area && inView(k.x, k.y, 10)) {

    }
    if (!G.inside) for (const b of G.bundles) if (inView(b.x, b.y, 10)) {

      if (dark && !seen(b.x, b.y - 4)) { ob.hidden = true; glints.push(b); }

    }
    for (const pj of G.projs) objs.push(pj.drawObj());
    // 이모트는 어둠 뒤에 그리려고 따로

    for (const ob of objs) if (ob.emote) { emotes.push({ ob, e: ob.emote }); ob.emote = null; }
    D.drawWorld(l, { pix: null }, objs, cx, cy, t, { skipGround: true, wires: G.inside ? null : G.wires });
    // 가려진 하루 · 동료는 실루엣으로 비춘다: 큰 공룡 몸 뒤의 하루(노란 테) · 나무나 성벽(tall)처럼 키 큰 것 뒤의 하루와 동료(하루는 노랑, 동료는 흰 테)

    const xray = (ob, rimC) => {
      const ox = Math.round(ob.x - ob.ax - cx), oy = Math.round(ob.y - ob.ay - cy);
      const rim = ob.spr.silhouette(rimC).canvas(), body = ob.spr.silhouette('#3a2a6a').canvas();
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) l.drawImage(rim, ox + dx, oy + dy);
      l.globalAlpha = 0.85; l.drawImage(body, ox, oy); l.globalAlpha = 1;
    };
    if (!G.inside) {
      const tall = objs.filter(ob => ob.obj && ob.spr && !ob.hidden && (ob.obj.node === 'tree' || ob.obj.tall) && (ob.spr.h || ob.spr.height) > 28);
      const behindTree = ob => {
        const w = ob.spr.w || ob.spr.width, h = ob.spr.h || ob.spr.height, x0 = ob.x - ob.ax, y0 = ob.y - ob.ay;
        return tall.some(q => { const qw = q.spr.w || q.spr.width, qx = q.x - q.ax; return q.y > ob.y + 1 && qx + 4 < x0 + w && qx + qw - 4 > x0 && q.y - q.ay < y0 + h * 0.4; });
      };
      const behindDino = G.dinos.some(d => !d.dead && d.y > p.y && d.y - d.art.foot + 6 < p.y - 6 && Math.abs(d.x - p.x) < d.art.w * 0.42 && !hid.some(ob => ob.dino === d));
      if (pob.spr && pob.spr.silhouette && (behindDino || behindTree(pob))) xray(pob, '#ffe066');
      for (const ob of mates) if (ob.spr && ob.spr.silhouette && !ob.hidden && behindTree(ob)) xray(ob, '#e6e0ff');
    }
    G.fx.draw(l, cx, cy);
    for (const r of G.rings) { const k = r.t / r.dur; drawRing(l, r.x - cx, r.y - cy, r.r0 + (r.r1 - r.r0) * ease(k), r.c, k > 0.65); }
    // 시간대
    const ph = G.phase(), c = G.clock;
    if (ph === 'dusk') D.FX.multiply(l, D.col.mix('#ffffff', '#ffb890', Math.min(1, (c - 0.62) / 0.04)), VW, VH);
    else if (ph === 'night') {
      // 불빛은 화면 좌표로, 공룡의 공격 경고 구역은 어둠 속에서도 붉게 빛난다
      const k = Math.min(1, (c - 0.7) / 0.04), nightC = D.col.mix('#ffb890', '#46489a', k);
      const ls = G.lightList().map(q => Object.assign({}, q, { x: q.x - cx, y: q.y - cy }));
      const glows = G.zones.map(z => ({ pts: z.pts.map(([x, y]) => [Math.round(x - cx), Math.round(y - cy)]), c: '#e8b0a0' }));
      D.FX.darkness(l, VW, VH, nightC, ls, t, glows);
    } else if (ph === 'dawn') D.FX.multiply(l, D.col.mix('#8a86c8', '#ffffff', (c - 0.93) / 0.07), VW, VH);
    if (G.drawMood) G.drawMood(l, t);
    if (dark) { drawEyes(l, hid, cx, cy, t); drawGlints(l, glints, cx, cy, t); }
    if (G.placing) drawPlacing(l, cx, cy, t);
    // 밤에도 보이는 것: 이모트·숫자
    for (const { ob, e } of emotes) {
      const hop = Math.floor(t / 400) % 2;
      l.drawImage(UI.emote(e).canvas(), Math.round(ob.x + (ob.ex || 0) - 5 - cx), Math.round(ob.y - (ob.head || 24) - 13 - hop - cy));
    }
    for (const n of G.nums) {
      const yy = n.y - Math.min(12, n.t * 30) - cy;
      TX.drawDigits(l, String(n.v), n.x - cx, yy, n.c, { outline: P.outline, align: 'center' });
    }
    // 행동 대상 표시
    if (!G.lock && !G.menu && !G.placing && p.state !== 'down') drawTargetHint(l, cx, cy, t);
    if (G.desat > 0) D.FX.desaturate(l, VW, VH, G.desat);
    G.flash.draw(l, VW, VH);
    // 영화처럼: 위아래 검은 띠 ({cine}). 그동안 HUD는 숨긴다
    if (G.cineK > 0.01) { const h = Math.round(CINE_BAR * G.cineK); l.fillStyle = '#0c0a1d'; l.fillRect(0, 0, VW, h); l.fillRect(0, VH - h, VW, h); }
    // HUD · 외침 말풍선 (HUD 위에 — 보스 체력 막대에 가리지 않게)
    if (G.cineK < 0.4) drawHud(l, t);
    for (const b of G.barks) drawBark(l, b, cx, cy);
    if (G.placing) {
      const hint = '걸어서 자리 고르기 · A 놓기 · B 취소', w = TX.width(hint, 'g9') + 12;
      UI.tag(l, 120 - (w >> 1), 144, w, 13);
      TX.draw(l, hint, 120, 145, { font: 'g9', color: P.accent, align: 'center' });
    }
    if (G.script) drawScript(l, t);
    if (G.menu) G.drawMenu(l, t);
    if (G.fade > 0) { l.globalAlpha = G.fade; l.fillStyle = '#0c0a1d'; l.fillRect(0, 0, VW, VH); l.globalAlpha = 1; }
    // 장 · 보스 이름 카드와 가운데 알림은 어둠(페이드) 위에
    if (G.card) drawCard(l, G.card, t);
    if (G.banner) drawBanner(l, G.banner, t);
  };
  // 외침 말풍선: 머리 위 흰 풍선 + 아래로 꼬리. 화면 밖으로 나가지 않게 옆으로 밀어 넣는다
  function drawBark(l, b, cx, cy) {
    const e = b.e, w = b.w || (b.w = TX.width(b.text, 'g9') + 8), h = 13, a = Math.min(1, b.t / 0.12, (b.dur - b.t) / 0.25);
    const ex = Math.round(e.x - cx), top = Math.round(e.y - cy - (e.sitting ? 20 : 26) - h - 4) - (b.t < 0.12 ? Math.round((0.12 - b.t) * 30) : 0);
    const x = Math.max(2, Math.min(VW - w - 2, ex - (w >> 1))), y = Math.max(2, top);
    l.globalAlpha = Math.max(0, a);
    l.fillStyle = P.outline; l.fillRect(x - 1, y, w + 2, h); l.fillRect(x, y - 1, w, h + 2);
    l.fillStyle = '#fbf8ff'; l.fillRect(x, y, w, h);
    const tx = Math.max(x + 3, Math.min(x + w - 4, ex));
    l.fillStyle = P.outline; l.fillRect(tx - 2, y + h, 5, 1); l.fillRect(tx - 1, y + h + 1, 3, 1); l.fillRect(tx, y + h + 2, 1, 1);
    l.fillStyle = '#fbf8ff'; l.fillRect(tx - 1, y + h, 3, 1); l.fillRect(tx, y + h + 1, 1, 1);
    TX.draw(l, b.text, x + 4, y + 2, { font: 'g9', color: P.outline });
    l.globalAlpha = 1;
  }
  // 납작한 고리 (위에서 내려다본 원): 거의 끝나 갈 땐 한 점 걸러 찍어 흐려진다
  function drawRing(l, x, y, r, c, faint) {
    if (r < 1) return;

    const n = Math.max(12, Math.round(r * 5));
    for (let i = 0; i < n; i++) { if (faint && i % 2) continue; const a = i / n * Math.PI * 2; l.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 0.45), 1, 1); }
  }
  // 설치 미리보기 (물체 · 어둠 위에 — 위를 볼 때 하루 몸에 가리지 않고, 밤에도 보이게): 발판 칸(초록 = 놓을 수 있다 · 빨강 = 못 놓는다)과
  //   반투명한 모습. 불을 내는 것(모닥불)은 해 질 녘부터 불빛이 닿을 둘레를 점선으로 (불빛은 납작하지 않은 원 — lights())
  function drawPlacing(l, cx, cy, t) {
    const sp = G.placeSpot(), pr = sp.pr, c = sp.ok ? '#7ad07a' : '#ff6a5a';
    const fx = sp.tx * T + 8 - cx, fy = sp.ty * T + 15 - cy; // 놓일 물체의 발 (그림 기준점)
    const as = PLACED[G.placing.item] || {}, r = as.light;
    if (r && (G.phase() === 'dusk' || G.isNight())) {
      l.fillStyle = sp.ok ? '#ffe2b4' : '#ff8a7a';
      const n = Math.round(r * 2 * Math.PI / 3), ly = fy - (as.lightY || 10); // 3px마다 한 점
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; l.fillRect(Math.round(fx + Math.cos(a) * r), Math.round(ly + Math.sin(a) * r), 1, 1); }
    }
    const x0 = sp.x0 * T - cx, y0 = (sp.ty - sp.rows + 1) * T - cy, w = sp.cw * T, h = sp.rows * T;
    l.globalAlpha = 0.25; l.fillStyle = c; l.fillRect(x0, y0, w, h);
    l.globalAlpha = 0.6;
    const spr = pr.frames ? pr.frames[Math.floor(t / 120) % pr.frames.length] : pr.pix;
    l.drawImage(spr.canvas(), fx - pr.ax, fy - pr.ay);
    l.globalAlpha = 1; l.fillStyle = c;
    l.fillRect(x0, y0, w, 1); l.fillRect(x0, y0 + h - 1, w, 1); l.fillRect(x0, y0, 1, h); l.fillRect(x0 + w - 1, y0, 1, h);
  }
  // 이름 카드: style 'chapter' — 가운데 작은 글(sub) 위 큰 제목 · 'boss' — 화면 위쪽 띠에 붉은 이름이 옆에서 밀려 들어온다
  const cardArt = {};
  function cardTitle(c) {
    if (c.style === 'narration') return null;
    const k = c.style + ':' + c.title;
    if (!cardArt[k] || cardArt[k].gen !== TX.gen) {
      const o = c.style === 'boss' ? { scale: 2, c1: '#ffd0c4', c2: '#e0445a', hl: '#fff0e8' } : { scale: 2 };
      cardArt[k] = { img: TX.title(c.title, o), gen: TX.gen };
    }
    return cardArt[k].img;
  }
  function drawCard(l, c, t) {
    const inA = Math.min(1, c.t / 0.6), outA = c.keep ? 1 : Math.min(1, Math.max(0, (c.dur - c.t) / 0.6)), a = Math.min(inA, outA);
    if (a <= 0) return;
    const img = cardTitle(c);
    l.globalAlpha = a;
    if (!img && c.style !== 'narration') { l.globalAlpha = 1; return; }
    if (c.style === 'narration') { // 검은 화면의 한두 줄 (여운)
      c.title.split('\n').forEach((ln, i, all) => TX.draw(l, ln, 120, 74 - all.length * 8 + i * 16, { font: 'g11', color: '#e6e0ff', align: 'center' }));
      l.globalAlpha = 1;
      return;
    }
    if (c.style === 'boss') {
      const slide = Math.round((1 - ease(Math.min(1, c.t / 0.45))) * 120), y = CINE_BAR + 2; // 위쪽 띠 바로 아래 (보스의 머리를 가리지 않게)
      l.globalAlpha = a * 0.72; l.fillStyle = '#0c0a1d'; l.fillRect(0, y, VW, img.height + 22); l.globalAlpha = a;
      l.fillStyle = '#e0445a'; l.fillRect(0, y, VW, 1); l.fillRect(0, y + img.height + 21, VW, 1);
      if (c.sub) TX.draw(l, c.sub, 120 - slide, y + 4, { font: 'g9', color: '#ffb0a0', align: 'center' });
      l.drawImage(img, 120 - (img.width >> 1) + slide, y + 15);
    } else {
      const y = 58, band = (1 - G.fade) * 0.65; // 장면 위에 뜰 땐 어두운 띠를 깔아 읽히게
      if (band > 0) { l.globalAlpha = a * band; l.fillStyle = '#0c0a1d'; l.fillRect(0, y - 8, VW, img.height + 46); l.globalAlpha = a; }
      if (c.sub) TX.draw(l, c.sub, 120, y, { font: 'g11', color: P.accent, align: 'center' });
      const w = Math.min(160, img.width + 40), lx = 120 - (w >> 1);
      l.fillStyle = '#6a62b0'; l.fillRect(lx, y + 17, w, 1);
      l.drawImage(img, 120 - (img.width >> 1), y + 23);
      l.fillStyle = '#6a62b0'; l.fillRect(lx, y + 28 + img.height, w, 1);
    }
    l.globalAlpha = 1;
  }
  // 가운데 알림 (동료 합류처럼 무게 있는 소식): 살짝 튀어 올랐다가 자리 잡는다
  function drawBanner(l, b, t) {
    const font = TX.width(b.text, 'g11') + (b.icon ? 34 : 20) > 232 ? 'g9' : 'g11'; // 길면 작은 글씨로
    const w = TX.width(b.text, font) + (b.icon ? 34 : 20), x = Math.round(120 - w / 2), pop = b.t < 0.18 ? Math.round((0.18 - b.t) * 30) : 0, y = 52 - pop;
    UI.win(l, x, y, w, 22);
    if (b.icon) l.drawImage(UI.icon(b.icon).canvas(), x + 6, y + 4);
    TX.draw(l, b.text, x + (b.icon ? 22 : 10), y + (font === 'g9' ? 6 : 5), { font, color: b.color || P.accent });
  }
  function drawZone(l, z, cx, cy, t) {
    const k = Math.min(1, (G.t - z.t0) / Math.max(0.1, z.dur));
    const fast = k > 0.6;
    if (Math.floor(t / (fast ? 50 : 100)) % 2 === 0 && k < 1) return;
    const c = fast ? '#ff5a4a' : '#ffb04a';
    l.fillStyle = c;
    const pts = z.pts.map(([x, y]) => [Math.round(x - cx), Math.round(y - cy)]);
    D.raster.spansPoly(pts, (a, b, y) => { for (let x = a; x <= b; x++) if (((x + y) & 1) === 0) l.fillRect(x, y, 1, 1); });
    // 테두리
    l.fillStyle = '#fff0d0';
    for (let i = 0; i < pts.length; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];

    }
  }
  // 밤에 그 공룡이 보이나: 몸(그림 폭의 80% × 발부터 키의 80%)이 불빛에 조금이라도 닿거나, 덤벼드는 중이면(경고 구역이 빛난다) 보인다
  G.dinoVisible = d => !G.dark() || dinoSeen(d, G.lightList()); // 지금 눈에 보이는 공룡인가 (밤엔 불빛 안만 — 지도)
  function dinoSeen(d, lit) {
    if (d.state === 'windup' || d.state === 'strike') return true;
    const hw = d.art.w * 0.4, x0 = d.x - hw, x1 = d.x + hw, y0 = d.y - d.art.foot * 0.8, y1 = d.y;
    return lit.some(q => hyp(Math.max(x0 - q.x, 0, q.x - x1), Math.max(y0 - q.y, 0, q.y - y1)) < q.r + 2);
  }
  // 어둠 속 눈빛: 불빛 밖에서 깨어 있는 공룡은 눈만 보인다 (쫓아올 땐 붉게, 가끔 깜빡). 잠든 녀석은 눈을 감아 안 보이고 z만 뜬다
  function drawEyes(l, hid, cx, cy, t) {
    const p = G.camFocus || G.player; // (연출이 먼 곳을 비추면 그곳 둘레의 눈빛)
    for (const ob of hid) {
      const d = ob.dino, e = ob.spr && ob.spr.eyeAt;

      l.fillStyle = d.hostile ? '#ff6a5a' : '#ffe066';
      l.fillRect(Math.round(ob.x - ob.ax + e[0] - cx), Math.round(ob.y - ob.ay + e[1] - cy), d.S.boss ? 3 : 2, d.S.boss ? 2 : 1);
    }
  }
  // 어둠 속에 떨어진 물건은 가끔 반짝인다 (찾아 주울 수 있게)
  function drawGlints(l, list, cx, cy, t) {
    for (const k of list) if ((t / 1000 + k.x * 0.013) % 1.7 < 0.18) D.FX.star(l, Math.round(k.x - cx), Math.round(k.y - 7 - cy), '#ffe066', 0.3);
  }
  function drawTargetHint(l, cx, cy, t) {
    const tg = G.interactTarget();
    if (!tg || tg.kind !== 'obj' || !tg.o.node) return;
    const o = tg.o, pr = o.pr, bob = Math.floor(t / 300) % 2;
    const x = Math.round(o.x - cx), y = Math.round(o.y - pr.ay - cy - 6 - bob);

    l.fillStyle = P.accent; l.fillRect(x - 2, y, 5, 2); l.fillRect(x - 1, y + 2, 3, 1); l.fillRect(x, y + 3, 1, 1);
  }
  function drawHud(l, t) {
    const p = G.player;

      hunger: p.hunger, show: p.hungerShow, glow: p.hungerGlow, gain: p.hungerGain, gainT: p.hungerGainT, wound: p.wounds * D.WOUND.cut }, t);

    const showParty = G.party.length && (G.combatT > 0 || G.inCombat() || G.party.some(b => b.down || b.hp < b.maxHp - 0.5));
    if (showParty) UI.hudParty(l, G.party.map(b => ({ name: b.name, hp: b.hp, maxHp: b.maxHp, down: b.down, wound: b.wounds * D.WOUND.cut })), t);
